<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtro de Tags</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="min-h-screen flex flex-col">
    <header class="border-b border-slate-700 px-4 py-4 bg-slate-950">
      <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
        <button type="button" onclick="goBackToMarkedRoute()" class="rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">Voltar</button>
        <h1 class="text-lg md:text-xl font-semibold text-center flex-1">Filtro de Tags</h1>
        <button type="button" onclick="openSavedMenu()" class="rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">Tags salvas</button>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 max-w-4xl mx-auto w-full">
      <section class="bg-slate-800/60 border border-slate-700 rounded-xl p-4">
        <div class="flex items-center justify-between gap-2 mb-3">
          <h2 class="text-sm uppercase tracking-wide text-slate-300">Cards filtrados</h2>
          <span id="cardsCount" class="text-xs text-slate-400">0 cards</span>
        </div>
        <div id="cardsList" class="space-y-2"></div>
      </section>
    </main>

    <footer class="border-t border-slate-700 px-4 py-4 bg-slate-950">
      <div class="max-w-4xl mx-auto space-y-3">
        <label class="text-sm text-slate-300">Selecionar tags para filtrar</label>
        <div id="selectedTagsPanel" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
        <input id="footerTagSearch" type="text" placeholder="Pesquisar tag por nome..." class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm text-slate-100">
        <div id="searchTagsPanel" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </div>
    </footer>
  </div>
  <aside id="savedTagsMenu" class="fixed inset-y-0 right-0 w-full max-w-sm bg-slate-950 border-l border-slate-700 transform translate-x-full transition-transform duration-200 z-40">
    <div class="h-full flex flex-col">
      <div class="flex items-center justify-between p-4 border-b border-slate-700">
        <h3 class="font-semibold">Filtros salvos</h3>
        <button type="button" onclick="closeSavedMenu()" class="text-slate-300 hover:text-white">Fechar</button>
      </div>
      <div id="savedTagsList" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </div>
  </aside>
  <div id="savedMenuBackdrop" onclick="closeSavedMenu()" class="fixed inset-0 bg-black/50 hidden z-30"></div>

  <div id="editSavedTagModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-base">Editar tag salva</h3>
        <button type="button" onclick="closeEditSavedTagModal()" class="text-slate-300 hover:text-white">✕</button>
      </div>
      <form id="editSavedTagForm" class="space-y-3">
        <input type="hidden" id="editSavedTagId">
        <div>
          <label class="text-xs text-slate-400">Número</label>
          <input id="editSavedTagNumero" type="number" class="w-full mt-1 bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-400">Nome</label>
          <input id="editSavedTagName" required class="w-full mt-1 bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
        </div>
        <div>
          <label class="text-xs text-slate-400">Nome pt-br</label>
          <input id="editSavedTagNamePtBr" class="w-full mt-1 bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm">
        </div>
        <div class="flex items-center justify-between gap-2 pt-2">
          <button type="button" onclick="unpinTagFromModal()" class="px-3 py-2 rounded border border-rose-500 text-rose-300 hover:bg-rose-500/20 text-sm">Desfixar</button>
          <button type="submit" class="px-3 py-2 rounded bg-sky-600 hover:bg-sky-500 text-white text-sm">Salvar edição</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    const state = { tags: [], cards: [], selectedTagIds: [], temporaryTagIds: [], savedFilters: [] };
    function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

    function getMarkedBackRoute() {
      const urlParams = new URLSearchParams(window.location.search);
      const from = urlParams.get('from');
      return from ? decodeURIComponent(from) : '/views/tag_family.html';
    }
    function goBackToMarkedRoute() {
      if (window.history.length > 1) { window.history.back(); return; }
      window.location.href = getMarkedBackRoute();
    }
    async function api(action, payload = {}) {
      payload.action = action;
      const r = await fetch('/api/flashcards', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const j = await r.json();
      if (!r.ok || j.status !== 'success') throw new Error(j.message || 'Erro');
      return j;
    }

    function getTagLabel(tag){
      const numero = tag?.numero;
      const pt = String(tag?.name_pt_br || '').trim();
      const name = String(tag?.name || '').trim();
      if (numero !== null && numero !== undefined && String(numero).trim() !== '') return pt ? `${numero} - ${pt}` : `${numero} - ${name}`;
      return pt || name || 'Tag sem nome';
    }

    function renderTags(){
      const selectedEl = document.getElementById('selectedTagsPanel');
      const searchEl = document.getElementById('searchTagsPanel');
      const q = (document.getElementById('footerTagSearch').value || '').toLowerCase().trim();
      const selectedSet = new Set(state.selectedTagIds);
      const filtered = state.tags.filter(t => String(t.name || '').toLowerCase().includes(q) || String(t.name_pt_br || '').toLowerCase().includes(q) || String(t.numero ?? '').toLowerCase().includes(q));

      const savedTagIds = new Set(state.savedFilters.map(f => Number(f.id_tag)));
      const selectedTags = state.tags.filter(t => selectedSet.has(Number(t.id)));
      selectedEl.innerHTML = selectedTags.length
        ? selectedTags.map(t => `<div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs border bg-sky-500/20 text-sky-200 border-sky-400">
            <button type="button" onclick="toggleTag(${Number(t.id)})" class="inline-flex items-center gap-1">
              <i class="${savedTagIds.has(Number(t.id)) ? 'fa-solid text-sky-300' : 'fa-regular text-slate-300'} fa-bookmark"></i>${esc(getTagLabel(t))}
            </button>
            <button type="button" onclick="toggleSavedFilter(${Number(t.id)})" title="${savedTagIds.has(Number(t.id)) ? 'Remover tag salva' : 'Salvar tag'}" class="inline-flex items-center rounded-full border px-2 py-0.5 ${savedTagIds.has(Number(t.id)) ? 'border-sky-500/50 text-sky-400' : 'border-slate-600 text-slate-400'} hover:bg-slate-800">
              <i class="fa-solid fa-bookmark"></i>
            </button>
          </div>`).join('')
        : '<span class="text-xs text-slate-400">Nenhuma tag selecionada.</span>';

      const unselected = filtered.filter(t => !selectedSet.has(Number(t.id)));
      searchEl.innerHTML = unselected.length
        ? unselected.map(t => `<button type="button" onclick="toggleTag(${Number(t.id)})" class="px-2.5 py-1 rounded-full text-xs border bg-slate-800 text-slate-300 border-slate-600 hover:bg-slate-700"><span class="inline-block w-2 h-2 rounded-full mr-1" style="background:${esc(t.color || '#334155')}"></span>${esc(getTagLabel(t))}</button>`).join('')
        : '<span class="text-xs text-slate-400">Nenhuma tag encontrada para esta busca.</span>';
    }

    function cardHasAllSelectedTags(card, selectedSet){
      const pools = ['all_tags','subject_tags','object_tags','tipo_frasal_tags','tense_tags','lexical_chunks_tags','relation_tags','words_tags','idioma_principal_tags','idioma_secundario_tags'];
      const cardTagIds = new Set();
      pools.forEach(key => (card[key] || []).forEach(t => cardTagIds.add(Number(t.id))));
      for (const id of selectedSet) if (!cardTagIds.has(id)) return false;
      return true;
    }

    function renderCards(){
      const list = document.getElementById('cardsList');
      const selectedSet = new Set(state.selectedTagIds);
      if (!selectedSet.size) {
        document.getElementById('cardsCount').textContent = '0 card(s)';
        list.innerHTML = '<p class="text-sm text-slate-400">Selecione pelo menos uma tag para ver os cards.</p>';
        return;
      }

      const filteredCards = state.cards.filter(c => cardHasAllSelectedTags(c, selectedSet));
      document.getElementById('cardsCount').textContent = `${filteredCards.length} card(s)`;
      list.innerHTML = filteredCards.length
        ? filteredCards.map(c => `<article class="rounded-lg border border-slate-700 bg-slate-900/60 p-3"><p class="text-sm text-slate-100">${esc(c.front || '(sem frente)')}</p><p class="text-xs text-slate-400 mt-1">${esc(c.back || '(sem verso)')}</p></article>`).join('')
        : '<p class="text-sm text-slate-400">Nenhum card encontrado com as tags selecionadas.</p>';
    }

    function syncSelectedTags(){
      const activeSavedIds = state.savedFilters.filter(f => Number(f.ativo) === 1).map(f => Number(f.id_tag));
      state.selectedTagIds = Array.from(new Set([...(state.temporaryTagIds || []), ...activeSavedIds]));
    }

    function toggleTag(tagId){
      const id = Number(tagId);
      state.temporaryTagIds = state.temporaryTagIds.includes(id) ? state.temporaryTagIds.filter(v => v !== id) : [...state.temporaryTagIds, id];
      syncSelectedTags();
      renderTags();
      renderCards();
    }

    function openSavedMenu(){
      document.getElementById('savedTagsMenu').classList.remove('translate-x-full');
      document.getElementById('savedMenuBackdrop').classList.remove('hidden');
    }
    function closeSavedMenu(){
      document.getElementById('savedTagsMenu').classList.add('translate-x-full');
      document.getElementById('savedMenuBackdrop').classList.add('hidden');
    }

    async function toggleSavedFilter(tagId){
      await api('toggle_saved_filter', { tag_id: Number(tagId) });
      await loadSavedFilters();
      renderTags();
      renderCards();
    }

    async function loadSavedFilters(){
      const res = await api('list_saved_filters');
      state.savedFilters = res.data || [];
      renderSavedFilters();
    }

    function renderSavedFilters(){
      const el = document.getElementById('savedTagsList');
      if (!state.savedFilters.length) {
        el.innerHTML = '<p class="text-sm text-slate-400">Nenhuma tag salva.</p>';
        return;
      }
      el.innerHTML = state.savedFilters.map(f => `
        <div class="border border-slate-700 rounded-lg p-2 bg-slate-900/70">
          <div class="flex items-center justify-between gap-2">
            <button type="button" onclick="setSavedFilterActive(${Number(f.id_tag)}, ${Number(f.ativo) !== 1})" class="flex items-center gap-2 text-sm cursor-pointer flex-1 text-left leading-tight">
              <i class="${Number(f.ativo) === 1 ? 'fa-regular fa-square-check text-emerald-400' : 'fa-regular fa-square text-slate-400'}"></i>
              <span>${esc(getTagLabel(f))}</span>
            </button>
            <button type="button" onclick="openEditSavedTagModal(${Number(f.id_tag)})" class="inline-flex items-center justify-center rounded-md border border-slate-600 px-2 py-1 text-slate-300 hover:bg-slate-800 hover:text-white text-xs" title="Editar">
              <i class="fa-solid fa-sliders"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function setSavedFilterActive(tagId, checked){
      await api('set_saved_filter_active', { tag_id: Number(tagId), ativo: checked ? 1 : 0 });
      await loadSavedFilters();
      applySavedActiveFilters();
    }

    function applySavedActiveFilters(){
      syncSelectedTags();
      renderTags();
      renderCards();
    }

    function openEditSavedTagModal(tagId){
      const tag = state.tags.find(t => Number(t.id) === Number(tagId));
      if (!tag) return;
      document.getElementById('editSavedTagId').value = String(tag.id);
      document.getElementById('editSavedTagNumero').value = tag.numero ?? '';
      document.getElementById('editSavedTagName').value = tag.name ?? '';
      document.getElementById('editSavedTagNamePtBr').value = tag.name_pt_br ?? '';
      document.getElementById('editSavedTagModal').classList.remove('hidden');
      document.getElementById('editSavedTagModal').classList.add('flex');
    }
    function closeEditSavedTagModal(){
      document.getElementById('editSavedTagModal').classList.add('hidden');
      document.getElementById('editSavedTagModal').classList.remove('flex');
    }

    async function unpinTagFromModal(){
      const tagId = Number(document.getElementById('editSavedTagId').value || 0);
      if (!tagId) return;
      await api('remove_saved_filter', { tag_id: tagId });
      state.temporaryTagIds = state.temporaryTagIds.filter(id => id !== tagId);
      syncSelectedTags();
      closeEditSavedTagModal();
      await loadSavedFilters();
      renderTags();
      renderCards();
    }

    async function load(){
      const [tagsRes, cardsRes] = await Promise.all([api('list_tags'), api('list_cards_for_tag_filtering')]);
      state.tags = tagsRes.data || [];
      state.cards = cardsRes.data || [];
      await loadSavedFilters();
      applySavedActiveFilters();
      renderTags();
      renderCards();
    }

    document.getElementById('editSavedTagForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const id = Number(document.getElementById('editSavedTagId').value || 0);
      if (!id) return;
      const old = state.tags.find(t => Number(t.id) === id) || {};
      await api('update_tag', {
        id,
        numero: document.getElementById('editSavedTagNumero').value,
        name: document.getElementById('editSavedTagName').value,
        name_pt_br: document.getElementById('editSavedTagNamePtBr').value,
        is_book: Number(old.is_book) === 1 ? 1 : 0,
        is_verb_tense: Number(old.is_verb_tense) === 1 ? 1 : 0,
        is_sentence_type: Number(old.is_sentence_type) === 1 ? 1 : 0,
        is_lexical_chunk: Number(old.is_lexical_chunk) === 1 ? 1 : 0,
        is_relation_type: Number(old.is_relation_type) === 1 ? 1 : 0,
        is_word: Number(old.is_word) === 1 ? 1 : 0,
        is_month: Number(old.is_month) === 1 ? 1 : 0,
        is_day: Number(old.is_day) === 1 ? 1 : 0,
        is_year: Number(old.is_year) === 1 ? 1 : 0
      });
      closeEditSavedTagModal();
      await load();
    });

    document.getElementById('footerTagSearch').addEventListener('input', renderTags);
    window.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
