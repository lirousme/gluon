<!-- 
  Arquivo: gerar_cards.html
  Diretório: public_html/gluon/views/gerar_cards.html
  Pilar: Bonito e Escalável.
  Atualização: Tela dedicada para gerar cards com exportação no cabeçalho.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Gluon - Gerar Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: { extend: { colors: { gluon: { dark: '#0f172a', primary: '#3b82f6', secondary: '#1e293b', accent: '#6366f1' } } } }
        }
    </script>
</head>
<body class="bg-gluon-dark text-slate-200 min-h-[100dvh] flex flex-col font-sans pb-[env(safe-area-inset-bottom)]">
    <nav class="bg-gluon-secondary border-b border-slate-700/50 shrink-0 z-40 h-16 flex items-center justify-between px-4 sm:px-6">
        <div class="flex items-center gap-4 min-w-0">
            <button onclick="goBackToMarkedRoute()" class="text-slate-400 hover:text-white transition-colors bg-slate-800 p-2 rounded-lg border border-slate-700 shadow-sm" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="h-6 w-px bg-slate-700"></div>
            <div class="min-w-0">
                <h1 class="text-sm sm:text-base font-semibold text-white truncate">Gerar Cards</h1>
                <p id="deckName" class="text-xs text-slate-400 truncate">Carregando deck...</p>
            </div>
        </div>

        <button id="btnExportExcel" onclick="generateCardsApp.exportToExcel()" class="flex items-center gap-2 cursor-pointer bg-slate-800/80 px-3 py-2 rounded-lg border border-slate-700 shadow-sm transition-colors hover:bg-slate-700 text-emerald-500 hover:text-emerald-400 text-sm" title="Baixar Todo o Deck (Excel / CSV)">
            <i class="fa-solid fa-file-export text-sm"></i>
            <span class="hidden sm:inline">Baixar Cards</span>
        </button>
    </nav>

    <main class="flex-1 w-full p-4 sm:p-6">
        <div class="max-w-4xl mx-auto rounded-xl border border-slate-700 bg-gluon-secondary/60 p-6 text-slate-300">
            <p class="text-sm sm:text-base">Use esta tela para futuras ações de geração de cards. O download do deck está disponível no cabeçalho.</p>
        </div>
    </main>

    <script>
        function getMarkedBackRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            const from = urlParams.get('from');
            return from ? decodeURIComponent(from) : '/dashboard';
        }

        function goBackToMarkedRoute() {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            window.location.href = getMarkedBackRoute();
        }

        const generateCardsApp = {
            deckId: null,

            async init() {
                const urlParams = new URLSearchParams(window.location.search);
                this.deckId = urlParams.get('id');

                if (!this.deckId) {
                    window.location.href = getMarkedBackRoute();
                    return;
                }

                const res = await this.api('fetch', { deck_id: this.deckId });
                if (res) {
                    document.getElementById('deckName').innerText = res.deck_name || 'Deck sem nome';
                }
            },

            showToast(message, type = 'success') {
                let toast = document.getElementById('gluon-toast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'gluon-toast';
                    document.body.appendChild(toast);
                }
                const icon = type === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-exclamation"></i>';
                const bgClass = type === 'success' ? 'bg-green-600' : 'bg-red-600';
                toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-lg shadow-xl text-white text-sm font-medium flex items-center gap-3 z-50 transition-all duration-300 transform translate-y-10 opacity-0 ${bgClass}`;
                toast.innerHTML = `${icon} <span>${message}</span>`;
                setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); }, 10);
                setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-10', 'opacity-0'); }, 3000);
            },

            async api(action, payload = {}) {
                payload.action = action;
                try {
                    const res = await fetch(`/api/flashcards`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

                    if (res.status === 401) {
                        window.location.href = '/';
                        return null;
                    }

                    const data = await res.json();
                    if (data.status !== 'success') throw new Error(data.message);
                    return data;
                } catch (err) {
                    console.error(err);
                    this.showToast(err.message || 'Erro de conexão.', 'error');
                    return null;
                }
            },

            async exportToExcel() {
                const btn = document.getElementById('btnExportExcel');
                const originalContent = btn.innerHTML;

                try {
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-sm"></i>';
                    btn.disabled = true;

                    const res = await this.api('get_all_cards', { deck_id: this.deckId });

                    if (!res || !res.data || res.data.length === 0) {
                        this.showToast('Não há cards para exportar neste deck.', 'error');
                        return;
                    }

                    let csv = '\uFEFF';
                    csv += 'Frente,Verso\n';

                    res.data.forEach(card => {
                        const front = card.front ? card.front.replace(/"/g, '""') : '';
                        const back = card.back ? card.back.replace(/"/g, '""') : '';
                        csv += `"${front}","${back}"\n`;
                    });

                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;

                    const deckName = document.getElementById('deckName').innerText;
                    const safeName = deckName.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'deck';

                    a.download = `gluon_${safeName}.csv`;

                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    this.showToast('Exportação concluída com sucesso!', 'success');
                } catch (error) {
                    this.showToast('Erro ao exportar: ' + error.message, 'error');
                } finally {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => generateCardsApp.init());
    </script>
</body>
</html>
