<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Gluon - Informações do Prédio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gluon: { dark: '#0f172a', primary: '#3b82f6', secondary: '#1e293b', accent: '#6366f1' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gluon-dark text-slate-200 min-h-dvh font-sans selection:bg-gluon-primary selection:text-white">
    <header class="bg-gluon-secondary border-b border-slate-700/50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
            <button type="button" onclick="window.location.href='/dashboard'" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-slate-200 hover:text-white hover:border-gluon-primary transition-colors" title="Voltar para dashboard">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="font-semibold text-sm">Voltar</span>
            </button>

            <h1 id="building-user-name" class="text-sm sm:text-base font-semibold text-slate-100 truncate">Carregando usuário...</h1>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-5">
        <section id="selectedSentenceSection" class="hidden mb-4 bg-gluon-secondary border border-indigo-400/40 rounded-xl p-4 sm:p-5 shadow-2xl">
            <p class="text-xs text-indigo-200 uppercase tracking-wide">Frase em construção</p>
            <p id="selectedSentenceText" class="text-base font-semibold text-indigo-100 mt-1"></p>
        </section>

        <section class="bg-gluon-secondary border border-slate-700 rounded-xl p-4 sm:p-5 shadow-2xl">
            <div class="mb-3">
                <h2 class="text-base sm:text-lg font-semibold text-slate-100">Selecionar noun</h2>
                <p class="text-xs sm:text-sm text-slate-400">Digite para buscar nas 4 versões do noun (pt-BR e en-US, singular e plural).</p>
            </div>

            <div id="nounPanel" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
            <input id="nounSearchInput" type="text" placeholder="Pesquisar noun..." class="w-full mt-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm" autocomplete="off">
        </section>

        <section class="bg-gluon-secondary border border-slate-700 rounded-xl p-4 sm:p-5 shadow-2xl">
            <div class="mb-3">
                <h2 class="text-base sm:text-lg font-semibold text-slate-100">Selecionar verbo</h2>
                <p class="text-xs sm:text-sm text-slate-400">Digite para buscar variações de verbos salvas na tabela verbs.</p>
            </div>

            <div id="verbPanel" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
            <input id="verbSearchInput" type="text" placeholder="Pesquisar verbo..." class="w-full mt-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm" autocomplete="off">
        </section>
    </main>

    <script>
        async function userApi(action, payload = {}) {
            const response = await fetch('/api/user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...payload })
            });
            return response.json();
        }

        async function flashcardsApi(action, payload = {}) {
            const response = await fetch('/api/flashcards', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...payload })
            });
            return response.json();
        }

        async function loadHeaderUserName() {
            const label = document.getElementById('building-user-name');
            try {
                const sessionRes = await userApi('get_session');
                const sessionId = sessionRes?.data?.id;

                if (!sessionId) {
                    label.textContent = 'Usuário';
                    return;
                }

                const profileRes = await userApi('get_public_profile', { target_user_id: sessionId });
                const username = profileRes?.data?.username || 'Usuário';
                label.textContent = username;
            } catch (error) {
                label.textContent = 'Usuário';
            }
        }


        function formatSelectedTokens(values) {
            if (!values.length) return '';
            const normalized = values.map((value, index) => {
                const raw = String(value || '').trim();
                if (raw === '') return '';
                if (index === 0) return raw;
                return raw.charAt(0).toLowerCase() + raw.slice(1);
            }).filter(Boolean);

            if (normalized.length <= 1) return normalized[0] || '';
            if (normalized.length === 2) return `${normalized[0]} e ${normalized[1]}`;
            return `${normalized.slice(0, -1).join(', ')} e ${normalized[normalized.length - 1]}`;
        }

        function renderSentenceDisplay() {
            const section = document.getElementById('selectedSentenceSection');
            const text = document.getElementById('selectedSentenceText');
            const nouns = nounApp.getSelectedValues();
            const verbs = verbApp.getSelectedValuesForDisplay();
            const phrase = formatSelectedTokens([...nouns, ...verbs]);

            if (!phrase) {
                text.textContent = '';
                section.classList.add('hidden');
                return;
            }

            text.textContent = phrase;
            section.classList.remove('hidden');
        }

        const nounApp = {
            allNounTokens: [],
            selectedTokenKeys: [],
            searchQuery: '',

            async init() {
                loadHeaderUserName();
                this.bindEvents();
                await this.loadNouns();
                this.renderPanel();
            },

            bindEvents() {
                const input = document.getElementById('nounSearchInput');
                input.addEventListener('input', (event) => {
                    this.searchQuery = String(event.target.value || '').trim().toLowerCase();
                    this.renderPanel();
                });
            },

            async loadNouns() {
                try {
                    const res = await flashcardsApi('list_noun_tokens');
                    if (res?.status !== 'success' || !Array.isArray(res.tokens)) {
                        this.allNounTokens = [];
                        return;
                    }
                    this.allNounTokens = res.tokens;
                } catch (error) {
                    this.allNounTokens = [];
                }
            },

            getFilteredTokens() {
                if (!this.searchQuery) return [];
                return this.allNounTokens.filter((token) => String(token.value || '').toLowerCase().includes(this.searchQuery));
            },

            getTokenKey(token) {
                return `${Number(token.id)}:${String(token.column || '')}`;
            },


            toggleToken(token) {
                const tokenId = Number(token.id);
                if (!tokenId) return;
                const tokenKey = this.getTokenKey(token);
                const existingIndex = this.selectedTokenKeys.findIndex((key) => key === tokenKey);
                if (existingIndex >= 0) {
                    this.selectedTokenKeys.splice(existingIndex, 1);
                } else {
                    this.selectedTokenKeys.push(tokenKey);
                }
                renderSentenceDisplay();
                this.renderPanel();
            },

            getSelectedValues() {
                return this.selectedTokenKeys
                    .map((tokenKey) => this.allNounTokens.find((token) => this.getTokenKey(token) === tokenKey))
                    .filter(Boolean)
                    .map((token) => token.value);
            },

            renderPanel() {
                const panel = document.getElementById('nounPanel');
                const tokens = this.getFilteredTokens();

                if (!this.searchQuery) {
                    panel.innerHTML = '<p class="text-sm text-slate-400">Comece digitando para ver sugestões de noun.</p>';
                    return;
                }

                if (!tokens.length) {
                    panel.innerHTML = '<p class="text-sm text-slate-400">Nenhum noun encontrado para esse filtro.</p>';
                    return;
                }

                panel.innerHTML = tokens.map((token) => {
                    const tokenKey = this.getTokenKey(token);
                    const selected = this.selectedTokenKeys.includes(tokenKey);
                    const baseClass = selected
                        ? 'bg-blue-500/20 text-blue-100 border-blue-400'
                        : 'bg-slate-800 text-slate-200 border-slate-600 hover:border-gluon-primary hover:text-white';
                    return `<button type="button" data-token-key="${tokenKey}" class="noun-token border ${baseClass} rounded-full px-3 py-1.5 text-sm transition-colors">${token.value}</button>`;
                }).join('');

                panel.querySelectorAll('.noun-token').forEach((button) => {
                    button.addEventListener('click', () => {
                        const tokenKey = String(button.dataset.tokenKey || '');
                        const token = this.allNounTokens.find((item) => this.getTokenKey(item) === tokenKey);
                        if (token) this.toggleToken(token);
                    });
                });
            }
        };

        const verbApp = {
            allVerbTokens: [],
            selectedTokenIds: [],
            searchQuery: '',
            pronounLabels: {
                0: 'forma nominal',
                1: 'eu',
                2: 'você',
                3: 'ele/ela/isso',
                4: 'nós',
                5: 'vós/vocês',
                6: 'eles/elas'
            },
            verbFormLabels: {
                1: 'Simple Present',
                2: 'Simple Past',
                3: 'Simple Future',
                4: 'Present Continuous',
                5: 'Past Continuous',
                6: 'Future Continuous',
                7: 'Present Perfect',
                8: 'Past Perfect',
                9: 'Future Perfect',
                10: 'Present Perfect Continuous',
                11: 'Past Perfect Continuous',
                12: 'Future Perfect Continuous',
                13: 'Infinitive',
                14: 'Gerund',
                15: 'Participle'
            },

            async init() {
                this.bindEvents();
                await this.loadVerbs();
                this.renderPanel();
            },

            bindEvents() {
                const input = document.getElementById('verbSearchInput');
                input.addEventListener('input', (event) => {
                    this.searchQuery = String(event.target.value || '').trim().toLowerCase();
                    this.renderPanel();
                });
            },

            async loadVerbs() {
                try {
                    const res = await flashcardsApi('list_verb_tokens');
                    if (res?.status !== 'success' || !Array.isArray(res.tokens)) {
                        this.allVerbTokens = [];
                        return;
                    }
                    this.allVerbTokens = res.tokens;
                } catch (error) {
                    this.allVerbTokens = [];
                }
            },

            getFilteredTokens() {
                if (!this.searchQuery) return [];
                const filtered = this.allVerbTokens.filter((token) => String(token.value || '').toLowerCase().includes(this.searchQuery));
                const uniqueByDisplayValue = new Map();

                filtered.forEach((token) => {
                    const displayValue = this.getTokenDisplayValue(token);
                    if (!displayValue) return;
                    if (!uniqueByDisplayValue.has(displayValue)) {
                        uniqueByDisplayValue.set(displayValue, token);
                    }
                });

                return Array.from(uniqueByDisplayValue.values());
            },


            getValueOccurrences() {
                return this.allVerbTokens.reduce((acc, token) => {
                    const key = String(token.value || '').trim().toLowerCase();
                    if (!key) return acc;
                    acc[key] = (acc[key] || 0) + 1;
                    return acc;
                }, {});
            },

            getTokenDisplayValue(token) {
                const rawValue = String(token?.value || '').trim();
                if (!rawValue) return '';

                const valueOccurrences = this.getValueOccurrences();
                const shouldDisambiguate = (valueOccurrences[rawValue.toLowerCase()] || 0) > 1;
                if (!shouldDisambiguate) return rawValue;

                const pronounId = Number(token?.pronoun_id || 0);
                const verbFormId = Number(token?.verb_form_id || 0);
                const pronounLabel = this.pronounLabels[pronounId] || `pronoun ${pronounId}`;
                const verbFormLabel = this.verbFormLabels[verbFormId] || `Forma ${verbFormId}`;

                if (pronounId > 0) return `${rawValue} (${pronounLabel})`;
                return `${rawValue} (${verbFormLabel})`;
            },

            toggleToken(token) {
                const tokenId = Number(token.id);
                if (!tokenId) return;
                const selectedValue = this.getTokenDisplayValue(token);
                if (!selectedValue) return;

                const relatedTokenIds = this.allVerbTokens
                    .filter((item) => this.getTokenDisplayValue(item) === selectedValue)
                    .map((item) => Number(item.id))
                    .filter((id) => id > 0);

                const isAlreadySelected = relatedTokenIds.some((id) => this.selectedTokenIds.includes(id));
                if (isAlreadySelected) {
                    this.selectedTokenIds = this.selectedTokenIds.filter((id) => !relatedTokenIds.includes(id));
                } else {
                    const nextIds = [...this.selectedTokenIds, ...relatedTokenIds];
                    this.selectedTokenIds = Array.from(new Set(nextIds));
                }

                renderSentenceDisplay();
                this.renderPanel();
            },

            getSelectedValuesForDisplay() {
                const selectedValues = this.selectedTokenIds
                    .map((tokenId) => this.allVerbTokens.find((token) => Number(token.id) === Number(tokenId)))
                    .filter(Boolean)
                    .map((token) => String(token.value || '').trim())
                    .filter(Boolean);
                return Array.from(new Set(selectedValues));
            },

            renderPanel() {
                const panel = document.getElementById('verbPanel');
                const tokens = this.getFilteredTokens();

                if (!this.searchQuery) {
                    panel.innerHTML = '<p class="text-sm text-slate-400">Comece digitando para ver sugestões de verbos.</p>';
                    return;
                }

                if (!tokens.length) {
                    panel.innerHTML = '<p class="text-sm text-slate-400">Nenhum verbo encontrado para esse filtro.</p>';
                    return;
                }

                panel.innerHTML = tokens.map((token) => {
                    const tokenId = Number(token.id);
                    const displayValue = this.getTokenDisplayValue(token);
                    const selected = this.selectedTokenIds
                        .map((id) => this.allVerbTokens.find((item) => Number(item.id) === Number(id)))
                        .filter(Boolean)
                        .some((item) => this.getTokenDisplayValue(item) === displayValue);
                    const baseClass = selected
                        ? 'bg-emerald-500/20 text-emerald-100 border-emerald-400'
                        : 'bg-slate-800 text-slate-200 border-slate-600 hover:border-gluon-primary hover:text-white';
                    return `<button type="button" data-token-id="${tokenId}" class="verb-token border ${baseClass} rounded-full px-3 py-1.5 text-sm transition-colors">${displayValue}</button>`;
                }).join('');

                panel.querySelectorAll('.verb-token').forEach((button) => {
                    button.addEventListener('click', () => {
                        const tokenId = Number(button.dataset.tokenId || 0);
                        const token = this.allVerbTokens.find((item) => Number(item.id) === tokenId);
                        if (token) this.toggleToken(token);
                    });
                });
            }
        };

        nounApp.init();
        verbApp.init();
    </script>
</body>
</html>
