<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Gluon - Informações do Prédio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gluon: { dark: '#0f172a', primary: '#3b82f6', secondary: '#1e293b', accent: '#6366f1' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gluon-dark text-slate-200 min-h-dvh font-sans selection:bg-gluon-primary selection:text-white">
    <header class="bg-gluon-secondary border-b border-slate-700/50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
            <button type="button" onclick="window.location.href='/dashboard'" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-slate-200 hover:text-white hover:border-gluon-primary transition-colors" title="Voltar para dashboard">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="font-semibold text-sm">Voltar</span>
            </button>

            <h1 id="building-user-name" class="text-sm sm:text-base font-semibold text-slate-100 truncate">Carregando usuário...</h1>
        </div>
    </header>

    <script>
        async function api(action, payload = {}) {
            const response = await fetch('/api/user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...payload })
            });
            return response.json();
        }

        async function loadHeaderUserName() {
            const label = document.getElementById('building-user-name');
            try {
                const sessionRes = await api('get_session');
                const sessionId = sessionRes?.data?.id;

                if (!sessionId) {
                    label.textContent = 'Usuário';
                    return;
                }

                const profileRes = await api('get_public_profile', { target_user_id: sessionId });
                const username = profileRes?.data?.username || 'Usuário';
                label.textContent = username;
            } catch (error) {
                label.textContent = 'Usuário';
            }
        }

        loadHeaderUserName();
    </script>
</body>
</html>
