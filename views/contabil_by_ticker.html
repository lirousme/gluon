<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/assets/zoom-lock.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <title>Contábil por ticker</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(circle at 50% -20%, #17345c 0, #08111f 38%); color: #e5edf8; }
        header { flex: 0 0 auto; padding: 14px clamp(16px, 2.5vw, 40px); border-bottom: 1px solid #243247; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
        header a { color: #9fb0c9; text-decoration: none; font-size: 24px; }
        main { width: 100%; min-height: 0; flex: 1; display: flex; flex-direction: column; padding: 30px clamp(12px, 2vw, 32px) 44px; }
        input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        button { border: 1px solid transparent; border-radius: 10px; padding: 0 18px; min-height: 42px; font-weight: 700; color: white; background: #2878ff; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        .upload-button { width: 44px; padding: 0; display: inline-grid; place-items: center; margin-left: auto; background: #162945; border-color: #354b69; color: #c9d6e8; }
        .upload-button svg { width: 22px; height: 22px; }
        .navigator { border: 1px solid #293950; background: linear-gradient(135deg, #111f32, #0d1929); padding: 14px 18px; border-radius: 14px; box-shadow: 0 18px 40px #0005; }
        .navigator h1 { margin: 0 0 8px; font-size: clamp(22px, 3vw, 30px); }
        .navigator p { margin: 0; color: #9fb0c9; line-height: 1.5; }
        #status:empty { display: none; }
        #status { margin: 10px 0 0; font-size: 12px; font-weight: 600; }
        #status.ok { color: #53d89b; }
        #status.error { color: #ff7d8b; }
        .listing { min-height: 0; flex: 1; display: flex; flex-direction: column; margin-top: 24px; border: 1px solid #293950; border-radius: 16px; overflow: hidden; background: #0d1929; box-shadow: 0 18px 40px #0004; }
        .listing-title { display: flex; justify-content: space-between; gap: 16px; padding: 18px 22px; align-items: center; }
        .listing-title h2 { margin: 0; font-size: 18px; }
        .count { color: #99a9bf; }
        .scroll { min-height: 0; flex: 1; overflow: auto; overscroll-behavior: contain; }
        table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
        th, td { padding: 11px 14px; text-align: right; border-top: 1px solid #223149; border-right: 1px solid #1b2a40; white-space: nowrap; }
        th { position: sticky; top: 0; z-index: 2; background: #142238; color: #aebdd2; font-size: 11px; letter-spacing: .025em; text-transform: uppercase; }
        td { font-size: 14px; }
        th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; text-align: left; background: #101e31; }
        th:first-child { z-index: 3; background: #142238; }
        tbody tr:hover td { background: #14263d; }
        tbody tr:hover td:first-child { background: #172b45; }
        tr.is-hidden { display: none; }
        .group-toggle { width: 24px; height: 24px; min-height: 24px; margin-right: 8px; padding: 0; border-radius: 7px; border-color: #3c536f; background: #172b45; color: #d7e4f5; font-size: 12px; line-height: 1; vertical-align: middle; }
        .group-toggle:hover { background: #214263; }
        .group-spacer { display: inline-block; width: 24px; margin-right: 8px; }
        .outline-cell { display: inline-flex; align-items: center; }
        .empty { padding: 45px; text-align: center; color: #8495ad; }
        @media (max-width: 640px) {
            header { padding-block: 16px; }
            main { padding-top: 18px; }
            .listing-title { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
<header>
    <a href="/views/guiadeacoes.html" aria-label="Voltar">←</a>
    <button id="upload-button" class="upload-button" type="button" title="Importar planilha .xlsx" aria-label="Importar planilha .xlsx">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3h11l5 5v13H4z"/><path d="M14 3v6h6M8 13h8M8 17h8M11 10v10"/></svg>
    </button>
    <form id="upload-form">
        <input id="planilha" name="planilha" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" aria-label="Selecionar planilha" required>
    </form>
</header>
<main>
    <section class="navigator" aria-label="Importação de planilha contábil por ticker">
        <h1>Contábil por ticker</h1>
        <p>Faça upload de uma planilha para visualizar os dados aqui na tela. Nenhuma informação será enviada ou salva no banco de dados.</p>
        <div id="status" role="status" aria-live="polite"></div>
    </section>
    <section class="listing">
        <div class="listing-title"><h2 id="sheet-title">Planilha carregada</h2><span id="count" class="count"></span></div>
        <div class="scroll"><table><thead><tr id="headings"></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">Nenhuma planilha carregada.</div></div>
    </section>
</main>
<script>
const form = document.querySelector('#upload-form');
const statusBox = document.querySelector('#status');
const uploadButton = document.querySelector('#upload-button');
const fileInput = document.querySelector('#planilha');
const headings = document.querySelector('#headings');
const rowsBody = document.querySelector('#rows');
const empty = document.querySelector('#empty');
const count = document.querySelector('#count');
const sheetTitle = document.querySelector('#sheet-title');
const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

function getRowLevel(rowMeta) {
    const level = Number(rowMeta?.level ?? rowMeta?.Level ?? rowMeta?.outlineLevel ?? 0);
    return Number.isFinite(level) && level > 0 ? Math.floor(level) : 0;
}

function rowHasChild(displayRows, index) {
    return index + 1 < displayRows.length && displayRows[index + 1].level > displayRows[index].level;
}

function applyInitialHiddenRows() {
    rowsBody.querySelectorAll('tr[data-hidden="1"]').forEach(row => row.classList.add('is-hidden'));
}

function setDescendantsVisibility(parentRow, collapse) {
    const parentLevel = Number(parentRow.dataset.level || 0);
    let sibling = parentRow.nextElementSibling;
    while (sibling && Number(sibling.dataset.level || 0) > parentLevel) {
        if (collapse) {
            sibling.classList.add('is-hidden');
        } else {
            const nearestCollapsedParent = findCollapsedAncestorBetween(parentRow, sibling);
            if (!nearestCollapsedParent) {
                sibling.classList.remove('is-hidden');
            }
        }
        sibling = sibling.nextElementSibling;
    }
}

function findCollapsedAncestorBetween(parentRow, childRow) {
    const childLevel = Number(childRow.dataset.level || 0);
    let row = childRow.previousElementSibling;
    while (row && row !== parentRow) {
        const rowLevel = Number(row.dataset.level || 0);
        if (rowLevel < childLevel && row.querySelector('.group-toggle[aria-expanded="false"]')) return row;
        row = row.previousElementSibling;
    }
    return null;
}

function bindGroupToggles() {
    rowsBody.querySelectorAll('.group-toggle').forEach(button => {
        button.addEventListener('click', () => {
            const parentRow = button.closest('tr');
            const expanded = button.getAttribute('aria-expanded') === 'true';
            button.setAttribute('aria-expanded', expanded ? 'false' : 'true');
            button.textContent = expanded ? '▸' : '▾';
            setDescendantsVisibility(parentRow, expanded);
        });
    });
}

function renderSheet(sheetName, matrix, rowMeta = []) {
    const nonEmptyRows = matrix
        .map((row, index) => ({ row, index, level: getRowLevel(rowMeta[index]), hidden: Boolean(rowMeta[index]?.hidden) }))
        .filter(({ row }) => row.some(cell => String(cell ?? '').trim() !== ''));
    if (!nonEmptyRows.length) {
        headings.innerHTML = '';
        rowsBody.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'A planilha está vazia.';
        count.textContent = '0 registro(s)';
        return;
    }

    const header = nonEmptyRows[0].row.map((cell, index) => String(cell || `Coluna ${index + 1}`));
    const dataRows = nonEmptyRows.slice(1);
    headings.innerHTML = header.map(label => `<th scope="col">${escapeHtml(label)}</th>`).join('');
    rowsBody.innerHTML = dataRows.map((entry, rowIndex) => {
        const cells = header.map((_, cellIndex) => {
            const value = escapeHtml(entry.row[cellIndex] ?? '—');
            if (cellIndex !== 0) return `<td>${value}</td>`;
            const indent = Math.max(0, entry.level) * 22;
            const control = rowHasChild(dataRows, rowIndex)
                ? `<button class="group-toggle" type="button" aria-label="Alternar agrupamento da linha" aria-expanded="true">▾</button>`
                : '<span class="group-spacer" aria-hidden="true"></span>';
            return `<td><span class="outline-cell" style="padding-left:${indent}px">${control}<span>${value}</span></span></td>`;
        }).join('');
        return `<tr data-level="${entry.level}" data-hidden="${entry.hidden ? '1' : '0'}">${cells}</tr>`;
    }).join('');
    applyInitialHiddenRows();
    bindGroupToggles();
    empty.style.display = dataRows.length ? 'none' : 'block';
    empty.textContent = dataRows.length ? '' : 'A planilha possui apenas cabeçalho.';
    const groupedRows = dataRows.filter(entry => entry.level > 0).length;
    count.textContent = `${dataRows.length} registro(s)${groupedRows ? ` · ${groupedRows} em agrupamento(s)` : ''}`;
    sheetTitle.textContent = `Planilha carregada: ${sheetName}`;
}

function waitForXlsx() {
    return new Promise((resolve, reject) => {
        if (window.XLSX) { resolve(window.XLSX); return; }
        let attempts = 0;
        const interval = setInterval(() => {
            if (window.XLSX) {
                clearInterval(interval);
                resolve(window.XLSX);
            } else if (++attempts > 40) {
                clearInterval(interval);
                reject(new Error('Não foi possível carregar o leitor de planilhas. Verifique a conexão e tente novamente.'));
            }
        }, 125);
    });
}

uploadButton.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
    if (!fileInput.files.length) return;
    uploadButton.disabled = true;
    statusBox.className = '';
    statusBox.textContent = 'Lendo planilha…';
    try {
        const XLSX = await waitForXlsx();
        const file = fileInput.files[0];
        const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true, cellStyles: true });
        const firstSheetName = workbook.SheetNames[0];
        if (!firstSheetName) throw new Error('A planilha não possui abas para exibir.');
        const worksheet = workbook.Sheets[firstSheetName];
        const matrix = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '', raw: false });
        renderSheet(firstSheetName, matrix, worksheet['!rows'] || []);
        statusBox.className = 'ok';
        statusBox.textContent = `Planilha “${file.name}” montada na tela com sucesso.`;
        form.reset();
    } catch (error) {
        statusBox.className = 'error';
        statusBox.textContent = error.message;
    } finally {
        uploadButton.disabled = false;
    }
});
</script>
</body>
</html>
