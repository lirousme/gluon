<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gluon • Mapa de Fases</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        :root { --hud:rgba(17,29,47,.65); }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { min-height:100vh; background:linear-gradient(180deg,#0f172a,#1e293b); color:#fff; font-family:"Nunito",sans-serif; overflow:hidden; }
        .page { min-height:100vh; display:grid; place-items:center; padding:1rem; }
        .map-shell { width:min(100%,31rem); height:min(95vh,58rem); border-radius:2rem; border:.14rem solid rgba(255,255,255,.45); background:rgba(255,255,255,.08); padding:1rem; display:grid; grid-template-rows:auto 1fr; gap:.8rem; }
        .hud { display:flex; align-items:center; justify-content:space-between; gap:.6rem; background:var(--hud); border-radius:1rem; padding:.6rem .75rem; }
        .hud h1 { font-family:"Baloo 2",cursive; font-size:1rem; line-height:1.2; }
        .hud small { display:block; font-size:.78rem; opacity:.9; }
        .pager { display:flex; align-items:center; gap:.45rem; }
        .pager button { border:0; border-radius:.7rem; padding:.45rem .65rem; cursor:pointer; font-weight:700; }
        .pager button:disabled { opacity:.4; cursor:not-allowed; }
        .map-board { position:relative; border-radius:1.2rem; overflow:hidden; background:#1f2937 center/cover no-repeat; }
        .nodes { position:absolute; inset:2.5rem 2rem 1.7rem; z-index:2; }
        .level-btn { --size:2.6rem; position:absolute; width:var(--size); height:var(--size); border-radius:50%; border:0; display:grid; place-items:center; color:#fff; font-weight:800; background:linear-gradient(180deg,#ffb44f,#dc7c14); cursor:pointer; box-shadow:0 .2rem .5rem rgba(0,0,0,.35); }
        .level-btn.locked { background:linear-gradient(180deg,#64748b,#334155); opacity:.85; cursor:not-allowed; }
        .level-btn.locked::after { content:'🔒'; position:absolute; right:-.3rem; top:-.35rem; font-size:.8rem; }
        .legend { position:absolute; left:50%; transform:translateX(-50%); bottom:.8rem; background:rgba(13,32,53,.58); border-radius:999px; padding:.3rem .65rem; font-size:.72rem; z-index:2; }
        .msg { position:absolute; top:1rem; left:50%; transform:translateX(-50%); background:rgba(18,41,66,.8); border-radius:.7rem; padding:.5rem .8rem; opacity:0; transition:opacity .2s; z-index:5; }
        .msg.show { opacity:1; }
    </style>
</head>
<body>
<main class="page">
    <section class="map-shell">
        <header class="hud">
            <div>
                <h1 id="trackTitle">🗺️ Carregando...</h1>
                <small id="mapMeta">Mapa 1</small>
            </div>
            <div class="pager">
                <button id="btnPrev">◀</button>
                <button id="btnNext">▶</button>
            </div>
        </header>
        <div class="map-board" id="mapBoard">
            <div class="msg" id="mapMsg"></div>
            <div class="nodes" id="nodes"></div>
            <div class="legend">Fases do mapa atual</div>
        </div>
    </section>
</main>
<script>
const qs = new URLSearchParams(location.search);
const trackId = Number(qs.get('id') || 0);
const nodesEl = document.getElementById('nodes');
const msg = document.getElementById('mapMsg');
const mapBoard = document.getElementById('mapBoard');
let activeMap = 1;
let mapDirectories = [];
let unlockByPhaseId = new Map();

const positions = [
    {l:47,t:3},{l:68,t:12},{l:34,t:19},{l:50,t:28},{l:72,t:37},
    {l:42,t:46},{l:25,t:55},{l:58,t:64},{l:70,t:73},{l:48,t:82}
];

function toast(text){ msg.textContent=text; msg.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>msg.classList.remove('show'),2000); }

async function apiDirectories(action, payload = {}) {
    const res = await fetch('/api/directories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...payload })
    });
    return res.json();
}

function setMapBackground(mapNumber){
    const fallback = "url('../assets/map-bg-candy.svg') center/cover no-repeat";
    const img = new Image();
    img.onload = () => {
        mapBoard.style.background = `url('../assets/mapa-${mapNumber}.jpg') center/cover no-repeat`;
    };
    img.onerror = () => {
        mapBoard.style.background = fallback;
    };
    img.src = `../assets/mapa-${mapNumber}.jpg`;
}

function renderNodes(phases){
    nodesEl.innerHTML='';
    phases.forEach((phase, i) => {
        const positionIndex = positions.length - 1 - i;
        const p = positions[positionIndex] || { l: 50, t: 50 };
        const b = document.createElement('button');
        b.className = 'level-btn';
        b.style.left = `${p.l}%`;
        b.style.top = `${p.t}%`;
        b.textContent = String(i + 1);
        b.title = phase.name || `Fase ${i + 1}`;
        const unlocked = !!unlockByPhaseId.get(Number(phase.id));
        if (!unlocked) {
            b.classList.add('locked');
            b.title = `${b.title} (bloqueada)`;
        }
        b.onclick = () => {
            if (!unlocked) {
                toast('Fase bloqueada: revise todos os flashcards da fase anterior.');
                return;
            }
            window.location.href = `/flashcards?id=${phase.id}&from=${encodeURIComponent(location.pathname + location.search)}`;
        };
        nodesEl.appendChild(b);
    });
}

function isPhaseCleared(phase){
    const total = Number(phase.deck_total_cards || 0);
    const due = Number(phase.deck_due_cards || 0);
    if (total <= 0) return true;
    return due <= 0;
}

function rebuildUnlockState(allMapsWithPhases){
    unlockByPhaseId = new Map();
    const ordered = [];
    allMapsWithPhases.forEach(map => {
        map.phases.forEach(phase => ordered.push(phase));
    });
    ordered.forEach((phase, index) => {
        if (index === 0) {
            unlockByPhaseId.set(Number(phase.id), true);
            return;
        }
        const prev = ordered[index - 1];
        unlockByPhaseId.set(Number(phase.id), isPhaseCleared(prev));
    });
}

async function loadMaps(){
    const data = await apiDirectories('fetch', { parent_id: trackId });
    if (data.status !== 'success') {
        toast(data.message || 'Erro ao carregar trilha.');
        return;
    }

    mapDirectories = (Array.isArray(data.data) ? data.data : [])
        .filter(item => Number(item.type) === 9)
        .sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0) || Number(a.id) - Number(b.id));

    if (!mapDirectories.length) {
        document.getElementById('trackTitle').textContent = '🗺️ Trilha sem mapas';
        document.getElementById('mapMeta').textContent = 'Crie diretórios do tipo Mapa dentro da trilha';
        renderNodes([]);
        return;
    }

    const mapsWithPhases = await Promise.all(
        mapDirectories.map(async (mapDir) => {
            const mapData = await apiDirectories('fetch', { parent_id: mapDir.id });
            const phases = mapData.status === 'success' && Array.isArray(mapData.data)
                ? mapData.data
                    .filter(item => Number(item.type) === 10)
                    .sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0) || Number(a.id) - Number(b.id))
                : [];
            return { mapDir, phases };
        })
    );
    rebuildUnlockState(mapsWithPhases);

    const trailName = qs.get('name') || 'Trilha';
    document.getElementById('trackTitle').textContent = `🗺️ ${trailName}`;
    loadMap(1);
}

async function loadMap(mapIndex){
    if (!mapDirectories.length) return;
    activeMap = Math.max(1, Math.min(mapDirectories.length, mapIndex));
    const mapDir = mapDirectories[activeMap - 1];

    const data = await apiDirectories('fetch', { parent_id: mapDir.id });
    if (data.status !== 'success') {
        toast(data.message || 'Erro ao carregar fases do mapa.');
        return;
    }

    const phases = (Array.isArray(data.data) ? data.data : [])
        .filter(item => Number(item.type) === 10)
        .sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0) || Number(a.id) - Number(b.id));

    setMapBackground(activeMap);
    document.getElementById('mapMeta').textContent = `Mapa ${activeMap} de ${mapDirectories.length} · ${phases.length} fases`;
    document.getElementById('btnPrev').disabled = activeMap <= 1;
    document.getElementById('btnNext').disabled = activeMap >= mapDirectories.length;
    renderNodes(phases);
}

document.getElementById('btnPrev').onclick = () => loadMap(activeMap - 1);
document.getElementById('btnNext').onclick = () => loadMap(activeMap + 1);

if (!trackId) toast('Informe o id da trilha na URL.');
else loadMaps();
</script>
</body>
</html>
