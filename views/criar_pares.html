<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gluon - Criar pares</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <header class="h-16 border-b border-slate-800 bg-slate-900 flex items-center justify-between px-4">
        <button id="btnVoltar" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700">Voltar</button>
        <h1 class="font-semibold">Criar pares</h1>
        <div class="w-16"></div>
    </header>
    <main class="flex-1 flex items-center justify-center p-4 text-center text-slate-300">
        <p id="mensagem"></p>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const directoryId = Number(params.get('id') || 0);
        document.getElementById('mensagem').textContent = directoryId
            ? `Tela de criação de pares para o diretório #${directoryId}.`
            : 'ID de diretório inválido para criar pares.';

        document.getElementById('btnVoltar').addEventListener('click', () => {
            window.location.href = directoryId ? `/pares?id=${directoryId}` : '/dashboard';
        });
    </script>
</body>
</html>
