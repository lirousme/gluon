<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gluon - End Points</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <main class="max-w-4xl mx-auto p-6 space-y-6">
        <header>
            <h1 class="text-2xl font-bold">End Points</h1>
            <p class="text-slate-400 text-sm">A lista exibe somente o nome. Edite caminho, nome e estrutura da resposta via modais.</p>
        </header>

        <section class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between gap-3">
                <span class="font-semibold">Lista de End Points</span>
                <button onclick="app.addEndpoint()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded-lg text-sm font-medium">
                    <i class="fa-solid fa-plus mr-1"></i> Novo
                </button>
            </div>
            <ul id="endpointList" class="divide-y divide-slate-800"></ul>
        </section>
    </main>

    <div id="responseModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold">Estrutura da resposta</h2>
                <button onclick="app.closeResponseModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">Edite a estrutura da resposta apenas neste modal.</p>
            <textarea id="responseStructureInput" rows="12" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm font-mono"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="app.closeResponseModal()" class="px-3 py-2 rounded-lg border border-slate-700">Cancelar</button>
                <button onclick="app.saveResponseStructure()" class="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500">Salvar</button>
            </div>
        </div>
    </div>

    <div id="pathNameModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4">
        <div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-xl p-5 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold">Editar nome e caminho</h2>
                <button onclick="app.closePathNameModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">Nome e caminho ficam em um modal separado.</p>
            <div class="space-y-3">
                <div>
                    <label class="text-sm text-slate-300 block mb-1">Nome</label>
                    <input id="endpointNameInput" type="text" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="text-sm text-slate-300 block mb-1">Caminho</label>
                    <input id="endpointPathInput" type="text" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2">
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="app.closePathNameModal()" class="px-3 py-2 rounded-lg border border-slate-700">Cancelar</button>
                <button onclick="app.savePathName()" class="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        const app = {
            endpoints: [
                { id: 1, name: 'Listar Usuários', path: '/api/users/list', responseStructure: '{"status":"success","data":[{"id":1,"name":"Ana"}]}' },
                { id: 2, name: 'Criar Usuário', path: '/api/users/create', responseStructure: '{"status":"success","message":"Usuário criado"}' }
            ],
            selectedId: null,

            init() {
                this.renderList();
            },

            renderList() {
                const list = document.getElementById('endpointList');
                if (this.endpoints.length === 0) {
                    list.innerHTML = '<li class="p-4 text-sm text-slate-400">Nenhum end point cadastrado.</li>';
                    return;
                }

                list.innerHTML = this.endpoints.map((item) => `
                    <li class="p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <span class="font-medium">${this.escapeHtml(item.name)}</span>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="app.openPathNameModal(${item.id})" class="text-sm px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800">
                                Nome e caminho
                            </button>
                            <button onclick="app.openResponseModal(${item.id})" class="text-sm px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500">
                                Estrutura da resposta
                            </button>
                        </div>
                    </li>
                `).join('');
            },

            addEndpoint() {
                const nextId = this.endpoints.length ? Math.max(...this.endpoints.map((item) => item.id)) + 1 : 1;
                this.endpoints.unshift({
                    id: nextId,
                    name: `Novo End Point ${nextId}`,
                    path: '/api/novo/caminho',
                    responseStructure: '{"status":"success","data":{}}'
                });
                this.renderList();
            },

            openResponseModal(id) {
                const item = this.endpoints.find((endpoint) => endpoint.id === id);
                if (!item) return;
                this.selectedId = id;
                document.getElementById('responseStructureInput').value = item.responseStructure || '';
                this.toggleModal('responseModal', true);
            },

            closeResponseModal() {
                this.selectedId = null;
                this.toggleModal('responseModal', false);
            },

            saveResponseStructure() {
                const item = this.endpoints.find((endpoint) => endpoint.id === this.selectedId);
                if (!item) return;
                item.responseStructure = document.getElementById('responseStructureInput').value.trim();
                this.closeResponseModal();
                this.renderList();
            },

            openPathNameModal(id) {
                const item = this.endpoints.find((endpoint) => endpoint.id === id);
                if (!item) return;
                this.selectedId = id;
                document.getElementById('endpointNameInput').value = item.name || '';
                document.getElementById('endpointPathInput').value = item.path || '';
                this.toggleModal('pathNameModal', true);
            },

            closePathNameModal() {
                this.selectedId = null;
                this.toggleModal('pathNameModal', false);
            },

            savePathName() {
                const item = this.endpoints.find((endpoint) => endpoint.id === this.selectedId);
                if (!item) return;

                const newName = document.getElementById('endpointNameInput').value.trim();
                const newPath = document.getElementById('endpointPathInput').value.trim();
                if (!newName || !newPath) return;

                item.name = newName;
                item.path = newPath;

                this.closePathNameModal();
                this.renderList();
            },

            toggleModal(id, show) {
                const modal = document.getElementById(id);
                modal.classList.toggle('hidden', !show);
                modal.classList.toggle('flex', show);
            },

            escapeHtml(value) {
                return String(value)
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#39;');
            }
        };

        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') return;
            app.closeResponseModal();
            app.closePathNameModal();
        });

        app.init();
    </script>
</body>
</html>
