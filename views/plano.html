<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Gluon - Plano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
<nav class="h-16 px-4 sm:px-6 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex items-center justify-between">
    <div class="flex items-center gap-3">
        <button onclick="goBack()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
            <p class="text-xs text-slate-400">Diretório do tipo Plano</p>
            <h1 id="planName" class="font-semibold">Carregando...</h1>
        </div>
    </div>
    <span id="currentPhaseBadge" class="text-xs px-2 py-1 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30">Fase atual: -</span>
</nav>

<main class="max-w-5xl mx-auto p-4 sm:p-6 space-y-4" id="accordionContainer"></main>

<script>
const PHASES = [
    'Detecção do problema/objetivo',
    'Brainstorm de soluções',
    'Planejamento',
    'Teste do plano',
    'Implementação monitorizada com feedback periódico'
];

function q(name) { return new URLSearchParams(window.location.search).get(name); }
function goBack() {
    const from = q('from');
    if (from) { window.location.href = decodeURIComponent(from); return; }
    window.location.href = '/dashboard';
}

const planoApp = {
    dirId: Number(q('id')),
    currentPhase: 1,
    phasesData: {},
    recurrenceRules: {},

    toast(message, ok = true) {
        let toast = document.getElementById('toast');
        if (!toast) { toast = document.createElement('div'); toast.id = 'toast'; document.body.appendChild(toast); }
        toast.className = `fixed right-4 bottom-4 px-4 py-2 rounded-lg text-white text-sm border ${ok ? 'bg-green-600 border-green-500' : 'bg-red-600 border-red-500'}`;
        toast.textContent = message;
        setTimeout(() => toast.remove(), 2600);
    },

    async api(action, payload = {}) {
        const res = await fetch('/api/plano', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action, directory_id: this.dirId, ...payload })
        });
        if (res.status === 401) window.location.href = '/';
        return await res.json();
    },

    updateHeader() {
        document.getElementById('currentPhaseBadge').textContent = `Fase atual: ${this.currentPhase}/5`;
    },

    recurrenceInputsHtml(phase, rule) {
        return `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 mt-3">
                <select id="rec_type_${phase}" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm">
                    <option value="" ${!rule.type ? 'selected' : ''}>Sem repetição</option>
                    <option value="hourly" ${rule.type === 'hourly' ? 'selected' : ''}>A cada horas</option>
                    <option value="daily" ${rule.type === 'daily' ? 'selected' : ''}>Diária</option>
                    <option value="weekly" ${rule.type === 'weekly' ? 'selected' : ''}>Semanal</option>
                    <option value="monthly" ${rule.type === 'monthly' ? 'selected' : ''}>Mensal</option>
                    <option value="yearly" ${rule.type === 'yearly' ? 'selected' : ''}>Anual</option>
                    <option value="custom" ${rule.type === 'custom' ? 'selected' : ''}>Datas custom</option>
                </select>
                <input id="rec_interval_${phase}" type="number" min="1" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm" value="${rule.interval_value || 1}" placeholder="Intervalo">
                <input id="rec_days_${phase}" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm" value="${rule.days_of_week || ''}" placeholder="Dias semana (0,1,2)">
                <input id="rec_custom_${phase}" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm" value="${rule.custom_dates || ''}" placeholder='Datas JSON ["2026-01-05"]'>
                <input id="rec_start_${phase}" type="date" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm" value="${rule.start_date || ''}" placeholder="Data início">
                <input id="rec_end_${phase}" type="date" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm" value="${rule.end_date || ''}" placeholder="Data fim">
                <input id="rec_time_start_${phase}" type="time" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm" value="${rule.time_start || ''}" placeholder="Hora início">
                <input id="rec_time_end_${phase}" type="time" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm" value="${rule.time_end || ''}" placeholder="Hora fim">
            </div>
            <button onclick="planoApp.saveRecurrence(${phase})" class="mt-2 px-3 py-2 text-sm rounded bg-violet-600 hover:bg-violet-500">Salvar repetição da fase</button>
        `;
    },

    render() {
        this.updateHeader();
        const container = document.getElementById('accordionContainer');
        container.innerHTML = PHASES.map((title, idx) => {
            const phase = idx + 1;
            const data = this.phasesData[String(phase)] || { brainstorm: '', conclusion: '', completed_at: null };
            const rule = this.recurrenceRules[String(phase)] || {};
            const completed = !!data.completed_at;
            return `
                <section class="border border-slate-800 rounded-xl bg-slate-900/70 overflow-hidden">
                    <button onclick="planoApp.toggle(${phase})" class="w-full text-left px-4 py-3 flex justify-between items-center hover:bg-slate-800/80">
                        <span class="font-medium">${phase}. ${title}</span>
                        <span class="text-xs ${completed ? 'text-green-300' : 'text-slate-400'}">${completed ? 'Concluída' : 'Pendente'}</span>
                    </button>
                    <div id="phase_body_${phase}" class="${phase === this.currentPhase ? '' : 'hidden'} px-4 pb-4 space-y-3">
                        <div>
                            <label class="text-sm text-slate-300">Brainstorm</label>
                            <textarea id="brainstorm_${phase}" rows="3" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded p-2">${data.brainstorm || ''}</textarea>
                        </div>
                        <div>
                            <label class="text-sm text-slate-300">Conclusão</label>
                            <textarea id="conclusion_${phase}" rows="3" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded p-2">${data.conclusion || ''}</textarea>
                        </div>
                        <div class="pt-1 border-t border-slate-800">
                            <p class="text-xs text-slate-400 mb-1">Repetições específicas desta fase na agenda</p>
                            ${this.recurrenceInputsHtml(phase, rule)}
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button onclick="planoApp.savePhase(${phase})" class="px-3 py-2 rounded bg-blue-600 hover:bg-blue-500 text-sm">Salvar fase</button>
                            <button onclick="planoApp.completePhase(${phase})" class="px-3 py-2 rounded bg-green-600 hover:bg-green-500 text-sm">Concluir fase e avançar</button>
                        </div>
                    </div>
                </section>
            `;
        }).join('');
    },

    toggle(phase) {
        const el = document.getElementById(`phase_body_${phase}`);
        el.classList.toggle('hidden');
    },

    async load() {
        if (!this.dirId) { this.toast('ID do plano inválido', false); return; }
        const res = await this.api('fetch');
        if (res.status !== 'success') { this.toast(res.message || 'Erro ao carregar', false); return; }
        document.getElementById('planName').textContent = res.name;
        this.currentPhase = Number(res.current_phase || 1);
        this.phasesData = res.phases_data || {};
        this.recurrenceRules = res.recurrence_rules || {};
        this.render();
    },

    async savePhase(phase) {
        const brainstorm = document.getElementById(`brainstorm_${phase}`).value;
        const conclusion = document.getElementById(`conclusion_${phase}`).value;
        const res = await this.api('save_phase', { phase, brainstorm, conclusion });
        this.toast(res.message || (res.status === 'success' ? 'Salvo' : 'Erro'), res.status === 'success');
        if (res.status === 'success') await this.load();
    },

    async saveRecurrence(phase) {
        const rule = {
            type: document.getElementById(`rec_type_${phase}`).value,
            interval_value: Number(document.getElementById(`rec_interval_${phase}`).value || 1),
            days_of_week: document.getElementById(`rec_days_${phase}`).value,
            custom_dates: document.getElementById(`rec_custom_${phase}`).value,
            start_date: document.getElementById(`rec_start_${phase}`).value,
            end_date: document.getElementById(`rec_end_${phase}`).value,
            time_start: document.getElementById(`rec_time_start_${phase}`).value,
            time_end: document.getElementById(`rec_time_end_${phase}`).value
        };
        const res = await this.api('set_phase_recurrence', { phase, rule });
        this.toast(res.message || (res.status === 'success' ? 'Repetição salva' : 'Erro'), res.status === 'success');
        if (res.status === 'success') await this.load();
    },

    async completePhase(phase) {
        const res = await this.api('complete_phase', { phase });
        this.toast(res.message || (res.status === 'success' ? 'Fase concluída' : 'Erro'), res.status === 'success');
        if (res.status === 'success') await this.load();
    }
};

planoApp.load();
</script>
</body>
</html>
