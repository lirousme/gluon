<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Gluon - Plano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
<nav class="h-16 px-4 sm:px-6 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex items-center justify-between">
    <div class="flex items-center gap-3">
        <button onclick="goBack()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
            <p class="text-xs text-slate-400">Diretório do tipo Plano</p>
            <h1 id="planName" class="font-semibold">Carregando...</h1>
        </div>
    </div>
    <span id="currentPhaseBadge" class="text-xs px-2 py-1 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30">Fase atual: -</span>
</nav>

<main class="max-w-5xl mx-auto p-4 sm:p-6 space-y-4" id="accordionContainer"></main>

<script>
const PHASES = [
    'Detecção do problema/objetivo',
    'Brainstorm de soluções',
    'Planejamento',
    'Teste do plano',
    'Implementação monitorizada com feedback periódico'
];

function q(name) { return new URLSearchParams(window.location.search).get(name); }
function goBack() {
    const from = q('from');
    if (from) { window.location.href = decodeURIComponent(from); return; }
    window.location.href = '/dashboard';
}

const planoApp = {
    dirId: Number(q('id')),
    currentPhase: 1,
    phasesData: {},
    recurrenceRules: {},

    toast(message, ok = true) {
        let toast = document.getElementById('toast');
        if (!toast) { toast = document.createElement('div'); toast.id = 'toast'; document.body.appendChild(toast); }
        toast.className = `fixed right-4 bottom-4 px-4 py-2 rounded-lg text-white text-sm border ${ok ? 'bg-green-600 border-green-500' : 'bg-red-600 border-red-500'}`;
        toast.textContent = message;
        setTimeout(() => toast.remove(), 2600);
    },

    async api(action, payload = {}) {
        let res;
        try {
            res = await fetch('/api/plano', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action, directory_id: this.dirId, ...payload })
            });
        } catch (error) {
            throw new Error(`Falha de conexão com o servidor: ${error.message || 'verifique sua internet.'}`);
        }

        if (res.status === 401) {
            window.location.href = '/';
            throw new Error('Sua sessão expirou. Faça login novamente.');
        }

        const responseText = await res.text();
        let data;
        try {
            data = JSON.parse(responseText);
        } catch (error) {
            console.error('[Plano API] Resposta inválida:', { action, status: res.status, responseText });
            throw new Error(`O servidor retornou uma resposta inválida (HTTP ${res.status}).`);
        }

        if (!res.ok && !data.message) {
            throw new Error(`A operação falhou no servidor (HTTP ${res.status}).`);
        }

        return data;
    },

    updateHeader() {
        document.getElementById('currentPhaseBadge').textContent = `Fase atual: ${this.currentPhase}/5`;
    },

    recurrenceInputsHtml(phase, rule) {
        const isRecurring = Number(rule.is_recurring || 0) === 1;
        return `
            <div class="mt-3 space-y-4 border-t border-slate-800 pt-3">
                <label class="flex items-center gap-2 cursor-pointer mb-2">
                    <input type="checkbox" id="is_recurring_${phase}" class="rounded border-slate-600 bg-slate-800 text-violet-500 focus:ring-violet-500 transition-colors" ${isRecurring ? 'checked' : ''} onchange="planoApp.toggleRecurrenceFields(${phase})">
                    <span class="text-sm font-medium text-slate-300">Ativar Repetição Automática</span>
                </label>

                <div id="recurrence_fields_${phase}" class="space-y-4 border-t border-slate-700 pt-4 ${isRecurring ? '' : 'hidden'}">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Frequência</label>
                        <select id="rec_type_${phase}" class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2.5 px-3 text-white" onchange="planoApp.handleRecurrenceTypeChange(${phase})">
                            <option value="hourly" ${rule.type === 'hourly' ? 'selected' : ''}>De hora em hora (Diário)</option>
                            <option value="daily" ${rule.type === 'daily' ? 'selected' : ''}>Diariamente</option>
                            <option value="weekly" ${rule.type === 'weekly' ? 'selected' : ''}>Semanalmente</option>
                            <option value="monthly" ${rule.type === 'monthly' ? 'selected' : ''}>Mensalmente</option>
                            <option value="yearly" ${rule.type === 'yearly' ? 'selected' : ''}>Anualmente</option>
                            <option value="custom" ${rule.type === 'custom' ? 'selected' : ''}>Datas Específicas</option>
                        </select>
                    </div>

                    <div id="rec_interval_container_${phase}">
                        <label class="block text-sm font-medium text-slate-300 mb-1">A cada (intervalo)</label>
                        <input id="rec_interval_${phase}" type="number" min="1" value="${rule.interval_value || 1}" class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
                    </div>

                    <div id="rec_hourly_container_${phase}" class="hidden">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Janela: Início</label>
                                <input id="rec_time_start_${phase}" type="time" value="${rule.time_start || ''}" class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-1">Janela: Término</label>
                                <input id="rec_time_end_${phase}" type="time" value="${rule.time_end || ''}" class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
                            </div>
                        </div>
                    </div>

                    <div id="rec_custom_container_${phase}" class="hidden">
                        <label class="block text-sm font-medium text-slate-300 mb-1">Datas (formato JSON)</label>
                        <input id="rec_custom_${phase}" type="text" value="${rule.custom_dates || ''}" placeholder='Ex: ["2026-03-01", "2026-04-05"]' class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2.5 px-3 text-white font-mono text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Parar de repetir em (Opcional)</label>
                        <input id="rec_end_${phase}" type="date" value="${rule.end_date || ''}" class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
                    </div>
                </div>
            </div>
            <button onclick="planoApp.saveRecurrence(${phase})" class="mt-2 px-3 py-2 text-sm rounded bg-violet-600 hover:bg-violet-500">Salvar repetição da fase</button>
        `;
    },

    toggleRecurrenceFields(phase) {
        const isChecked = document.getElementById(`is_recurring_${phase}`).checked;
        const fields = document.getElementById(`recurrence_fields_${phase}`);
        if (isChecked) fields.classList.remove('hidden');
        else fields.classList.add('hidden');
    },

    handleRecurrenceTypeChange(phase) {
        const type = document.getElementById(`rec_type_${phase}`).value;
        const intervalCont = document.getElementById(`rec_interval_container_${phase}`);
        const customCont = document.getElementById(`rec_custom_container_${phase}`);
        const hourlyCont = document.getElementById(`rec_hourly_container_${phase}`);

        if (type === 'custom') {
            intervalCont.classList.add('hidden');
            customCont.classList.remove('hidden');
            hourlyCont.classList.add('hidden');
        } else if (type === 'hourly') {
            intervalCont.classList.remove('hidden');
            customCont.classList.add('hidden');
            hourlyCont.classList.remove('hidden');
        } else {
            intervalCont.classList.remove('hidden');
            customCont.classList.add('hidden');
            hourlyCont.classList.add('hidden');
        }
    },

    render() {
        this.updateHeader();
        const container = document.getElementById('accordionContainer');
        container.innerHTML = PHASES.map((title, idx) => {
            const phase = idx + 1;
            const data = this.phasesData[String(phase)] || { brainstorm: '', conclusion: '', completed_at: null };
            const rule = this.recurrenceRules[String(phase)] || {};
            const completed = !!data.completed_at;
            return `
                <section class="border border-slate-800 rounded-xl bg-slate-900/70 overflow-hidden">
                    <button onclick="planoApp.toggle(${phase})" class="w-full text-left px-4 py-3 flex justify-between items-center hover:bg-slate-800/80">
                        <span class="font-medium">${phase}. ${title}</span>
                        <span class="text-xs ${completed ? 'text-green-300' : 'text-slate-400'}">${completed ? 'Concluída' : 'Pendente'}</span>
                    </button>
                    <div id="phase_body_${phase}" class="${phase === this.currentPhase ? '' : 'hidden'} px-4 pb-4 space-y-3">
                        <div>
                            <label class="text-sm text-slate-300">Brainstorm</label>
                            <textarea id="brainstorm_${phase}" rows="3" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded p-2">${data.brainstorm || ''}</textarea>
                        </div>
                        <div>
                            <label class="text-sm text-slate-300">Conclusão</label>
                            <textarea id="conclusion_${phase}" rows="3" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded p-2">${data.conclusion || ''}</textarea>
                        </div>
                        <div class="pt-1 border-t border-slate-800">
                            <p class="text-xs text-slate-400 mb-1">Repetições específicas desta fase na agenda</p>
                            ${this.recurrenceInputsHtml(phase, rule)}
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button onclick="planoApp.savePhase(${phase})" class="px-3 py-2 rounded bg-blue-600 hover:bg-blue-500 text-sm">Salvar fase</button>
                            <button onclick="planoApp.completePhase(${phase})" class="px-3 py-2 rounded bg-green-600 hover:bg-green-500 text-sm">Concluir fase e avançar</button>
                        </div>
                    </div>
                </section>
            `;
        }).join('');

        for (let phase = 1; phase <= PHASES.length; phase++) {
            this.handleRecurrenceTypeChange(phase);
        }
    },

    toggle(phase) {
        const el = document.getElementById(`phase_body_${phase}`);
        el.classList.toggle('hidden');
    },

    async load() {
        if (!this.dirId) { this.toast('ID do plano inválido', false); return; }
        const res = await this.api('fetch');
        if (res.status !== 'success') { this.toast(res.message || 'Erro ao carregar', false); return; }
        document.getElementById('planName').textContent = res.name;
        this.currentPhase = Number(res.current_phase || 1);
        this.phasesData = res.phases_data || {};
        this.recurrenceRules = res.recurrence_rules || {};
        this.render();
    },

    async savePhase(phase) {
        const brainstorm = document.getElementById(`brainstorm_${phase}`).value;
        const conclusion = document.getElementById(`conclusion_${phase}`).value;
        const res = await this.api('save_phase', { phase, brainstorm, conclusion });
        this.toast(res.message || (res.status === 'success' ? 'Salvo' : 'Erro'), res.status === 'success');
        if (res.status === 'success') await this.load();
    },

    async saveRecurrence(phase) {
        const isRecurring = document.getElementById(`is_recurring_${phase}`).checked ? 1 : 0;
        const rule = {
            is_recurring: isRecurring,
            type: document.getElementById(`rec_type_${phase}`).value,
            interval_value: Number(document.getElementById(`rec_interval_${phase}`).value || 1),
            custom_dates: document.getElementById(`rec_custom_${phase}`).value,
            end_date: document.getElementById(`rec_end_${phase}`).value,
            time_start: document.getElementById(`rec_time_start_${phase}`).value,
            time_end: document.getElementById(`rec_time_end_${phase}`).value
        };
        if (!isRecurring) {
            rule.type = '';
        }
        try {
            const res = await this.api('set_phase_recurrence', { phase, rule });
            if (res.status !== 'success') {
                throw new Error(res.message || 'O servidor não informou o motivo da falha.');
            }
            this.toast(res.message || 'Repetição salva', true);
            await this.load();
        } catch (error) {
            console.error('[Plano] Falha ao salvar repetição:', error);
            this.toast(`Não foi possível salvar a repetição: ${error.message}`, false);
        }
    },

    async completePhase(phase) {
        const res = await this.api('complete_phase', { phase });
        this.toast(res.message || (res.status === 'success' ? 'Fase concluída' : 'Erro'), res.status === 'success');
        if (res.status === 'success') await this.load();
    }
};

planoApp.load();
</script>
</body>
</html>
