<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Guia de ações</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(circle at 50% -20%, #17345c 0, #08111f 38%); color: #e5edf8; }
        header { flex: 0 0 auto; padding: 14px clamp(16px, 2.5vw, 40px); border-bottom: 1px solid #243247; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
        header a { color: #9fb0c9; text-decoration: none; font-size: 24px; }
        .filter-actions { display: flex; align-items: center; gap: 10px; }
        main { width: 100%; min-height: 0; flex: 1; display: flex; flex-direction: column; padding: 30px clamp(12px, 2vw, 32px) 44px; }
        .navigator { border: 1px solid #293950; background: linear-gradient(135deg, #111f32, #0d1929); padding: 10px 14px; border-radius: 14px; box-shadow: 0 18px 40px #0005; }
        input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .search-input { width: 100%; min-height: 44px; border: 1px solid #354b69; border-radius: 10px; padding: 0 14px; background: #0a1524; color: #e5edf8; font: inherit; outline: none; }
        .search-input:focus { border-color: #65a0ff; box-shadow: 0 0 0 3px #2878ff2e; }
        button { border: 1px solid transparent; border-radius: 10px; padding: 0 18px; min-height: 42px; font-weight: 700; color: white; background: #2878ff; cursor: pointer; }
        .clear-filters-button { background: transparent; border-color: #354b69; color: #9fb0c9; }
        .clear-filters-button:hover { background: #162945; color: #fff; }
        .filter-button { background: #162945; border-color: #354b69; color: #c9d6e8; }
        .filter-button.active { background: #2878ff; border-color: #65a0ff; color: #fff; box-shadow: 0 0 0 2px #2878ff33; }
        .upload-button { width: 44px; padding: 0; display: inline-grid; place-items: center; margin-left: auto; background: #162945; border-color: #354b69; color: #c9d6e8; }
        .upload-button svg { width: 22px; height: 22px; }
        .column-button { background: #162945; border-color: #354b69; color: #c9d6e8; }
        dialog { width: min(440px, calc(100vw - 28px)); border: 1px solid #354b69; border-radius: 16px; padding: 0; color: #e5edf8; background: #101e31; box-shadow: 0 24px 80px #000b; }
        dialog::backdrop { background: #020711b8; }
        .modal-content { padding: 24px; display: grid; gap: 16px; }
        .modal-content h2 { margin: 0; font-size: 20px; }
        .modal-content label { display: grid; gap: 7px; color: #b9c7da; font-size: 13px; }
        .modal-content input, .modal-content select { width: 100%; min-height: 42px; border: 1px solid #354b69; border-radius: 8px; padding: 8px 11px; background: #08111f; color: #fff; font: inherit; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .danger { margin-right: auto; background: #8e2634; }
        .modal-help { margin: 0; color: #8495ad; font-size: 12px; line-height: 1.5; }
        button:disabled { opacity: .55; cursor: wait; }
        #filter-description { margin: 7px 0 0; color: #9fb0c9; font-size: 12px; }
        #filter-description:empty, #status:empty { display: none; }
        #status { margin: 5px 0 0; font-size: 12px; font-weight: 600; }
        #status.ok { color: #53d89b; } #status.error { color: #ff7d8b; }
        .listing { min-height: 0; flex: 1; display: flex; flex-direction: column; margin-top: 24px; border: 1px solid #293950; border-radius: 16px; overflow: hidden; background: #0d1929; box-shadow: 0 18px 40px #0004; }
        .listing-title { display: flex; justify-content: space-between; gap: 16px; padding: 18px 22px; align-items: center; }
        .listing-title h2 { margin: 0; font-size: 18px; }
        .count { color: #99a9bf; }
        .scroll { min-height: 0; flex: 1; overflow: auto; overscroll-behavior: contain; }
        table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
        th, td { padding: 11px 14px; text-align: right; border-top: 1px solid #223149; border-right: 1px solid #1b2a40; white-space: nowrap; }
        th { position: sticky; top: 0; z-index: 2; background: #142238; color: #aebdd2; font-size: 11px; letter-spacing: .025em; text-transform: uppercase; }
        th[draggable="true"] { cursor: grab; user-select: none; }
        th[draggable="true"]:active { cursor: grabbing; }
        th.dragging { opacity: .4; }
        th.drag-target { box-shadow: inset 3px 0 #65a0ff; }
        .sort-button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 4px; padding: 0; min-height: 0; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; }
        .sort-button::after { content: '↕'; color: #657892; font-size: 12px; }
        th[aria-sort="ascending"] .sort-button::after { content: '↑'; color: #72a7ff; }
        th[aria-sort="descending"] .sort-button::after { content: '↓'; color: #72a7ff; }
        td { font-size: 14px; } td:first-child { color: #72a7ff; font-weight: 800; }
        td.editable { cursor: cell; }
        td.editable:hover { box-shadow: inset 0 0 0 1px #3f6598; }
        .cell-editor { width: 100%; min-width: 90px; padding: 5px 7px; border: 1px solid #65a0ff; border-radius: 5px; background: #08111f; color: #fff; font: inherit; text-align: inherit; outline: none; box-shadow: 0 0 0 2px #2878ff33; }
        th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; text-align: left; background: #101e31; }
        th:first-child { z-index: 3; background: #142238; }
        th:nth-child(2), td:nth-child(2) { text-align: left; }
        tbody tr:hover td { background: #14263d; }
        tbody tr:hover td:first-child { background: #172b45; }
        .empty { padding: 45px; text-align: center; color: #8495ad; }
        @media (max-width: 640px) {
            header { padding-block: 16px; }
            main { padding-top: 18px; }
            .listing-title { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
<header>
    <a href="/dashboard" aria-label="Voltar">←</a>
    <button id="clear-filters-button" class="clear-filters-button" type="button">Limpar filtros</button>
    <nav class="filter-actions" aria-label="Filtros da tabela">
        <button class="filter-button" type="button" data-filter="vpa" aria-pressed="false">VPA</button>
        <button class="filter-button" type="button" data-filter="vpa-div" aria-pressed="false">VPA+DIV</button>
        <button class="filter-button" type="button" data-filter="vf-div-qa-sad" aria-pressed="false">VF-DIV / QA :(</button>
        <button class="filter-button" type="button" data-filter="vf-div-qa-happy" aria-pressed="false">VF-DIV / QA :)</button>
    </nav>
    <button id="upload-button" class="upload-button" type="button" title="Importar planilha .xlsx" aria-label="Importar planilha .xlsx">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3h11l5 5v13H4z"/><path d="M14 3v6h6M8 13h8M8 17h8M11 10v10"/></svg>
    </button>
    <button id="add-column-button" class="column-button" type="button">+ Coluna manual</button>
    <form id="upload-form">
        <input id="planilha" name="planilha" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="Selecionar planilha" required>
    </form>
</header>
<main>
    <section class="navigator" aria-label="Busca de empresas">
        <input id="company-search" class="search-input" type="search" placeholder="Digite o nome da empresa ou ticker…" aria-label="Buscar por empresa ou ticker" autocomplete="off">
        <p id="filter-description" aria-live="polite"></p>
        <div id="status" role="status" aria-live="polite"></div>
    </section>
    <section class="listing">
        <div class="listing-title"><h2>Empresas cadastradas</h2><span id="count" class="count"></span></div>
        <div class="scroll"><table><thead><tr id="headings"></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">Carregando…</div></div>
    </section>
</main>
<dialog id="column-modal"><form id="column-form" class="modal-content" method="dialog"><h2 id="column-modal-title">Nova coluna manual</h2><p class="modal-help" id="column-help">A coluna será armazenada no banco e não será alterada por uploads de planilhas.</p><label>Nome exibido<input id="column-label" maxlength="120" required></label><label id="identifier-field">Identificador no banco<input id="column-name" maxlength="63" placeholder="ex.: margem_seguranca"></label><label id="type-field">Tipo<select id="column-type"><option value="texto">Texto</option><option value="numero">Número</option></select></label><div class="modal-actions"><button id="delete-column" class="danger" type="button" hidden>Excluir coluna</button><button value="cancel" class="clear-filters-button" type="button">Cancelar</button><button id="save-column" type="submit">Salvar</button></div></form></dialog>
<script>
const form = document.querySelector('#upload-form');
const statusBox = document.querySelector('#status');
const uploadButton = document.querySelector('#upload-button');
const fileInput = document.querySelector('#planilha');
const filterDescription = document.querySelector('#filter-description');
const searchInput = document.querySelector('#company-search');
const clearFiltersButton = document.querySelector('#clear-filters-button');
let rows = [];
let companyNames = new Map();
let activeFilter = null;
let sortField = null;
let sortDirection = 'ascending';
let fields = ['sigla', 'setor', 'cotacao', 'vpa', 'pt_medio', 'pt_projetivo', 'preco_consenso', 'vf_div_qa_sad', 'cx_qa', 'vl_qa', 'div_pct_cx', 'cx_db', 'div_liquida', 'payout_medio', 'dl_pct_vf', 'vf_qa', 'vf_div_qa_happy', 'part_ibov', 'val_mercado', 'vol_med_3m', 'retorno_ano', 'retorno_12m_prov', 'retorno_12m_sem_prov', 'retorno_36m_prov', 'retorno_36m_sem_prov', 'retorno_60m_prov', 'retorno_60m_sem_prov', 'dpa_medio', 'dy_medio', 'dy_12m', 'prov_p_acao_12m', 'dt_ultimo_prov', 'projecao_div', 'dy_projetivo', 'dif_mercado_pt_projetivo', 'pm_pt_projetivo', 'projecao_lucro', 'qtde_acoes', 'projecao_lpa', 'p_vpa', 'p_l', 'ev', 'ev_ebitda', 'ebitda', 'div_bruta', 'caixa', 'div_liquida_ebitda', 'lucro_liquido', 'lpa', 'margem_ebitda', 'margem_liquida', 'roe', 'roic', 'ev_ebit', 'market_value_at', 'psr', 'market_value_acpc', 'market_value_ac_pc_pnc', 'fcfpa', 'fcfy', 'div_liqui_pl', 'div_liqui_ebitda', 'lc', 'margem_bruta_pct', 'roa', 'cagr_receita', 'cagr_lucro', 'cagr_div', 'cotacao_fechamento'];
const labels = { sigla: 'Sigla', nome_da_empresa: 'Nome da empresa', setor: 'Setor', free_float: 'Free float', ativos: 'Ativos', ativos_circ: 'Ativos circ.', freq_div: 'Freq. div.', datas_resultados: 'Datas resultados', meses_mdi: 'Meses MDI', datas_assembleias: 'Datas assembleias', pauta_assembleias: 'Pauta assembleias', datas_conselhos: 'Datas conselhos', cotacao: 'Cotação', pt_projetivo: 'PT projetivo', pt_medio: 'PT médio', payout_medio: 'Payout médio', div_pct_cx: 'DB % CX', cx_db: 'CX - DB', div_liquida: 'Div Líquida', dl_pct_vf: 'DL % VF', vf_qa: 'VF / QA', vf_div_qa_sad: 'VF-DIV / QA :(', cx_qa: 'CX / QA', vl_qa: 'VM / QA', vf_div_qa_happy: 'VF-DIV / QA :)', preco_consenso: 'PT consenso', part_ibov: 'Part. Ibov', val_mercado: 'Valor de mercado', vol_med_3m: 'Vol. méd. 3m', dt_ultimo_prov: 'Data último prov.', qtde_acoes: 'Qtd. ações', ev: 'Valor de Firma', cotacao_fechamento: 'Cotação fechamento' };
const format = value => value === null || value === '' ? '—' : new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 4 }).format(Number(value));
const formatPercent = value => value === null || value === '' ? '—' : `${new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 }).format(Number(value))}%`;
const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const textFields = new Set(['sigla', 'nome_da_empresa', 'setor', 'dt_ultimo_prov', 'freq_div', 'datas_resultados', 'meses_mdi', 'datas_assembleias', 'pauta_assembleias', 'datas_conselhos']);
const calculatedFields = new Set(['vf_div_qa_sad', 'cx_qa', 'vl_qa', 'div_pct_cx', 'cx_db', 'dl_pct_vf', 'vf_qa', 'vf_div_qa_happy']);
let customColumns = new Map();
let databaseColumns = new Set();
function renderHeadings() { document.querySelector('#headings').innerHTML = fields.map(field => `<th scope="col" draggable="true" data-field="${escapeHtml(field)}" title="Arraste para reordenar. ${escapeHtml(field)} — clique com o botão direito para gerenciar" aria-sort="${sortField === field ? sortDirection : 'none'}"><button class="sort-button" type="button" data-field="${escapeHtml(field)}">${escapeHtml(labels[field] || field.replaceAll('_', ' '))}</button></th>`).join(''); }
renderHeadings();
async function loadRows() {
    const [response, companiesResponse] = await Promise.all([fetch('/api/guiadeacoes'), fetch('/api/empresas')]);
    const [result, companiesResult] = await Promise.all([response.json(), companiesResponse.ok ? companiesResponse.json() : Promise.resolve({ empresas: [] })]);
    if (!response.ok) throw new Error(result.message || 'Não foi possível carregar os registros.');
    result.custom_columns.forEach(column => { customColumns.set(column.nome, column); labels[column.nome] = column.rotulo; if (column.tipo === 'texto') textFields.add(column.nome); });
    databaseColumns = new Set(result.database_columns || []);
    const deletedColumns = new Set(result.deleted_columns || []);
    fields = fields.filter(field => !deletedColumns.has(field) && (calculatedFields.has(field) || databaseColumns.has(field))).concat(result.custom_columns.map(column => column.nome).filter(field => !fields.includes(field) && !deletedColumns.has(field)));
    const savedOrder = Array.isArray(result.column_order) ? result.column_order : [];
    const availableFields = new Set(fields);
    fields = savedOrder.filter(field => availableFields.has(field)).concat(fields.filter(field => !savedOrder.includes(field)));
    renderHeadings();
    companyNames = new Map((companiesResult.empresas || []).map(company => [company.ticker, company.nome]));
    rows = result.data.map(row => ({
        ...row,
        div_pct_cx: row.div_bruta === null || row.div_bruta === '' || row.caixa === null || row.caixa === '' || Number(row.caixa) === 0
            ? null
            : (Number(row.div_bruta) / Number(row.caixa)) * 100,
        dl_pct_vf: row.div_liquida === null || row.div_liquida === '' || row.ev === null || row.ev === '' || Number(row.ev) === 0
            ? null
            : (Number(row.div_liquida) / Number(row.ev)) * 100,
        vf_qa: row.ev === null || row.ev === '' || row.qtde_acoes === null || row.qtde_acoes === '' || Number(row.qtde_acoes) === 0
            ? null
            : Number(row.ev) / Number(row.qtde_acoes),
        vf_div_qa_sad: row.ev === null || row.ev === '' || row.qtde_acoes === null || row.qtde_acoes === '' || Number(row.qtde_acoes) === 0
            ? null
            : (Number(row.ev) - Math.max(Number(row.div_liquida) || 0, 0)) / Number(row.qtde_acoes),
        cx_qa: row.caixa === null || row.caixa === '' || row.qtde_acoes === null || row.qtde_acoes === '' || Number(row.qtde_acoes) === 0
            ? null
            : Number(row.caixa) / Number(row.qtde_acoes),
        vl_qa: row.val_mercado === null || row.val_mercado === '' || row.qtde_acoes === null || row.qtde_acoes === '' || Number(row.qtde_acoes) === 0
            ? null
            : Number(row.val_mercado) / Number(row.qtde_acoes),
        cx_db: row.caixa === null || row.caixa === '' || row.div_bruta === null || row.div_bruta === ''
            ? null
            : Number(row.caixa) - Number(row.div_bruta),
        vf_div_qa_happy: row.ev === null || row.ev === '' || row.qtde_acoes === null || row.qtde_acoes === '' || Number(row.qtde_acoes) === 0
            ? null
            : (Number(row.ev) - (Number(row.div_liquida) || 0)) / Number(row.qtde_acoes)
    })).filter(row => row.payout_medio !== null && row.payout_medio !== '' && Number(row.payout_medio) > 0
        && row.vpa !== null && row.vpa !== '' && Number(row.vpa) !== 0
        && row.pt_medio !== null && row.pt_medio !== '' && Number(row.pt_medio) !== 0
        && row.vol_med_3m !== null && row.vol_med_3m !== '' && Number(row.vol_med_3m) !== 0
        && row.dy_12m !== null && row.dy_12m !== '' && Number(row.dy_12m) !== 0);
    renderRows();
}
function renderRows() {
    const query = searchInput.value.trim().toLocaleLowerCase('pt-BR');
    const filteredRows = rows.filter(row => {
        const hasValidAverageTarget = row.pt_medio !== null && row.pt_medio !== '' && Number(row.pt_medio) >= Number(row.cotacao);
        const hasQuoteBelowAverageTarget = row.pt_medio !== null && row.pt_medio !== '' && Number(row.cotacao) < Number(row.pt_medio);
        if (activeFilter === 'vpa') return Number(row.vpa) > Number(row.cotacao) && hasValidAverageTarget;
        if (activeFilter === 'vpa-div') return Number(row.vpa) > Number(row.cotacao) && hasValidAverageTarget && (row.div_liquida === null || Number(row.div_liquida) <= 0);
        if (activeFilter === 'vf-div-qa-sad') return row.vf_div_qa_sad !== null && hasQuoteBelowAverageTarget && Number(row.vf_div_qa_sad) > Number(row.cotacao) && Number(row.vf_div_qa_sad) > Number(row.pt_medio);
        if (activeFilter === 'vf-div-qa-happy') return row.vf_div_qa_happy !== null && hasQuoteBelowAverageTarget && Number(row.vf_div_qa_happy) > Number(row.cotacao) && Number(row.vf_div_qa_happy) > Number(row.pt_medio);
        return true;
    }).filter(row => !query || row.sigla.toLocaleLowerCase('pt-BR').includes(query) || (row.nome_da_empresa || companyNames.get(row.sigla) || '').toLocaleLowerCase('pt-BR').includes(query));
    if (sortField) filteredRows.sort((a, b) => {
        const aValue = a[sortField];
        const bValue = b[sortField];
        if (aValue === null || aValue === '') return bValue === null || bValue === '' ? 0 : 1;
        if (bValue === null || bValue === '') return -1;
        const comparison = textFields.has(sortField)
            ? String(aValue).localeCompare(String(bValue), 'pt-BR', { numeric: true, sensitivity: 'base' })
            : Number(aValue) - Number(bValue);
        return sortDirection === 'ascending' ? comparison : -comparison;
    });
    else if (activeFilter) filteredRows.sort((a, b) =>
        Math.abs(Number(a.cotacao) - Number(a.vpa)) - Math.abs(Number(b.cotacao) - Number(b.vpa))
    );
    document.querySelector('#rows').innerHTML = filteredRows.map(row => `<tr>${fields.map(field => {
        const editable = !calculatedFields.has(field);
        const displayValue = textFields.has(field) ? (row[field] || '—') : ['dl_pct_vf', 'div_pct_cx'].includes(field) ? formatPercent(row[field]) : format(row[field]);
        return `<td class="${editable ? 'editable' : 'calculated'}" data-field="${escapeHtml(field)}" data-sigla="${escapeHtml(row.sigla)}"${editable ? ' title="Clique duas vezes para editar"' : ' title="Valor calculado automaticamente"'}>${escapeHtml(displayValue)}</td>`;
    }).join('')}</tr>`).join('');
    document.querySelector('#empty').style.display = filteredRows.length ? 'none' : 'block';
    document.querySelector('#empty').textContent = query ? 'Nenhuma empresa encontrada para esta busca.' : activeFilter ? 'Nenhuma empresa atende aos parâmetros do filtro.' : 'Nenhuma empresa cadastrada.';
    document.querySelector('#count').textContent = `${filteredRows.length} registro(s)`;
}
document.querySelector('#rows').addEventListener('dblclick', event => {
    const cell = event.target.closest('td.editable');
    if (!cell || cell.querySelector('input')) return;
    const row = rows.find(item => item.sigla === cell.dataset.sigla);
    if (!row) return;

    const field = cell.dataset.field;
    const oldValue = row[field] ?? '';
    const input = document.createElement('input');
    input.className = 'cell-editor';
    input.type = field === 'dt_ultimo_prov' ? 'date' : 'text';
    input.inputMode = textFields.has(field) ? 'text' : 'decimal';
    input.value = oldValue;
    cell.replaceChildren(input);
    input.focus();
    input.select();

    let finished = false;
    const finish = async save => {
        if (finished) return;
        finished = true;
        if (!save || input.value === String(oldValue)) {
            renderRows();
            return;
        }
        statusBox.className = '';
        statusBox.textContent = 'Salvando alteração…';
        try {
            const response = await fetch('/api/guiadeacoes', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sigla: row.sigla, field, value: input.value })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Não foi possível atualizar o valor.');
            statusBox.className = 'ok';
            statusBox.textContent = result.message;
            await loadRows();
        } catch (error) {
            statusBox.className = 'error';
            statusBox.textContent = error.message;
            renderRows();
        }
    };
    input.addEventListener('keydown', keyEvent => {
        if (keyEvent.key === 'Enter') { keyEvent.preventDefault(); input.blur(); }
        if (keyEvent.key === 'Escape') { keyEvent.preventDefault(); finished = true; renderRows(); }
    });
    input.addEventListener('blur', () => finish(true));
});
const columnModal = document.querySelector('#column-modal');
const columnForm = document.querySelector('#column-form');
let editingColumn = null;
function openColumnModal(column = null) {
    editingColumn = column;
    document.querySelector('#column-modal-title').textContent = column ? 'Gerenciar coluna' : 'Nova coluna manual';
    document.querySelector('#column-label').value = column?.rotulo || '';
    document.querySelector('#column-name').value = column?.nome || '';
    document.querySelector('#column-type').value = column?.tipo || 'texto';
    document.querySelector('#identifier-field').hidden = Boolean(column);
    document.querySelector('#type-field').hidden = Boolean(column);
    document.querySelector('#delete-column').hidden = !column;
    columnModal.showModal();
}
document.querySelector('#add-column-button').addEventListener('click', () => openColumnModal());
document.querySelector('.modal-actions [value="cancel"]').addEventListener('click', () => columnModal.close());
document.querySelector('#headings').addEventListener('contextmenu', event => {
    const field = event.target.closest('th')?.dataset.field;
    if (!field) return;
    event.preventDefault();
    openColumnModal(customColumns.get(field) || { nome: field, rotulo: labels[field] || field.replaceAll('_', ' '), tipo: textFields.has(field) ? 'texto' : 'numero' });
});
columnForm.addEventListener('submit', async event => {
    event.preventDefault();
    const payload = editingColumn ? { action: 'rename_column', name: editingColumn.nome, label: document.querySelector('#column-label').value } : { label: document.querySelector('#column-label').value, name: document.querySelector('#column-name').value, type: document.querySelector('#column-type').value };
    const response = await fetch('/api/guiadeacoes', { method: editingColumn ? 'PATCH' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    const result = await response.json();
    if (!response.ok) { statusBox.className = 'error'; statusBox.textContent = result.message; return; }
    columnModal.close(); statusBox.className = 'ok'; statusBox.textContent = result.message; customColumns.clear(); await loadRows();
});
document.querySelector('#delete-column').addEventListener('click', async () => {
    if (!editingColumn || !confirm(`Excluir definitivamente a coluna “${editingColumn.rotulo}” e todos os valores dela?`)) return;
    const response = await fetch('/api/guiadeacoes', { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: editingColumn.nome}) });
    const result = await response.json();
    if (!response.ok) { statusBox.className = 'error'; statusBox.textContent = result.message; return; }
    columnModal.close(); fields = fields.filter(field => field !== editingColumn.nome); delete labels[editingColumn.nome]; customColumns.clear(); statusBox.className = 'ok'; statusBox.textContent = result.message; await loadRows();
});
searchInput.addEventListener('input', renderRows);
document.querySelector('#headings').addEventListener('click', event => {
    if (suppressSortClick) return;
    const button = event.target.closest('.sort-button');
    if (!button) return;
    sortDirection = sortField === button.dataset.field && sortDirection === 'ascending' ? 'descending' : 'ascending';
    sortField = button.dataset.field;
    document.querySelectorAll('#headings th').forEach(th => th.setAttribute('aria-sort', th.contains(button) ? sortDirection : 'none'));
    renderRows();
});
let draggedField = null;
let suppressSortClick = false;
const headings = document.querySelector('#headings');
headings.addEventListener('dragstart', event => {
    const heading = event.target.closest('th');
    if (!heading) return;
    draggedField = heading.dataset.field;
    heading.classList.add('dragging');
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', draggedField);
});
headings.addEventListener('dragover', event => {
    const heading = event.target.closest('th');
    if (!heading || !draggedField || heading.dataset.field === draggedField) return;
    event.preventDefault();
    headings.querySelectorAll('.drag-target').forEach(item => item.classList.remove('drag-target'));
    heading.classList.add('drag-target');
});
headings.addEventListener('drop', async event => {
    const target = event.target.closest('th');
    if (!target || !draggedField || target.dataset.field === draggedField) return;
    event.preventDefault();
    const previousFields = [...fields];
    const from = fields.indexOf(draggedField);
    let to = fields.indexOf(target.dataset.field);
    if (from < to) to--;
    fields.splice(to, 0, fields.splice(from, 1)[0]);
    suppressSortClick = true;
    renderHeadings();
    renderRows();
    statusBox.className = '';
    statusBox.textContent = 'Salvando ordem das colunas…';
    try {
        const response = await fetch('/api/guiadeacoes', { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'reorder_columns', order: fields }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Não foi possível salvar a ordem das colunas.');
        statusBox.className = 'ok';
        statusBox.textContent = result.message;
    } catch (error) {
        fields = previousFields;
        renderHeadings();
        renderRows();
        statusBox.className = 'error';
        statusBox.textContent = error.message;
    }
});
headings.addEventListener('dragend', () => {
    draggedField = null;
    headings.querySelectorAll('.dragging, .drag-target').forEach(item => item.classList.remove('dragging', 'drag-target'));
    setTimeout(() => { suppressSortClick = false; }, 0);
});
document.querySelectorAll('.filter-button').forEach(filterButton => filterButton.addEventListener('click', () => {
    activeFilter = activeFilter === filterButton.dataset.filter ? null : filterButton.dataset.filter;
    sortField = null;
    document.querySelectorAll('#headings th').forEach(th => th.setAttribute('aria-sort', 'none'));
    document.querySelectorAll('.filter-button').forEach(item => {
        const isActive = item.dataset.filter === activeFilter;
        item.classList.toggle('active', isActive);
        item.setAttribute('aria-pressed', String(isActive));
    });
    filterDescription.textContent = activeFilter === 'vpa'
        ? 'Filtro ativo: VPA > Cotação e PT médio ≥ Cotação.'
        : activeFilter === 'vpa-div' ? 'Filtro ativo: VPA > Cotação, PT médio ≥ Cotação e Dívida líquida ≤ 0 ou sem valor.'
        : activeFilter === 'vf-div-qa-sad' ? 'Filtro ativo: VF-DIV / QA :( > PT médio > Cotação.'
        : activeFilter === 'vf-div-qa-happy' ? 'Filtro ativo: VF-DIV / QA :) > PT médio > Cotação.' : '';
    renderRows();
}));
clearFiltersButton.addEventListener('click', () => {
    activeFilter = null;
    sortField = null;
    searchInput.value = '';
    filterDescription.textContent = '';
    document.querySelectorAll('#headings th').forEach(th => th.setAttribute('aria-sort', 'none'));
    document.querySelectorAll('.filter-button').forEach(item => {
        item.classList.remove('active');
        item.setAttribute('aria-pressed', 'false');
    });
    renderRows();
});
uploadButton.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
    if (!fileInput.files.length) return;
    uploadButton.disabled = true;
    statusBox.className = '';
    statusBox.textContent = 'Importando…';
    try {
        const response = await fetch('/api/guiadeacoes', { method: 'POST', body: new FormData(form) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Falha na importação.');
        statusBox.className = 'ok';
        statusBox.textContent = `${result.message} ${result.inserted} inserido(s), ${result.updated} atualizado(s) e ${result.ignored} ignorado(s).`;
        form.reset();
        await loadRows();
    } catch (error) {
        statusBox.className = 'error';
        statusBox.textContent = error.message;
    } finally { uploadButton.disabled = false; }
});
loadRows().catch(error => { document.querySelector('#empty').textContent = error.message; });
</script>
</body>
</html>
