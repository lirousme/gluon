<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de cards — Gluon</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #090d18; color: #e5e7eb; }
        button, a { font: inherit; }
        .page { width: min(100% - 32px, 1600px); margin: 0 auto; padding: 32px 0 48px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
        .eyebrow { margin: 0 0 6px; color: #818cf8; font-size: .75rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
        h1 { margin: 0; color: #f8fafc; font-size: clamp(1.65rem, 3vw, 2.3rem); }
        .subtitle { margin: 8px 0 0; color: #94a3b8; }
        .back { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid #334155; border-radius: 10px; color: #cbd5e1; text-decoration: none; transition: .2s; }
        .back:hover { border-color: #818cf8; color: #fff; background: #172033; }
        .panel { overflow: hidden; border: 1px solid #202b3f; border-radius: 16px; background: #0f172a; box-shadow: 0 22px 60px rgb(0 0 0 / 25%); }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; min-width: 1120px; border-collapse: collapse; table-layout: fixed; }
        th { width: calc(100% / 6); padding: 15px 18px; border-bottom: 1px solid #334155; background: #111c30; color: #c7d2fe; font-size: .75rem; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
        td { height: 92px; padding: 16px 18px; border-right: 1px solid #202b3f; border-bottom: 1px solid #202b3f; vertical-align: top; }
        th:last-child, td:last-child { border-right: 0; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: #141e32; }
        .text-part { color: #e2e8f0; font-size: .9rem; line-height: 1.5; overflow-wrap: anywhere; }
        .text-part + .text-part { margin-top: 9px; padding-top: 9px; border-top: 1px dashed #334155; }
        .side-label { display: block; margin-bottom: 3px; color: #64748b; font-size: .65rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
        .empty { color: #475569; }
        .message { padding: 56px 24px; color: #94a3b8; text-align: center; }
        .message.error { color: #fca5a5; }
        .footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 18px; border-top: 1px solid #202b3f; background: #0c1424; }
        .page-info { color: #94a3b8; font-size: .9rem; }
        .controls { display: flex; gap: 8px; }
        .controls button { padding: 9px 14px; border: 1px solid #334155; border-radius: 9px; background: #172033; color: #e2e8f0; cursor: pointer; }
        .controls button:hover:not(:disabled) { border-color: #818cf8; background: #25304a; }
        .controls button:disabled { cursor: not-allowed; opacity: .38; }
        @media (max-width: 640px) {
            .page { width: min(100% - 20px, 1600px); padding-top: 20px; }
            .topbar { align-items: flex-start; flex-direction: column-reverse; }
            .footer { align-items: stretch; flex-direction: column; }
            .controls { display: grid; grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h1>Tabela de cards</h1>
                <p class="subtitle">Os textos de cada card, organizados por idioma.</p>
            </div>
            <a class="back" href="/dashboard" aria-label="Voltar ao dashboard"><span aria-hidden="true">←</span> Dashboard</a>
        </header>

        <section class="panel" aria-labelledby="table-caption">
            <div class="table-scroll">
                <table id="cardsTable" hidden>
                    <caption id="table-caption" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Textos dos cards separados por idioma</caption>
                    <thead><tr id="languageHeaders"></tr></thead>
                    <tbody id="cardsBody"></tbody>
                </table>
                <div id="status" class="message" role="status">Carregando cards…</div>
            </div>
            <footer id="pagination" class="footer" hidden>
                <div id="pageInfo" class="page-info"></div>
                <div class="controls">
                    <button id="previousPage" type="button">← Anterior</button>
                    <button id="nextPage" type="button">Próxima →</button>
                </div>
            </footer>
        </section>
    </main>

    <script>
        const languages = [
            ['pt_br', 'Português (Brasil)'], ['en_us', 'Inglês (EUA)'], ['en_gb', 'Inglês (Reino Unido)'],
            ['es', 'Espanhol'], ['fr', 'Francês'], ['zh', 'Chinês (Mandarim)']
        ];
        const state = { page: Math.max(1, Number(new URLSearchParams(location.search).get('page')) || 1), totalPages: 1 };
        const table = document.getElementById('cardsTable');
        const body = document.getElementById('cardsBody');
        const status = document.getElementById('status');
        const pagination = document.getElementById('pagination');
        const previousButton = document.getElementById('previousPage');
        const nextButton = document.getElementById('nextPage');

        document.getElementById('languageHeaders').replaceChildren(...languages.map(([, label]) => {
            const header = document.createElement('th');
            header.scope = 'col';
            header.textContent = label;
            return header;
        }));

        function textContent(html) {
            const documentFragment = new DOMParser().parseFromString(String(html || ''), 'text/html');
            return documentFragment.body.textContent.trim();
        }

        function renderCell(value) {
            const cell = document.createElement('td');
            const parts = [['Frente', textContent(value?.front)], ['Verso', textContent(value?.back)]].filter(([, text]) => text);
            if (!parts.length) {
                const empty = document.createElement('span');
                empty.className = 'empty';
                empty.textContent = '—';
                cell.append(empty);
                return cell;
            }
            parts.forEach(([label, text]) => {
                const part = document.createElement('div');
                part.className = 'text-part';
                const sideLabel = document.createElement('span');
                sideLabel.className = 'side-label';
                sideLabel.textContent = label;
                part.append(sideLabel, document.createTextNode(text));
                cell.append(part);
            });
            return cell;
        }

        async function loadPage(page) {
            status.hidden = false;
            status.className = 'message';
            status.textContent = 'Carregando cards…';
            table.hidden = true;
            pagination.hidden = true;
            try {
                const response = await fetch('/api/flashcards', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'list_text_cards', page })
                });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível carregar os cards.');
                const meta = result.pagination;
                state.page = meta.page;
                state.totalPages = meta.total_pages;
                history.replaceState(null, '', state.page > 1 ? `?page=${state.page}` : location.pathname);
                body.replaceChildren(...result.data.map(card => {
                    const row = document.createElement('tr');
                    row.dataset.cardId = card.id;
                    row.replaceChildren(...languages.map(([key]) => renderCell(card.texts[key])));
                    return row;
                }));
                if (!result.data.length) {
                    status.textContent = 'Nenhum card encontrado.';
                    return;
                }
                status.hidden = true;
                table.hidden = false;
                pagination.hidden = false;
                document.getElementById('pageInfo').textContent = `Página ${meta.page} de ${meta.total_pages} · ${meta.total_cards} card${meta.total_cards === 1 ? '' : 's'}`;
                previousButton.disabled = meta.page <= 1;
                nextButton.disabled = meta.page >= meta.total_pages;
            } catch (error) {
                status.className = 'message error';
                status.textContent = error.message;
            }
        }

        previousButton.addEventListener('click', () => loadPage(state.page - 1));
        nextButton.addEventListener('click', () => loadPage(state.page + 1));
        loadPage(state.page);
    </script>
</body>
</html>
