<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Gluon - Ficha do Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { theme: { extend: { colors: { gluon: { dark: '#0f172a', primary: '#3b82f6', secondary: '#1e293b' } } } } };
  </script>
  <style>
    html,
    body {
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    input,
    textarea,
    select,
    button {
      font-size: 16px !important;
    }

    .tag-pill,
    .tag-pill button {
      font-size: 0.6875rem !important;
      line-height: 0.875rem;
    }
  </style>
</head>
<body class="min-h-[100dvh] bg-gluon-dark text-slate-100 selection:bg-blue-600/60">
  <main class="max-w-3xl mx-auto px-3 py-4 sm:px-4 sm:py-6">
    <div class="mb-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <a id="backLink" href="/dashboard" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm">
          <i class="fa-solid fa-arrow-left"></i> Voltar
        </a>
        <button type="button" onclick="app.goToSourceDirectory()" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200" title="Abrir minhas Anotações">
          <i class="fa-solid fa-thumbtack text-gluon-primary"></i> Anotações
        </button>
      </div>
      <h1 id="pageTitle" class="text-base sm:text-lg font-semibold">Criar ficha de card</h1>
    </div>

    <form id="cardForm" class="bg-gluon-secondary border border-slate-700 rounded-xl shadow-2xl p-4 sm:p-5 space-y-5">
      <input type="hidden" id="editCardId" value="">
      <input type="hidden" id="selectedSubjectTagIds" value="[]">

      <div class="flex items-center gap-2 border-b border-slate-700 pb-3">
        <button type="button" id="tabFrontBtn" class="px-3 py-1.5 rounded-lg text-sm border border-blue-400 bg-blue-500/20 text-blue-200">Frente</button>
        <button type="button" id="tabBackBtn" class="px-3 py-1.5 rounded-lg text-sm border border-slate-600 bg-slate-800 text-slate-300">Verso</button>
        <button type="button" id="translateBtn" class="px-3 py-1.5 rounded-lg text-sm border border-violet-400 bg-violet-500/20 text-violet-200 hover:bg-violet-500/30 transition-colors">Traduzir</button>
      </div>

      <section id="singleFrontTabContent">
        <label class="block text-sm font-medium text-slate-300 mb-2">Frente (Obrigatório texto ou imagem)</label>
        <textarea id="singleFront" rows="7" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 px-4 text-white resize-none"></textarea>
        <div class="mt-3 bg-slate-800/50 p-3 rounded-lg border border-slate-700">
          <label class="block text-xs font-medium text-slate-400 mb-2"><i class="fa-regular fa-image"></i> Imagem da Frente (Opcional, Máx: 4MB)</label>
          <input type="file" id="frontImageFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer bg-slate-900 border border-slate-600 rounded">
          <input type="hidden" id="frontImageBase64">
          <div id="frontImagePreview" class="mt-2 hidden w-full h-36 rounded bg-contain bg-center bg-no-repeat border border-slate-600"></div>
          <button type="button" id="btnRemoveFrontImage" class="hidden mt-2 text-xs text-red-400 hover:text-red-300 flex items-center gap-1"><i class="fa-solid fa-trash"></i> Remover Imagem</button>
        </div>
      </section>

      <section id="singleBackTabContent" class="hidden">
        <label class="block text-sm font-medium text-slate-300 mb-2">Verso (Opcional)</label>
        <textarea id="singleBack" rows="7" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 px-4 text-white resize-none" placeholder="Se não quiser texto no verso, deixe vazio."></textarea>
      </section>

      <section id="SubjectTagsPanel" class="pt-3 border-t border-slate-700">
        <div class="mb-2 flex items-center justify-between gap-2">
          <label class="block text-sm font-medium text-emerald-300">Subjects deste card (Base form)</label>
          <button type="button" onclick="app.openCreateTagModal()" class="h-7 w-7 rounded-md border border-violet-500/50 text-violet-300 hover:text-violet-200 hover:bg-violet-500/20 transition-colors" title="Criar nova tag">+</button>
        </div>
        <div id="subjectTagSelector" class="flex flex-wrap gap-1.5 bg-slate-900/70 border border-slate-700 rounded-lg p-2 min-h-[44px]"></div>
        <input id="subjectTagSearchInput" type="text" placeholder="Pesquisar tag de subject por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm" autocomplete="off">
      </section>

      <div class="flex items-center justify-between gap-3 pt-2 border-t border-slate-700">
        <p id="statusMessage" class="text-sm text-slate-400">Preencha a frente com texto ou imagem.</p>
        <button type="submit" id="btnSave" class="inline-flex items-center gap-2 bg-gluon-primary hover:bg-blue-600 px-4 py-2 rounded-lg font-medium">
          <i class="fa-solid fa-check"></i> Salvar
        </button>
      </div>
    </form>
  </main>
  <div id="tagModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-[70] opacity-0 transition-opacity duration-300 p-4">
    <div id="tagModalContent" class="bg-gluon-secondary border border-slate-700 rounded-xl shadow-2xl w-full max-w-md transform scale-95 transition-transform duration-300">
      <form id="tagForm" class="p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-white">Criar nova tag</h3>
          <button type="button" onclick="app.closeCreateTagModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-2">
          <label class="text-sm text-slate-300">Nome da tag</label>
          <input id="tagNameInput" type="text" required maxlength="80" placeholder="Ex.: Gramática, Verbos, Trabalho..." class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
          <input id="tagNamePtBrInput" type="text" maxlength="80" placeholder="Nome em pt-BR (ex.: Cachorro)" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
          <input id="tagNumeroInput" type="number" placeholder="Número (ex.: 2026)" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
          <p class="text-xs text-slate-400">A cor da tag é definida automaticamente conforme a categoria selecionada.</p>
          <p class="text-xs text-amber-300">Selecione no máximo 1 categoria para a nova tag.</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-300">
          <label class="inline-flex items-center gap-2"><input id="tagIsBookInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa um livro</span></label>
          <label class="inline-flex items-center gap-2"><input id="tagIsVerbTenseInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa um Tempo Verbal</span></label>
          <label class="inline-flex items-center gap-2"><input id="tagIsSentenceTypeInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa um Tipo Frasal</span></label>
          <label class="inline-flex items-center gap-2"><input id="tagIsLexicalChunkInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa um Lexical Chunk</span></label>
          <label class="inline-flex items-center gap-2"><input id="tagIsRelationTypeInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa um Tipo de Relação</span></label>
          <label class="inline-flex items-center gap-2"><input id="tagIsWordInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa uma Palavra</span></label>
          <label class="inline-flex items-center gap-2"><input id="tagIsMonthInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa um mês</span></label>
          <label class="inline-flex items-center gap-2"><input id="tagIsDayInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa um dia</span></label>
          <label class="inline-flex items-center gap-2"><input id="tagIsYearInput" type="checkbox" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-violet-500 focus:ring-violet-500"><span>Esta tag representa um ano</span></label>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="app.closeCreateTagModal()" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white">Cancelar</button>
          <button id="btnSaveTag" type="submit" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-white">Criar tag</button>
        </div>
      </form>
    </div>
  </div>
  <div id="editTagModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-[75] opacity-0 transition-opacity duration-300 p-4">
    <div id="editTagModalContent" class="bg-gluon-secondary border border-slate-700 rounded-xl shadow-2xl w-full max-w-md transform scale-95 transition-transform duration-300">
      <form id="editTagForm" class="p-5 space-y-4">
        <input type="hidden" id="editTagIdInput">
        <div class="flex items-center justify-between"><h3 class="text-lg font-semibold text-white">Editar tag</h3><button type="button" onclick="app.closeEditTagModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
        <input id="editTagNameInput" type="text" required maxlength="80" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
        <input id="editTagNamePtBrInput" type="text" maxlength="80" placeholder="Nome em pt-BR" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
        <input id="editTagNumeroInput" type="number" placeholder="Número (opcional)" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2.5 px-3 text-white">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-300">
          <label class="inline-flex items-center gap-2"><input id="editTagIsBookInput" type="checkbox" class="h-4 w-4"><span>Livro</span></label><label class="inline-flex items-center gap-2"><input id="editTagIsVerbTenseInput" type="checkbox" class="h-4 w-4"><span>Tempo Verbal</span></label><label class="inline-flex items-center gap-2"><input id="editTagIsSentenceTypeInput" type="checkbox" class="h-4 w-4"><span>Tipo Frasal</span></label><label class="inline-flex items-center gap-2"><input id="editTagIsLexicalChunkInput" type="checkbox" class="h-4 w-4"><span>Lexical Chunk</span></label><label class="inline-flex items-center gap-2"><input id="editTagIsRelationTypeInput" type="checkbox" class="h-4 w-4"><span>Tipo de Relação</span></label><label class="inline-flex items-center gap-2"><input id="editTagIsWordInput" type="checkbox" class="h-4 w-4"><span>Palavra</span></label><label class="inline-flex items-center gap-2"><input id="editTagIsMonthInput" type="checkbox" class="h-4 w-4"><span>Mês</span></label><label class="inline-flex items-center gap-2"><input id="editTagIsDayInput" type="checkbox" class="h-4 w-4"><span>Dia</span></label><label class="inline-flex items-center gap-2"><input id="editTagIsYearInput" type="checkbox" class="h-4 w-4"><span>Ano</span></label>
        </div>
        <div class="flex flex-wrap justify-between gap-2">
          <button type="button" onclick="app.viewTagFamily()" class="px-4 py-2 rounded-lg border border-slate-600 text-slate-200 hover:bg-slate-800">Ver família</button>
          <div class="flex gap-2">
            <button type="button" id="btnDeleteTag" onclick="app.deleteTag()" class="px-4 py-2 rounded-lg bg-red-700 hover:bg-red-600 text-white">Excluir tag</button>
            <button type="button" onclick="app.closeEditTagModal()" class="px-4 py-2 rounded-lg bg-slate-700">Cancelar</button>
            <button id="btnUpdateTag" type="submit" class="px-4 py-2 rounded-lg bg-violet-600">Salvar</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div id="notesModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-[80] opacity-0 transition-opacity duration-200 p-2 sm:p-4">
    <div id="notesModalContent" class="w-full h-full max-w-6xl max-h-[95dvh] bg-gluon-secondary border border-slate-700 rounded-xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200 flex flex-col">
      <div class="h-12 px-3 border-b border-slate-700 flex items-center justify-between shrink-0">
        <h3 class="text-sm sm:text-base font-semibold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-thumbtack text-gluon-primary"></i>
          <span>Anotações</span>
        </h3>
        <button type="button" onclick="app.closeNotesModal()" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-600 text-slate-200 hover:text-white hover:border-gluon-primary transition-colors text-sm">
          <i class="fa-solid fa-xmark"></i>
          <span>Fechar</span>
        </button>
      </div>
      <iframe id="notesModalFrame" class="w-full flex-1 bg-slate-950" src="about:blank" loading="lazy"></iframe>
    </div>
  </div>

<script>
(function lockMobileZoom(){
  const viewport = document.querySelector('meta[name="viewport"]');
  const lockedViewport = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
  if (viewport) viewport.setAttribute('content', lockedViewport);

  const preventZoom = (event) => event.preventDefault();
  document.addEventListener('gesturestart', preventZoom, { passive: false });
  document.addEventListener('gesturechange', preventZoom, { passive: false });
  document.addEventListener('gestureend', preventZoom, { passive: false });

  document.addEventListener('touchmove', (event) => {
    if (event.touches && event.touches.length > 1) event.preventDefault();
  }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  document.addEventListener('wheel', (event) => {
    if (event.ctrlKey) event.preventDefault();
  }, { passive: false });
})();
const params = new URLSearchParams(window.location.search);
const app = {
  deckId: params.get('id'),
  from: params.get('from') || '/dashboard',
  editCardId: params.get('edit_card_id'),
  initialSubjectTagId: Number(params.get('tag_id') || 0),
  activeTab: 'front',
  availableTags: [],
  sessionUserId: null,
  tagPanels: {
    subject: { selectedInputId: 'selectedSubjectTagIds', selectorId: 'subjectTagSelector', activeClass: 'bg-emerald-500/20 text-emerald-200 border-emerald-400', searchQuery: '' }
  },
  setupTagCategorySingleSelect() {
    const ids = ['tagIsBookInput','tagIsVerbTenseInput','tagIsSentenceTypeInput','tagIsLexicalChunkInput','tagIsRelationTypeInput','tagIsWordInput','tagIsMonthInput','tagIsDayInput','tagIsYearInput'];
    const inputs = ids.map(id => document.getElementById(id)).filter(Boolean);
    inputs.forEach(input => input.addEventListener('change', () => {
      if (!input.checked) return;
      inputs.forEach(other => { if (other !== input) other.checked = false; });
    }));
  },

  setupEditTagCategorySingleSelect() {
    const ids = ['editTagIsBookInput','editTagIsVerbTenseInput','editTagIsSentenceTypeInput','editTagIsLexicalChunkInput','editTagIsRelationTypeInput','editTagIsWordInput','editTagIsMonthInput','editTagIsDayInput','editTagIsYearInput'];
    const inputs = ids.map(id => document.getElementById(id)).filter(Boolean);
    inputs.forEach(input => input.addEventListener('change', () => { if (!input.checked) return; inputs.forEach(other => { if (other !== input) other.checked = false; }); }));
  },
  resetCreateTagCategoryDefaults() {
    ['tagIsBookInput','tagIsVerbTenseInput','tagIsSentenceTypeInput','tagIsLexicalChunkInput','tagIsRelationTypeInput','tagIsWordInput','tagIsMonthInput','tagIsDayInput','tagIsYearInput'].forEach((id) => {
      const input = document.getElementById(id);
      if (input) input.checked = false;
    });
    tagIsWordInput.checked = true;
  },
  openCreateTagModal() {
    this.resetCreateTagCategoryDefaults();
    tagNameInput.value = '';
    tagNamePtBrInput.value = '';
    tagNumeroInput.value = '';
    tagModal.classList.remove('hidden');
    tagModal.classList.add('flex');
    setTimeout(() => {
      tagModal.classList.remove('opacity-0');
      tagModalContent.classList.remove('scale-95');
      tagNameInput.focus();
    }, 20);
  },
  closeCreateTagModal() {
    tagModal.classList.add('opacity-0');
    tagModalContent.classList.add('scale-95');
    setTimeout(() => {
      tagModal.classList.add('hidden');
      tagModal.classList.remove('flex');
    }, 200);
  },

  openEditTagModal(tagId) {
    const tag = this.availableTags.find(item => Number(item.id) === Number(tagId));
    if (!tag) return;
    editTagIdInput.value = String(tag.id || ''); editTagNameInput.value = String(tag.name || ''); editTagNameInput.dataset.tagName = String(tag.name || ''); editTagNamePtBrInput.value = String(tag.name_pt_br || ''); editTagNumeroInput.value = tag.numero ?? '';
    editTagIsBookInput.checked = Number(tag.is_book) === 1; editTagIsVerbTenseInput.checked = Number(tag.is_verb_tense) === 1; editTagIsSentenceTypeInput.checked = Number(tag.is_sentence_type) === 1; editTagIsLexicalChunkInput.checked = Number(tag.is_lexical_chunk) === 1; editTagIsRelationTypeInput.checked = Number(tag.is_relation_type) === 1; editTagIsWordInput.checked = Number(tag.is_word) === 1; editTagIsMonthInput.checked = Number(tag.is_month) === 1; editTagIsDayInput.checked = Number(tag.is_day) === 1; editTagIsYearInput.checked = Number(tag.is_year) === 1;
    editTagModal.classList.remove('hidden'); editTagModal.classList.add('flex');
    setTimeout(() => { editTagModal.classList.remove('opacity-0'); editTagModalContent.classList.remove('scale-95'); editTagNameInput.focus(); }, 20);
  },
  closeEditTagModal() {
    editTagModal.classList.add('opacity-0'); editTagModalContent.classList.add('scale-95');
    setTimeout(() => { editTagModal.classList.add('hidden'); editTagModal.classList.remove('flex'); }, 200);
  },
  viewTagFamily() {
    const rawName = String(editTagNameInput?.dataset?.tagName || editTagNameInput?.value || '').trim();
    if (!rawName) return;
    const tagId = Number(editTagIdInput?.value || 0);
    window.location.href = `/views/tag_family.html?tag_id=${encodeURIComponent(tagId)}&tag_name=${encodeURIComponent(rawName)}`;
  },
  async createTag(e) {
    e.preventDefault();
    btnSaveTag.disabled = true;
    try {
      const res = await this.api('create_tag', {
        name: tagNameInput.value.trim(),
        name_pt_br: tagNamePtBrInput.value.trim(),
        numero: tagNumeroInput.value.trim(),
        is_book: tagIsBookInput.checked ? 1 : 0,
        is_verb_tense: tagIsVerbTenseInput.checked ? 1 : 0,
        is_sentence_type: tagIsSentenceTypeInput.checked ? 1 : 0,
        is_lexical_chunk: tagIsLexicalChunkInput.checked ? 1 : 0,
        is_relation_type: tagIsRelationTypeInput.checked ? 1 : 0,
        is_word: tagIsWordInput.checked ? 1 : 0,
        is_month: tagIsMonthInput.checked ? 1 : 0,
        is_day: tagIsDayInput.checked ? 1 : 0,
        is_year: tagIsYearInput.checked ? 1 : 0
      });
      await this.loadTags();
      this.closeCreateTagModal();
      this.setStatus(res?.message || 'Tag criada com sucesso.', 'success');
    } catch (err) {
      this.setStatus(err.message || 'Erro ao criar tag.', 'error');
    } finally {
      btnSaveTag.disabled = false;
    }
  },


  async updateTag(e) {
    e.preventDefault(); btnUpdateTag.disabled = true;
    try {
      const res = await this.api('update_tag', { id:Number(editTagIdInput.value), name:editTagNameInput.value.trim(), name_pt_br:editTagNamePtBrInput.value.trim(), numero:editTagNumeroInput.value.trim(), is_book:editTagIsBookInput.checked?1:0, is_verb_tense:editTagIsVerbTenseInput.checked?1:0, is_sentence_type:editTagIsSentenceTypeInput.checked?1:0, is_lexical_chunk:editTagIsLexicalChunkInput.checked?1:0, is_relation_type:editTagIsRelationTypeInput.checked?1:0, is_word:editTagIsWordInput.checked?1:0, is_month:editTagIsMonthInput.checked?1:0, is_day:editTagIsDayInput.checked?1:0, is_year:editTagIsYearInput.checked?1:0 });
      await this.loadTags(); this.closeEditTagModal(); this.setStatus(res?.message || 'Tag atualizada com sucesso.', 'success');
    } catch (err) { this.setStatus(err.message || 'Erro ao atualizar tag.', 'error'); }
    finally { btnUpdateTag.disabled = false; }
  },

  async deleteTag() {
    const tagId = Number(editTagIdInput.value);
    if (!tagId) return;
    if (!confirm('Tem certeza que deseja excluir esta tag? Essa ação não pode ser desfeita.')) return;
    btnDeleteTag.disabled = true;
    try {
      const res = await this.api('delete_tag', { id: tagId });
      await this.loadTags();
      this.closeEditTagModal();
      this.setStatus(res?.message || 'Tag excluída com sucesso.', 'success');
    } catch (err) {
      this.setStatus(err.message || 'Erro ao excluir tag.', 'error');
    } finally {
      btnDeleteTag.disabled = false;
    }
  },
  async api(action, payload = {}) {
    payload.action = action;
    const res = await fetch('/api/flashcards', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (res.status === 401) { window.location.href = '/'; return null; }
    const raw = await res.text();
    let data = null;
    try { data = raw ? JSON.parse(raw) : null; }
    catch (_) {
      throw new Error('Resposta inválida da API de flashcards.');
    }
    if (!data) throw new Error('A API de flashcards retornou uma resposta vazia.');
    if (data.status !== 'success') throw new Error(data.message || 'Falha na requisição.');
    return data;
  },
  handleCardImageUpload(e, side) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) return this.setStatus('A imagem/GIF é muito pesada! Limite de 4MB.', 'error');
    const reader = new FileReader();
    reader.onload = (event) => {
      const result = event.target.result;
      if (file.type === 'image/gif') return this.setBase64ImagePreview(side, result);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1200;
        let {width, height} = img;
        if (width > height && width > MAX) { height *= MAX / width; width = MAX; }
        if (height >= width && height > MAX) { width *= MAX / height; height = MAX; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        this.setBase64ImagePreview(side, canvas.toDataURL(mime, mime === 'image/jpeg' ? 0.8 : undefined));
      };
      img.src = result;
    };
    reader.readAsDataURL(file);
  },
  setBase64ImagePreview(side, base64) {
    document.getElementById(`${side}ImageBase64`).value = base64;
    const preview = document.getElementById(`${side}ImagePreview`);
    preview.style.backgroundImage = `url('${base64}')`;
    preview.classList.remove('hidden');
    document.getElementById(`btnRemove${side.charAt(0).toUpperCase()+side.slice(1)}Image`).classList.remove('hidden');
  },
  removeCardImage(side) {
    document.getElementById(`${side}ImageFile`).value = '';
    document.getElementById(`${side}ImageBase64`).value = '';
    const p = document.getElementById(`${side}ImagePreview`);
    p.classList.add('hidden'); p.style.backgroundImage = 'none';
    document.getElementById(`btnRemove${side.charAt(0).toUpperCase()+side.slice(1)}Image`).classList.add('hidden');
  },
  async loadTags() {
    const res = await this.api('list_tags');
    this.availableTags = res?.data || [];
    this.renderAllTagSelectors();
  },
  applyInitialSubjectTag() {
    if (this.editCardId || !this.initialSubjectTagId) return;
    const tagExists = this.getVisibleTags().some(tag => Number(tag.id) === this.initialSubjectTagId);
    if (!tagExists) return;
    const selectedIds = this.getSelectedTagIds('subject');
    if (!selectedIds.includes(this.initialSubjectTagId)) {
      selectedIds.push(this.initialSubjectTagId);
      this.setSelectedTagIds('subject', selectedIds);
      this.renderTagSelector('subject');
    }
  },
  async loadSessionUserId() {
    try {
      const res = await fetch('/api/user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_session' })
      });
      if (!res.ok) return;
      const data = await res.json();
      const parsedId = Number(data?.id ?? data?.data?.id);
      if (Number.isInteger(parsedId) && parsedId > 0) this.sessionUserId = parsedId;
    } catch (_) {}
  },
  async goToSourceDirectory() {
    try {
      const res = await fetch('/api/user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_source_directory' })
      });
      if (res.status === 401) {
        window.location.href = '/';
        return;
      }
      const data = await res.json();
      const sourceDirectoryId = Number(data?.data?.source_directory_id || 0);
      if (!sourceDirectoryId) {
        this.setStatus('Não foi possível localizar seu diretório obrigatório.', 'error');
        return;
      }
      this.openNotesModal(sourceDirectoryId);
    } catch (_) {
      this.setStatus('Erro ao abrir suas Anotações.', 'error');
    }
  },
  openNotesModal(sourceDirectoryId) {
    const frame = document.getElementById('notesModalFrame');
    if (!frame) return;
    const from = encodeURIComponent(window.location.pathname + window.location.search);
    frame.src = `/editor?id=${sourceDirectoryId}&from=${from}&preview=1&embedded=1`;
    notesModal.classList.remove('hidden');
    notesModal.classList.add('flex');
    requestAnimationFrame(() => {
      notesModal.classList.remove('opacity-0');
      notesModalContent.classList.remove('scale-95');
    });
  },
  closeNotesModal() {
    notesModal.classList.add('opacity-0');
    notesModalContent.classList.add('scale-95');
    setTimeout(() => {
      notesModal.classList.add('hidden');
      notesModal.classList.remove('flex');
      notesModalFrame.src = 'about:blank';
    }, 200);
  },
  getVisibleTags() {
    const sessionId = Number(this.sessionUserId);
    return this.availableTags.filter((tag) => {
      const tagUserId = Number(tag?.user_id);
      if (!Number.isInteger(tagUserId) || tagUserId <= 0) return false;
      return tagUserId === 5 || (Number.isInteger(sessionId) && sessionId > 0 && tagUserId === sessionId);
    });
  },
  getPanelConfig(panel) { return this.tagPanels[panel] || this.tagPanels.subject; },
  getSelectedTagIds(panel) {
    const input = document.getElementById(this.getPanelConfig(panel).selectedInputId);
    try { return JSON.parse(input.value || '[]').map(Number).filter(Boolean); }
    catch (_) { return []; }
  },
  setSelectedTagIds(panel, ids) {
    document.getElementById(this.getPanelConfig(panel).selectedInputId).value = JSON.stringify(ids.map(Number).filter(Boolean));
  },
  handleTagSearch(panel, query='') {
    this.getPanelConfig(panel).searchQuery = query.trim().toLowerCase();
    this.renderTagSelector(panel);
  },
  getTagLabel(tag = {}, numeroPtBrCounts = null) {
    const numero = tag?.numero;
    const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
    const name = String(tag?.name || '').trim();
    const namePtBr = String(tag?.name_pt_br || '').trim();
    if (hasNumero) {
      const numeroKey = String(numero).trim();
      const qtdTraducoes = numeroPtBrCounts?.get(numeroKey) || 0;
      if (qtdTraducoes > 1 && namePtBr) return `${numeroKey} (${namePtBr})`;
      return numeroKey;
    }
    return namePtBr ? `${name} (${namePtBr})` : name;
  },
  getTagPillStyle(tag = {}) {
    const color = String(tag?.color || '#334155');
    const hex = color.replace('#', '');
    if (!/^[0-9a-fA-F]{6}$/.test(hex)) return 'background: rgba(51,65,85,.35); border-color:#64748b;';
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    return `background: rgba(${r}, ${g}, ${b}, .25); border-color: rgba(${r}, ${g}, ${b}, .9);`;
  },
  renderAllTagSelectors() { Object.keys(this.tagPanels).forEach(panel => this.renderTagSelector(panel)); },
  renderTagSelector(panel = 'subject', selectedIds = null) {
    const config = this.getPanelConfig(panel);
    const el = document.getElementById(config.selectorId);
    const currentSelected = selectedIds ?? this.getSelectedTagIds(panel);
    if (!this.availableTags.length) { el.innerHTML = '<span class="text-xs text-slate-400">Sem tags cadastradas.</span>'; return; }
    const visibleTags = this.getVisibleTags();
    if (!config.searchQuery) {
      const selectedTags = visibleTags.filter(tag => currentSelected.includes(Number(tag.id)));
      if (!selectedTags.length) {
        el.innerHTML = '<span class="text-xs text-slate-400">Digite para buscar tags.</span>';
        return;
      }
      const numeroPtBrCounts = new Map();
      selectedTags.forEach(tag => {
        const numero = tag?.numero;
        const numeroKey = numero !== null && numero !== undefined ? String(numero).trim() : '';
        const namePtBr = String(tag?.name_pt_br || '').trim();
        if (numeroKey && namePtBr) numeroPtBrCounts.set(numeroKey, (numeroPtBrCounts.get(numeroKey) || 0) + 1);
      });
      el.innerHTML = selectedTags.map(tag => {
        const id = Number(tag.id);
        return `<div class="tag-pill inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full border ${config.activeClass}"><button type="button" data-tag-id="${id}">${this.escapeHTML(this.getTagLabel(tag, numeroPtBrCounts))}</button><button type="button" data-edit-tag-id="${id}" title="Editar tag"><i class="fa-solid fa-pen-to-square"></i></button></div>`;
      }).join('');
      el.querySelectorAll('[data-tag-id]').forEach(btn => btn.onclick = () => this.toggleTagSelection(panel, Number(btn.dataset.tagId)));
      el.querySelectorAll('[data-edit-tag-id]').forEach(btn => btn.onclick = () => this.openEditTagModal(Number(btn.dataset.editTagId)));
      return;
    }
    const filtered = visibleTags.filter(t =>
      String(t.name || '').toLowerCase().includes(config.searchQuery)
      || String(t.name_pt_br || '').toLowerCase().includes(config.searchQuery)
      || String(t.numero ?? '').toLowerCase().includes(config.searchQuery)
    );
    const numeroPtBrCounts = new Map();
    filtered.forEach(tag => {
      const numero = tag?.numero;
      const numeroKey = numero !== null && numero !== undefined ? String(numero).trim() : '';
      const namePtBr = String(tag?.name_pt_br || '').trim();
      if (numeroKey && namePtBr) numeroPtBrCounts.set(numeroKey, (numeroPtBrCounts.get(numeroKey) || 0) + 1);
    });
    if (!filtered.length) { el.innerHTML = '<span class="text-xs text-slate-400">Nenhuma tag para exibir.</span>'; return; }
    el.innerHTML = filtered.map(tag => {
      const id = Number(tag.id); const active = currentSelected.includes(id);
      return `<div class="tag-pill inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full border ${active ? config.activeClass : 'bg-slate-800 text-slate-300 border-slate-600'}"><button type="button" data-tag-id="${id}">${this.escapeHTML(this.getTagLabel(tag, numeroPtBrCounts))}</button><button type="button" data-edit-tag-id="${id}" title="Editar tag"><i class="fa-solid fa-pen-to-square"></i></button></div>`;
    }).join('');
    el.querySelectorAll('[data-tag-id]').forEach(btn => btn.onclick = () => this.toggleTagSelection(panel, Number(btn.dataset.tagId)));
    el.querySelectorAll('[data-edit-tag-id]').forEach(btn => btn.onclick = () => this.openEditTagModal(Number(btn.dataset.editTagId)));
  },
  toggleTagSelection(panel, tagId) {
    const config = this.getPanelConfig(panel);
    const ids = this.getSelectedTagIds(panel);
    this.setSelectedTagIds(panel, config.singleSelect ? (ids.includes(tagId) ? [] : [tagId]) : (ids.includes(tagId) ? ids.filter(id => id !== tagId) : [...ids, tagId]));
    this.renderTagSelector(panel);
  },
  escapeHTML(str='') { return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[s])); },
  setStatus(text, tone='neutral') {
    statusMessage.textContent = text;
    statusMessage.className = 'text-sm ' + (tone==='error'?'text-red-400':tone==='success'?'text-emerald-300':'text-slate-400');
  },

  setActiveTab(tab) {
    this.activeTab = tab === 'back' ? 'back' : 'front';
    const isFront = this.activeTab === 'front';
    singleFrontTabContent.classList.toggle('hidden', !isFront);
    singleBackTabContent.classList.toggle('hidden', isFront);
    tabFrontBtn.className = `px-3 py-1.5 rounded-lg text-sm border ${isFront ? 'border-blue-400 bg-blue-500/20 text-blue-200' : 'border-slate-600 bg-slate-800 text-slate-300'}`;
    tabBackBtn.className = `px-3 py-1.5 rounded-lg text-sm border ${!isFront ? 'border-blue-400 bg-blue-500/20 text-blue-200' : 'border-slate-600 bg-slate-800 text-slate-300'}`;
  },
  async setPageTitleWithDirectoryName() {
    if (!this.deckId) return;
    try {
      const res = await this.api('fetch', { deck_id: this.deckId });
      const directoryName = String(res?.deck_name || '').trim();
      if (!directoryName) return;
      pageTitle.textContent = this.editCardId ? `Editar ficha de card - ${directoryName}` : directoryName;
    } catch (_) {}
  },
  async preloadEditCard() {
    if (!this.editCardId) return;
    pageTitle.textContent = 'Editar ficha de card';
    editCardId.value = this.editCardId;
    this.setStatus('Carregando card para edição...');
    const res = await this.api('fetch', { deck_id: this.deckId });
    const card = (res?.data || []).find(c => String(c.id) === String(this.editCardId));
    if (!card) throw new Error('Card não encontrado para edição.');
    singleFront.value = card.front || '';
    singleBack.value = String(card.back || '');
    if (card.image_front) this.setBase64ImagePreview('front', card.image_front);
    const subjectTags = Array.isArray(card.subject_tags) ? card.subject_tags.map(t => Number(t.id)).filter(Boolean) : [];
    this.setSelectedTagIds('subject', subjectTags);
    this.renderAllTagSelectors();
    this.setStatus('Você está editando um card.', 'neutral');
  },
  async save(e) {
    e.preventDefault();
    const front = singleFront.value.trim();
    const back = singleBack.value.trim();
    const image_front = frontImageBase64.value;
    const image_back = null;
    const subject_tag_ids = this.getSelectedTagIds('subject');
    if (!front && !image_front) return this.setStatus('Preencha a frente do card com texto ou imagem.', 'error');
    if (!subject_tag_ids.length) return this.setStatus('Selecione ao menos 1 tag na categoria Subject para salvar o card.', 'error');
    const original = btnSave.innerHTML; btnSave.disabled = true; btnSave.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Salvando...';
    try {
      const action = this.editCardId ? 'update_card' : 'add_single';
      const payload = { deck_id: this.deckId, front, back, image_front, image_back, subject_tag_ids };
      if (this.editCardId) payload.card_id = this.editCardId;
      const response = await this.api(action, payload);
      this.setStatus(response?.message || 'Card salvo com sucesso.', 'success');
      setTimeout(() => window.location.href = backLink.href, 260);
    } catch (err) { this.setStatus(err.message || 'Erro ao salvar card.', 'error'); }
    finally { btnSave.disabled = false; btnSave.innerHTML = original; }
  }
};

backLink.href = decodeURIComponent(app.from);
if (!app.deckId) window.location.replace(backLink.href);
tabFrontBtn.onclick = () => app.setActiveTab('front');
tabBackBtn.onclick = () => app.setActiveTab('back');
frontImageFile.onchange = (e) => app.handleCardImageUpload(e, 'front');
btnRemoveFrontImage.onclick = () => app.removeCardImage('front');
subjectTagSearchInput.oninput = (e) => app.handleTagSearch('subject', e.target.value);
cardForm.onsubmit = (e) => app.save(e);
tagForm.onsubmit = (e) => app.createTag(e);
editTagForm.onsubmit = (e) => app.updateTag(e);
app.setupTagCategorySingleSelect();
app.setupEditTagCategorySingleSelect();
app.setPageTitleWithDirectoryName();
tagModal.onclick = (e) => { if (e.target === tagModal) app.closeCreateTagModal(); };
editTagModal.onclick = (e) => { if (e.target === editTagModal) app.closeEditTagModal(); };
notesModal.onclick = (e) => { if (e.target === notesModal) app.closeNotesModal(); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !notesModal.classList.contains('hidden')) app.closeNotesModal();
});

(async () => {
  app.setActiveTab('front');
  await app.loadSessionUserId();
  await app.loadTags();
  app.applyInitialSubjectTag();
  await app.preloadEditCard();
})();
</script>
</body>
</html>
