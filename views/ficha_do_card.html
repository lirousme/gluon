<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Gluon - Ficha do Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { theme: { extend: { colors: { gluon: { dark: '#0f172a', primary: '#3b82f6', secondary: '#1e293b' } } } } };
  </script>
</head>
<body class="min-h-[100dvh] bg-gluon-dark text-slate-100 selection:bg-blue-600/60">
  <main class="max-w-3xl mx-auto px-3 py-4 sm:px-4 sm:py-6">
    <div class="mb-4 flex items-center justify-between gap-3">
      <a id="backLink" href="/dashboard" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm">
        <i class="fa-solid fa-arrow-left"></i> Voltar
      </a>
      <h1 id="pageTitle" class="text-base sm:text-lg font-semibold">Criar ficha de card</h1>
    </div>

    <form id="cardForm" class="bg-gluon-secondary border border-slate-700 rounded-xl shadow-2xl p-4 sm:p-5 space-y-5">
      <input type="hidden" id="editCardId" value="">
      <input type="hidden" id="selectedTagIds" value="[]">
      <input type="hidden" id="selectedSubjectTagIds" value="[]">
      <input type="hidden" id="selectedObjectTagIds" value="[]">
      <input type="hidden" id="selectedTipoFrasalTagIds" value="[]">
      <input type="hidden" id="selectedTenseTagIds" value="[]">
      <input type="hidden" id="selectedLexicalChunksTagIds" value="[]">
      <input type="hidden" id="selectedRelationTagIds" value="[]">
      <input type="hidden" id="selectedWordsTagIds" value="[]">
      <input type="hidden" id="selectedIdiomaPrincipalTagIds" value="[]">
      <input type="hidden" id="selectedIdiomaSecundarioTagIds" value="[]">

      <div class="grid grid-cols-2 gap-2 rounded-lg bg-slate-900/70 p-1 border border-slate-700">
        <button type="button" id="singleTabFront" class="px-3 py-2 rounded-md text-sm font-medium transition-colors bg-gluon-primary text-white">Frente do card</button>
        <button type="button" id="singleTabBack" class="px-3 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-white">Verso do card</button>
      </div>

      <section id="singleFrontTabContent">
        <label class="block text-sm font-medium text-slate-300 mb-2">Frente (Obrigatório texto ou imagem)</label>
        <textarea id="singleFront" rows="7" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 px-4 text-white resize-none"></textarea>
        <div class="mt-3 bg-slate-800/50 p-3 rounded-lg border border-slate-700">
          <label class="block text-xs font-medium text-slate-400 mb-2"><i class="fa-regular fa-image"></i> Imagem da Frente (Opcional, Máx: 4MB)</label>
          <input type="file" id="frontImageFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer bg-slate-900 border border-slate-600 rounded">
          <input type="hidden" id="frontImageBase64">
          <div id="frontImagePreview" class="mt-2 hidden w-full h-36 rounded bg-contain bg-center bg-no-repeat border border-slate-600"></div>
          <button type="button" id="btnRemoveFrontImage" class="hidden mt-2 text-xs text-red-400 hover:text-red-300 flex items-center gap-1"><i class="fa-solid fa-trash"></i> Remover Imagem</button>
        </div>
      </section>

      <section id="singleBackTabContent" class="hidden pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-blue-300 mb-2">Verso (Opcional)</label>
        <textarea id="singleBack" rows="7" class="w-full bg-slate-900 border border-blue-500/50 rounded-lg py-3 px-4 text-white resize-none"></textarea>
        <div class="mt-3 bg-blue-900/10 p-3 rounded-lg border border-blue-900/50">
          <label class="block text-xs font-medium text-blue-400 mb-2"><i class="fa-regular fa-image"></i> Imagem do Verso (Opcional, Máx: 4MB)</label>
          <input type="file" id="backImageFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-900 file:text-blue-200 hover:file:bg-blue-800 cursor-pointer bg-slate-900 border border-blue-900/50 rounded">
          <input type="hidden" id="backImageBase64">
          <div id="backImagePreview" class="mt-2 hidden w-full h-36 rounded bg-contain bg-center bg-no-repeat border border-blue-500/50"></div>
          <button type="button" id="btnRemoveBackImage" class="hidden mt-2 text-xs text-red-400 hover:text-red-300 flex items-center gap-1"><i class="fa-solid fa-trash"></i> Remover Imagem</button>
        </div>
      </section>

      <section class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-violet-300 mb-2">Tags deste card</label>
        <input id="cardTagSearchInput" type="text" placeholder="Pesquisar tag por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="cardTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>

      <section id="SubjectTagsPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-emerald-300 mb-2">Subjects deste card (Base form)</label>
        <input id="subjectTagSearchInput" type="text" placeholder="Pesquisar tag de subject por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="subjectTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>

      <section id="ObjectTagsPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-amber-300 mb-2">Objects deste card (Base form)</label>
        <input id="objectTagSearchInput" type="text" placeholder="Pesquisar tag de object por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="objectTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>
      
      <section id="TipoFrasalTagsPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-amber-300 mb-2">Tipo frasal deste card</label>
        <input id="tipoFrasalTagSearchInput" type="text" placeholder="Pesquisar tag de object por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="tipoFrasalTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>
      
      <section id="TenseTagsPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-amber-300 mb-2">Tense deste card</label>
        <input id="tenseTagSearchInput" type="text" placeholder="Pesquisar tag de object por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="tenseTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>
      
      <section id="LexicalChunksTagsPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-amber-300 mb-2">Lexical chunks deste card</label>
        <input id="lexicalChunksTagSearchInput" type="text" placeholder="Pesquisar tag de object por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="lexicalChunksTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>
      
      <section id="RelationTagsPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-amber-300 mb-2">Tipo de relação deste card</label>
        <input id="relationTagSearchInput" type="text" placeholder="Pesquisar tag de object por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="relationTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>
      
      <section id="WordsTagsPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-amber-300 mb-2">Words deste card</label>
        <input id="wordsTagSearchInput" type="text" placeholder="Pesquisar tag de object por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="wordsTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>
      
      <section id="IdiomaPrincipalTagPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-amber-300 mb-2">Idioma principal deste card</label>
        <input id="idiomaPrincipalTagSearchInput" type="text" placeholder="Pesquisar tag do idioma principal por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="idiomaPrincipalTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>

      <section id="IdiomaSecundarioTagPanel" class="pt-3 border-t border-slate-700">
        <label class="block text-sm font-medium text-amber-300 mb-2">Idioma secundário deste card</label>
        <input id="idiomaSecundarioTagSearchInput" type="text" placeholder="Pesquisar tag do idioma secundário por nome..." class="w-full mb-2 bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm">
        <div id="idiomaSecundarioTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
      </section>

      <div class="flex items-center justify-between gap-3 pt-2 border-t border-slate-700">
        <p id="statusMessage" class="text-sm text-slate-400">Preencha pelo menos um lado com texto ou imagem.</p>
        <button type="submit" id="btnSave" class="inline-flex items-center gap-2 bg-gluon-primary hover:bg-blue-600 px-4 py-2 rounded-lg font-medium">
          <i class="fa-solid fa-check"></i> Salvar
        </button>
      </div>
    </form>
  </main>

<script>
const params = new URLSearchParams(window.location.search);
const app = {
  deckId: params.get('id'),
  from: params.get('from') || '/dashboard',
  editCardId: params.get('edit_card_id'),
  availableTags: [],
  tagPanels: {
    card: { selectedInputId: 'selectedTagIds', selectorId: 'cardTagSelector', activeClass: 'bg-violet-500/20 text-violet-200 border-violet-400', searchQuery: '' },
    subject: { selectedInputId: 'selectedSubjectTagIds', selectorId: 'subjectTagSelector', activeClass: 'bg-emerald-500/20 text-emerald-200 border-emerald-400', searchQuery: '' },
    object: { selectedInputId: 'selectedObjectTagIds', selectorId: 'objectTagSelector', activeClass: 'bg-amber-500/20 text-amber-200 border-amber-400', searchQuery: '' },
    tipoFrasal: { selectedInputId: 'selectedTipoFrasalTagIds', selectorId: 'tipoFrasalTagSelector', activeClass: 'bg-rose-500/20 text-rose-200 border-rose-400', searchQuery: '' },
    tense: { selectedInputId: 'selectedTenseTagIds', selectorId: 'tenseTagSelector', activeClass: 'bg-sky-500/20 text-sky-200 border-sky-400', searchQuery: '' },
    lexicalChunks: { selectedInputId: 'selectedLexicalChunksTagIds', selectorId: 'lexicalChunksTagSelector', activeClass: 'bg-fuchsia-500/20 text-fuchsia-200 border-fuchsia-400', searchQuery: '' },
    relation: { selectedInputId: 'selectedRelationTagIds', selectorId: 'relationTagSelector', activeClass: 'bg-cyan-500/20 text-cyan-200 border-cyan-400', searchQuery: '' },
    words: { selectedInputId: 'selectedWordsTagIds', selectorId: 'wordsTagSelector', activeClass: 'bg-lime-500/20 text-lime-200 border-lime-400', searchQuery: '' },
    idiomaPrincipal: { selectedInputId: 'selectedIdiomaPrincipalTagIds', selectorId: 'idiomaPrincipalTagSelector', activeClass: 'bg-indigo-500/20 text-indigo-200 border-indigo-400', searchQuery: '', singleSelect: true },
    idiomaSecundario: { selectedInputId: 'selectedIdiomaSecundarioTagIds', selectorId: 'idiomaSecundarioTagSelector', activeClass: 'bg-teal-500/20 text-teal-200 border-teal-400', searchQuery: '', singleSelect: true }
  },

  async api(action, payload = {}) {
    payload.action = action;
    const res = await fetch('/api/flashcards', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (res.status === 401) { window.location.href = '/'; return null; }
    const raw = await res.text();
    let data = null;
    try { data = raw ? JSON.parse(raw) : null; }
    catch (_) {
      throw new Error('Resposta inválida da API de flashcards.');
    }
    if (!data) throw new Error('A API de flashcards retornou uma resposta vazia.');
    if (data.status !== 'success') throw new Error(data.message || 'Falha na requisição.');
    return data;
  },
  switchSingleModalTab(tab) {
    const isFrontTab = tab !== 'back';
    singleTabFront.classList.toggle('bg-gluon-primary', isFrontTab);
    singleTabFront.classList.toggle('text-white', isFrontTab);
    singleTabBack.classList.toggle('bg-gluon-primary', !isFrontTab);
    singleTabBack.classList.toggle('text-white', !isFrontTab);
    singleFrontTabContent.classList.toggle('hidden', !isFrontTab);
    singleBackTabContent.classList.toggle('hidden', isFrontTab);
  },
  handleCardImageUpload(e, side) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) return this.setStatus('A imagem/GIF é muito pesada! Limite de 4MB.', 'error');
    const reader = new FileReader();
    reader.onload = (event) => {
      const result = event.target.result;
      if (file.type === 'image/gif') return this.setBase64ImagePreview(side, result);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1200;
        let {width, height} = img;
        if (width > height && width > MAX) { height *= MAX / width; width = MAX; }
        if (height >= width && height > MAX) { width *= MAX / height; height = MAX; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        this.setBase64ImagePreview(side, canvas.toDataURL(mime, mime === 'image/jpeg' ? 0.8 : undefined));
      };
      img.src = result;
    };
    reader.readAsDataURL(file);
  },
  setBase64ImagePreview(side, base64) {
    document.getElementById(`${side}ImageBase64`).value = base64;
    const preview = document.getElementById(`${side}ImagePreview`);
    preview.style.backgroundImage = `url('${base64}')`;
    preview.classList.remove('hidden');
    document.getElementById(`btnRemove${side.charAt(0).toUpperCase()+side.slice(1)}Image`).classList.remove('hidden');
  },
  removeCardImage(side) {
    document.getElementById(`${side}ImageFile`).value = '';
    document.getElementById(`${side}ImageBase64`).value = '';
    const p = document.getElementById(`${side}ImagePreview`);
    p.classList.add('hidden'); p.style.backgroundImage = 'none';
    document.getElementById(`btnRemove${side.charAt(0).toUpperCase()+side.slice(1)}Image`).classList.add('hidden');
  },
  async loadTags() {
    const res = await this.api('list_tags');
    this.availableTags = res?.data || [];
    this.renderAllTagSelectors();
  },
  getPanelConfig(panel) { return this.tagPanels[panel] || this.tagPanels.card; },
  getSelectedTagIds(panel) {
    const input = document.getElementById(this.getPanelConfig(panel).selectedInputId);
    try { return JSON.parse(input.value || '[]').map(Number).filter(Boolean); }
    catch (_) { return []; }
  },
  setSelectedTagIds(panel, ids) {
    document.getElementById(this.getPanelConfig(panel).selectedInputId).value = JSON.stringify(ids.map(Number).filter(Boolean));
  },
  handleTagSearch(panel, query='') {
    this.getPanelConfig(panel).searchQuery = query.trim().toLowerCase();
    this.renderTagSelector(panel);
  },
  renderAllTagSelectors() { Object.keys(this.tagPanels).forEach(panel => this.renderTagSelector(panel)); },
  renderTagSelector(panel = 'card', selectedIds = null) {
    const config = this.getPanelConfig(panel);
    const el = document.getElementById(config.selectorId);
    const currentSelected = selectedIds ?? this.getSelectedTagIds(panel);
    if (!this.availableTags.length) { el.innerHTML = '<span class="text-xs text-slate-400">Sem tags cadastradas.</span>'; return; }
    const filtered = config.searchQuery ? this.availableTags.filter(t => String(t.name||'').toLowerCase().includes(config.searchQuery)) : this.availableTags.filter(t => currentSelected.includes(Number(t.id)));
    if (!filtered.length) { el.innerHTML = '<span class="text-xs text-slate-400">Nenhuma tag para exibir.</span>'; return; }
    el.innerHTML = filtered.map(tag => {
      const id = Number(tag.id); const active = currentSelected.includes(id);
      return `<button type="button" data-tag-id="${id}" class="px-2.5 py-1 rounded-full text-xs border transition ${active ? config.activeClass : 'bg-slate-800 text-slate-300 border-slate-600'}"><span class="inline-block w-2 h-2 rounded-full mr-1" style="background:${tag.color}"></span>${String(tag.name||'')}</button>`;
    }).join('');
    el.querySelectorAll('[data-tag-id]').forEach(btn => btn.onclick = () => this.toggleTagSelection(panel, Number(btn.dataset.tagId)));
  },
  toggleTagSelection(panel, tagId) {
    const config = this.getPanelConfig(panel);
    const ids = this.getSelectedTagIds(panel);
    this.setSelectedTagIds(panel, config.singleSelect ? (ids.includes(tagId) ? [] : [tagId]) : (ids.includes(tagId) ? ids.filter(id => id !== tagId) : [...ids, tagId]));
    this.renderTagSelector(panel);
  },
  setStatus(text, tone='neutral') {
    statusMessage.textContent = text;
    statusMessage.className = 'text-sm ' + (tone==='error'?'text-red-400':tone==='success'?'text-emerald-300':'text-slate-400');
  },
  async preloadEditCard() {
    if (!this.editCardId) return;
    pageTitle.textContent = 'Editar ficha de card';
    editCardId.value = this.editCardId;
    this.setStatus('Carregando card para edição...');
    const res = await this.api('fetch', { deck_id: this.deckId });
    const card = (res?.data || []).find(c => String(c.id) === String(this.editCardId));
    if (!card) throw new Error('Card não encontrado para edição.');
    singleFront.value = card.front || '';
    singleBack.value = card.back || '';
    if (card.image_front) this.setBase64ImagePreview('front', card.image_front);
    if (card.image_back) this.setBase64ImagePreview('back', card.image_back);
    const tags = Array.isArray(card.tags) ? card.tags.map(t => Number(t.id)).filter(Boolean) : [];
    const subjectTags = Array.isArray(card.subject_tags) ? card.subject_tags.map(t => Number(t.id)).filter(Boolean) : [];
    const objectTags = Array.isArray(card.object_tags) ? card.object_tags.map(t => Number(t.id)).filter(Boolean) : [];
    const tipoFrasalTags = Array.isArray(card.tipo_frasal_tags) ? card.tipo_frasal_tags.map(t => Number(t.id)).filter(Boolean) : [];
    const tenseTags = Array.isArray(card.tense_tags) ? card.tense_tags.map(t => Number(t.id)).filter(Boolean) : [];
    const lexicalChunksTags = Array.isArray(card.lexical_chunks_tags) ? card.lexical_chunks_tags.map(t => Number(t.id)).filter(Boolean) : [];
    const relationTags = Array.isArray(card.relation_tags) ? card.relation_tags.map(t => Number(t.id)).filter(Boolean) : [];
    const wordsTags = Array.isArray(card.words_tags) ? card.words_tags.map(t => Number(t.id)).filter(Boolean) : [];
    const idiomaPrincipalTags = Array.isArray(card.idioma_principal_tags) ? card.idioma_principal_tags.map(t => Number(t.id)).filter(Boolean) : (Array.isArray(card.idiomas_tags) ? card.idiomas_tags.map(t => Number(t.id)).filter(Boolean) : []);
    const idiomaSecundarioTags = Array.isArray(card.idioma_secundario_tags) ? card.idioma_secundario_tags.map(t => Number(t.id)).filter(Boolean) : [];
    this.setSelectedTagIds('card', tags);
    this.setSelectedTagIds('subject', subjectTags);
    this.setSelectedTagIds('object', objectTags);
    this.setSelectedTagIds('tipoFrasal', tipoFrasalTags);
    this.setSelectedTagIds('tense', tenseTags);
    this.setSelectedTagIds('lexicalChunks', lexicalChunksTags);
    this.setSelectedTagIds('relation', relationTags);
    this.setSelectedTagIds('words', wordsTags);
    this.setSelectedTagIds('idiomaPrincipal', idiomaPrincipalTags);
    this.setSelectedTagIds('idiomaSecundario', idiomaSecundarioTags);
    this.renderAllTagSelectors();
    this.setStatus('Você está editando um card.', 'neutral');
  },
  async save(e) {
    e.preventDefault();
    const front = singleFront.value.trim();
    const back = singleBack.value.trim();
    const image_front = frontImageBase64.value;
    const image_back = backImageBase64.value;
    const tag_ids = this.getSelectedTagIds('card');
    const subject_tag_ids = this.getSelectedTagIds('subject');
    const object_tag_ids = this.getSelectedTagIds('object');
    const tipo_frasal_tag_ids = this.getSelectedTagIds('tipoFrasal');
    const tense_tag_ids = this.getSelectedTagIds('tense');
    const lexical_chunks_tag_ids = this.getSelectedTagIds('lexicalChunks');
    const relation_tag_ids = this.getSelectedTagIds('relation');
    const words_tag_ids = this.getSelectedTagIds('words');
    const idioma_principal_tag_ids = this.getSelectedTagIds('idiomaPrincipal');
    const idioma_secundario_tag_ids = this.getSelectedTagIds('idiomaSecundario');
    if (!front && !back && !image_front && !image_back) return this.setStatus('Preencha pelo menos um lado do card com texto ou imagem.', 'error');
    const original = btnSave.innerHTML; btnSave.disabled = true; btnSave.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Salvando...';
    try {
      const action = this.editCardId ? 'update_card' : 'add_single';
      const payload = { deck_id: this.deckId, front, back, image_front, image_back, tag_ids, subject_tag_ids, object_tag_ids, tipo_frasal_tag_ids, tense_tag_ids, lexical_chunks_tag_ids, relation_tag_ids, words_tag_ids, idioma_principal_tag_ids, idioma_secundario_tag_ids };
      if (this.editCardId) payload.card_id = this.editCardId;
      const response = await this.api(action, payload);
      this.setStatus(response?.message || 'Card salvo com sucesso.', 'success');
      setTimeout(() => window.location.href = backLink.href, 260);
    } catch (err) { this.setStatus(err.message || 'Erro ao salvar card.', 'error'); }
    finally { btnSave.disabled = false; btnSave.innerHTML = original; }
  }
};

backLink.href = decodeURIComponent(app.from);
if (!app.deckId) window.location.replace(backLink.href);
singleTabFront.onclick = () => app.switchSingleModalTab('front');
singleTabBack.onclick = () => app.switchSingleModalTab('back');
frontImageFile.onchange = (e) => app.handleCardImageUpload(e, 'front');
backImageFile.onchange = (e) => app.handleCardImageUpload(e, 'back');
btnRemoveFrontImage.onclick = () => app.removeCardImage('front');
btnRemoveBackImage.onclick = () => app.removeCardImage('back');
cardTagSearchInput.oninput = (e) => app.handleTagSearch('card', e.target.value);
subjectTagSearchInput.oninput = (e) => app.handleTagSearch('subject', e.target.value);
objectTagSearchInput.oninput = (e) => app.handleTagSearch('object', e.target.value);
