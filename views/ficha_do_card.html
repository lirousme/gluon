<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Gluon - Ficha do Card</title>
</head>
<body>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const deckId = urlParams.get('id');
    const from = urlParams.get('from') || '/dashboard';
    const editCardId = urlParams.get('edit_card_id');

    if (!deckId) {
      window.location.href = decodeURIComponent(from);
    } else {
      const flashcardsParams = new URLSearchParams({
        id: deckId,
        card_sheet_embed: '1',
        card_sheet_mode: editCardId ? 'edit' : 'create',
        from: `/ficha_do_card?id=${encodeURIComponent(deckId)}&from=${encodeURIComponent(from)}`
      });
      if (editCardId) flashcardsParams.set('edit_card_id', editCardId);
      window.location.replace(`/flashcards?${flashcardsParams.toString()}`);
    }
  </script>
</body>
</html>
