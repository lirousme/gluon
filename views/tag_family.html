<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Família da Tag</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <main class="relative flex min-h-screen items-center justify-center px-4">
    <button type="button" onclick="window.history.back()" class="absolute left-4 top-4 rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">Voltar</button>
    <h1 id="tagFamilyTitle" class="text-2xl font-semibold text-center">Tag</h1>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tagName = (params.get('tag_name') || '').trim();
    const title = document.getElementById('tagFamilyTitle');
    title.textContent = tagName || 'Tag';
  </script>
</body>
</html>
