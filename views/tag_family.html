<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Família da Tag</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="min-h-screen flex flex-col">
    <header class="relative flex items-center justify-center border-b border-slate-700 px-4 py-4 bg-slate-950">
      <button type="button" onclick="goBackToMarkedRoute()" class="absolute left-4 rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">Voltar</button>
      <h1 id="tagFamilyTitle" class="text-2xl font-semibold text-center">Tag</h1>
      <div class="absolute right-4 flex items-center gap-2">
        <button id="btnOpenTagFiltering" type="button" class="h-9 px-3 rounded-lg border border-sky-500/50 text-sky-300 hover:text-sky-200 hover:bg-sky-500/20 transition-colors text-sm font-medium" title="Abrir filtro de tags">Filtro</button>
        <button id="btnOpenCreateTagModal" type="button" class="h-9 w-9 rounded-lg border border-violet-500/50 text-violet-300 hover:text-violet-200 hover:bg-violet-500/20 transition-colors text-lg font-semibold" title="Criar nova tag">+</button>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 max-w-4xl mx-auto w-full">
      <section class="bg-slate-800/60 border border-slate-700 rounded-xl p-4">
        <h2 class="text-sm uppercase tracking-wide text-slate-300 mb-3">Família da tag</h2>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <p class="text-red-300 text-sm mb-2">Esta tag é mãe de:</p>
            <div id="childrenList" class="flex flex-wrap gap-2"></div>
          </div>
          <div>
            <p class="text-red-300 text-sm mb-2">Esta tag é filha de:</p>
            <div id="mothersList" class="flex flex-wrap gap-2"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="border-t border-slate-700 px-4 py-4 bg-slate-950">
      <div class="max-w-4xl mx-auto space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-sm text-slate-300">Modo de vínculo</label>
          <button id="relationModeSwitch" type="button" class="px-3 py-1.5 rounded-lg border border-slate-600 text-sm">Adicionando filhas</button>
        </div>
        <div id="footerTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
        <input id="footerTagSearch" type="text" placeholder="Pesquisar tag por nome..." class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm text-slate-100">
      </div>
    </footer>
  </div>
<script>
const params = new URLSearchParams(window.location.search);
const state = { tagId: Number(params.get('tag_id') || 0), tagName: (params.get('tag_name') || '').trim(), mode: 'child', tags: [], family: {mothers:[], children:[]} };
const title = document.getElementById('tagFamilyTitle');
title.textContent = state.tagName || 'Tag';

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function getTagLabel(tag = {}, numeroPtBrCounts = null){
  const numero = tag?.numero;
  const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
  const name = String(tag?.name || '').trim();
  const namePtBr = String(tag?.name_pt_br || '').trim();
  if (hasNumero){
    const numeroKey = String(numero).trim();
    const qtdTraducoes = numeroPtBrCounts?.get(numeroKey) || 0;
    if (qtdTraducoes > 1 && namePtBr) return `${numeroKey} (${namePtBr})`;
    return numeroKey;
  }
  return namePtBr ? `${name} (${namePtBr})` : name;
}

function buildNumeroPtBrCounts(tags = []){
  const counts = new Map();
  tags.forEach((tag)=>{
    const numero = tag?.numero;
    const numeroKey = numero !== null && numero !== undefined ? String(numero).trim() : '';
    const namePtBr = String(tag?.name_pt_br || '').trim();
    if (numeroKey && namePtBr) counts.set(numeroKey, (counts.get(numeroKey) || 0) + 1);
  });
  return counts;
}

function getMarkedBackRoute(){
  const urlParams=new URLSearchParams(window.location.search);
  const from=urlParams.get('from');
  return from?decodeURIComponent(from):'/views/flashcards.html';
}
function goBackToMarkedRoute(){
  if(window.history.length>1){window.history.back();return;}
  window.location.href=getMarkedBackRoute();
}
function openTagFiltering(){
  const params=new URLSearchParams();
  if(state.tagId) params.set('tag_id', String(state.tagId));
  if(state.tagName) params.set('tag_name', state.tagName);
  params.set('from', encodeURIComponent(window.location.pathname+window.location.search));
  const q=params.toString();
  window.location.href=`/views/tag_filtering.html${q?`?${q}`:''}`;
}
async function api(action,payload={}){payload.action=action;const r=await fetch('/api/flashcards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||j.status!=='success')throw new Error(j.message||'Erro');return j;}
function renderFooterTags(){
  const q=(document.getElementById('footerTagSearch').value||'').toLowerCase().trim();
  const el=document.getElementById('footerTagSelector');
  const filtered=state.tags.filter(t=>Number(t.id)!==state.tagId).filter(t=>String(t.name||'').toLowerCase().includes(q)||String(t.name_pt_br||'').toLowerCase().includes(q)||String(t.numero??'').toLowerCase().includes(q));
  if(!filtered.length){el.innerHTML='<span class="text-xs text-slate-400">Nenhuma tag encontrada.</span>';return;}
  const numeroPtBrCounts = buildNumeroPtBrCounts(filtered);
  el.innerHTML=filtered.map(t=>`<button type="button" data-id="${Number(t.id)}" class="px-2.5 py-1 rounded-full text-xs border bg-slate-800 text-slate-300 border-slate-600 hover:bg-slate-700">${esc(getTagLabel(t, numeroPtBrCounts))}</button>`).join('');
  el.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>addRelation(Number(b.dataset.id)));
}
function enforceSingleCreateTagCategorySelection(changedInput){
  if(!changedInput.checked) return;
  document.querySelectorAll('#createTagForm input[data-tag-category]').forEach((input)=>{if(input!==changedInput) input.checked=false;});
}
function resetCreateTagCategoryDefaults(){
  document.querySelectorAll('#createTagForm input[data-tag-category]').forEach((input)=>input.checked=false);
  const defaultInput=document.getElementById('createTagIsWordInput');
  if(defaultInput) defaultInput.checked=true;
}
function openCreateTagModal(){
  resetCreateTagCategoryDefaults();
  document.getElementById('createTagNameInput').value='';
  document.getElementById('createTagNamePtBrInput').value='';
  document.getElementById('createTagNumeroInput').value='';
  const m=document.getElementById('createTagModal');
  const c=document.getElementById('createTagModalContent');
  m.classList.remove('hidden');m.classList.add('flex');
  setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');document.getElementById('createTagNameInput').focus();},20);
}
function closeCreateTagModal(){
  const m=document.getElementById('createTagModal');
  const c=document.getElementById('createTagModalContent');
  m.classList.add('opacity-0');c.classList.add('scale-95');
  setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);
}
async function submitCreateTag(e){
  e.preventDefault();
  const btn=document.getElementById('btnSubmitCreateTag');
  btn.disabled=true;
  try{
    await api('create_tag',{
      name:document.getElementById('createTagNameInput').value.trim(),
      name_pt_br:document.getElementById('createTagNamePtBrInput').value.trim(),
      numero:document.getElementById('createTagNumeroInput').value.trim(),
      is_book:document.getElementById('createTagIsBookInput').checked?1:0,
      is_verb_tense:document.getElementById('createTagIsVerbTenseInput').checked?1:0,
      is_sentence_type:document.getElementById('createTagIsSentenceTypeInput').checked?1:0,
      is_lexical_chunk:document.getElementById('createTagIsLexicalChunkInput').checked?1:0,
      is_relation_type:document.getElementById('createTagIsRelationTypeInput').checked?1:0,
      is_word:document.getElementById('createTagIsWordInput').checked?1:0,
      is_month:document.getElementById('createTagIsMonthInput').checked?1:0,
      is_day:document.getElementById('createTagIsDayInput').checked?1:0,
      is_year:document.getElementById('createTagIsYearInput').checked?1:0
    });
    closeCreateTagModal();
    await load();
  }finally{btn.disabled=false;}
}
function openTagFamily(tag){
  const nextTagId=Number(tag?.id||0);
  if(!nextTagId) return;
  const nextTagName=String(tag?.name||'').trim();
  window.location.href=`/views/tag_family.html?tag_id=${encodeURIComponent(nextTagId)}&tag_name=${encodeURIComponent(nextTagName)}`;
}
function renderFamily(){
  const mk=(arr)=>{
    if(!arr.length) return '<span class="text-xs text-slate-400">Nenhuma</span>';
    const numeroPtBrCounts = buildNumeroPtBrCounts(arr);
    return arr.map(t=>`<button type="button" data-family-tag-id="${Number(t.id)}" class="px-2 py-1 rounded-full text-xs border border-red-400/70 bg-red-500/10 text-red-200 hover:bg-red-500/20 transition-colors" title="Abrir família da tag">${esc(getTagLabel(t, numeroPtBrCounts))}</button>`).join('');
  };
  document.getElementById('childrenList').innerHTML=mk(state.family.children);
  document.getElementById('mothersList').innerHTML=mk(state.family.mothers);
  document.querySelectorAll('[data-family-tag-id]').forEach((el)=>{
    el.onclick=()=>{
      const targetId=Number(el.dataset.familyTagId);
      const tag=[...state.family.children,...state.family.mothers].find((item)=>Number(item.id)===targetId);
      openActionModal(tag||{id:targetId,name:el.textContent||''}, el.closest('#childrenList') ? 'child' : 'mother');
    };
  });
}
async function load(){
  if(!state.tagId) return;
  const [tags,family]=await Promise.all([api('list_tags'), api('get_tag_family',{tag_id:state.tagId})]);
  state.tags=tags.data||[]; state.family=family.data||{mothers:[],children:[]};
  renderFamily(); renderFooterTags();
}
async function addRelation(otherTagId){
  await api('add_tag_family_relation',{tag_id:state.tagId,other_tag_id:otherTagId,mode:state.mode});
  await load();
}
document.getElementById('footerTagSearch').addEventListener('input',renderFooterTags);

document.getElementById('relationModeSwitch').addEventListener('click',()=>{state.mode=state.mode==='child'?'mother':'child';document.getElementById('relationModeSwitch').textContent=state.mode==='child'?'Adicionando filhas':'Adicionando mães';});
const actionState={tag:null,relationType:null};
function openActionModal(tag, relationType){actionState.tag=tag;actionState.relationType=relationType;document.getElementById('tagActionTitle').textContent=`Ações: ${getTagLabel(tag) || 'Tag'}`;const m=document.getElementById('tagActionModal');const c=document.getElementById('tagActionModalContent');m.classList.remove('hidden');m.classList.add('flex');setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');},20);} 
function closeActionModal(){const m=document.getElementById('tagActionModal');const c=document.getElementById('tagActionModalContent');m.classList.add('opacity-0');c.classList.add('scale-95');setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);} 
async function removeRelation(){if(!actionState.tag) return;await api('remove_tag_family_relation',{tag_id:state.tagId,other_tag_id:Number(actionState.tag.id),relation_type:actionState.relationType});closeActionModal();await load();}
function openEditTagModal(tag){if(!tag) return;document.getElementById('editTagIdInput').value=String(tag.id);document.getElementById('editTagNameInput').value=String(tag.name||'');document.getElementById('editTagNamePtBrInput').value=String(tag.name_pt_br||'');document.getElementById('editTagNumeroInput').value=(tag.numero??'');const m=document.getElementById('editTagModal');const c=document.getElementById('editTagModalContent');m.classList.remove('hidden');m.classList.add('flex');setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');},20);} 
function closeEditTagModal(){const m=document.getElementById('editTagModal');const c=document.getElementById('editTagModalContent');m.classList.add('opacity-0');c.classList.add('scale-95');setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);} 
async function submitEditTag(e){e.preventDefault();const id=Number(document.getElementById('editTagIdInput').value||0);const original=state.tags.find(t=>Number(t.id)===id)||{};await api('update_tag',{id,name:document.getElementById('editTagNameInput').value.trim(),name_pt_br:document.getElementById('editTagNamePtBrInput').value.trim(),numero:document.getElementById('editTagNumeroInput').value.trim(),is_book:Number(original.is_book||0),is_verb_tense:Number(original.is_verb_tense||0),is_sentence_type:Number(original.is_sentence_type||0),is_lexical_chunk:Number(original.is_lexical_chunk||0),is_relation_type:Number(original.is_relation_type||0),is_word:Number(original.is_word||0),is_month:Number(original.is_month||0),is_day:Number(original.is_day||0),is_year:Number(original.is_year||0)});closeEditTagModal();closeActionModal();await load();}
async function deleteTag(){if(!actionState.tag) return;await api('delete_tag',{id:Number(actionState.tag.id)});closeActionModal();await load();}
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btnOpenCreateTagModal').onclick=openCreateTagModal;
  document.getElementById('btnOpenTagFiltering').onclick=openTagFiltering;
  document.getElementById('btnCancelCreateTag').onclick=closeCreateTagModal;
  document.getElementById('btnCloseCreateTagModal').onclick=closeCreateTagModal;
  document.getElementById('createTagForm').addEventListener('submit',submitCreateTag);
  document.querySelectorAll('#createTagForm input[data-tag-category]').forEach((input)=>input.addEventListener('change',()=>enforceSingleCreateTagCategorySelection(input)));
  document.getElementById('btnCloseActionModal').onclick=closeActionModal;
  document.getElementById('btnRemoveRelation').onclick=removeRelation;
  document.getElementById('btnViewFamily').onclick=()=>{const t=actionState.tag;closeActionModal();openTagFamily(t)};
  document.getElementById('btnEditTag').onclick=()=>openEditTagModal(actionState.tag);
  document.getElementById('btnDeleteTag').onclick=deleteTag;
  document.getElementById('btnCancelEditTag').onclick=closeEditTagModal;
  document.getElementById('editTagForm').addEventListener('submit',submitEditTag);
  load();
});
</script>
  <div id="tagActionModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200">
    <div id="tagActionModalContent" class="w-[92%] max-w-sm rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <h3 class="text-lg font-semibold mb-3" id="tagActionTitle">Ações da tag</h3>
      <div class="grid gap-2">
        <button type="button" id="btnRemoveRelation" class="w-full text-left px-3 py-2 rounded-lg border border-slate-600 hover:bg-slate-800">Remover da família</button>
        <button type="button" id="btnViewFamily" class="w-full text-left px-3 py-2 rounded-lg border border-slate-600 hover:bg-slate-800">Ver família</button>
        <button type="button" id="btnEditTag" class="w-full text-left px-3 py-2 rounded-lg border border-slate-600 hover:bg-slate-800">Editar</button>
        <button type="button" id="btnDeleteTag" class="w-full text-left px-3 py-2 rounded-lg border border-red-500/60 text-red-300 hover:bg-red-500/10">Excluir</button>
      </div>
      <button type="button" id="btnCloseActionModal" class="mt-3 w-full px-3 py-2 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800">Cancelar</button>
    </div>
  </div>

  <div id="editTagModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200">
    <div id="editTagModalContent" class="w-[92%] max-w-lg rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <h3 class="text-lg font-semibold mb-3">Editar tag</h3>
      <form id="editTagForm" class="space-y-3">
        <input id="editTagIdInput" type="hidden">
        <input id="editTagNameInput" type="text" required maxlength="80" placeholder="Nome" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="editTagNamePtBrInput" type="text" maxlength="80" placeholder="Nome pt-br" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="editTagNumeroInput" type="number" placeholder="Número" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnCancelEditTag" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
          <button type="submit" id="btnSubmitEditTag" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500">Salvar</button>
        </div>
      </form>
    </div>
  </div>
  <div id="createTagModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4">
    <div id="createTagModalContent" class="w-[92%] max-w-lg rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <form id="createTagForm" class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">Criar nova tag</h3>
          <button id="btnCloseCreateTagModal" type="button" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <input id="createTagNameInput" type="text" required maxlength="80" placeholder="Nome" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="createTagNamePtBrInput" type="text" maxlength="80" placeholder="Nome pt-br" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="createTagNumeroInput" type="number" placeholder="Número" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <p class="text-xs text-amber-300">Selecione no máximo 1 categoria para a nova tag.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-300">
          <label class="inline-flex items-center gap-2"><input id="createTagIsBookInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Livro</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsVerbTenseInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Tempo Verbal</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsSentenceTypeInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Tipo Frasal</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsLexicalChunkInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Lexical Chunk</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsRelationTypeInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Tipo de Relação</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsWordInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Palavra</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsMonthInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Mês</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsDayInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Dia</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsYearInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Ano</span></label>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button id="btnCancelCreateTag" type="button" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
          <button id="btnSubmitCreateTag" type="submit" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500">Criar tag</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
