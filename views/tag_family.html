<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Família da Tag</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    html,
    body {
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    input,
    textarea,
    select,
    button {
      font-size: 16px;
    }

    .sequence-reorder-list {
      align-items: center;
      min-height: 2.25rem;
      transition: background-color 320ms ease, box-shadow 320ms ease, padding 320ms ease, margin 320ms ease;
    }

    .sequence-reorder-list.sequence-drag-active {
      border-radius: 0.75rem;
      background: rgba(14, 165, 233, 0.08);
      box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.26);
      padding: 0.25rem;
      margin: -0.25rem;
    }

    .sequence-tag-chip {
      transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1), opacity 260ms ease, box-shadow 320ms ease, margin 420ms cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    .sequence-tag-chip.sequence-dragging {
      opacity: 0.35;
      transform: scale(0.96);
    }

    .sequence-drop-placeholder {
      flex: 0 0 auto;
      width: var(--sequence-placeholder-width, 0px);
      min-width: var(--sequence-placeholder-width, 0px);
      height: var(--sequence-placeholder-height, 0px);
      margin-inline: var(--sequence-placeholder-margin, 0px);
      opacity: var(--sequence-placeholder-opacity, 0);
      border: 1px dashed rgba(125, 211, 252, 0.92);
      border-radius: 9999px;
      background: rgba(14, 165, 233, 0.16);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.08);
      animation: sequenceDropPulse 1800ms ease-in-out infinite;
      pointer-events: none;
      transform: scaleX(var(--sequence-placeholder-scale, 0.35));
      transform-origin: center;
      will-change: width, min-width, margin, opacity, transform;
      transition: width 620ms cubic-bezier(0.16, 1, 0.3, 1), min-width 620ms cubic-bezier(0.16, 1, 0.3, 1), height 420ms ease, margin 620ms cubic-bezier(0.16, 1, 0.3, 1), opacity 300ms ease, transform 620ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sequence-drop-placeholder.sequence-drop-placeholder-visible {
      --sequence-placeholder-opacity: 1;
      --sequence-placeholder-margin: 0.5rem;
      --sequence-placeholder-scale: 1;
    }

    @keyframes sequenceDropPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="min-h-screen flex flex-col">
    <header class="relative flex items-center justify-center border-b border-slate-700 px-4 py-7 bg-slate-950">
      <div class="absolute left-4 flex items-center gap-2">
        <button type="button" onclick="goBackToMarkedRoute()" class="h-9 rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800"><i class="fa-solid fa-left-long"></i></button>
        <button id="btnOpenOrphanTags" type="button" onclick="goToOrphanTags()" class="h-9 w-9 rounded-lg border border-purple-500/50 text-purple-300 hover:text-purple-200 hover:bg-purple-500/20 transition-colors text-sm font-medium" title="Tags sem vínculos" aria-label="Abrir tags sem vínculos"><i class="fa-solid fa-magnifying-glass-chart"></i></button>
        <button id="btnShowLayerGroupMessage" type="button" class="h-9 w-9 rounded-lg border border-sky-500/50 text-sky-300 hover:text-sky-200 hover:bg-sky-500/20 transition-colors text-sm font-medium" title="Mostrar mensagem no console" aria-label="Mostrar mensagem no console"><i class="fa-solid fa-book"></i></button>
      </div>

      <h1 class="text-2xl font-semibold text-center"></h1>
      <div class="absolute right-4 flex items-center gap-2">
        <button id="btnToggleCurrentTagPin" type="button" class="hidden h-9 w-9 rounded-lg border border-slate-600 bg-slate-700 text-slate-200 hover:bg-slate-600 transition-colors text-sm font-medium" title="Fixar tag" aria-label="Fixar tag"><i class="fa-solid fa-thumbtack"></i></button>
        <button id="btnOpenCurrentTagActions" type="button" class="hidden h-9 w-9 rounded-lg border border-amber-500/50 text-amber-300 hover:text-amber-200 hover:bg-amber-500/20 transition-colors text-sm font-medium" title="Editar a tag atual" aria-label="Editar a tag atual"><i class="fa-solid fa-pen-to-square"></i></button>
        <button id="btnOpenCreateTagModal" type="button" class="h-9 w-9 rounded-lg border border-violet-500/50 text-violet-300 hover:text-violet-200 hover:bg-violet-500/20 transition-colors text-lg font-semibold" title="Criar nova tag"><i class="fa-solid fa-plus"></i></button>
        <button id="btnOpenCreateRelationTypeModal" type="button" class="h-9 w-9 rounded-lg border border-emerald-500/50 text-emerald-300 hover:text-emerald-200 hover:bg-emerald-500/20 transition-colors text-lg font-semibold" title="Criar novo tipo de relação"><i class="fa-solid fa-folder-plus"></i></button>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 max-w-4xl mx-auto w-full">
        <h3 id="tagFamilyMainTitle" class="-translate-y-3 text-1xl font-semibold text-center">Tag</h3>
        <div id="relationTypeSections" class="space-y-4"></div>
    </main>

    <footer class="border-t border-slate-700 px-4 py-4 bg-slate-950">
      <div class="max-w-4xl mx-auto space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-sm text-slate-300">Modo de vínculo <span id="selectedRelationTypeLabel" class="text-violet-300"></span></label>
          <button id="relationModeSwitch" type="button" class="px-3 py-1.5 rounded-lg border border-slate-600 text-sm">Adicionando filhas</button>
        </div>
        <div id="footerTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
        <input id="footerTagSearch" type="text" placeholder="Pesquisar tag por nome..." class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-base text-slate-100">
      </div>
    </footer>
  </div>
<script>
(function lockMobileZoom(){
  const viewport = document.querySelector('meta[name="viewport"]');
  const lockedViewport = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
  if (viewport) viewport.setAttribute('content', lockedViewport);

  const preventZoom = (event) => event.preventDefault();
  document.addEventListener('gesturestart', preventZoom, { passive: false });
  document.addEventListener('gesturechange', preventZoom, { passive: false });
  document.addEventListener('gestureend', preventZoom, { passive: false });

  document.addEventListener('touchmove', (event) => {
    if (event.touches && event.touches.length > 1) event.preventDefault();
  }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  document.addEventListener('wheel', (event) => {
    if (event.ctrlKey) event.preventDefault();
  }, { passive: false });
})();
const params = new URLSearchParams(window.location.search);
const state = { tagId: Number(params.get('tag_id') || 0), tagName: (params.get('tag_name') || '').trim(), mode: 'child', selectedRelationType: null, removalRelationType: null, tags: [], family: {mothers:[], children:[]}, relationTypes: [], savedFilters: [], sessionUserId: null, editingRelationTypeId: null, reorderRelationType: null, draggedSequenceTagId: null, sequenceDropTargetId: null, sequenceDropPosition: 'before', sequenceDropPreviewTargetId: null, sequenceDropPreviewPosition: 'before', sequenceDropPreviewFrame: null };
const title = document.getElementById('tagFamilyMainTitle');
title.textContent = state.tagName || 'Tag';

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function getTagLabel(tag = {}, numeroPtBrCounts = null){
  const numero = tag?.numero;
  const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
  const name = String(tag?.name || '').trim();
  const namePtBr = String(tag?.name_pt_br || '').trim();
  if (hasNumero){
    const numeroKey = String(numero).trim();
    const qtdTraducoes = numeroPtBrCounts?.get(numeroKey) || 0;
    if (qtdTraducoes > 1 && namePtBr) return `${numeroKey} (${namePtBr})`;
    return numeroKey;
  }
  return namePtBr ? `${name} (${namePtBr})` : name;
}
function getSubjectsCount(tag = {}){
  const value = Number(tag?.subjects_count ?? 0);
  return Number.isFinite(value) && value >= 0 ? value : 0;
}
function renderTagButtonContent(tag = {}, numeroPtBrCounts = null){
  return `${esc(getTagLabel(tag, numeroPtBrCounts))} <span class="text-[10px] text-slate-400">(${getSubjectsCount(tag)})</span>`;
}

function buildNumeroPtBrCounts(tags = []){
  const counts = new Map();
  tags.forEach((tag)=>{
    const numero = tag?.numero;
    const numeroKey = numero !== null && numero !== undefined ? String(numero).trim() : '';
    const namePtBr = String(tag?.name_pt_br || '').trim();
    if (numeroKey && namePtBr) counts.set(numeroKey, (counts.get(numeroKey) || 0) + 1);
  });
  return counts;
}

function getMarkedBackRoute(){
  const urlParams=new URLSearchParams(window.location.search);
  const from=urlParams.get('from');
  return from?decodeURIComponent(from):'/views/flashcards.html';
}
function goBackToMarkedRoute(){
  if(window.history.length>1){window.history.back();return;}
  window.location.href=getMarkedBackRoute();
}
function showLayerGroupMessage(){
  const params=new URLSearchParams();
  if(state.tagId) params.set('tag_id', String(state.tagId));
  if(state.tagName) params.set('tag_name', state.tagName);
  params.set('from', encodeURIComponent(window.location.pathname+window.location.search));
  const q=params.toString();
  window.location.href=`/views/card_da_tag.html${q?`?${q}`:''}`;
}
function openTagFiltering(){
  const params=new URLSearchParams();
  if(state.tagId) params.set('tag_id', String(state.tagId));
  if(state.tagName) params.set('tag_name', state.tagName);
  params.set('from', encodeURIComponent(window.location.pathname+window.location.search));
  const q=params.toString();
  window.location.href=`/views/tag_filtering.html${q?`?${q}`:''}`;
}
function goToOrphanTags(){
  window.location.href='/views/tags_sem_vinculos.html';
}
async function api(action,payload={}){payload.action=action;const r=await fetch('/api/flashcards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||j.status!=='success'){const error=new Error(j.message||'Erro');error.response=j;throw error;}return j;}
async function loadSessionUserId(){try{const r=await fetch('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get_session'})});if(!r.ok)return;const j=await r.json();const parsed=Number(j?.id??j?.data?.id);if(Number.isInteger(parsed)&&parsed>0)state.sessionUserId=parsed;}catch(_){}}
function canEditTag(tag={}){const tagUserId=Number(tag?.user_id);const sessionId=Number(state.sessionUserId);return Number.isInteger(tagUserId)&&tagUserId>0&&Number.isInteger(sessionId)&&sessionId>0&&tagUserId===sessionId;}
function isUserOwnedTag(tag={}){return canEditTag(tag);}
function getTagOwnershipClass(tag={}, {removalMode=false}={}){
  const base=isUserOwnedTag(tag)?'bg-emerald-500/15 text-emerald-200 border-emerald-400/80 hover:bg-emerald-500/25':'bg-slate-800 text-slate-300 border-slate-600 hover:bg-slate-700';
  return removalMode?`${base} ring-1 ring-amber-300/70`:base;
}
function canEditRelationType(relationType={}){const typeUserId=Number(relationType?.user_id);const sessionId=Number(state.sessionUserId);return Number.isInteger(typeUserId)&&typeUserId>0&&Number.isInteger(sessionId)&&sessionId>0&&typeUserId===sessionId;}
function getRelationTypeById(type){return state.relationTypes.find((item)=>Number(item.id)===Number(type))||null;}
function updateCurrentTagHeaderActions(){const editBtn=document.getElementById('btnOpenCurrentTagActions');const pinBtn=document.getElementById('btnToggleCurrentTagPin');const current=getCurrentTag();const canEdit=canEditTag(current);if(editBtn) editBtn.classList.toggle('hidden',!canEdit);if(pinBtn){pinBtn.classList.toggle('hidden',!state.tagId||canEdit);updatePinTagButton(pinBtn,state.tagId);}}
async function translateTagFieldsWithGemini(nameInputId,namePtBrInputId,buttonId){const nameInput=document.getElementById(nameInputId);const namePtBrInput=document.getElementById(namePtBrInputId);const btn=document.getElementById(buttonId);const englishText=nameInput.value.trim();const ptBrText=namePtBrInput.value.trim();if(englishText&&ptBrText){alert('Deixe apenas um dos campos de texto da tag preenchido para traduzir para o outro.');return;}if(!englishText&&!ptBrText){alert('Preencha o nome em inglês ou em pt-BR para traduzir a tag.');return;}const originalHtml=btn.innerHTML;const translatingFromEnglish=Boolean(englishText);btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Traduzindo...';btn.disabled=true;try{const res=await api('translate_text_gemini',{text:translatingFromEnglish?englishText:ptBrText,source_language:translatingFromEnglish?'en-US':'pt-BR',target_language:translatingFromEnglish?'pt-BR':'en-US'});if(!res||!res.translation) throw new Error('A API não retornou uma tradução válida.');if(translatingFromEnglish) namePtBrInput.value=res.translation;else nameInput.value=res.translation;}catch(err){alert('Falha ao traduzir tag com Gemini: '+(err.message||'erro desconhecido'));}finally{btn.innerHTML=originalHtml;btn.disabled=false;}}
function renderFooterTags(){
  document.getElementById('selectedRelationTypeLabel').textContent=`(${getRelationTypeLabel(state.selectedRelationType)})`;

  const q=(document.getElementById('footerTagSearch').value||'').toLowerCase().trim();
  const el=document.getElementById('footerTagSelector');
  const minSearchLength=2;
  const maxResults=200;

  if(q.length<minSearchLength){
    el.innerHTML=`<span class="text-xs text-slate-400">Digite pelo menos ${minSearchLength} caracteres para buscar tags.</span>`;
    return;
  }

  const matches=state.tags
    .filter((t)=>Number(t.id)!==state.tagId)
    .filter((t)=>String(t.name||'').toLowerCase().includes(q)||String(t.name_pt_br||'').toLowerCase().includes(q)||String(t.numero??'').toLowerCase().includes(q));

  if(!matches.length){
    el.innerHTML='<span class="text-xs text-slate-400">Nenhuma tag encontrada.</span>';
    return;
  }

  const filtered=matches.slice(0,maxResults);
  const numeroPtBrCounts = buildNumeroPtBrCounts(filtered);
  const hasMoreResults=matches.length>maxResults;
  const summary=hasMoreResults?`<div class="w-full text-[11px] text-amber-300 mb-2">Mostrando ${maxResults} de ${matches.length} tags. Refine a busca para ver menos resultados.</div>`:'';
  el.innerHTML=summary+filtered.map(t=>`<button type="button" data-id="${Number(t.id)}" class="px-2.5 py-1 rounded-full text-xs border transition-colors ${getTagOwnershipClass(t)}">${renderTagButtonContent(t, numeroPtBrCounts)}</button>`).join('');
  el.querySelectorAll('button[data-id]').forEach((b)=>b.onclick=()=>addRelation(Number(b.dataset.id)));
}
function openCreateTagModal(){
  document.getElementById('createTagNameInput').value='';
  document.getElementById('createTagNamePtBrInput').value='';
  document.getElementById('createTagNumeroInput').value='';
  const m=document.getElementById('createTagModal');
  const c=document.getElementById('createTagModalContent');
  m.classList.remove('hidden');m.classList.add('flex');
  setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');document.getElementById('createTagNameInput').focus();},20);
}
function closeCreateTagModal(){
  const m=document.getElementById('createTagModal');
  const c=document.getElementById('createTagModalContent');
  m.classList.add('opacity-0');c.classList.add('scale-95');
  setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);
}
async function submitCreateTag(e){
  e.preventDefault();
  const btn=document.getElementById('btnSubmitCreateTag');
  btn.disabled=true;
  try{
    const createTagNameInput=document.getElementById('createTagNameInput');
    const createTagNamePtBrInput=document.getElementById('createTagNamePtBrInput');
    let namePtBr=createTagNamePtBrInput.value.trim();
    const nameFromEnglish=createTagNameInput.value.trim();
    const name=nameFromEnglish||namePtBr;
    if(!name){alert('Preencha o nome em inglês ou em pt-BR para criar a tag.');return;}
    if(!nameFromEnglish){createTagNameInput.value=name;createTagNamePtBrInput.value='';namePtBr='';}
    await api('create_tag',{
      name,
      name_pt_br:namePtBr,
      numero:document.getElementById('createTagNumeroInput').value.trim(),
      is_book:0,
      is_verb_tense:0,
      is_sentence_type:0,
      is_lexical_chunk:0,
      is_relation_type:0,
      is_word:1,
      is_month:0,
      is_day:0,
      is_year:0
    });
    closeCreateTagModal();
    await load();
  }finally{btn.disabled=false;}
}
function openTagFamily(tag){
  const nextTagId=Number(tag?.id||0);
  if(!nextTagId) return;
  const nextTagName=String(tag?.name||'').trim();
  window.location.href=`/views/tag_family.html?tag_id=${encodeURIComponent(nextTagId)}&tag_name=${encodeURIComponent(nextTagName)}`;
}
function getRelationTypeLabel(type){
  const found=state.relationTypes.find((item)=>Number(item.id)===Number(type));
  return found?.nome || `Tipo de relação ${type}`;
}
function getRelationTypeHierarchy(type){
  const found=state.relationTypes.find((item)=>Number(item.id)===Number(type));
  return Number(found?.hierarquia||0);
}
function relationTypeUsesHierarchy(type){return getRelationTypeHierarchy(type)===1;}
function relationTypeUsesSequence(type){return getRelationTypeHierarchy(type)===2;}
function openCreateRelationTypeModal(){
  document.getElementById('createRelationTypeNameInput').value='';
  document.getElementById('createRelationTypeHierarchyInput').value='0';
  const m=document.getElementById('createRelationTypeModal');
  const c=document.getElementById('createRelationTypeModalContent');
  m.classList.remove('hidden');m.classList.add('flex');
  setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');document.getElementById('createRelationTypeNameInput').focus();},20);
}
function closeCreateRelationTypeModal(){
  const m=document.getElementById('createRelationTypeModal');
  const c=document.getElementById('createRelationTypeModalContent');
  m.classList.add('opacity-0');c.classList.add('scale-95');
  setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);
}
function getTagRelationType(tag={}){
  const candidates=[tag?.tipo_de_relacao,tag?.relation_type,tag?.relation_type_id,tag?.tipo_relacao];
  for(const value of candidates){
    const num=Number(value);
    if(Number.isInteger(num)) return num;
  }
  return 0;
}
function getSequenceDropPlaceholder(){
  let placeholder=document.getElementById('sequenceDropPlaceholder');
  if(!placeholder){
    placeholder=document.createElement('span');
    placeholder.id='sequenceDropPlaceholder';
    placeholder.className='sequence-drop-placeholder';
    placeholder.setAttribute('aria-hidden','true');
  }
  return placeholder;
}
function clearSequenceDragPreview(){
  const placeholder=document.getElementById('sequenceDropPlaceholder');
  if(state.sequenceDropPreviewFrame){
    cancelAnimationFrame(state.sequenceDropPreviewFrame);
    state.sequenceDropPreviewFrame=null;
  }
  if(placeholder){
    placeholder.classList.remove('sequence-drop-placeholder-visible');
    placeholder.style.setProperty('--sequence-placeholder-width','0px');
    placeholder.style.setProperty('--sequence-placeholder-height','0px');
    setTimeout(()=>{if(!placeholder.classList.contains('sequence-drop-placeholder-visible')) placeholder.remove();},220);
  }
  document.querySelectorAll('.sequence-dragging').forEach((el)=>el.classList.remove('sequence-dragging'));
  document.querySelectorAll('.sequence-drag-active').forEach((el)=>el.classList.remove('sequence-drag-active'));
  state.draggedSequenceTagId=null;
  state.sequenceDropTargetId=null;
  state.sequenceDropPosition='before';
  state.sequenceDropPreviewTargetId=null;
  state.sequenceDropPreviewPosition='before';
}
function setSequencePlaceholderSize(placeholder,width,height,{animateOpen=false}={}){
  const nextWidth=Math.max(width,48);
  const nextHeight=Math.max(height,28);
  if(animateOpen){
    placeholder.classList.remove('sequence-drop-placeholder-visible');
    placeholder.style.setProperty('--sequence-placeholder-width','0px');
    placeholder.style.setProperty('--sequence-placeholder-height',`${nextHeight}px`);
    // Force the browser to paint the closed slot first, then open it slowly so the
    // surrounding chips visibly make room instead of jumping instantly.
    placeholder.getBoundingClientRect();
    requestAnimationFrame(()=>{
      placeholder.style.setProperty('--sequence-placeholder-width',`${nextWidth}px`);
      placeholder.style.setProperty('--sequence-placeholder-height',`${nextHeight}px`);
      placeholder.classList.add('sequence-drop-placeholder-visible');
    });
    return;
  }
  placeholder.style.setProperty('--sequence-placeholder-width',`${nextWidth}px`);
  placeholder.style.setProperty('--sequence-placeholder-height',`${nextHeight}px`);
  requestAnimationFrame(()=>placeholder.classList.add('sequence-drop-placeholder-visible'));
}
function updateSequenceDropPreview(list,targetEl,event){
  if(state.sequenceDropPreviewFrame) cancelAnimationFrame(state.sequenceDropPreviewFrame);
  state.sequenceDropPreviewFrame=requestAnimationFrame(()=>{
    state.sequenceDropPreviewFrame=null;
    const relationType=Number(list?.dataset.sequenceList||0);
    if(!list||state.reorderRelationType!==relationType||!state.draggedSequenceTagId) return;
    list.classList.add('sequence-drag-active');
    const placeholder=getSequenceDropPlaceholder();
    if(targetEl?.closest?.('#sequenceDropPlaceholder')) return;
    const draggedEl=list.querySelector(`[data-family-tag-id="${state.draggedSequenceTagId}"]`);
    const referenceEl=targetEl?.closest?.('[data-family-tag-id]');
    if(referenceEl===draggedEl) return;
    let targetId=0;
    let dropPosition='before';
    let insertMode='beforebegin';
    let anchorEl=referenceEl;
    if(referenceEl){
      const rect=referenceEl.getBoundingClientRect();
      targetId=Number(referenceEl.dataset.familyTagId||0);
      const previousPosition=state.sequenceDropPreviewTargetId===targetId?state.sequenceDropPreviewPosition:null;
      const isWrappedRow=Math.abs(event.clientY-(rect.top+(rect.height/2)))>Math.max(rect.height*0.45,14);
      const axisStart=isWrappedRow?rect.top:rect.left;
      const axisSize=isWrappedRow?rect.height:rect.width;
      const pointerPosition=isWrappedRow?event.clientY:event.clientX;
      const axisRatio=axisSize>0?(pointerPosition-axisStart)/axisSize:0.5;
      // Use a small dead zone around the middle of the chip. This avoids the
      // placeholder rapidly flipping before/after while the user drags slowly.
      if(previousPosition && axisRatio>0.35 && axisRatio<0.65) dropPosition=previousPosition;
      else dropPosition=axisRatio>=0.5?'after':'before';
      insertMode=dropPosition==='after'?'afterend':'beforebegin';
      const previewChanged=state.sequenceDropPreviewTargetId!==targetId||state.sequenceDropPreviewPosition!==dropPosition;
      setSequencePlaceholderSize(placeholder,rect.width,rect.height,{animateOpen:previewChanged});
    }else{
      const chips=[...list.querySelectorAll('[data-family-tag-id]')].filter((chip)=>chip!==draggedEl);
      anchorEl=chips[chips.length-1]||null;
      if(anchorEl){
        const rect=anchorEl.getBoundingClientRect();
        targetId=Number(anchorEl.dataset.familyTagId||0);
        dropPosition='after';
        insertMode='afterend';
        const previewChanged=state.sequenceDropPreviewTargetId!==targetId||state.sequenceDropPreviewPosition!==dropPosition;
        setSequencePlaceholderSize(placeholder,rect.width,rect.height,{animateOpen:previewChanged});
      }else{
        targetId=state.draggedSequenceTagId;

async function reorderSequenceTag(relationType, draggedId, targetId, dropPosition='before'){
  draggedId=Number(draggedId||0);targetId=Number(targetId||0);
  if(!draggedId||!targetId||draggedId===targetId) return;
  const current=state.family.children.filter((tag)=>getTagRelationType(tag)===relationType).map((tag)=>Number(tag.id));
  const from=current.indexOf(draggedId);
  const to=current.indexOf(targetId);
  if(from<0||to<0) return;
  const ordered=[...current];
  const [moved]=ordered.splice(from,1);
  let insertIndex=to+(dropPosition==='after'?1:0);
  if(from<insertIndex) insertIndex-=1;
  ordered.splice(Math.max(0,Math.min(insertIndex,ordered.length)),0,moved);
  await api('reorder_tag_family_sequence',{tag_id:state.tagId,tipo_de_relacao:relationType,ordered_tag_ids:ordered});
  state.family.children.sort((a,b)=>{
    const typeA=getTagRelationType(a), typeB=getTagRelationType(b);
    if(typeA!==relationType || typeB!==relationType) return 0;
    return ordered.indexOf(Number(a.id))-ordered.indexOf(Number(b.id));
  });
  await load();
}

  document.getElementById('btnConfirmTagDeletionBlockedModal').onclick=closeTagDeletionBlockedModal;
  document.getElementById('btnDeleteEditingTag').onclick=deleteEditedTag;
  document.getElementById('btnTranslateEditTagGemini').onclick=()=>translateTagFieldsWithGemini('editTagNameInput','editTagNamePtBrInput','btnTranslateEditTagGemini');
  document.getElementById('btnTogglePinnedTag').onclick=()=>togglePinnedTag();
  document.getElementById('editTagForm').addEventListener('submit',submitEditTag);
  await loadSessionUserId();
  load();
});
</script>
  <div id="editRelationTypeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4" role="dialog" aria-modal="true" aria-labelledby="editRelationTypeTitle">
    <div id="editRelationTypeModalContent" class="w-[92%] max-w-md rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <form id="editRelationTypeForm" class="space-y-4">
        <div class="flex items-center justify-between gap-3">
          <h3 id="editRelationTypeTitle" class="text-lg font-semibold">Editar sessão</h3>
          <button id="btnCloseEditRelationTypeModal" type="button" class="text-slate-400 hover:text-white text-xl" aria-label="Fechar">&times;</button>
        </div>
        <div>
          <label for="editRelationTypeNameInput" class="mb-1 block text-sm text-slate-300">Nome da sessão</label>
          <input id="editRelationTypeNameInput" type="text" maxlength="120" placeholder="Nome da sessão" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        </div>
        <div class="flex flex-col gap-2 pt-2 sm:flex-row sm:items-center sm:justify-between">
          <button type="button" id="btnDeleteRelationType" class="px-4 py-2 rounded-lg border border-red-500/60 text-red-300 hover:bg-red-500/10">Excluir sessão</button>
          <div class="flex justify-end gap-2">
            <button type="button" id="btnCancelEditRelationType" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
            <button type="submit" id="btnSubmitEditRelationType" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500">Salvar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="editTagModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200">

      <div class="mb-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <button type="button" id="btnDeleteEditingTag" class="rounded-lg border border-red-500/60 px-3 py-2 text-sm text-red-300 hover:bg-red-500/10">Excluir</button>
          <button type="button" id="btnTranslateEditTagGemini" class="rounded-lg border border-amber-300/40 px-3 py-2 text-sm text-amber-300 hover:bg-amber-300/10" title="Traduzir tag com Gemini"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Gemini</button>
        </div>
        <button type="button" id="btnTogglePinnedTag" class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-600 bg-slate-700 text-slate-200 hover:bg-slate-600 transition-colors" title="Fixar tag" aria-label="Fixar tag"><i class="fa-solid fa-thumbtack"></i></button>
      </div>
      <form id="editTagForm" class="space-y-3">
        <input id="editTagIdInput" type="hidden">
        <input id="editTagNameInput" type="text" maxlength="80" placeholder="Nome" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="editTagNamePtBrInput" type="text" maxlength="80" placeholder="Nome pt-br" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="editTagNumeroInput" type="number" placeholder="Número" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnCancelEditTag" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
          <button type="submit" id="btnSubmitEditTag" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500">Salvar</button>
        </div>
      </form>
    </div>
  </div>
  <div id="tagDeletionBlockedModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4" role="dialog" aria-modal="true" aria-labelledby="tagDeletionBlockedTitle">
    <div id="tagDeletionBlockedModalContent" class="w-[92%] max-w-md rounded-xl border border-red-500/40 bg-slate-900 p-5 scale-95 transition-transform duration-200">
      <div class="mb-4 flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-red-500/15 text-red-300"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i></span>
          <h3 id="tagDeletionBlockedTitle" class="text-lg font-semibold text-red-200">Exclusão bloqueada</h3>
        </div>
        <button type="button" id="btnCloseTagDeletionBlockedModal" class="text-slate-400 hover:text-white text-xl" aria-label="Fechar">&times;</button>
      </div>
      <p class="text-sm leading-6 text-slate-200">Tag não pode ser excluída, pois deixará cards órfãos.</p>
      <div class="mt-5 flex justify-end">
        <button type="button" id="btnConfirmTagDeletionBlockedModal" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-500">Entendi</button>
      </div>
    </div>
  </div>

  <div id="createTagModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4">
    <div id="createTagModalContent" class="w-[92%] max-w-lg rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <form id="createTagForm" class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">Criar nova tag</h3>
          <button id="btnCloseCreateTagModal" type="button" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <input id="createTagNameInput" type="text" maxlength="80" placeholder="Nome" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="createTagNamePtBrInput" type="text" maxlength="80" placeholder="Nome pt-br" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="createTagNumeroInput" type="number" placeholder="Número" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">

        <div class="flex justify-end gap-2 pt-2">
          <button id="btnCancelCreateTag" type="button" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
          <button id="btnTranslateCreateTagGemini" type="button" class="px-4 py-2 rounded-lg border border-amber-300/40 text-amber-300 hover:bg-amber-300/10"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Gemini</button>
          <button id="btnSubmitCreateTag" type="submit" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500">Criar tag</button>
        </div>
      </form>
    </div>
  </div>


  <div id="createRelationTypeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4">

          <button id="btnCloseCreateRelationTypeModal" type="button" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <input id="createRelationTypeNameInput" type="text" required maxlength="120" placeholder="Nome do tipo de relação" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <select id="createRelationTypeHierarchyInput" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
          <option value="0">0 - Conjunto simples</option>
          <option value="1">1 - Árvore parental</option>
          <option value="2">2 - Sequência</option>
          <option value="3">3 - Componente conexo</option>
        </select>

          <button id="btnCancelCreateRelationType" type="button" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
          <button id="btnSubmitCreateRelationType" type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500">Criar relação</button>
        </div>
      </form>
    </div>
  </div>
