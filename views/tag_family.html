<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Família da Tag</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="min-h-screen flex flex-col">
    <header class="relative flex items-center justify-center border-b border-slate-700 px-4 py-7 bg-slate-950">
      <div class="absolute left-4 flex items-center gap-2">
        <button type="button" onclick="goBackToMarkedRoute()" class="h-9 rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800"><i class="fa-solid fa-left-long"></i></button>
        <button id="orphanTagsBtn" type="button" onclick="goToOrphanTags()" class="h-9 px-3 rounded-lg border border-red-500 bg-red-600/80 text-sm text-white hover:bg-red-500 transition-colors" title="Tags sem vínculos">0</button>
        <button id="btnShowLayerGroupMessage" type="button" class="h-9 w-9 rounded-lg border border-sky-500/50 text-sky-300 hover:text-sky-200 hover:bg-sky-500/20 transition-colors text-sm font-medium" title="Mostrar mensagem no console" aria-label="Mostrar mensagem no console"><i class="fa-solid fa-book"></i></button>
        <button id="btnShowFavoritos" type="button" class="h-9 w-9 rounded-lg border border-sky-500/50 text-sky-300 hover:text-sky-200 hover:bg-sky-500/20 transition-colors text-sm font-medium" title="Mostrar favoritos" aria-label="Mostrar mensagem no console"><i class="fa-solid fa-face-smile"></i></button>
      </div>
      
      <h1 class="text-2xl font-semibold text-center"></h1>
      <div class="absolute right-4 flex items-center gap-2">
        <button id="btnOpenTagFiltering" type="button" class="h-9 px-3 rounded-lg border border-sky-500/50 text-sky-300 hover:text-sky-200 hover:bg-sky-500/20 transition-colors text-sm font-medium" title="Abrir filtro de tags">Filtro</button>
        <button id="btnOpenCreateTagModal" type="button" class="h-9 w-9 rounded-lg border border-violet-500/50 text-violet-300 hover:text-violet-200 hover:bg-violet-500/20 transition-colors text-lg font-semibold" title="Criar nova tag"><i class="fa-solid fa-plus"></i></button>
        <button id="btnOpenCreateRelationTypeModal" type="button" class="h-9 w-9 rounded-lg border border-emerald-500/50 text-emerald-300 hover:text-emerald-200 hover:bg-emerald-500/20 transition-colors text-lg font-semibold" title="Criar novo tipo de relação"><i class="fa-solid fa-folder-plus"></i></button>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 max-w-4xl mx-auto w-full">
        <h3 id="tagFamilyMainTitle" class="-translate-y-3 text-1xl font-semibold text-center">Tag</h3>
        <section id="subjectCardsSection" class="mb-6 rounded-xl border border-slate-700 bg-slate-950/70 p-4">
          <div class="flex items-center justify-between gap-3 mb-3">
            <div>
              <h2 class="text-lg font-semibold text-slate-100">Cards vinculados</h2>
              <p class="text-xs text-slate-400">Cards relacionados a esta tag pela tabela subjects_links.</p>
            </div>
            <span id="subjectCardsCount" class="shrink-0 rounded-full border border-emerald-500/40 bg-emerald-500/10 px-3 py-1 text-xs text-emerald-200">0 card(s)</span>
          </div>
          <div id="subjectCardsList" class="space-y-3">
            <p class="text-sm text-slate-400">Carregando cards...</p>
          </div>
        </section>
        <div id="relationTypeSections" class="space-y-4"></div>
    </main>

    <footer class="border-t border-slate-700 px-4 py-4 bg-slate-950">
      <div class="max-w-4xl mx-auto space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-sm text-slate-300">Modo de vínculo <span id="selectedRelationTypeLabel" class="text-violet-300"></span></label>
          <button id="relationModeSwitch" type="button" class="px-3 py-1.5 rounded-lg border border-slate-600 text-sm">Adicionando filhas</button>
        </div>
        <div id="footerTagSelector" class="flex flex-wrap gap-2 bg-slate-900/70 border border-slate-700 rounded-lg p-3 min-h-[48px]"></div>
        <input id="footerTagSearch" type="text" placeholder="Pesquisar tag por nome..." class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2 px-3 text-sm text-slate-100">
      </div>
    </footer>
  </div>
<script>
const params = new URLSearchParams(window.location.search);
const state = { tagId: Number(params.get('tag_id') || 0), tagName: (params.get('tag_name') || '').trim(), mode: 'child', selectedRelationType: null, tags: [], family: {mothers:[], children:[]}, relationTypes: [], orphanTagsCount: 0, subjectCards: [] };
const title = document.getElementById('tagFamilyMainTitle');
title.textContent = state.tagName || 'Tag';

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function getTagLabel(tag = {}, numeroPtBrCounts = null){
  const numero = tag?.numero;
  const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
  const name = String(tag?.name || '').trim();
  const namePtBr = String(tag?.name_pt_br || '').trim();
  if (hasNumero){
    const numeroKey = String(numero).trim();
    const qtdTraducoes = numeroPtBrCounts?.get(numeroKey) || 0;
    if (qtdTraducoes > 1 && namePtBr) return `${numeroKey} (${namePtBr})`;
    return numeroKey;
  }
  return namePtBr ? `${name} (${namePtBr})` : name;
}
function getSubjectsCount(tag = {}){
  const value = Number(tag?.subjects_count ?? 0);
  return Number.isFinite(value) && value >= 0 ? value : 0;
}
function renderTagButtonContent(tag = {}, numeroPtBrCounts = null){
  return `${esc(getTagLabel(tag, numeroPtBrCounts))} <span class="text-[10px] text-slate-400">(${getSubjectsCount(tag)})</span>`;
}

function buildNumeroPtBrCounts(tags = []){
  const counts = new Map();
  tags.forEach((tag)=>{
    const numero = tag?.numero;
    const numeroKey = numero !== null && numero !== undefined ? String(numero).trim() : '';
    const namePtBr = String(tag?.name_pt_br || '').trim();
    if (numeroKey && namePtBr) counts.set(numeroKey, (counts.get(numeroKey) || 0) + 1);
  });
  return counts;
}

function getMarkedBackRoute(){
  const urlParams=new URLSearchParams(window.location.search);
  const from=urlParams.get('from');
  return from?decodeURIComponent(from):'/views/flashcards.html';
}
function goBackToMarkedRoute(){
  if(window.history.length>1){window.history.back();return;}
  window.location.href=getMarkedBackRoute();
}
function showLayerGroupMessage(){
  const params=new URLSearchParams();
  if(state.tagId) params.set('tag_id', String(state.tagId));
  if(state.tagName) params.set('tag_name', state.tagName);
  params.set('from', encodeURIComponent(window.location.pathname+window.location.search));
  const q=params.toString();
  window.location.href=`/views/card_da_tag.html${q?`?${q}`:''}`;
}
function openTagFiltering(){
  const params=new URLSearchParams();
  if(state.tagId) params.set('tag_id', String(state.tagId));
  if(state.tagName) params.set('tag_name', state.tagName);
  params.set('from', encodeURIComponent(window.location.pathname+window.location.search));
  const q=params.toString();
  window.location.href=`/views/tag_filtering.html${q?`?${q}`:''}`;
}
function renderOrphanTagsButton(){
  const btn=document.getElementById('orphanTagsBtn');
  if(!btn) return;
  const count=Number(state.orphanTagsCount||0);
  btn.innerHTML = `<i class="fa-solid fa-magnifying-glass-chart"></i> ${String(count)}`;
  btn.title=`${count} tag(s) sem vínculos`;
}
function goToOrphanTags(){
  window.location.href='/views/tags_sem_vinculos.html';
}
async function api(action,payload={}){payload.action=action;const r=await fetch('/api/flashcards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||j.status!=='success')throw new Error(j.message||'Erro');return j;}

function getCardEditUrl(card = {}){
  const deckId = Number(card?.directory_id || 0);
  const cardId = Number(card?.id || 0);
  if(!deckId || !cardId) return '';
  const editParams = new URLSearchParams();
  editParams.set('id', String(deckId));
  editParams.set('edit_card_id', String(cardId));
  editParams.set('from', window.location.pathname + window.location.search);
  return `/ficha_do_card?${editParams.toString()}`;
}
function renderSubjectCards(){
  const list=document.getElementById('subjectCardsList');
  const count=document.getElementById('subjectCardsCount');
  const cards=Array.isArray(state.subjectCards)?state.subjectCards:[];
  if(count) count.textContent=`${cards.length} card(s)`;
  if(!list) return;
  if(!cards.length){
    list.innerHTML='<p class="text-sm text-slate-400">Nenhum card encontrado para esta tag em subjects_links.</p>';
    return;
  }
  list.innerHTML=cards.map((card)=>{
    const front=String(card.front||'').trim()||'(sem frente)';
    const back=String(card.back||'').trim()||'(sem verso)';
    const deckName=String(card.directory_name||'').trim();
    const editUrl=Number(card.can_edit||0)===1?getCardEditUrl(card):'';
    const imageFront=card.image_front?`<img src="${esc(card.image_front)}" alt="Imagem da frente" class="mt-2 max-h-32 rounded-lg border border-slate-700 object-contain">`:'';
    const imageBack=card.image_back?`<img src="${esc(card.image_back)}" alt="Imagem do verso" class="mt-2 max-h-32 rounded-lg border border-slate-700 object-contain">`:'';
    return `<article class="rounded-lg border border-slate-700 bg-slate-900/60 p-3">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="text-sm text-slate-100 whitespace-pre-wrap break-words">${esc(front)}</p>
          ${imageFront}
          <p class="mt-2 text-xs text-slate-400 whitespace-pre-wrap break-words">${esc(back)}</p>
          ${imageBack}
          ${deckName?`<p class="mt-2 text-[11px] text-slate-500">Deck: ${esc(deckName)}</p>`:''}
        </div>
        ${editUrl?`<a href="${esc(editUrl)}" class="shrink-0 rounded-lg border border-violet-500/50 px-2.5 py-1 text-xs text-violet-200 hover:bg-violet-500/20">Editar</a>`:''}
      </div>
    </article>`;
  }).join('');
}

function renderFooterTags(){
  document.getElementById('selectedRelationTypeLabel').textContent=`(${getRelationTypeLabel(state.selectedRelationType)})`;

  const q=(document.getElementById('footerTagSearch').value||'').toLowerCase().trim();
  const el=document.getElementById('footerTagSelector');
  const minSearchLength=2;
  const maxResults=200;

  if(q.length<minSearchLength){
    el.innerHTML=`<span class="text-xs text-slate-400">Digite pelo menos ${minSearchLength} caracteres para buscar tags.</span>`;
    return;
  }

  const matches=state.tags
    .filter((t)=>Number(t.id)!==state.tagId)
    .filter((t)=>String(t.name||'').toLowerCase().includes(q)||String(t.name_pt_br||'').toLowerCase().includes(q)||String(t.numero??'').toLowerCase().includes(q));

  if(!matches.length){
    el.innerHTML='<span class="text-xs text-slate-400">Nenhuma tag encontrada.</span>';
    return;
  }

  const filtered=matches.slice(0,maxResults);
  const numeroPtBrCounts = buildNumeroPtBrCounts(filtered);
  const hasMoreResults=matches.length>maxResults;
  const summary=hasMoreResults?`<div class="w-full text-[11px] text-amber-300 mb-2">Mostrando ${maxResults} de ${matches.length} tags. Refine a busca para ver menos resultados.</div>`:'';
  el.innerHTML=summary+filtered.map(t=>`<button type="button" data-id="${Number(t.id)}" class="px-2.5 py-1 rounded-full text-xs border bg-slate-800 text-slate-300 border-slate-600 hover:bg-slate-700">${renderTagButtonContent(t, numeroPtBrCounts)}</button>`).join('');
  el.querySelectorAll('button[data-id]').forEach((b)=>b.onclick=()=>addRelation(Number(b.dataset.id)));
}
function enforceSingleCreateTagCategorySelection(changedInput){
  if(!changedInput.checked) return;
  document.querySelectorAll('#createTagForm input[data-tag-category]').forEach((input)=>{if(input!==changedInput) input.checked=false;});
}
function resetCreateTagCategoryDefaults(){
  document.querySelectorAll('#createTagForm input[data-tag-category]').forEach((input)=>input.checked=false);
  const defaultInput=document.getElementById('createTagIsWordInput');
  if(defaultInput) defaultInput.checked=true;
}
function openCreateTagModal(){
  resetCreateTagCategoryDefaults();
  document.getElementById('createTagNameInput').value='';
  document.getElementById('createTagNamePtBrInput').value='';
  document.getElementById('createTagNumeroInput').value='';
  const m=document.getElementById('createTagModal');
  const c=document.getElementById('createTagModalContent');
  m.classList.remove('hidden');m.classList.add('flex');
  setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');document.getElementById('createTagNameInput').focus();},20);
}
function closeCreateTagModal(){
  const m=document.getElementById('createTagModal');
  const c=document.getElementById('createTagModalContent');
  m.classList.add('opacity-0');c.classList.add('scale-95');
  setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);
}
async function submitCreateTag(e){
  e.preventDefault();
  const btn=document.getElementById('btnSubmitCreateTag');
  btn.disabled=true;
  try{
    await api('create_tag',{
      name:document.getElementById('createTagNameInput').value.trim(),
      name_pt_br:document.getElementById('createTagNamePtBrInput').value.trim(),
      numero:document.getElementById('createTagNumeroInput').value.trim(),
      is_book:document.getElementById('createTagIsBookInput').checked?1:0,
      is_verb_tense:document.getElementById('createTagIsVerbTenseInput').checked?1:0,
      is_sentence_type:document.getElementById('createTagIsSentenceTypeInput').checked?1:0,
      is_lexical_chunk:document.getElementById('createTagIsLexicalChunkInput').checked?1:0,
      is_relation_type:document.getElementById('createTagIsRelationTypeInput').checked?1:0,
      is_word:document.getElementById('createTagIsWordInput').checked?1:0,
      is_month:document.getElementById('createTagIsMonthInput').checked?1:0,
      is_day:document.getElementById('createTagIsDayInput').checked?1:0,
      is_year:document.getElementById('createTagIsYearInput').checked?1:0
    });
    closeCreateTagModal();
    await load();
  }finally{btn.disabled=false;}
}
function openTagFamily(tag){
  const nextTagId=Number(tag?.id||0);
  if(!nextTagId) return;
  const nextTagName=String(tag?.name||'').trim();
  window.location.href=`/views/tag_family.html?tag_id=${encodeURIComponent(nextTagId)}&tag_name=${encodeURIComponent(nextTagName)}`;
}
function getRelationTypeLabel(type){
  const found=state.relationTypes.find((item)=>Number(item.id)===Number(type));
  return found?.nome || `Tipo de relação ${type}`;
}
function relationTypeUsesHierarchy(type){
  const found=state.relationTypes.find((item)=>Number(item.id)===Number(type));
  return Number(found?.hierarquia||0)===1;
}
function openCreateRelationTypeModal(){
  document.getElementById('createRelationTypeNameInput').value='';
  document.getElementById('createRelationTypeHierarchyInput').value='0';
  const m=document.getElementById('createRelationTypeModal');
  const c=document.getElementById('createRelationTypeModalContent');
  m.classList.remove('hidden');m.classList.add('flex');
  setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');document.getElementById('createRelationTypeNameInput').focus();},20);
}
function closeCreateRelationTypeModal(){
  const m=document.getElementById('createRelationTypeModal');
  const c=document.getElementById('createRelationTypeModalContent');
  m.classList.add('opacity-0');c.classList.add('scale-95');
  setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);
}
function getTagRelationType(tag={}){
  const candidates=[tag?.tipo_de_relacao,tag?.relation_type,tag?.relation_type_id,tag?.tipo_relacao];
  for(const value of candidates){
    const num=Number(value);
    if(Number.isInteger(num)) return num;
  }
  return 0;
}
function renderFamily(){
  const mk=(arr)=>{
    if(!arr.length) return '<span class="text-xs text-slate-400">Nenhuma</span>';
    const numeroPtBrCounts = buildNumeroPtBrCounts(arr);
    return arr.map(t=>`<button type="button" data-family-tag-id="${Number(t.id)}" data-relation-role="${t.__relationRole||'child'}" class="px-2 py-1 rounded-full text-xs border border-red-400/70 bg-red-500/10 text-red-200 hover:bg-red-500/20 transition-colors" title="Abrir família da tag">${renderTagButtonContent(t, numeroPtBrCounts)}</button>`).join('');
  };
  const familyTypes=[...new Set([...state.family.children,...state.family.mothers].map((tag)=>getTagRelationType(tag)))];
  const configuredTypes=state.relationTypes.map((item)=>Number(item.id));
  const types=[...new Set([...configuredTypes,...familyTypes])].sort((a,b)=>a-b);
  const container=document.getElementById('relationTypeSections');
  container.innerHTML=types.map((type)=>{
    const children=state.family.children.filter((tag)=>getTagRelationType(tag)===type).map((tag)=>({...tag,__relationRole:'child'}));
    const mothers=state.family.mothers.filter((tag)=>getTagRelationType(tag)===type).map((tag)=>({...tag,__relationRole:'mother'}));
    const isSelected=state.selectedRelationType===type;
    const selectedClass=isSelected?'ring-2 ring-violet-400 border-violet-500/80':'border-slate-700/80';
    if(!relationTypeUsesHierarchy(type)){
      const merged=[...children,...mothers];
      const uniqueMerged=[...new Map(merged.map((tag)=>[Number(tag.id),tag])).values()];
      return `<div data-relation-type="${type}" class="relation-type-card ${selectedClass} border rounded-lg p-3 bg-slate-900/40 cursor-pointer"><h3 class="text-sm font-semibold text-violet-200 mb-3">${esc(getRelationTypeLabel(type))}</h3><div><div class="flex flex-wrap gap-2">${mk(uniqueMerged)}</div></div></div>`;
    }
    return `<div data-relation-type="${type}" class="relation-type-card ${selectedClass} border rounded-lg p-3 bg-slate-900/40 cursor-pointer"><h3 class="text-sm font-semibold text-violet-200 mb-3">${esc(getRelationTypeLabel(type))}</h3><div class="grid md:grid-cols-2 gap-4"><div><p class="text-red-300 text-sm mb-2">Esta tag é mãe de:</p><div class="flex flex-wrap gap-2">${mk(children)}</div></div><div><p class="text-red-300 text-sm mb-2">Esta tag é filha de:</p><div class="flex flex-wrap gap-2">${mk(mothers)}</div></div></div></div>`;
  }).join('');
  document.querySelectorAll('.relation-type-card').forEach((card)=>{
    card.addEventListener('click',(ev)=>{
      if(ev.target.closest('[data-family-tag-id]')) return;
      state.selectedRelationType=Number(card.dataset.relationType||0);
      renderFamily();
    });
  });
  document.querySelectorAll('[data-family-tag-id]').forEach((el)=>{
    el.onclick=()=>{
      const targetId=Number(el.dataset.familyTagId);
      const relationRole=el.dataset.relationRole||'child';
      const tag=[...state.family.children,...state.family.mothers].find((item)=>Number(item.id)===targetId);
      openActionModal(tag||{id:targetId,name:el.textContent||''}, relationRole);
    };
  });
}
async function load(){
  if(!state.tagId) return;
  const [tags,family,relationTypes,orphanTags,subjectCards]=await Promise.all([api('list_tags'), api('get_tag_family',{tag_id:state.tagId}), api('list_relation_types'), api('list_orphan_user_tags'), api('list_subject_cards_by_tag',{tag_id:state.tagId})]);
  state.tags=tags.data||[];
  const subjectsCountByTagId = new Map(state.tags.map((tag)=>[Number(tag.id), getSubjectsCount(tag)]));
  state.family=family.data||{mothers:[],children:[]};
  state.family.children=(state.family.children||[]).map((tag)=>({...tag, subjects_count: subjectsCountByTagId.get(Number(tag.id)) || 0}));
  state.family.mothers=(state.family.mothers||[]).map((tag)=>({...tag, subjects_count: subjectsCountByTagId.get(Number(tag.id)) || 0}));
  state.relationTypes=(relationTypes.data||[]).map((item)=>({id:Number(item.id),nome:String(item.nome||''),hierarquia:Number(item.hierarquia||0)}));
  state.orphanTagsCount=Number(orphanTags.count||0);
  state.subjectCards=subjectCards.data||[];
  renderOrphanTagsButton();
  renderSubjectCards();
  if(state.selectedRelationType===null){
    state.selectedRelationType=state.relationTypes.length?Number(state.relationTypes[0].id):0;
  }
  const validTypes=new Set(state.relationTypes.map((item)=>Number(item.id)));
  if(!validTypes.has(Number(state.selectedRelationType)) && state.relationTypes.length){
    state.selectedRelationType=Number(state.relationTypes[0].id);
  }
  renderFamily(); renderFooterTags();
}
async function submitCreateRelationType(e){
  e.preventDefault();
  const btn=document.getElementById('btnSubmitCreateRelationType');
  btn.disabled=true;
  try{
    const res=await api('create_relation_type',{
      nome:document.getElementById('createRelationTypeNameInput').value.trim(),
      hierarquia:Number(document.getElementById('createRelationTypeHierarchyInput').value||0)
    });
    closeCreateRelationTypeModal();
    await load();
    if(res?.id) state.selectedRelationType=Number(res.id);
    renderFamily(); renderFooterTags();
  }finally{btn.disabled=false;}
}

async function addRelation(otherTagId){
  await api('add_tag_family_relation',{tag_id:state.tagId,other_tag_id:otherTagId,mode:state.mode,tipo_de_relacao:state.selectedRelationType});
  await load();
}
document.getElementById('footerTagSearch').addEventListener('input',renderFooterTags);

document.getElementById('relationModeSwitch').addEventListener('click',()=>{state.mode=state.mode==='child'?'mother':'child';document.getElementById('relationModeSwitch').textContent=state.mode==='child'?'Adicionando filhas':'Adicionando mães';});
const actionState={tag:null,relationType:null};
function openActionModal(tag, relationType){actionState.tag=tag;actionState.relationType=relationType;document.getElementById('tagActionTitle').textContent=`Ações: ${getTagLabel(tag) || 'Tag'}`;const m=document.getElementById('tagActionModal');const c=document.getElementById('tagActionModalContent');m.classList.remove('hidden');m.classList.add('flex');setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');},20);} 
function closeActionModal(){const m=document.getElementById('tagActionModal');const c=document.getElementById('tagActionModalContent');m.classList.add('opacity-0');c.classList.add('scale-95');setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);} 
async function removeRelation(){
  if(!actionState.tag) return;
  const relationTypeId=getTagRelationType(actionState.tag);
  const usesHierarchy=relationTypeUsesHierarchy(relationTypeId);
  if(usesHierarchy){
    await api('remove_tag_family_relation',{tag_id:state.tagId,other_tag_id:Number(actionState.tag.id),relation_type:actionState.relationType,tipo_de_relacao:relationTypeId});
  }else{
    const payload={tag_id:state.tagId,other_tag_id:Number(actionState.tag.id),tipo_de_relacao:relationTypeId};
    const attempts=[api('remove_tag_family_relation',{...payload,relation_type:'child'}),api('remove_tag_family_relation',{...payload,relation_type:'mother'})];
    const results=await Promise.allSettled(attempts);
    if(results.every((result)=>result.status==='rejected')){
      throw results[0].reason||new Error('Não foi possível remover o vínculo.');
    }
  }
  closeActionModal();
  await load();
}
function openEditTagModal(tag){if(!tag) return;document.getElementById('editTagIdInput').value=String(tag.id);document.getElementById('editTagNameInput').value=String(tag.name||'');document.getElementById('editTagNamePtBrInput').value=String(tag.name_pt_br||'');document.getElementById('editTagNumeroInput').value=(tag.numero??'');const m=document.getElementById('editTagModal');const c=document.getElementById('editTagModalContent');m.classList.remove('hidden');m.classList.add('flex');setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');},20);} 
function closeEditTagModal(){const m=document.getElementById('editTagModal');const c=document.getElementById('editTagModalContent');m.classList.add('opacity-0');c.classList.add('scale-95');setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},180);} 
async function submitEditTag(e){e.preventDefault();const id=Number(document.getElementById('editTagIdInput').value||0);const original=state.tags.find(t=>Number(t.id)===id)||{};await api('update_tag',{id,name:document.getElementById('editTagNameInput').value.trim(),name_pt_br:document.getElementById('editTagNamePtBrInput').value.trim(),numero:document.getElementById('editTagNumeroInput').value.trim(),is_book:Number(original.is_book||0),is_verb_tense:Number(original.is_verb_tense||0),is_sentence_type:Number(original.is_sentence_type||0),is_lexical_chunk:Number(original.is_lexical_chunk||0),is_relation_type:Number(original.is_relation_type||0),is_word:Number(original.is_word||0),is_month:Number(original.is_month||0),is_day:Number(original.is_day||0),is_year:Number(original.is_year||0)});closeEditTagModal();closeActionModal();await load();}
async function deleteTag(){if(!actionState.tag) return;await api('delete_tag',{id:Number(actionState.tag.id)});closeActionModal();await load();}
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btnOpenCreateTagModal').onclick=openCreateTagModal;
  document.getElementById('btnOpenCreateRelationTypeModal').onclick=openCreateRelationTypeModal;
  document.getElementById('btnOpenTagFiltering').onclick=openTagFiltering;
  document.getElementById('btnShowLayerGroupMessage').onclick=showLayerGroupMessage;
  document.getElementById('btnCancelCreateTag').onclick=closeCreateTagModal;
  document.getElementById('btnCloseCreateTagModal').onclick=closeCreateTagModal;
  document.getElementById('createTagForm').addEventListener('submit',submitCreateTag);
  document.getElementById('btnCancelCreateRelationType').onclick=closeCreateRelationTypeModal;
  document.getElementById('btnCloseCreateRelationTypeModal').onclick=closeCreateRelationTypeModal;
  document.getElementById('createRelationTypeForm').addEventListener('submit',submitCreateRelationType);
  document.querySelectorAll('#createTagForm input[data-tag-category]').forEach((input)=>input.addEventListener('change',()=>enforceSingleCreateTagCategorySelection(input)));
  document.getElementById('btnCloseActionModal').onclick=closeActionModal;
  document.getElementById('btnRemoveRelation').onclick=removeRelation;
  document.getElementById('btnViewFamily').onclick=()=>{const t=actionState.tag;closeActionModal();openTagFamily(t)};
  document.getElementById('btnEditTag').onclick=()=>openEditTagModal(actionState.tag);
  document.getElementById('btnDeleteTag').onclick=deleteTag;
  document.getElementById('btnCancelEditTag').onclick=closeEditTagModal;
  document.getElementById('editTagForm').addEventListener('submit',submitEditTag);
  load();
});
</script>
  <div id="tagActionModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200">
    <div id="tagActionModalContent" class="w-[92%] max-w-sm rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <h3 class="text-lg font-semibold mb-3" id="tagActionTitle">Ações da tag</h3>
      <div class="grid gap-2">
        <button type="button" id="btnRemoveRelation" class="w-full text-left px-3 py-2 rounded-lg border border-slate-600 hover:bg-slate-800">Remover da família</button>
        <button type="button" id="btnViewFamily" class="w-full text-left px-3 py-2 rounded-lg border border-slate-600 hover:bg-slate-800">Ver família</button>
        <button type="button" id="btnEditTag" class="w-full text-left px-3 py-2 rounded-lg border border-slate-600 hover:bg-slate-800">Editar</button>
        <button type="button" id="btnDeleteTag" class="w-full text-left px-3 py-2 rounded-lg border border-red-500/60 text-red-300 hover:bg-red-500/10">Excluir</button>
      </div>
      <button type="button" id="btnCloseActionModal" class="mt-3 w-full px-3 py-2 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800">Cancelar</button>
    </div>
  </div>

  <div id="editTagModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200">
    <div id="editTagModalContent" class="w-[92%] max-w-lg rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <h3 class="text-lg font-semibold mb-3">Editar tag</h3>
      <form id="editTagForm" class="space-y-3">
        <input id="editTagIdInput" type="hidden">
        <input id="editTagNameInput" type="text" required maxlength="80" placeholder="Nome" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="editTagNamePtBrInput" type="text" maxlength="80" placeholder="Nome pt-br" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="editTagNumeroInput" type="number" placeholder="Número" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnCancelEditTag" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
          <button type="submit" id="btnSubmitEditTag" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500">Salvar</button>
        </div>
      </form>
    </div>
  </div>
  <div id="createTagModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4">
    <div id="createTagModalContent" class="w-[92%] max-w-lg rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <form id="createTagForm" class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">Criar nova tag</h3>
          <button id="btnCloseCreateTagModal" type="button" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <input id="createTagNameInput" type="text" required maxlength="80" placeholder="Nome" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="createTagNamePtBrInput" type="text" maxlength="80" placeholder="Nome pt-br" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <input id="createTagNumeroInput" type="number" placeholder="Número" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <p class="text-xs text-amber-300">Selecione no máximo 1 categoria para a nova tag.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-300">
          <label class="inline-flex items-center gap-2"><input id="createTagIsBookInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Livro</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsVerbTenseInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Tempo Verbal</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsSentenceTypeInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Tipo Frasal</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsLexicalChunkInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Lexical Chunk</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsRelationTypeInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Tipo de Relação</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsWordInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Palavra</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsMonthInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Mês</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsDayInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Dia</span></label>
          <label class="inline-flex items-center gap-2"><input id="createTagIsYearInput" data-tag-category type="checkbox" class="h-4 w-4"><span>Ano</span></label>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button id="btnCancelCreateTag" type="button" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
          <button id="btnSubmitCreateTag" type="submit" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500">Criar tag</button>
        </div>
      </form>
    </div>
  </div>


  <div id="createRelationTypeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4">
    <div id="createRelationTypeModalContent" class="w-[92%] max-w-lg rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
      <form id="createRelationTypeForm" class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">Criar tipo de relação</h3>
          <button id="btnCloseCreateRelationTypeModal" type="button" class="text-slate-400 hover:text-white text-xl">&times;</button>
        </div>
        <input id="createRelationTypeNameInput" type="text" required maxlength="120" placeholder="Nome do tipo de relação" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
        <select id="createRelationTypeHierarchyInput" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3">
          <option value="0">0 - Conjunto simples</option>
          <option value="1">1 - Árvore parental</option>
          <option value="2">2 - Sequência</option>
          <option value="3">3 - Componente conexo</option>
        </select>
        <div class="flex justify-end gap-2 pt-2">
          <button id="btnCancelCreateRelationType" type="button" class="px-4 py-2 rounded-lg border border-slate-600">Cancelar</button>
          <button id="btnSubmitCreateRelationType" type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500">Criar relação</button>
        </div>
      </form>
    </div>
  </div>

</body>
