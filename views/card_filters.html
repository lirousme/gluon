                </article>`;
        }

        function renderEditTagForm(tag = {}) {
            return `
                <article class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4 shadow-xl shadow-black/20">
                    <form id="editTagForm" class="space-y-3">
                        <div class="flex items-center justify-between"><h3 class="text-lg font-semibold">Editar tag</h3><button id="btnCloseEditTagModal" type="button" class="text-slate-400 hover:text-white text-xl">&times;</button></div>
                        <input id="editTagIdInput" type="hidden" value="${escapeHtml(String(tag.id || ''))}">
                        <input id="editTagNameInput" type="text" maxlength="80" placeholder="Nome" value="${escapeHtml(String(tag.name || ''))}" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2">
                        <input id="editTagNamePtBrInput" type="text" maxlength="80" placeholder="Nome pt-br" value="${escapeHtml(String(tag.name_pt_br || ''))}" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2">
                        <input id="editTagNumeroInput" type="number" placeholder="Número" value="${escapeHtml(String(tag.numero ?? ''))}" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2">
                        <div class="flex justify-end gap-2 pt-2"><button id="btnCancelEditTag" type="button" class="rounded-lg border border-slate-600 px-4 py-2">Cancelar</button><button type="submit" class="rounded-lg bg-amber-600 px-4 py-2 hover:bg-amber-500">Salvar</button></div>
                    </form>
                </article>`;
        }

        function openCreateTagModal() {
            showTagFormSection(renderCreateTagForm(), 'createTagNameInput');
            document.getElementById('btnCancelCreateTag').addEventListener('click', () => loadPage(state.page));
            document.getElementById('btnCloseCreateTagModal').addEventListener('click', () => loadPage(state.page));
            document.getElementById('createTagForm').addEventListener('submit', submitCreateTag);
        }
        function openCreateRelationTypeModal() { document.getElementById('createRelationTypeNameInput').value = ''; document.getElementById('createRelationTypeHierarchyInput').value = '0'; showModal('createRelationTypeModal', 'createRelationTypeModalContent', 'createRelationTypeNameInput'); }
        function openEditCurrentTagModal() {
            const tag = getCurrentTag();
            if (!canEditTag(tag)) return;
            showTagFormSection(renderEditTagForm(tag), 'editTagNameInput');
            document.getElementById('btnCancelEditTag').addEventListener('click', () => loadPage(state.page));
            document.getElementById('btnCloseEditTagModal').addEventListener('click', () => loadPage(state.page));
            document.getElementById('editTagForm').addEventListener('submit', submitEditCurrentTag);
        }

        async function submitCreateTag(event) {
            event.preventDefault();
            const nameInput = document.getElementById('createTagNameInput');
            const namePtBrInput = document.getElementById('createTagNamePtBrInput');
            let namePtBr = namePtBrInput.value.trim();
            const nameFromEnglish = nameInput.value.trim();
            const name = nameFromEnglish || namePtBr;
            if (!name) { alert('Preencha o nome em inglês ou em pt-BR para criar a tag.'); return; }
            if (!nameFromEnglish) { nameInput.value = name; namePtBrInput.value = ''; namePtBr = ''; }
            const createResult = await api('create_tag', { name, name_pt_br: namePtBr, numero: document.getElementById('createTagNumeroInput').value.trim(), is_book: 0, is_verb_tense: 0, is_sentence_type: 0, is_lexical_chunk: 0, is_relation_type: 0, is_word: 1, is_month: 0, is_day: 0, is_year: 0 });
            const shouldPinTag = document.getElementById('createTagPinnedInput').checked;
            const createdTagId = Number(createResult.tag_id || 0);
            if (shouldPinTag && createdTagId > 0) {
                await api('toggle_saved_filter', { tag_id: createdTagId });
            }
            hideTagFormSection();
            await loadSavedFilters();
            await loadPage(1);
        }

        async function submitCreateRelationType(event) {
            event.preventDefault();
            await api('create_relation_type', { nome: document.getElementById('createRelationTypeNameInput').value.trim(), hierarquia: Number(document.getElementById('createRelationTypeHierarchyInput').value || 0) });
            closeModal('createRelationTypeModal', 'createRelationTypeModalContent');
            if (isAnyTagMode()) await loadPage(1);
        }

        async function submitEditCurrentTag(event) {
            event.preventDefault();
            const id = Number(document.getElementById('editTagIdInput').value || 0);
            const original = state.tags.find((tag) => Number(tag.id) === id) || {};
            if (!canEditTag(original)) return;
            const nameInput = document.getElementById('editTagNameInput');
            const namePtBrInput = document.getElementById('editTagNamePtBrInput');
            let namePtBr = namePtBrInput.value.trim();
            const nameFromEnglish = nameInput.value.trim();
            const name = nameFromEnglish || namePtBr;
            if (!name) { alert('Preencha o nome em inglês ou em pt-BR para editar a tag.'); return; }
            if (!nameFromEnglish) { nameInput.value = name; namePtBrInput.value = ''; namePtBr = ''; }
            await api('update_tag', { id, name, name_pt_br: namePtBr, numero: document.getElementById('editTagNumeroInput').value.trim(), is_book: Number(original.is_book || 0), is_verb_tense: Number(original.is_verb_tense || 0), is_sentence_type: Number(original.is_sentence_type || 0), is_lexical_chunk: Number(original.is_lexical_chunk || 0), is_relation_type: Number(original.is_relation_type || 0), is_word: Number(original.is_word || 0), is_month: Number(original.is_month || 0), is_day: Number(original.is_day || 0), is_year: Number(original.is_year || 0) });
            state.selectedTagLabels = [name];
            hideTagFormSection();
            await loadSavedFilters();
            await loadPage(1);
        }

        function buildTagFamilySectionHeader(type, children = []) {
            const relationType = getRelationTypeById(type);
            const isRemovalMode = state.removalRelationType === type;
            const isReorderMode = state.reorderRelationType === type;
            const canReorder = relationTypeUsesSequence(type);
            const actionsButton = canEditRelationType(relationType) ? `<button type="button" data-open-relation-type-actions="${type}" class="h-8 w-8 shrink-0 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white transition-colors" title="Editar ou excluir esta sessão" aria-label="Editar ou excluir esta sessão"><i class="fa-solid fa-ellipsis-vertical"></i></button>` : '';
            const reorderButton = canReorder ? `<button type="button" data-toggle-reorder-type="${type}" class="hidden md:inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border ${isReorderMode ? 'border-sky-300 bg-sky-500/20 text-sky-100' : 'border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white'} transition-colors" title="Reordenar tags desta sequência" aria-label="Reordenar tags desta sequência"><i class="fa-solid fa-arrow-up-wide-short"></i></button>` : '';
            const removalButton = `<button type="button" data-toggle-removal-type="${type}" class="h-8 w-8 shrink-0 rounded-lg border ${isRemovalMode ? 'border-amber-300 bg-amber-500/20 text-amber-100' : 'border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white'} transition-colors" title="Remover tags desta sessão" aria-label="Remover tags desta sessão"><i class="fa-solid fa-folder-minus"></i></button>`;
            const actionGroup = actionsButton || reorderButton || removalButton ? `<div class="flex shrink-0 items-center gap-2">${actionsButton}${reorderButton}${removalButton}</div>` : '';
            return `<div class="mb-3 flex items-start justify-between gap-3"><div><h3 class="text-sm font-semibold text-violet-200">${escapeHtml(getRelationTypeLabel(type))}</h3>${isRemovalMode ? '<p class="mt-1 text-xs text-amber-300">Clique em uma tag desta sessão para removê-la daqui.</p>' : ''}${isReorderMode ? '<p class="mt-1 hidden text-xs text-sky-300 md:block">Arraste as tags para ajustar a ordem desta sequência.</p>' : ''}</div>${actionGroup}</div>`;
        }

        function renderTagFamilySections() {
            const selectedLabel = getSelectedTagSummary();
            ensureSelectedRelationType();
            if (!state.selectedTagIds.length) {
                tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">Selecione uma tag fixada no menu esquerdo para ver suas famílias.</div>';
                return;
            }
            const familyTypes = [...new Set([...(state.tagFamily.children || []), ...(state.tagFamily.mothers || [])].map((tag) => getTagRelationType(tag)))].filter((type) => type > 0);
            const configuredTypes = state.relationTypes.map((item) => Number(item.id)).filter((id) => id > 0);
            const types = [...new Set([...configuredTypes, ...familyTypes])].sort((a, b) => a - b);
            if (!types.length) {
                tagFamilySections.innerHTML = `<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">Nenhuma sessão de família encontrada para ${escapeHtml(selectedLabel)}.</div>`;
                return;
            }
            tagFamilySections.innerHTML = `
                <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
                    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Famílias</p>
                    <h2 class="mt-1 text-lg font-bold text-white">${escapeHtml(selectedLabel)}</h2>
                </div>
                ${types.map((type) => {
                    const children = (state.tagFamily.children || []).filter((tag) => getTagRelationType(tag) === type);
                    const mothers = (state.tagFamily.mothers || []).filter((tag) => getTagRelationType(tag) === type);
                    const isSelected = Number(state.selectedRelationType) === Number(type);
                    const articleClass = `rounded-2xl border bg-slate-900/70 p-4 transition ${isSelected ? 'border-violet-400/80 ring-1 ring-violet-400/40' : 'border-slate-800 hover:border-violet-500/40'}`;
                    const isSequence = relationTypeUsesSequence(type);
                    const childListClass = isSequence ? `sequence-reorder-list ${state.reorderRelationType === type ? 'sequence-drag-active' : ''}` : '';
                    if (!relationTypeUsesHierarchy(type)) {
                        return `<article data-relation-type="${type}" class="${articleClass}">${buildTagFamilySectionHeader(type, children)}<div data-sequence-list="${type}" class="flex flex-wrap gap-2 ${childListClass}">${children.length ? children.map((tag) => renderFamilyTagChip(tag, type, 'child', buildNumeroPtBrCounts(children))).join('') : '<span class="text-xs text-slate-400">Nenhuma</span>'}</div></article>`;
                    }
                    return `<article data-relation-type="${type}" class="${articleClass}">${buildTagFamilySectionHeader(type, children)}<div class="grid gap-4 md:grid-cols-2"><div><p class="mb-2 text-sm text-red-300">Exemplos:</p><div class="flex flex-wrap gap-2">${children.length ? children.map((tag) => renderFamilyTagChip(tag, type, 'child', buildNumeroPtBrCounts(children))).join('') : '<span class="text-xs text-slate-400">Nenhuma</span>'}</div></div><div><p class="mb-2 text-sm text-red-300">O que &quot;${escapeHtml(selectedLabel)}&quot; é:</p><div class="flex flex-wrap gap-2">${mothers.length ? mothers.map((tag) => renderFamilyTagChip(tag, type, 'mother', buildNumeroPtBrCounts(mothers))).join('') : '<span class="text-xs text-slate-400">Nenhuma</span>'}</div></div></div></article>`;
                }).join('')}
            `;
            bindTagFamilySectionEvents();
        }

        function bindTagFamilySectionEvents() {
            tagFamilySections.querySelectorAll('[data-relation-type]').forEach((card) => card.addEventListener('click', (event) => {
                if (event.target.closest('button')) return;
                state.selectedRelationType = Number(card.dataset.relationType || 0);
                renderTagFamilySections();
                renderFooterTags();
            }));
            tagFamilySections.querySelectorAll('[data-toggle-removal-type]').forEach((button) => button.addEventListener('click', () => {
                const type = Number(button.dataset.toggleRemovalType) || 0;
                state.removalRelationType = state.removalRelationType === type ? null : type;
                if (state.removalRelationType === type) state.reorderRelationType = null;
                renderTagFamilySections();
            }));
            tagFamilySections.querySelectorAll('[data-toggle-reorder-type]').forEach((button) => button.addEventListener('click', () => {
                const type = Number(button.dataset.toggleReorderType) || 0;
                state.reorderRelationType = state.reorderRelationType === type ? null : type;
                if (state.reorderRelationType === type) state.removalRelationType = null;
                renderTagFamilySections();
            }));
            tagFamilySections.querySelectorAll('[data-open-relation-type-actions]').forEach((button) => button.addEventListener('click', () => openRelationTypeActionsModal(Number(button.dataset.openRelationTypeActions) || 0)));
            tagFamilySections.querySelectorAll('[data-sequence-list]').forEach((list) => {
                list.addEventListener('dragover', (event) => { if (state.reorderRelationType === Number(list.dataset.sequenceList || 0)) event.preventDefault(); });
            });
            tagFamilySections.querySelectorAll('[data-main-family-tag-id]').forEach((button) => {
                button.addEventListener('dragstart', (event) => {
                    const type = Number(button.closest('[data-relation-type]')?.dataset.relationType || 0);
                    if (state.reorderRelationType !== type) { event.preventDefault(); return; }
                    state.draggedSequenceTagId = Number(button.dataset.mainFamilyTagId) || 0;
                    button.classList.add('sequence-dragging');
                });
                button.addEventListener('dragend', () => { button.classList.remove('sequence-dragging'); state.draggedSequenceTagId = null; });
                button.addEventListener('dragover', (event) => {
                    const type = Number(button.closest('[data-relation-type]')?.dataset.relationType || 0);
                    if (state.reorderRelationType === type) event.preventDefault();
                });
                button.addEventListener('drop', async (event) => {
                    event.preventDefault();
                    const type = Number(button.closest('[data-relation-type]')?.dataset.relationType || 0);
                    if (state.reorderRelationType !== type) return;
                    const targetId = Number(button.dataset.mainFamilyTagId) || 0;
                    await reorderSequenceTag(type, Number(state.draggedSequenceTagId), targetId);
                });
                button.addEventListener('click', async () => {
                    const tagId = Number(button.dataset.mainFamilyTagId) || 0;
                    const type = Number(button.closest('[data-relation-type]')?.dataset.relationType || 0);
                    if (!tagId) return;
                    const tag = [...(state.tagFamily.children || []), ...(state.tagFamily.mothers || [])].find((item) => Number(item.id) === tagId && getTagRelationType(item) === type) || {};
                    if (state.reorderRelationType === type) return;
                    if (state.removalRelationType === type) { await removeFamilyTag(tag, button.dataset.relationRole || 'child'); return; }
                    state.selectedTagIds = [tagId];
                    state.selectedTagLabels = [getTagLabel(tag)];
                    renderRightOptionsMenu();
                    await loadPage(1);
                    await loadSavedFilters();
                });
            });
        }

        async function removeFamilyTag(tag, relationRole) {
            if (!tag) return;
            const relationTypeId = getTagRelationType(tag);
            if (relationTypeUsesHierarchy(relationTypeId)) {
                await api('remove_tag_family_relation', { tag_id: state.selectedTagIds[0], other_tag_id: Number(tag.id), relation_type: relationRole, tipo_de_relacao: relationTypeId });
            } else {
                const payload = { tag_id: state.selectedTagIds[0], other_tag_id: Number(tag.id), tipo_de_relacao: relationTypeId };
                const results = await Promise.allSettled([api('remove_tag_family_relation', { ...payload, relation_type: 'child' }), api('remove_tag_family_relation', { ...payload, relation_type: 'mother' })]);
                if (results.every((result) => result.status === 'rejected')) throw results[0].reason || new Error('Não foi possível remover o vínculo.');
            }
            await loadPage(1);
        }

        async function reorderSequenceTag(relationType, draggedId, targetId) {
            if (!draggedId || !targetId || draggedId === targetId) return;
            const ordered = (state.tagFamily.children || []).filter((tag) => getTagRelationType(tag) === relationType).map((tag) => Number(tag.id));
            const from = ordered.indexOf(draggedId), to = ordered.indexOf(targetId);
            if (from < 0 || to < 0) return;
            ordered.splice(from, 1);
            ordered.splice(to, 0, draggedId);
            await api('reorder_tag_family_sequence', { tag_id: state.selectedTagIds[0], tipo_de_relacao: relationType, ordered_tag_ids: ordered });
            state.tagFamily.children.sort((a, b) => {
                const ia = ordered.indexOf(Number(a.id)), ib = ordered.indexOf(Number(b.id));
                if (getTagRelationType(a) !== relationType || getTagRelationType(b) !== relationType) return 0;
                return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib);
            });
            renderTagFamilySections();
        }

        function openRelationTypeActionsModal(type) {
            const relationType = getRelationTypeById(type);
            if (!canEditRelationType(relationType)) return;
            state.editingRelationTypeId = Number(relationType.id);
            document.getElementById('editRelationTypeNameInput').value = String(relationType.nome || relationType.name || '');
            showModal('editRelationTypeModal', 'editRelationTypeModalContent', 'editRelationTypeNameInput');
        }
        function closeRelationTypeActionsModal() { closeModal('editRelationTypeModal', 'editRelationTypeModalContent'); state.editingRelationTypeId = null; }
        async function submitEditRelationType(event) {
            event.preventDefault();
            const id = Number(state.editingRelationTypeId || 0);
            const relationType = getRelationTypeById(id);
            if (!canEditRelationType(relationType)) return;
            const name = document.getElementById('editRelationTypeNameInput').value.trim();
            if (!name) { alert('Preencha o nome da sessão.'); return; }
            await api('update_relation_type', { id, nome: name });
            closeRelationTypeActionsModal();
            await loadPage(1);
        }
        async function deleteEditingRelationType() {
            const id = Number(state.editingRelationTypeId || 0);
            const relationType = getRelationTypeById(id);
            if (!canEditRelationType(relationType)) return;
            if (!confirm('Excluir esta sessão também removerá os vínculos dela. Deseja continuar?')) return;
            await api('delete_relation_type', { id });
            if (state.removalRelationType === id) state.removalRelationType = null;
            if (state.reorderRelationType === id) state.reorderRelationType = null;
            closeRelationTypeActionsModal();
            await loadPage(1);
        }

        async function loadTagFamilyMode() {
            enforceSingleTagSelectionForTagMode();
            hideTagFormSection();
            statusBox.classList.add('hidden');
            cardsGrid.classList.add('hidden');
            cardsGrid.classList.remove('grid');
            tagFamilySections.classList.remove('hidden');
            window.history.replaceState(null, '', buildCardsRoute(state.page));
            updateFooter();
            if (!state.selectedTagIds.length) { renderTagFamilySections(); return; }
            tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300"><i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando famílias da tag...</div>';
            try {
                const [familyResult, relationTypesResult, tagsResult] = await Promise.all([
                    api('get_tag_family', { tag_id: state.selectedTagIds[0] }),
                    api('list_relation_types'),
                    api('list_tags')
                ]);
                state.tags = tagsResult.data || [];
                updateHeaderActions();
                state.tagFamily = familyResult.data || { mothers: [], children: [] };
                state.relationTypes = relationTypesResult.data || [];
                ensureSelectedRelationType();
                renderTagFamilySections();
                renderFooterTags();
            } catch (error) {
                tagFamilySections.innerHTML = `<div class="rounded-2xl border border-red-500/30 bg-red-950/20 p-6 text-center text-red-200">${escapeHtml(error.message || 'Erro ao carregar famílias da tag.')}</div>`;
            }
        }

        function updateFooter() {
            updateHeaderActions();
            const isGridMode = isTagsGridMode();
            const isSessionsMode = isTagSessionsMode();
            const isStoryMode = isInteractiveStoryMode();
            cardsPaginationFooter.classList.toggle('hidden', isSessionsMode || isStoryMode);
            cardsPaginationFooter.classList.toggle('flex', !isSessionsMode && !isStoryMode);
            tagRelationFooter.classList.toggle('hidden', !isSessionsMode);
            paginationInfo.textContent = `Página ${state.page} de ${state.totalPages} • ${state.totalCards} ${isGridMode ? 'tag(s)' : 'card(s)'} • 20 por página`;
            prevPageBtn.disabled = state.page <= 1;
            nextPageBtn.disabled = state.page >= state.totalPages;
            clearTagFilterBtn.classList.toggle('hidden', state.selectedTagIds.length === 0 && !state.withoutTagsOnly);
            renderLeftOthersMenu();
            if (isSessionsMode) renderFooterTags();
        }

        function ensureSelectedRelationType() {
            const validTypes = new Set(state.relationTypes.map((item) => Number(item.id)).filter((id) => id > 0));
            if (!validTypes.size) { state.selectedRelationType = null; return; }
            if (!validTypes.has(Number(state.selectedRelationType))) state.selectedRelationType = [...validTypes][0];
        }

        function renderFooterTags() {
            if (!footerTagSelector || !isTagSessionsMode()) return;
            ensureSelectedRelationType();
            const hideFooterTagSelector = () => {
                footerTagSelector.innerHTML = '';
                footerTagSelector.classList.add('hidden');
                footerTagSelector.classList.remove('flex');
            };
            const currentTagId = Number(state.selectedTagIds[0] || 0);
            if (!currentTagId || !state.selectedRelationType) { hideFooterTagSelector(); return; }
            const query = (footerTagSearch.value || '').toLowerCase().trim();
            if (query.length < 2) { hideFooterTagSelector(); return; }
            const matches = state.tags
                .filter((tag) => Number(tag.id) !== currentTagId)
                .filter((tag) => String(tag.name || '').toLowerCase().includes(query) || String(tag.name_pt_br || '').toLowerCase().includes(query) || String(tag.numero ?? '').toLowerCase().includes(query));
            if (!matches.length) { hideFooterTagSelector(); return; }
            const maxResults = 200;
            const filtered = matches.slice(0, maxResults);
            const numeroPtBrCounts = buildNumeroPtBrCounts(filtered);
            const summary = matches.length > maxResults ? `<div class="mb-2 w-full text-[11px] text-amber-300">Mostrando ${maxResults} de ${matches.length} tags. Refine a busca para ver menos resultados.</div>` : '';
            footerTagSelector.innerHTML = summary + filtered.map((tag) => `<button type="button" data-footer-add-tag-id="${Number(tag.id)}" class="rounded-full border px-2.5 py-1 text-xs transition-colors ${getTagOwnershipClass(tag)}">${renderTagButtonContent(tag, numeroPtBrCounts)}</button>`).join('');
            footerTagSelector.classList.remove('hidden');
            footerTagSelector.classList.add('flex');
            footerTagSelector.querySelectorAll('[data-footer-add-tag-id]').forEach((button) => button.addEventListener('click', () => addRelationToSelectedTag(Number(button.dataset.footerAddTagId || 0))));
        }

        async function addRelationToSelectedTag(otherTagId) {
            if (!otherTagId || !state.selectedTagIds[0] || !state.selectedRelationType) return;
            await api('add_tag_family_relation', { tag_id: state.selectedTagIds[0], other_tag_id: otherTagId, mode: 'child', tipo_de_relacao: state.selectedRelationType });
            footerTagSearch.value = '';
            await loadPage(1);
        }


        function renderGraphTags(tags = []) {
            const numeroPtBrCounts = buildNumeroPtBrCounts(tags);
            const sortLabel = state.tagSortDirection === 'desc' ? 'Mais para Menos' : 'Menos para Mais';
            tagFamilySections.innerHTML = `
                <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
                    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Tags</p>
                            <h2 class="mt-1 text-lg font-bold text-white">Ordenação por relações com cards filtrados</h2>
                            <p class="mt-1 text-xs text-slate-400">Respeita os filtros intencionais e semânticos selecionados.</p>
                        </div>
                        <button id="toggleTagSortDirectionBtn" type="button" class="rounded-xl border border-sky-500/40 bg-sky-500/10 px-4 py-2 text-sm font-semibold text-sky-100 transition hover:bg-sky-500/20">
                            <i class="fa-solid fa-arrow-down-wide-short mr-2"></i>${sortLabel}
                        </button>
                    </div>
                </div>
                <div id="gridDeTags" class="grid grid-cols-1 gap-3 md:grid-cols-2">
                    ${tags.map((tag) => {
                        const count = Number(tag.related_cards_count ?? tag.subjects_count ?? 0);
                        return `<button id="itemDoGridDeTags-${Number(tag.id)}" type="button" data-graph-tag-id="${Number(tag.id)}" class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4 text-left transition hover:border-violet-400/70 hover:bg-slate-900">
                            <div class="flex items-start justify-between gap-3">
                                <span class="min-w-0 font-semibold text-slate-100">${renderTagButtonContent(tag, numeroPtBrCounts)}</span>
                                <span class="shrink-0 rounded-full border border-cyan-500/40 bg-cyan-500/10 px-2 py-0.5 text-xs font-semibold text-cyan-100">${count}</span>
                            </div>
                            <p class="mt-2 text-xs text-slate-500">card(s) relacionados pelos filtros atuais</p>
                        </button>`;
                    }).join('')}
                </div>
            `;
            tagFamilySections.querySelector('#toggleTagSortDirectionBtn')?.addEventListener('click', () => {
                state.tagSortDirection = state.tagSortDirection === 'desc' ? 'asc' : 'desc';
                loadPage(1);
            });
            tagFamilySections.querySelectorAll('[data-graph-tag-id]').forEach((button) => button.addEventListener('click', () => {
                const tagId = Number(button.dataset.graphTagId || 0);
                const tag = tags.find((item) => Number(item.id) === tagId) || {};
                toggleTagFilter(tagId, tag);
                renderRightOptionsMenu();
                loadPage(1);
                loadSavedFilters();
            }));
        }


        function getStoryScenesFromForm() {
            return Array.from(tagFamilySections.querySelectorAll('[data-story-scene]')).map((sceneEl, index) => ({
                id: (sceneEl.querySelector('[data-scene-id]')?.value || `scene_${index + 1}`).trim().replace(/[^a-zA-Z0-9_-]/g, '_') || `scene_${index + 1}`,
                title: (sceneEl.querySelector('[data-scene-title]')?.value || '').trim(),
                text: (sceneEl.querySelector('[data-scene-text]')?.value || '').trim(),
                options: Array.from(sceneEl.querySelectorAll('[data-story-option]')).map((optionEl) => ({
                    label: (optionEl.querySelector('[data-option-label]')?.value || '').trim(),
                    target: (optionEl.querySelector('[data-option-target]')?.value || '').trim()
                })).filter((option) => option.label)
            }));
        }

        function renderInteractiveStory(data = {}) {
            const superposition = data.superposition || { title: 'História em Superposição', premise: '', scenes: [] };
            const scenes = Array.isArray(superposition.scenes) && superposition.scenes.length ? superposition.scenes : [{ id: 'inicio', title: 'Início', text: '', options: [] }];
            const collapses = Array.isArray(data.collapses) ? data.collapses : [];
            const selectedTagId = Number(state.selectedTagIds[0] || 0);
            const selectedTag = selectedTagId ? (state.tags.find((tag) => Number(tag.id) === selectedTagId) || getCurrentTag()) : null;
            const currentCollapse = selectedTagId ? (collapses.find((item) => Number(item.tag_id) === selectedTagId || Number(item.tag?.id) === selectedTagId) || null) : null;
            const currentCollapsePath = Array.isArray(currentCollapse?.path) ? currentCollapse.path : [];
            const selectedTagLabel = selectedTag ? getTagLabel(selectedTag) : '';
            const renderTargetOptions = (selected = '') => `<option value="">Fim da história</option>${scenes.map((scene) => `<option value="${escapeHtml(scene.id)}" ${scene.id === selected ? 'selected' : ''}>${escapeHtml(scene.title || scene.id)}</option>`).join('')}`;
            const renderScene = (scene, index) => `
                <article data-story-scene class="rounded-xl border border-slate-700 bg-slate-950/50 p-3 space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2"><span class="text-xs font-semibold uppercase tracking-widest text-violet-300">Cena ${index + 1}</span><button type="button" data-remove-scene class="rounded-lg border border-red-500/50 px-2 py-1 text-xs text-red-200 hover:bg-red-500/10">Remover</button></div>
                    <div class="grid gap-2 md:grid-cols-2"><input data-scene-id value="${escapeHtml(scene.id || '')}" class="rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100" placeholder="id-da-cena"><input data-scene-title value="${escapeHtml(scene.title || '')}" class="rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100" placeholder="Título da cena"></div>
                    <textarea data-scene-text rows="5" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100" placeholder="Texto/enunciado desta cena...">${escapeHtml(scene.text || '')}</textarea>
                    <div data-story-options class="space-y-2">${(scene.options || []).map((option) => `<div data-story-option class="grid gap-2 md:grid-cols-[1fr_14rem_auto]"><input data-option-label value="${escapeHtml(option.label || '')}" class="rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100" placeholder="Opção escolhível"><select data-option-target class="rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100">${renderTargetOptions(option.target || '')}</select><button type="button" data-remove-option class="rounded-lg border border-red-500/50 px-3 py-2 text-red-200 hover:bg-red-500/10"><i class="fa-solid fa-trash"></i></button></div>`).join('')}</div>
                    <button type="button" data-add-option class="rounded-lg border border-violet-400/50 px-3 py-2 text-sm text-violet-100 hover:bg-violet-500/10"><i class="fa-solid fa-plus mr-2"></i>Adicionar opção</button>
                </article>`;
            tagFamilySections.innerHTML = `
                <div class="space-y-4">
                    <section class="rounded-2xl border border-violet-500/30 bg-violet-950/20 p-4">
                        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-violet-300">História em Superposição</p>
                        <h2 class="mt-1 text-lg font-bold text-white">Editor de cenas no estilo Twine</h2>
                        <p class="mt-1 text-xs text-slate-400">Cada cena tem um texto e opções que apontam para a próxima cena. A superposição salva todos os caminhos possíveis.</p>
                        <form id="interactiveStorySuperpositionForm" class="mt-4 space-y-3">
                            <input id="interactiveStoryTitle" type="text" maxlength="191" value="${escapeHtml(superposition.title || '')}" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100" placeholder="Título da história geral">
                            <textarea id="interactiveStoryPremise" rows="3" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100" placeholder="Premissa/regras gerais...">${escapeHtml(superposition.premise || '')}</textarea>
                            <div id="interactiveStoryScenes" class="space-y-3">${scenes.map(renderScene).join('')}</div>
                            <div class="flex flex-wrap gap-2"><button type="button" id="addInteractiveStoryScene" class="rounded-xl border border-violet-400/60 px-4 py-2 text-sm font-semibold text-violet-100 hover:bg-violet-500/10"><i class="fa-solid fa-plus mr-2"></i>Adicionar cena</button><button type="submit" class="rounded-xl bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-500"><i class="fa-solid fa-floppy-disk mr-2"></i>Salvar Superposição</button></div>
                        </form>
                    </section>
                    <section id="interactiveStoryCollapseSection" class="rounded-2xl border border-emerald-500/30 bg-emerald-950/20 p-4">
                        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-emerald-300">Montar História</p>
                        <h2 class="mt-1 text-lg font-bold text-white">História Colapsada da tag selecionada</h2>
                        <p class="mt-1 text-xs text-slate-400">Escolha uma tag no menu lateral esquerdo e use Montar História. Não há seletor aqui: a História Colapsada pertence sempre à tag selecionada.</p>
                        ${selectedTagId ? `<div class="mt-4 grid gap-2 md:grid-cols-[1fr_auto]"><div class="rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3 py-2 text-sm text-emerald-100"><span class="text-xs uppercase tracking-widest text-emerald-300">Tag vinculada</span><div class="font-semibold">${escapeHtml(selectedTagLabel)}</div></div><button type="button" id="resetInteractiveStoryRun" class="rounded-lg border border-slate-500 px-3 py-2 text-sm text-slate-100 hover:bg-slate-700">Reiniciar</button></div><input id="interactiveStoryCollapseTitle" type="text" maxlength="191" value="${escapeHtml(currentCollapse?.title || `História de ${selectedTagLabel}`)}" class="mt-2 w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100" placeholder="Título da história colapsada"><div id="interactiveStoryPlayer" class="mt-4 rounded-xl border border-slate-700 bg-slate-950/60 p-4"></div>` : `<div class="mt-4 rounded-xl border border-amber-500/30 bg-amber-500/10 p-4 text-sm text-amber-100">Selecione uma tag no menu lateral esquerdo para montar a História Colapsada dela.</div>`}
                    </section>
                    <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
                        <h2 class="text-lg font-bold text-white">Histórias Colapsadas salvas</h2>
                        <div class="mt-3 space-y-3">${collapses.length ? collapses.map((item) => `<article class="rounded-xl border border-slate-700 bg-slate-950/50 p-3"><div class="flex flex-wrap items-center justify-between gap-2"><h3 class="font-semibold text-slate-100">${escapeHtml(item.title || 'Sem título')}</h3><span class="rounded-full border border-sky-500/40 bg-sky-500/10 px-2 py-0.5 text-xs text-sky-100">${escapeHtml(getTagLabel(item.tag || {}))}</span></div><p class="mt-2 whitespace-pre-wrap text-sm text-slate-300">${escapeHtml(item.collapsed_text || '')}</p><p class="mt-2 text-xs text-slate-500">Escolhas: ${escapeHtml((item.path || []).map((choice) => choice.label || choice).join(' → ') || 'nenhuma')}</p></article>`).join('') : '<p class="text-sm text-slate-400">Nenhuma História Colapsada salva ainda.</p>'}</div>
                    </section>
                </div>`;
            const lastSavedChoice = currentCollapsePath[currentCollapsePath.length - 1] || null;
            const savedTarget = lastSavedChoice?.target && scenes.some((scene) => scene.id === lastSavedChoice.target) ? lastSavedChoice.target : '';
            const playerState = { sceneId: savedTarget || scenes[0]?.id || 'inicio', path: [...currentCollapsePath] };
            const sceneById = () => new Map(scenes.map((scene) => [scene.id, scene]));
            const renderPlayer = () => {
                const scene = sceneById().get(playerState.sceneId);
                const player = tagFamilySections.querySelector('#interactiveStoryPlayer');
                if (!player) return;
                if (!scene) { player.innerHTML = '<p class="text-sm text-red-200">Cena não encontrada.</p>'; return; }
                player.innerHTML = `<h3 class="font-semibold text-white">${escapeHtml(scene.title || scene.id)}</h3><p class="mt-2 whitespace-pre-wrap text-sm text-slate-200">${escapeHtml(scene.text || '')}</p><div class="mt-4 flex flex-wrap gap-2">${(scene.options || []).length ? scene.options.map((option, idx) => `<button type="button" data-play-option="${idx}" class="rounded-xl border border-emerald-400/60 bg-emerald-500/10 px-3 py-2 text-sm text-emerald-100 hover:bg-emerald-500/20">${escapeHtml(option.label || '')}</button>`).join('') : '<span class="rounded-full border border-slate-600 px-3 py-1 text-xs text-slate-300">Fim da história</span>'}</div><p class="mt-3 text-xs text-slate-500">Escolhas: ${escapeHtml(playerState.path.map((choice) => choice.label).join(' → ') || 'nenhuma')}</p>`;
                player.querySelectorAll('[data-play-option]').forEach((button) => button.addEventListener('click', async () => {
                    const option = (scene.options || [])[Number(button.dataset.playOption || 0)];
                    if (!option) return;
                    playerState.path.push({ scene_id: scene.id, label: option.label, target: option.target || '' });
                    if (option.target && sceneById().has(option.target)) playerState.sceneId = option.target;
                    if (selectedTagId > 0) renderPlayer();
                    if (selectedTagId > 0) await api('save_interactive_story_collapse', { tag_id: selectedTagId, title: tagFamilySections.querySelector('#interactiveStoryCollapseTitle')?.value.trim() || '', path: playerState.path });
                }));
            };
            tagFamilySections.querySelector('#addInteractiveStoryScene')?.addEventListener('click', () => { tagFamilySections.querySelector('#interactiveStoryScenes')?.insertAdjacentHTML('beforeend', renderScene({ id: `scene_${Date.now()}`, title: '', text: '', options: [] }, tagFamilySections.querySelectorAll('[data-story-scene]').length)); });
            tagFamilySections.querySelector('#interactiveStoryScenes')?.addEventListener('click', (event) => {
                const target = event.target.closest('button');
                if (!target) return;
                if (target.matches('[data-remove-scene]')) target.closest('[data-story-scene]')?.remove();
                if (target.matches('[data-add-option]')) target.closest('[data-story-scene]')?.querySelector('[data-story-options]')?.insertAdjacentHTML('beforeend', `<div data-story-option class="grid gap-2 md:grid-cols-[1fr_14rem_auto]"><input data-option-label class="rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100" placeholder="Opção escolhível"><select data-option-target class="rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-slate-100">${renderTargetOptions('')}</select><button type="button" data-remove-option class="rounded-lg border border-red-500/50 px-3 py-2 text-red-200 hover:bg-red-500/10"><i class="fa-solid fa-trash"></i></button></div>`);
                if (target.matches('[data-remove-option]')) target.closest('[data-story-option]')?.remove();
            });
            tagFamilySections.querySelector('#resetInteractiveStoryRun')?.addEventListener('click', async () => {
                playerState.sceneId = scenes[0]?.id || 'inicio';
                playerState.path = [];
                renderPlayer();
                if (selectedTagId > 0) await api('save_interactive_story_collapse', { tag_id: selectedTagId, title: tagFamilySections.querySelector('#interactiveStoryCollapseTitle')?.value.trim() || '', path: [] });
            });
            tagFamilySections.querySelector('#interactiveStorySuperpositionForm')?.addEventListener('submit', async (event) => {
                event.preventDefault();
                await api('save_interactive_story', { title: interactiveStoryTitle.value.trim(), premise: interactiveStoryPremise.value.trim(), scenes: getStoryScenesFromForm() });
                await loadInteractiveStoryMode();
            });
            renderPlayer();
        }

        async function loadInteractiveStoryMode() {
            enforceSingleTagSelectionForTagMode();
            hideTagFormSection();
            cardsGrid.classList.add('hidden');
            cardsGrid.classList.remove('grid');
            statusBox.classList.add('hidden');
            tagFamilySections.classList.remove('hidden');
            window.history.replaceState(null, '', buildCardsRoute(state.page));
            updateFooter();
            tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300"><i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando história interativa...</div>';
            try {
                const [storyResult, tagsResult] = await Promise.all([api('get_interactive_story'), api('list_tags')]);
                state.tags = tagsResult.data || [];
                renderInteractiveStory(storyResult.data || {});
            } catch (error) {
                tagFamilySections.innerHTML = `<div class="rounded-2xl border border-red-500/30 bg-red-950/20 p-6 text-center text-red-200">${escapeHtml(error.message || 'Erro ao carregar história interativa.')}</div>`;
            }
        }

        async function loadTagsPage(page) {
            hideTagFormSection();
            cardsGrid.classList.add('hidden');
            cardsGrid.classList.remove('grid');
            tagFamilySections.classList.remove('hidden');
            statusBox.classList.add('hidden');
            tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300"><i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando tags...</div>';
            try {
                const params = new URLSearchParams({ action: 'list_graph_tags_for_user', page: String(page), sort: state.tagSortDirection });
                params.set('tag_link_types', state.selectedTagLinkTypes.join(','));
                params.set('info_types', state.selectedInfoTypes.join(','));
                const response = await fetch(`/api/flashcards?${params.toString()}`, { headers: { 'Accept': 'application/json' } });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível carregar as tags.');
                state.page = result.pagination.page;
                state.totalPages = result.pagination.total_pages;
                state.totalCards = result.pagination.total_tags;
                state.tags = result.data || [];
                window.history.replaceState(null, '', buildCardsRoute(state.page));
                updateFooter();
                if (!state.tags.length) {
                    tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">Nenhuma tag encontrada.</div>';
                    return;
                }
                renderGraphTags(state.tags);
            } catch (error) {
                tagFamilySections.innerHTML = `<div class="rounded-2xl border border-red-500/30 bg-red-950/20 p-6 text-center text-red-200">${escapeHtml(error.message || 'Erro ao carregar tags.')}</div>`;
            }
        }

        async function loadPage(page) {
            if (isTagsGridMode()) {
                await loadTagsPage(page);
                return;
            }
            if (isInteractiveStoryMode()) {
                await loadInteractiveStoryMode();
                return;
            }
            if (isTagSessionsMode()) {
                await loadTagFamilyMode();
                return;
            }
            hideTagFormSection();
            tagFamilySections.classList.add('hidden');
            statusBox.classList.remove('hidden');
            cardsGrid.classList.add('hidden');
            statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando cards...';
            try {
                const params = new URLSearchParams({ action: 'list_graph_cards_for_user', page: String(page) });
                if (state.withoutTagsOnly) params.set('without_tags', '1');
                if (state.longTextOnly) params.set('long_text', '1');
                if (state.selectedTagIds.length) params.set('tag_ids', state.selectedTagIds.join(','));
                params.set('tag_link_types', state.selectedTagLinkTypes.join(','));
                params.set('info_types', state.selectedInfoTypes.join(','));
                const response = await fetch(`/api/flashcards?${params.toString()}`, { headers: { 'Accept': 'application/json' } });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível carregar os cards.');

                state.page = result.pagination.page;
                state.totalPages = result.pagination.total_pages;
                state.totalCards = result.pagination.total_cards;
                window.history.replaceState(null, '', buildCardsRoute(state.page));
                updateFooter();

                if (!result.data.length) {
                    statusBox.textContent = 'Nenhum card encontrado em decks do modo grafo.';
                    return;
                }
                renderCards(result.data);
                statusBox.classList.add('hidden');
                cardsGrid.classList.remove('hidden');
                cardsGrid.classList.add('grid');
            } catch (error) {
                statusBox.textContent = error.message || 'Erro ao carregar cards.';
            }
        }


        async function openFilteredCreateCard() {
            const originalContent = createFilteredCardBtn.innerHTML;
            createFilteredCardBtn.disabled = true;
            createFilteredCardBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Abrindo...';
            try {
                const response = await fetch('/api/flashcards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ action: 'get_user_system_deck' })
                });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Deck de sistema não encontrado para criar o card.');
                const deckId = Number(result?.deck_id || result?.data?.deck_id || 0);
                if (!deckId) throw new Error('Deck de sistema não encontrado para criar o card.');

                const params = new URLSearchParams();
                params.set('id', String(deckId));
                if (state.selectedTagIds.length) {
                    params.set('tag_ids', state.selectedTagIds.join(','));
                    if (state.selectedTagLabels.length) params.set('tag_names', state.selectedTagLabels.join('|'));
                }
                params.set('from', window.location.pathname + window.location.search);
                window.location.href = `/ficha_do_card?${params.toString()}`;
            } catch (error) {
                statusBox.classList.remove('hidden');
                statusBox.textContent = error.message || 'Erro ao abrir a ficha do card.';
                createFilteredCardBtn.disabled = false;
                createFilteredCardBtn.innerHTML = originalContent;
            }
        }

        openLeftMenuBtn?.addEventListener('click', () => openMobileMenu('left'));
        openRightMenuBtn?.addEventListener('click', () => openMobileMenu('right'));
        openLeftMenuBtnTags?.addEventListener('click', () => openMobileMenu('left'));
        openRightMenuBtnTags?.addEventListener('click', () => openMobileMenu('right'));
        mobileDrawerBackdrop?.addEventListener('click', closeMobileMenus);
        document.querySelectorAll('[data-close-mobile-menu]').forEach((button) => button.addEventListener('click', closeMobileMenus));
        window.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeMobileMenus(); });
        window.addEventListener('resize', () => { if (window.matchMedia('(min-width: 1024px)').matches) closeMobileMenus(); });

        prevPageBtn.addEventListener('click', () => { if (state.page > 1) loadPage(state.page - 1); });
        nextPageBtn.addEventListener('click', () => { if (state.page < state.totalPages) loadPage(state.page + 1); });
        createFilteredCardBtn.addEventListener('click', openFilteredCreateCard);
        createTagBtn.addEventListener('click', openCreateTagModal);
        createRelationTypeBtn.addEventListener('click', openCreateRelationTypeModal);
        editCurrentTagBtn.addEventListener('click', openEditCurrentTagModal);
        selectedTagsVisibilityIndicator?.addEventListener('click', handleSelectedTagsHeaderAction);
        footerTagSearch?.addEventListener('input', renderFooterTags);
        leftTagSearchInput?.addEventListener('input', () => {
            state.leftTagSearchQuery = leftTagSearchInput.value || '';
            renderLeftTagSearchResults();
        });
        document.getElementById('btnCancelCreateRelationType').addEventListener('click', () => closeModal('createRelationTypeModal', 'createRelationTypeModalContent'));
        document.getElementById('btnCloseCreateRelationTypeModal').addEventListener('click', () => closeModal('createRelationTypeModal', 'createRelationTypeModalContent'));
        document.getElementById('createRelationTypeForm').addEventListener('submit', submitCreateRelationType);
        document.getElementById('btnCancelEditRelationType').addEventListener('click', closeRelationTypeActionsModal);
        document.getElementById('btnCloseEditRelationTypeModal').addEventListener('click', closeRelationTypeActionsModal);
        document.getElementById('btnDeleteRelationType').addEventListener('click', deleteEditingRelationType);
        document.getElementById('editRelationTypeForm').addEventListener('submit', submitEditRelationType);
        clearTagFilterBtn.addEventListener('click', () => {
            state.selectedTagIds = [];
            state.selectedTagLabels = [];
            state.withoutTagsOnly = false;
            renderRightOptionsMenu();
            loadPage(1);
            loadSavedFilters();
        });
        loadSessionUserId().then(() => updateHeaderActions());
        enforceSingleTagSelectionForTagMode();
        renderRightOptionsMenu();
        renderLeftOthersMenu();
        setupDesktopMenuResizing();
        loadSavedFilters();
        loadPage(state.page);
    </script>
</body>
</html>
