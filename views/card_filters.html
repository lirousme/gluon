<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Gluon - Cards do Grafo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gluon: {
                            dark: '#0f172a',
                            primary: '#3b82f6',
                            secondary: '#1e293b',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        };
    </script>
</head>
<body class="min-h-screen bg-gluon-dark text-slate-100">
    <div class="flex min-h-screen flex-col">
        <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/95 px-4 py-4 backdrop-blur">
            <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-[0.3em] text-violet-300">Gluon</p>
                    <h1 class="text-2xl font-bold text-white">Cards do modo grafo</h1>
                    <p id="pageSubtitle" class="mt-1 text-sm text-slate-400">Listando seus cards em decks configurados como grafo.</p>
                </div>
                <a href="/dashboard" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-violet-400 hover:text-white">
                    <i class="fa-solid fa-arrow-left"></i>
                    Dashboard
                </a>
            </div>
        </header>

        <div class="grid w-full flex-1 grid-cols-1 gap-4 py-6 lg:grid-cols-[16rem_minmax(0,1fr)_16rem]">
            <aside aria-label="Menu lateral esquerdo" class="mx-4 min-h-24 overflow-y-auto rounded-2xl border border-slate-800 bg-slate-900/50 p-4 lg:sticky lg:top-28 lg:ml-0 lg:mr-4 lg:h-[calc(100vh-12rem)]">
                <div class="mb-4 flex items-center justify-between gap-2">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Filtros</p>
                        <h2 class="mt-1 text-base font-bold text-white">Tags fixadas</h2>
                    </div>
                    <span id="savedFiltersCount" class="rounded-full border border-sky-500/40 bg-sky-500/20 px-2 py-0.5 text-xs font-semibold text-sky-100">0</span>
                </div>
                <div id="savedFiltersList" class="space-y-2 text-sm text-slate-300">
                    <p class="text-xs text-slate-500">Carregando tags fixadas...</p>
                </div>
                <button id="clearTagFilterBtn" type="button" class="mt-4 hidden w-full rounded-xl border border-slate-700 px-3 py-2 text-xs font-semibold text-slate-300 transition hover:border-violet-400 hover:text-white">
                    Limpar filtros de tags
                </button>
            </aside>

            <main class="min-w-0 px-4 lg:px-0">
                <div id="statusBox" class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">
                    <i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando cards...
                </div>
                <section id="cardsGrid" class="hidden grid-cols-1 gap-4 md:grid-cols-2"></section>
            </main>

            <aside aria-label="Menu lateral direito" class="mx-4 min-h-24 rounded-2xl border border-slate-800 bg-slate-900/50 p-4 lg:sticky lg:top-28 lg:ml-4 lg:mr-0 lg:h-[calc(100vh-12rem)]"></aside>
        </div>

        <footer class="sticky bottom-0 border-t border-slate-800 bg-slate-950/95 px-4 py-4 backdrop-blur">
            <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div id="paginationInfo" class="text-sm text-slate-400">Página 1 de 1</div>
                <div class="flex items-center gap-2">
                    <button id="prevPageBtn" type="button" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 disabled:cursor-not-allowed disabled:opacity-40 hover:not-disabled:border-violet-400">
                        <i class="fa-solid fa-chevron-left mr-2"></i>Anterior
                    </button>
                    <button id="nextPageBtn" type="button" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 disabled:cursor-not-allowed disabled:opacity-40 hover:not-disabled:border-violet-400">
                        Próxima<i class="fa-solid fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const state = {
            page: Number(urlParams.get('page')) || 1,
            totalPages: 1,
            totalCards: 0,
            selectedTagIds: parseSelectedTagIds(urlParams),
            selectedTagLabels: parseSelectedTagLabels(urlParams)
        };
        const cardsGrid = document.getElementById('cardsGrid');
        const statusBox = document.getElementById('statusBox');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const paginationInfo = document.getElementById('paginationInfo');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const clearTagFilterBtn = document.getElementById('clearTagFilterBtn');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
        }

        function getTagLabel(tag = {}) {
            const numero = tag?.numero;
            const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
            if (hasNumero) return String(numero).trim();

            const name = String(tag?.name || '').trim();
            const namePtBr = String(tag?.name_pt_br || '').trim();
            if (name && namePtBr && name.toLowerCase() !== namePtBr.toLowerCase()) return `${name} (${namePtBr})`;
            return name || namePtBr || 'Tag sem nome';
        }

        function parseSelectedTagIds(params) {
            const rawTagIds = params.get('tag_ids') || params.get('tag_id') || '';
            return rawTagIds.split(',').map((id) => Number(id)).filter((id, index, ids) => id > 0 && ids.indexOf(id) === index);
        }

        function parseSelectedTagLabels(params) {
            const rawTagNames = params.get('tag_names') || params.get('tag_name') || '';
            return rawTagNames.split('|').map((label) => label.trim()).filter(Boolean);
        }

        function normalizeSavedFilter(filter = {}) {
            return { ...filter, id: Number(filter.id_tag || filter.id || 0) };
        }

        function getSelectedTagSummary() {
            if (!state.selectedTagIds.length) return '';
            return state.selectedTagIds.map((id, index) => state.selectedTagLabels[index] || id).join(', ');
        }

        function buildTagRoute(path, tag = {}) {
            const params = new URLSearchParams();
            const tagId = Number(tag?.id || 0);
            if (tagId) params.set('tag_id', String(tagId));
            const tagName = getTagLabel(tag);
            if (tagName) params.set('tag_name', tagName);
            const query = params.toString();
            return `${path}${query ? `?${query}` : ''}`;
        }

        function buildCardsRoute(page = state.page) {
            const params = new URLSearchParams();
            params.set('page', String(page));
            if (state.selectedTagIds.length) {
                params.set('tag_ids', state.selectedTagIds.join(','));
                if (state.selectedTagLabels.length) params.set('tag_names', state.selectedTagLabels.join('|'));
            }
            return `/card_filters?${params.toString()}`;
        }

        function renderSavedFilters(filters) {
            const savedFiltersList = document.getElementById('savedFiltersList');
            const savedFiltersCount = document.getElementById('savedFiltersCount');
            savedFiltersCount.textContent = String(filters.length);

            if (!filters.length) {
                savedFiltersList.innerHTML = '<p class="text-xs text-slate-500">Nenhuma tag fixada para o usuário atual.</p>';
                return;
            }

            savedFiltersList.innerHTML = filters.map((tag, index) => {
                const label = getTagLabel(tag);
                const isActive = state.selectedTagIds.includes(Number(tag.id));
                return `
                    <article class="rounded-xl border ${isActive ? 'border-violet-400/80 bg-violet-950/40' : 'border-sky-500/20 bg-sky-950/20'} p-3 transition hover:border-sky-400/60 hover:bg-sky-950/40">
                        <button type="button" data-saved-filter-index="${index}" class="w-full text-left text-sm font-semibold ${isActive ? 'text-violet-100' : 'text-slate-100'} transition hover:text-sky-100">
                            ${escapeHtml(label)}
                        </button>
                    </article>
                `;
            }).join('');

            savedFiltersList.querySelectorAll('[data-saved-filter-index]').forEach((button) => {
                button.addEventListener('click', () => {
                    const tag = filters[Number(button.dataset.savedFilterIndex)] || {};
                    const tagId = Number(tag.id) || 0;
                    if (!tagId) return;
                    const existingIndex = state.selectedTagIds.indexOf(tagId);
                    if (existingIndex >= 0) {
                        state.selectedTagIds.splice(existingIndex, 1);
                        state.selectedTagLabels.splice(existingIndex, 1);
                    } else {
                        state.selectedTagIds.push(tagId);
                        state.selectedTagLabels.push(getTagLabel(tag));
                    }
                    loadPage(1);
                    renderSavedFilters(filters);
                });
            });
        }

        async function loadSavedFilters() {
            const savedFiltersList = document.getElementById('savedFiltersList');
            const savedFiltersCount = document.getElementById('savedFiltersCount');
            try {
                const response = await fetch('/api/flashcards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ action: 'list_saved_filters' })
                });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível carregar as tags fixadas.');
                renderSavedFilters((result.data || []).map(normalizeSavedFilter).filter((tag) => Number(tag.id) > 0));
            } catch (error) {
                savedFiltersCount.textContent = '0';
                savedFiltersList.innerHTML = `<p class="text-xs text-red-300">${escapeHtml(error.message || 'Erro ao carregar tags fixadas.')}</p>`;
            }
        }

        function renderImage(src, label) {
            if (!src) return '';
            return `<img src="${escapeHtml(src)}" alt="${escapeHtml(label)}" class="mt-3 max-h-52 w-full rounded-xl border border-slate-700 object-contain bg-slate-950/60">`;
        }

        function renderCards(cards) {
            cardsGrid.innerHTML = cards.map((card) => `
                <article class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/80 shadow-xl shadow-black/20">
                    <div class="flex items-center justify-between border-b border-slate-800 px-4 py-3 text-xs text-slate-400">
                        <span class="font-semibold text-violet-200">#${card.id}</span>
                        <span class="truncate pl-3">${escapeHtml(card.directory_name || 'Deck grafo')}</span>
                    </div>
                    <div class="grid gap-px bg-slate-800 md:grid-cols-2">
                        <div class="bg-slate-900 p-4">
                            <div class="mb-2 text-xs font-bold uppercase tracking-wider text-slate-500">Frente</div>
                            <div class="whitespace-pre-wrap break-words text-sm leading-6 text-slate-100">${escapeHtml(card.front || '—')}</div>
                            ${renderImage(card.image_front, 'Imagem da frente')}
                        </div>
                        <div class="bg-slate-900 p-4">
                            <div class="mb-2 text-xs font-bold uppercase tracking-wider text-slate-500">Verso</div>
                            <div class="whitespace-pre-wrap break-words text-sm leading-6 text-slate-100">${escapeHtml(card.back || '—')}</div>
                            ${renderImage(card.image_back, 'Imagem do verso')}
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 px-4 py-3 text-xs text-slate-400">
                        <span class="rounded-full bg-slate-800 px-2.5 py-1">Score: ${card.score}</span>
                        <span class="rounded-full bg-slate-800 px-2.5 py-1">Áudio frente: ${card.has_audio_front ? 'sim' : 'não'}</span>
                        <span class="rounded-full bg-slate-800 px-2.5 py-1">Áudio verso: ${card.has_audio_back ? 'sim' : 'não'}</span>
                    </div>
                </article>
            `).join('');
        }

        function updateFooter() {
            paginationInfo.textContent = `Página ${state.page} de ${state.totalPages} • ${state.totalCards} card(s) • 20 por página`;
            pageSubtitle.textContent = state.selectedTagIds.length
                ? `${state.totalCards} card(s) encontrados com ${state.selectedTagIds.length === 1 ? 'a tag' : 'as tags'} "${getSelectedTagSummary()}" em seus decks do modo grafo.`
                : `${state.totalCards} card(s) encontrados em seus decks do modo grafo.`;
            prevPageBtn.disabled = state.page <= 1;
            nextPageBtn.disabled = state.page >= state.totalPages;
            clearTagFilterBtn.classList.toggle('hidden', state.selectedTagIds.length === 0);
        }

        async function loadPage(page) {
            statusBox.classList.remove('hidden');
            cardsGrid.classList.add('hidden');
            statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando cards...';
            try {
                const params = new URLSearchParams({ action: 'list_graph_cards_for_user', page: String(page) });
                if (state.selectedTagIds.length) params.set('tag_ids', state.selectedTagIds.join(','));
                const response = await fetch(`/api/flashcards?${params.toString()}`, { headers: { 'Accept': 'application/json' } });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível carregar os cards.');

                state.page = result.pagination.page;
                state.totalPages = result.pagination.total_pages;
                state.totalCards = result.pagination.total_cards;
                window.history.replaceState(null, '', buildCardsRoute(state.page));
                updateFooter();

                if (!result.data.length) {
                    statusBox.textContent = 'Nenhum card encontrado em decks do modo grafo.';
                    return;
                }
                renderCards(result.data);
                statusBox.classList.add('hidden');
                cardsGrid.classList.remove('hidden');
                cardsGrid.classList.add('grid');
            } catch (error) {
                statusBox.textContent = error.message || 'Erro ao carregar cards.';
            }
        }

        prevPageBtn.addEventListener('click', () => { if (state.page > 1) loadPage(state.page - 1); });
        nextPageBtn.addEventListener('click', () => { if (state.page < state.totalPages) loadPage(state.page + 1); });
        clearTagFilterBtn.addEventListener('click', () => {
            state.selectedTagIds = [];
            state.selectedTagLabels = [];
            loadPage(1);
            loadSavedFilters();
        });
        loadSavedFilters();
        loadPage(state.page);
    </script>
</body>
</html>
