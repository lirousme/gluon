<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Gluon - Cards do Grafo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gluon: {
                            dark: '#0f172a',
                            primary: '#3b82f6',
                            secondary: '#1e293b',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        };
    </script>
</head>
<body class="min-h-screen bg-gluon-dark text-slate-100">
    <div class="flex min-h-screen flex-col">
        <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/95 px-4 py-4 backdrop-blur">
            <div class="flex w-full items-center justify-between gap-3">
                <a href="/dashboard" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-violet-400 hover:text-white">
                    <i class="fa-solid fa-arrow-left"></i>
                    Dashboard
                </a>
                <button id="createFilteredCardBtn" type="button" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-violet-400 hover:text-white">
                    <i class="fa-solid fa-plus"></i>
                    Novo card
                </button>
            </div>
        </header>

        <div class="grid w-full flex-1 grid-cols-1 gap-4 py-6 lg:grid-cols-[16rem_minmax(0,1fr)_16rem]">
            <aside aria-label="Menu lateral esquerdo" class="mx-4 min-h-24 overflow-y-auto rounded-2xl border border-slate-800 bg-slate-900/50 p-4 lg:sticky lg:top-28 lg:ml-0 lg:mr-4 lg:h-[calc(100vh-12rem)]">
                <div class="mb-4 flex items-center justify-between gap-2">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Filtros</p>
                        <h2 class="mt-1 text-base font-bold text-white">Tags fixadas</h2>
                    </div>
                    <span id="savedFiltersCount" class="rounded-full border border-sky-500/40 bg-sky-500/20 px-2 py-0.5 text-xs font-semibold text-sky-100">0</span>
                </div>
                <div id="savedFiltersList" class="space-y-2 text-sm text-slate-300">
                    <p class="text-xs text-slate-500">Carregando tags fixadas...</p>
                </div>
                <button id="clearTagFilterBtn" type="button" class="mt-4 hidden w-full rounded-xl border border-slate-700 px-3 py-2 text-xs font-semibold text-slate-300 transition hover:border-violet-400 hover:text-white">
                    Limpar filtros de tags
                </button>
            </aside>

            <main class="min-w-0 px-4 lg:px-0">
                <div id="statusBox" class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">
                    <i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando cards...
                </div>
                <section id="cardsGrid" class="hidden grid-cols-1 gap-4 md:grid-cols-2"></section>
                <section id="tagFamilySections" class="hidden space-y-4"></section>
            </main>

            <aside aria-label="Menu lateral direito" class="mx-4 min-h-24 rounded-2xl border border-slate-800 bg-slate-900/50 p-4 lg:sticky lg:top-28 lg:ml-4 lg:mr-0 lg:h-[calc(100vh-12rem)]">
                <div class="mb-4">
                    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Menu</p>
                    <h2 class="mt-1 text-base font-bold text-white">Ações rápidas</h2>
                </div>
                <div id="rightOptionsMenu" class="space-y-2 text-sm text-slate-300"></div>
            </aside>
        </div>

        <footer class="sticky bottom-0 border-t border-slate-800 bg-slate-950/95 px-4 py-4 backdrop-blur">
            <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div id="paginationInfo" class="text-sm text-slate-400">Página 1 de 1</div>
                <div class="flex items-center gap-2">
                    <button id="prevPageBtn" type="button" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 disabled:cursor-not-allowed disabled:opacity-40 hover:not-disabled:border-violet-400">
                        <i class="fa-solid fa-chevron-left mr-2"></i>Anterior
                    </button>
                    <button id="nextPageBtn" type="button" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 disabled:cursor-not-allowed disabled:opacity-40 hover:not-disabled:border-violet-400">
                        Próxima<i class="fa-solid fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const state = {
            page: Number(urlParams.get('page')) || 1,
            totalPages: 1,
            totalCards: 0,
            selectedTagIds: parseSelectedTagIds(urlParams),
            selectedTagLabels: parseSelectedTagLabels(urlParams),
            selectedTagLinkTypes: parseSelectedTagLinkTypes(urlParams),
            viewMode: parseViewMode(urlParams),
            expandedTagIds: new Set(),
            rightModeExpanded: false,
            rightOptionsExpanded: false,
            tagFamily: { mothers: [], children: [] },
            relationTypes: [],
            tagFamilyLoading: false
        };
        const cardsGrid = document.getElementById('cardsGrid');
        const tagFamilySections = document.getElementById('tagFamilySections');
        const statusBox = document.getElementById('statusBox');
        const createFilteredCardBtn = document.getElementById('createFilteredCardBtn');
        const paginationInfo = document.getElementById('paginationInfo');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const clearTagFilterBtn = document.getElementById('clearTagFilterBtn');
        const rightOptionsMenu = document.getElementById('rightOptionsMenu');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
        }

        function getTagLabel(tag = {}) {
            const numero = tag?.numero;
            const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
            if (hasNumero) return String(numero).trim();

            const name = String(tag?.name || '').trim();
            const namePtBr = String(tag?.name_pt_br || '').trim();
            if (name && namePtBr && name.toLowerCase() !== namePtBr.toLowerCase()) return `${name} (${namePtBr})`;
            return name || namePtBr || 'Tag sem nome';
        }

        function parseSelectedTagIds(params) {
            const rawTagIds = params.get('tag_ids') || params.get('tag_id') || '';
            return rawTagIds.split(',').map((id) => Number(id)).filter((id, index, ids) => id > 0 && ids.indexOf(id) === index);
        }

        function parseSelectedTagLabels(params) {
            const rawTagNames = params.get('tag_names') || params.get('tag_name') || '';
            return rawTagNames.split('|').map((label) => label.trim()).filter(Boolean);
        }

        function parseViewMode(params) {
            return params.get('mode') === 'tags' ? 'tags' : 'cards';
        }

        function parseSelectedTagLinkTypes(params) {
            const allowedTypes = ['subject', 'object', 'lexical_chunk'];
            if (!params.has('tag_link_types')) return [...allowedTypes];
            const rawTypes = params.get('tag_link_types') || '';
            const parsedTypes = rawTypes.split(',').map((type) => type.trim()).filter((type, index, types) => allowedTypes.includes(type) && types.indexOf(type) === index);
            return parsedTypes;
        }

        function normalizeSavedFilter(filter = {}) {
            return { ...filter, id: Number(filter.id_tag || filter.id || 0) };
        }

        function getSelectedTagSummary() {
            if (!state.selectedTagIds.length) return '';
            return state.selectedTagIds.map((id, index) => state.selectedTagLabels[index] || id).join(', ');
        }

        function buildTagRoute(path, tag = {}) {
            const params = new URLSearchParams();
            const tagId = Number(tag?.id || 0);
            if (tagId) params.set('tag_id', String(tagId));
            const tagName = getTagLabel(tag);
            if (tagName) params.set('tag_name', tagName);
            const query = params.toString();
            return `${path}${query ? `?${query}` : ''}`;
        }

        function buildCardsRoute(page = state.page) {
            const params = new URLSearchParams();
            params.set('page', String(page));
            if (state.viewMode !== 'cards') params.set('mode', state.viewMode);
            if (state.selectedTagIds.length) {
                params.set('tag_ids', state.selectedTagIds.join(','));
                if (state.selectedTagLabels.length) params.set('tag_names', state.selectedTagLabels.join('|'));
            }
            if (state.selectedTagLinkTypes.length !== 3) params.set('tag_link_types', state.selectedTagLinkTypes.join(','));
            return `/card_filters?${params.toString()}`;
        }

        function buildChildrenByMother(relations = []) {
            return relations.reduce((acc, relation) => {
                const motherId = Number(relation.id_tag_mother || 0);
                const childId = Number(relation.id_tag_child || 0);
                if (!motherId || !childId) return acc;
                if (!acc.has(motherId)) acc.set(motherId, []);
                if (!acc.get(motherId).includes(childId)) acc.get(motherId).push(childId);
                return acc;
            }, new Map());
        }

        function renderTagTreeItem(tag, tagById, childrenByMother, depth = 0, visited = new Set()) {
            const tagId = Number(tag.id) || 0;
            const label = getTagLabel(tag);
            const isActive = state.selectedTagIds.includes(tagId);
            const childIds = (childrenByMother.get(tagId) || []).filter((childId) => !visited.has(childId) && tagById.has(childId));
            const hasChildren = childIds.length > 0;
            const isExpanded = state.expandedTagIds.has(tagId);
            const childMarkup = hasChildren && isExpanded
                ? `<div class="mt-2 space-y-2 border-l border-sky-500/20 pl-3">${childIds.map((childId) => renderTagTreeItem(tagById.get(childId), tagById, childrenByMother, depth + 1, new Set([...visited, tagId]))).join('')}</div>`
                : '';

            return `
                <article class="rounded-xl border ${isActive ? 'border-violet-400/80 bg-violet-950/40' : 'border-sky-500/20 bg-sky-950/20'} p-3 transition hover:border-sky-400/60 hover:bg-sky-950/40" data-tag-tree-depth="${depth}">
                    <div class="flex items-center gap-2">
                        <button type="button" data-tag-accordion-id="${tagId}" aria-expanded="${isExpanded ? 'true' : 'false'}" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg border border-slate-700 text-xs ${hasChildren ? 'text-sky-200 hover:border-sky-400 hover:text-white' : 'cursor-default text-slate-600 opacity-50'}" ${hasChildren ? '' : 'disabled'} title="${hasChildren ? 'Mostrar tags filhas' : 'Sem tags filhas'}">
                            <i class="fa-solid ${hasChildren && isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
                        </button>
                        <button type="button" data-tag-filter-id="${tagId}" class="min-w-0 flex-1 text-left text-sm font-semibold ${isActive ? 'text-violet-100' : 'text-slate-100'} transition hover:text-sky-100">
                            <span class="break-words">${escapeHtml(label)}</span>
                        </button>
                    </div>
                    ${childMarkup}
                </article>
            `;
        }


        function renderRightOptionsMenu() {
            const modes = [
                { mode: 'tags', label: 'Tags' },
                { mode: 'cards', label: 'Cards' }
            ];
            const options = [
                { type: 'subject', label: 'Sujeito' },
                { type: 'object', label: 'Objeto' },
                { type: 'lexical_chunk', label: 'Lexical Chunk' }
            ];
            rightOptionsMenu.innerHTML = `
                <article class="rounded-xl border border-violet-500/20 bg-violet-950/20 p-3 transition hover:border-violet-400/60 hover:bg-violet-950/40">
                    <div class="flex items-center gap-2">
                        <button type="button" id="rightModeAccordionBtn" aria-expanded="${state.rightModeExpanded ? 'true' : 'false'}" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg border border-slate-700 text-xs text-violet-200 hover:border-violet-400 hover:text-white" title="Mostrar modos">
                            <i class="fa-solid ${state.rightModeExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
                        </button>
                        <button type="button" id="rightModeTitleBtn" class="min-w-0 flex-1 text-left text-sm font-semibold text-slate-100 transition hover:text-violet-100">
                            <span class="break-words">Modo</span>
                        </button>
                    </div>
                    ${state.rightModeExpanded ? `<div class="mt-2 space-y-2 border-l border-violet-500/20 pl-3">${modes.map((option) => {
                        const isActive = state.viewMode === option.mode;
                        return `<button type="button" data-view-mode="${option.mode}" aria-pressed="${isActive ? 'true' : 'false'}" class="w-full rounded-xl border p-3 text-left text-sm font-semibold transition ${isActive ? 'border-violet-400/80 bg-violet-950/40 text-violet-100' : 'border-violet-500/20 bg-violet-950/20 text-slate-100 hover:border-violet-400/60 hover:bg-violet-950/40 hover:text-violet-100'}">${escapeHtml(option.label)}</button>`;
                    }).join('')}</div>` : ''}
                </article>
                <article class="rounded-xl border border-sky-500/20 bg-sky-950/20 p-3 transition hover:border-sky-400/60 hover:bg-sky-950/40">
                    <div class="flex items-center gap-2">
                        <button type="button" id="rightOptionsAccordionBtn" aria-expanded="${state.rightOptionsExpanded ? 'true' : 'false'}" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg border border-slate-700 text-xs text-sky-200 hover:border-sky-400 hover:text-white" title="Mostrar opções">
                            <i class="fa-solid ${state.rightOptionsExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
                        </button>
                        <button type="button" id="rightOptionsTitleBtn" class="min-w-0 flex-1 text-left text-sm font-semibold text-slate-100 transition hover:text-sky-100">
                            <span class="break-words">Opções</span>
                        </button>
                    </div>
                    ${state.rightOptionsExpanded ? `<div class="mt-2 space-y-2 border-l border-sky-500/20 pl-3">${options.map((option) => {
                        const isActive = state.selectedTagLinkTypes.includes(option.type);
                        return `<button type="button" data-tag-link-type="${option.type}" aria-pressed="${isActive ? 'true' : 'false'}" class="w-full rounded-xl border p-3 text-left text-sm font-semibold transition ${isActive ? 'border-violet-400/80 bg-violet-950/40 text-violet-100' : 'border-sky-500/20 bg-sky-950/20 text-slate-100 hover:border-sky-400/60 hover:bg-sky-950/40 hover:text-sky-100'}">${escapeHtml(option.label)}</button>`;
                    }).join('')}</div>` : ''}
                </article>
            `;

            rightOptionsMenu.querySelectorAll('[data-view-mode]').forEach((button) => {
                button.addEventListener('click', () => {
                    state.viewMode = button.dataset.viewMode === 'tags' ? 'tags' : 'cards';
                    enforceSingleTagSelectionForTagMode();
                    renderRightOptionsMenu();
                    loadPage(1);
                    loadSavedFilters();
                });
            });
            rightOptionsMenu.querySelectorAll('[data-tag-link-type]').forEach((button) => {
                button.addEventListener('click', () => {
                    const type = button.dataset.tagLinkType || '';
                    if (!type) return;
                    if (state.selectedTagLinkTypes.includes(type)) state.selectedTagLinkTypes = state.selectedTagLinkTypes.filter((selectedType) => selectedType !== type);
                    else state.selectedTagLinkTypes.push(type);
                    renderRightOptionsMenu();
                    if (state.viewMode === 'cards') loadPage(1);
                });
            });
            rightOptionsMenu.querySelectorAll('#rightModeAccordionBtn, #rightModeTitleBtn').forEach((button) => {
                button.addEventListener('click', () => { state.rightModeExpanded = !state.rightModeExpanded; renderRightOptionsMenu(); });
            });
            rightOptionsMenu.querySelectorAll('#rightOptionsAccordionBtn, #rightOptionsTitleBtn').forEach((button) => {
                button.addEventListener('click', () => { state.rightOptionsExpanded = !state.rightOptionsExpanded; renderRightOptionsMenu(); });
            });
        }

        function enforceSingleTagSelectionForTagMode() {
            if (state.viewMode !== 'tags' || state.selectedTagIds.length <= 1) return;
            state.selectedTagIds = [state.selectedTagIds[state.selectedTagIds.length - 1]];
            state.selectedTagLabels = [state.selectedTagLabels[state.selectedTagLabels.length - 1]].filter(Boolean);
        }

        function selectTagFilter(tagId, tag = {}) {
            if (!tagId || state.selectedTagIds.includes(tagId)) return false;
            if (state.viewMode === 'tags') {
                state.selectedTagIds = [tagId];
                state.selectedTagLabels = [getTagLabel(tag)];
                return true;
            }
            state.selectedTagIds.push(tagId);
            state.selectedTagLabels.push(getTagLabel(tag));
            return true;
        }

        function toggleTagFilter(tagId, tag = {}) {
            if (!tagId) return false;
            const existingIndex = state.selectedTagIds.indexOf(tagId);
            if (existingIndex >= 0) {
                state.selectedTagIds.splice(existingIndex, 1);
                state.selectedTagLabels.splice(existingIndex, 1);
                return true;
            }
            return selectTagFilter(tagId, tag);
        }

        function renderSavedFilters(filters, allTags = filters, familyRelations = []) {
            const savedFiltersList = document.getElementById('savedFiltersList');
            const savedFiltersCount = document.getElementById('savedFiltersCount');
            savedFiltersCount.textContent = String(filters.length);

            if (!filters.length) {
                savedFiltersList.innerHTML = '<p class="text-xs text-slate-500">Nenhuma tag fixada para o usuário atual.</p>';
                return;
            }

            const tagById = new Map(allTags.map((tag) => [Number(tag.id), normalizeSavedFilter(tag)]).filter(([id]) => id > 0));
            filters.forEach((tag) => tagById.set(Number(tag.id), tag));
            const childrenByMother = buildChildrenByMother(familyRelations);
            savedFiltersList.innerHTML = filters.map((tag) => renderTagTreeItem(tag, tagById, childrenByMother, 0, new Set())).join('');

            savedFiltersList.querySelectorAll('[data-tag-accordion-id]').forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    const tagId = Number(button.dataset.tagAccordionId) || 0;
                    if (!tagId) return;
                    const tag = tagById.get(tagId) || {};
                    selectTagFilter(tagId, tag);
                    if (state.expandedTagIds.has(tagId)) state.expandedTagIds.delete(tagId);
                    else state.expandedTagIds.add(tagId);
                    loadPage(1);
                    renderSavedFilters(filters, allTags, familyRelations);
                });
            });

            savedFiltersList.querySelectorAll('[data-tag-filter-id]').forEach((button) => {
                button.addEventListener('click', () => {
                    const tagId = Number(button.dataset.tagFilterId) || 0;
                    const tag = tagById.get(tagId) || {};
                    if (!tagId) return;
                    toggleTagFilter(tagId, tag);
                    loadPage(1);
                    renderSavedFilters(filters, allTags, familyRelations);
                });
            });
        }

        async function loadSavedFilters() {
            const savedFiltersList = document.getElementById('savedFiltersList');
            const savedFiltersCount = document.getElementById('savedFiltersCount');
            try {
                const [savedResponse, tagsResponse, familyResponse] = await Promise.all([
                    fetch('/api/flashcards', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ action: 'list_saved_filters' })
                    }),
                    fetch('/api/flashcards?action=list_tags', { headers: { 'Accept': 'application/json' } }),
                    fetch('/api/flashcards?action=list_tag_family_relations', { headers: { 'Accept': 'application/json' } })
                ]);
                const [savedResult, tagsResult, familyResult] = await Promise.all([savedResponse.json(), tagsResponse.json(), familyResponse.json()]);
                if (!savedResponse.ok || savedResult.status !== 'success') throw new Error(savedResult.message || 'Não foi possível carregar as tags fixadas.');
                if (!tagsResponse.ok || tagsResult.status !== 'success') throw new Error(tagsResult.message || 'Não foi possível carregar as tags.');
                if (!familyResponse.ok || familyResult.status !== 'success') throw new Error(familyResult.message || 'Não foi possível carregar as famílias de tags.');
                renderSavedFilters(
                    (savedResult.data || []).map(normalizeSavedFilter).filter((tag) => Number(tag.id) > 0),
                    (tagsResult.data || []).map(normalizeSavedFilter).filter((tag) => Number(tag.id) > 0),
                    familyResult.data || []
                );
            } catch (error) {
                savedFiltersCount.textContent = '0';
                savedFiltersList.innerHTML = `<p class="text-xs text-red-300">${escapeHtml(error.message || 'Erro ao carregar tags fixadas.')}</p>`;
            }
        }

        function renderImage(src, label) {
            if (!src) return '';
            return `<img src="${escapeHtml(src)}" alt="${escapeHtml(label)}" class="mt-3 max-h-52 w-full rounded-xl border border-slate-700 object-contain bg-slate-950/60">`;
        }

        function renderCardTextsPanel(card) {
            return `
                <div class="grid gap-px bg-slate-800 md:grid-cols-2">
                    <div class="bg-slate-900 p-4">
                        <div class="mb-2 text-xs font-bold uppercase tracking-wider text-slate-500">Frente</div>
                        <div class="whitespace-pre-wrap break-words text-sm leading-6 text-slate-100">${escapeHtml(card.front || '—')}</div>
                        ${renderImage(card.image_front, 'Imagem da frente')}
                    </div>
                    <div class="bg-slate-900 p-4">
                        <div class="mb-2 text-xs font-bold uppercase tracking-wider text-slate-500">Verso</div>
                        <div class="whitespace-pre-wrap break-words text-sm leading-6 text-slate-100">${escapeHtml(card.back || '—')}</div>
                        ${renderImage(card.image_back, 'Imagem do verso')}
                    </div>
                </div>
            `;
        }

        function renderCardStatusPanel(card) {
            return `
                <div class="grid gap-3 bg-slate-900 p-4 text-sm text-slate-200 sm:grid-cols-2 xl:grid-cols-4">
                    <div class="rounded-xl border border-slate-800 bg-slate-950/50 p-4">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Deck</div>
                        <div class="mt-2 truncate font-semibold text-violet-100" title="${escapeHtml(card.directory_name || 'Deck grafo')}">${escapeHtml(card.directory_name || 'Deck grafo')}</div>
                    </div>
                    <div class="rounded-xl border border-slate-800 bg-slate-950/50 p-4">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Score</div>
                        <div class="mt-2 text-2xl font-bold text-violet-200">${escapeHtml(card.score ?? 0)}</div>
                    </div>
                    <div class="rounded-xl border border-slate-800 bg-slate-950/50 p-4">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Áudio frente</div>
                        <div class="mt-2 font-semibold ${card.has_audio_front ? 'text-emerald-300' : 'text-slate-400'}">${card.has_audio_front ? 'Sim' : 'Não'}</div>
                    </div>
                    <div class="rounded-xl border border-slate-800 bg-slate-950/50 p-4">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Áudio verso</div>
                        <div class="mt-2 font-semibold ${card.has_audio_back ? 'text-emerald-300' : 'text-slate-400'}">${card.has_audio_back ? 'Sim' : 'Não'}</div>
                    </div>
                </div>
            `;
        }

        function renderCardTagsPanel(card) {
            const tags = Array.isArray(card.tags) ? card.tags : [];
            if (!tags.length) return '<div class="bg-slate-900 p-4 text-sm text-slate-500">Nenhuma tag vinculada a este card.</div>';
            return `
                <div class="flex flex-wrap gap-2 bg-slate-900 p-4 text-xs text-slate-200">
                    ${tags.map((tag) => `<span class="rounded-full border border-sky-500/30 bg-sky-950/40 px-3 py-1.5">${escapeHtml(getTagLabel(tag))}</span>`).join('')}
                </div>
            `;
        }

        function renderCardPanel(card, activeTab = 'texts') {
            if (activeTab === 'status') return renderCardStatusPanel(card);
            if (activeTab === 'tags') return renderCardTagsPanel(card);
            return renderCardTextsPanel(card);
        }

        function renderCardTabButton(cardId, tab, label, activeTab) {
            const isActive = tab === activeTab;
            return `<button type="button" data-card-tab="${tab}" data-card-id="${cardId}" class="rounded-lg px-3 py-1.5 font-semibold transition ${isActive ? 'bg-violet-500/20 text-violet-100' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">${label}</button>`;
        }

        function getCardEditUrl(card = {}) {
            const deckId = Number(card?.directory_id || 0);
            const cardId = Number(card?.id || 0);
            if (!deckId || !cardId) return '';

            const params = new URLSearchParams();
            params.set('id', String(deckId));
            params.set('edit_card_id', String(cardId));
            params.set('from', window.location.pathname + window.location.search);
            return `/ficha_do_card?${params.toString()}`;
        }

        function renderCardEditButton(card = {}) {
            const editUrl = getCardEditUrl(card);
            if (!editUrl) return '';
            return `<a href="${escapeHtml(editUrl)}" class="rounded-lg px-3 py-1.5 font-semibold text-slate-400 transition hover:bg-slate-800 hover:text-white">Editar</a>`;
        }

        function renderCards(cards) {
            cardsGrid.innerHTML = cards.map((card) => {
                const activeTab = card.active_tab || 'texts';
                return `
                    <article class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/80 shadow-xl shadow-black/20" data-card-id="${card.id}">
                        <div class="flex items-center justify-end border-b border-slate-800 px-4 py-3 text-xs text-slate-400">
                            <div id="card-tabs-nav-${card.id}" class="flex shrink-0 items-center gap-1 rounded-xl border border-slate-800 bg-slate-950/40 p-1">
                                ${renderCardTabButton(card.id, 'texts', 'Textos', activeTab)}
                                ${renderCardTabButton(card.id, 'status', 'Status', activeTab)}
                                ${renderCardTabButton(card.id, 'tags', 'Tags', activeTab)}
                                ${renderCardEditButton(card)}
                            </div>
                        </div>
                        <div data-card-panel="${card.id}">${renderCardPanel(card, activeTab)}</div>
                    </article>
                `;
            }).join('');

            cardsGrid.querySelectorAll('[data-card-tab]').forEach((button) => {
                button.addEventListener('click', () => {
                    const cardId = Number(button.dataset.cardId) || 0;
                    const card = cards.find((item) => Number(item.id) === cardId);
                    if (!card) return;
                    card.active_tab = button.dataset.cardTab || 'texts';
                    renderCards(cards);
                });
            });
        }

        function getRelationTypeLabel(typeId) {
            const relationType = state.relationTypes.find((item) => Number(item.id) === Number(typeId));
            return relationType?.name || relationType?.nome || relationType?.label || `Sessão ${typeId}`;
        }

        function getTagRelationType(tag = {}) {
            return Number(tag.tipo_de_relacao ?? tag.relation_type_id ?? tag.id_relation_type ?? tag.relationTypeId ?? 0) || 0;
        }

        function renderFamilyTagChip(tag = {}) {
            return `<button type="button" data-main-family-tag-id="${Number(tag.id) || 0}" class="rounded-full border border-sky-500/30 bg-sky-950/40 px-3 py-1.5 text-xs font-semibold text-sky-100 transition hover:border-sky-300 hover:bg-sky-900/50">${escapeHtml(getTagLabel(tag))}</button>`;
        }

        function renderTagFamilySections() {
            const selectedLabel = getSelectedTagSummary();
            if (!state.selectedTagIds.length) {
                tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">Selecione uma tag fixada no menu esquerdo para ver suas famílias.</div>';
                return;
            }
            const familyTypes = [...new Set([...(state.tagFamily.children || []), ...(state.tagFamily.mothers || [])].map((tag) => getTagRelationType(tag)))].filter((type) => type > 0);
            const configuredTypes = state.relationTypes.map((item) => Number(item.id)).filter((id) => id > 0);
            const types = [...new Set([...configuredTypes, ...familyTypes])].sort((a, b) => a - b);
            if (!types.length) {
                tagFamilySections.innerHTML = `<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">Nenhuma sessão de família encontrada para ${escapeHtml(selectedLabel)}.</div>`;
                return;
            }
            tagFamilySections.innerHTML = `
                <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
                    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Famílias</p>
                    <h2 class="mt-1 text-lg font-bold text-white">${escapeHtml(selectedLabel)}</h2>
                </div>
                ${types.map((type) => {
                    const children = (state.tagFamily.children || []).filter((tag) => getTagRelationType(tag) === type);
                    const mothers = (state.tagFamily.mothers || []).filter((tag) => getTagRelationType(tag) === type);
                    return `<article class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
                        <h3 class="mb-3 text-sm font-semibold text-violet-200">${escapeHtml(getRelationTypeLabel(type))}</h3>
                        <div class="grid gap-4 md:grid-cols-2">
                            <div><p class="mb-2 text-sm text-red-300">Esta tag é mãe de:</p><div class="flex flex-wrap gap-2">${children.length ? children.map(renderFamilyTagChip).join('') : '<span class="text-xs text-slate-400">Nenhuma</span>'}</div></div>
                            <div><p class="mb-2 text-sm text-red-300">Esta tag é filha de:</p><div class="flex flex-wrap gap-2">${mothers.length ? mothers.map(renderFamilyTagChip).join('') : '<span class="text-xs text-slate-400">Nenhuma</span>'}</div></div>
                        </div>
                    </article>`;
                }).join('')}
            `;
            tagFamilySections.querySelectorAll('[data-main-family-tag-id]').forEach((button) => {
                button.addEventListener('click', () => {
                    const tagId = Number(button.dataset.mainFamilyTagId) || 0;
                    if (!tagId) return;
                    const tag = [...(state.tagFamily.children || []), ...(state.tagFamily.mothers || [])].find((item) => Number(item.id) === tagId) || {};
                    state.selectedTagIds = [tagId];
                    state.selectedTagLabels = [getTagLabel(tag)];
                    loadPage(1);
                    loadSavedFilters();
                });
            });
        }

        async function loadTagFamilyMode() {
            enforceSingleTagSelectionForTagMode();
            statusBox.classList.add('hidden');
            cardsGrid.classList.add('hidden');
            cardsGrid.classList.remove('grid');
            tagFamilySections.classList.remove('hidden');
            window.history.replaceState(null, '', buildCardsRoute(state.page));
            updateFooter();
            if (!state.selectedTagIds.length) { renderTagFamilySections(); return; }
            tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300"><i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando famílias da tag...</div>';
            try {
                const [familyResponse, relationTypesResponse] = await Promise.all([
                    fetch(`/api/flashcards?action=get_tag_family&tag_id=${encodeURIComponent(state.selectedTagIds[0])}`, { headers: { 'Accept': 'application/json' } }),
                    fetch('/api/flashcards?action=list_relation_types', { headers: { 'Accept': 'application/json' } })
                ]);
                const [familyResult, relationTypesResult] = await Promise.all([familyResponse.json(), relationTypesResponse.json()]);
                if (!familyResponse.ok || familyResult.status !== 'success') throw new Error(familyResult.message || 'Não foi possível carregar a família da tag.');
                if (!relationTypesResponse.ok || relationTypesResult.status !== 'success') throw new Error(relationTypesResult.message || 'Não foi possível carregar as sessões.');
                state.tagFamily = familyResult.data || { mothers: [], children: [] };
                state.relationTypes = relationTypesResult.data || [];
                renderTagFamilySections();
            } catch (error) {
                tagFamilySections.innerHTML = `<div class="rounded-2xl border border-red-500/30 bg-red-950/20 p-6 text-center text-red-200">${escapeHtml(error.message || 'Erro ao carregar famílias da tag.')}</div>`;
            }
        }

        function updateFooter() {
            paginationInfo.textContent = `Página ${state.page} de ${state.totalPages} • ${state.totalCards} card(s) • 20 por página`;
            prevPageBtn.disabled = state.page <= 1;
            nextPageBtn.disabled = state.page >= state.totalPages;
            clearTagFilterBtn.classList.toggle('hidden', state.selectedTagIds.length === 0);
        }

        async function loadPage(page) {
            if (state.viewMode === 'tags') {
                state.page = 1;
                await loadTagFamilyMode();
                return;
            }
            tagFamilySections.classList.add('hidden');
            statusBox.classList.remove('hidden');
            cardsGrid.classList.add('hidden');
            statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando cards...';
            try {
                const params = new URLSearchParams({ action: 'list_graph_cards_for_user', page: String(page) });
                if (state.selectedTagIds.length) params.set('tag_ids', state.selectedTagIds.join(','));
                if (state.selectedTagIds.length) params.set('tag_link_types', state.selectedTagLinkTypes.join(','));
                const response = await fetch(`/api/flashcards?${params.toString()}`, { headers: { 'Accept': 'application/json' } });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível carregar os cards.');

                state.page = result.pagination.page;
                state.totalPages = result.pagination.total_pages;
                state.totalCards = result.pagination.total_cards;
                window.history.replaceState(null, '', buildCardsRoute(state.page));
                updateFooter();

                if (!result.data.length) {
                    statusBox.textContent = 'Nenhum card encontrado em decks do modo grafo.';
                    return;
                }
                renderCards(result.data);
                statusBox.classList.add('hidden');
                cardsGrid.classList.remove('hidden');
                cardsGrid.classList.add('grid');
            } catch (error) {
                statusBox.textContent = error.message || 'Erro ao carregar cards.';
            }
        }


        async function openFilteredCreateCard() {
            const originalContent = createFilteredCardBtn.innerHTML;
            createFilteredCardBtn.disabled = true;
            createFilteredCardBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Abrindo...';
            try {
                const response = await fetch('/api/flashcards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ action: 'get_user_system_deck' })
                });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Deck de sistema não encontrado para criar o card.');
                const deckId = Number(result?.deck_id || result?.data?.deck_id || 0);
                if (!deckId) throw new Error('Deck de sistema não encontrado para criar o card.');

                const params = new URLSearchParams();
                params.set('id', String(deckId));
                if (state.selectedTagIds.length) {
                    params.set('tag_ids', state.selectedTagIds.join(','));
                    if (state.selectedTagLabels.length) params.set('tag_names', state.selectedTagLabels.join('|'));
                }
                params.set('from', window.location.pathname + window.location.search);
                window.location.href = `/ficha_do_card?${params.toString()}`;
            } catch (error) {
                statusBox.classList.remove('hidden');
                statusBox.textContent = error.message || 'Erro ao abrir a ficha do card.';
                createFilteredCardBtn.disabled = false;
                createFilteredCardBtn.innerHTML = originalContent;
            }
        }

        prevPageBtn.addEventListener('click', () => { if (state.page > 1) loadPage(state.page - 1); });
        nextPageBtn.addEventListener('click', () => { if (state.page < state.totalPages) loadPage(state.page + 1); });
        createFilteredCardBtn.addEventListener('click', openFilteredCreateCard);
        clearTagFilterBtn.addEventListener('click', () => {
            state.selectedTagIds = [];
            state.selectedTagLabels = [];
            loadPage(1);
            loadSavedFilters();
        });
        enforceSingleTagSelectionForTagMode();
        renderRightOptionsMenu();
        loadSavedFilters();
        loadPage(state.page);
    </script>
</body>
</html>
