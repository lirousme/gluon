        }

        function buildTagFamilySectionHeader(type, children = []) {
            const relationType = getRelationTypeById(type);
            const isRemovalMode = state.removalRelationType === type;
            const isReorderMode = state.reorderRelationType === type;
            const canReorder = relationTypeUsesSequence(type);
            const actionsButton = canEditRelationType(relationType) ? `<button type="button" data-open-relation-type-actions="${type}" class="h-8 w-8 shrink-0 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white transition-colors" title="Editar ou excluir esta sessão" aria-label="Editar ou excluir esta sessão"><i class="fa-solid fa-ellipsis-vertical"></i></button>` : '';
            const reorderButton = canReorder ? `<button type="button" data-toggle-reorder-type="${type}" class="hidden md:inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border ${isReorderMode ? 'border-sky-300 bg-sky-500/20 text-sky-100' : 'border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white'} transition-colors" title="Reordenar tags desta sequência" aria-label="Reordenar tags desta sequência"><i class="fa-solid fa-arrow-up-wide-short"></i></button>` : '';
            const removalButton = `<button type="button" data-toggle-removal-type="${type}" class="h-8 w-8 shrink-0 rounded-lg border ${isRemovalMode ? 'border-amber-300 bg-amber-500/20 text-amber-100' : 'border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white'} transition-colors" title="Remover tags desta sessão" aria-label="Remover tags desta sessão"><i class="fa-solid fa-folder-minus"></i></button>`;
            const actionGroup = actionsButton || reorderButton || removalButton ? `<div class="flex shrink-0 items-center gap-2">${actionsButton}${reorderButton}${removalButton}</div>` : '';
            return `<div class="mb-3 flex items-start justify-between gap-3"><div><h3 class="text-sm font-semibold text-violet-200">${escapeHtml(getRelationTypeLabel(type))}</h3>${isRemovalMode ? '<p class="mt-1 text-xs text-amber-300">Clique em uma tag desta sessão para removê-la daqui.</p>' : ''}${isReorderMode ? '<p class="mt-1 hidden text-xs text-sky-300 md:block">Arraste as tags para ajustar a ordem desta sequência.</p>' : ''}</div>${actionGroup}</div>`;
        }

        function renderTagFamilySections() {
            const selectedLabel = getSelectedTagSummary();
            ensureSelectedRelationType();
            if (!state.selectedTagIds.length) {
                tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">Selecione uma tag fixada no menu esquerdo para ver suas famílias.</div>';
                return;
            }
            const familyTypes = [...new Set([...(state.tagFamily.children || []), ...(state.tagFamily.mothers || [])].map((tag) => getTagRelationType(tag)))].filter((type) => type > 0);
            const configuredTypes = state.relationTypes.map((item) => Number(item.id)).filter((id) => id > 0);
            const types = [...new Set([...configuredTypes, ...familyTypes])].sort((a, b) => a - b);
            if (!types.length) {
                tagFamilySections.innerHTML = `<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">Nenhuma sessão de família encontrada para ${escapeHtml(selectedLabel)}.</div>`;
                return;
            }
            tagFamilySections.innerHTML = `
                <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
                    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Famílias</p>
                    <h2 class="mt-1 text-lg font-bold text-white">${escapeHtml(selectedLabel)}</h2>
                </div>
                ${types.map((type) => {
                    const children = (state.tagFamily.children || []).filter((tag) => getTagRelationType(tag) === type);
                    const mothers = (state.tagFamily.mothers || []).filter((tag) => getTagRelationType(tag) === type);
                    const isSelected = Number(state.selectedRelationType) === Number(type);
                    const articleClass = `rounded-2xl border bg-slate-900/70 p-4 transition ${isSelected ? 'border-violet-400/80 ring-1 ring-violet-400/40' : 'border-slate-800 hover:border-violet-500/40'}`;
                    const isSequence = relationTypeUsesSequence(type);
                    const childListClass = isSequence ? `sequence-reorder-list ${state.reorderRelationType === type ? 'sequence-drag-active' : ''}` : '';
                    if (!relationTypeUsesHierarchy(type)) {
                        return `<article data-relation-type="${type}" class="${articleClass}">${buildTagFamilySectionHeader(type, children)}<div data-sequence-list="${type}" class="flex flex-wrap gap-2 ${childListClass}">${children.length ? children.map((tag) => renderFamilyTagChip(tag, type, 'child', buildNumeroPtBrCounts(children))).join('') : '<span class="text-xs text-slate-400">Nenhuma</span>'}</div></article>`;
                    }
                    return `<article data-relation-type="${type}" class="${articleClass}">${buildTagFamilySectionHeader(type, children)}<div class="grid gap-4 md:grid-cols-2"><div><p class="mb-2 text-sm text-red-300">Esta tag é mãe de:</p><div class="flex flex-wrap gap-2">${children.length ? children.map((tag) => renderFamilyTagChip(tag, type, 'child', buildNumeroPtBrCounts(children))).join('') : '<span class="text-xs text-slate-400">Nenhuma</span>'}</div></div><div><p class="mb-2 text-sm text-red-300">Esta tag é filha de:</p><div class="flex flex-wrap gap-2">${mothers.length ? mothers.map((tag) => renderFamilyTagChip(tag, type, 'mother', buildNumeroPtBrCounts(mothers))).join('') : '<span class="text-xs text-slate-400">Nenhuma</span>'}</div></div></div></article>`;
                }).join('')}
            `;
            bindTagFamilySectionEvents();
        }

        function bindTagFamilySectionEvents() {
            tagFamilySections.querySelectorAll('[data-relation-type]').forEach((card) => card.addEventListener('click', (event) => {
                if (event.target.closest('button')) return;
                state.selectedRelationType = Number(card.dataset.relationType || 0);
                renderTagFamilySections();
                renderFooterTags();
            }));
            tagFamilySections.querySelectorAll('[data-toggle-removal-type]').forEach((button) => button.addEventListener('click', () => {
                const type = Number(button.dataset.toggleRemovalType) || 0;
                state.removalRelationType = state.removalRelationType === type ? null : type;
                if (state.removalRelationType === type) state.reorderRelationType = null;
                renderTagFamilySections();
            }));
            tagFamilySections.querySelectorAll('[data-toggle-reorder-type]').forEach((button) => button.addEventListener('click', () => {
                const type = Number(button.dataset.toggleReorderType) || 0;
                state.reorderRelationType = state.reorderRelationType === type ? null : type;
                if (state.reorderRelationType === type) state.removalRelationType = null;
                renderTagFamilySections();
            }));
            tagFamilySections.querySelectorAll('[data-open-relation-type-actions]').forEach((button) => button.addEventListener('click', () => openRelationTypeActionsModal(Number(button.dataset.openRelationTypeActions) || 0)));
            tagFamilySections.querySelectorAll('[data-sequence-list]').forEach((list) => {
                list.addEventListener('dragover', (event) => { if (state.reorderRelationType === Number(list.dataset.sequenceList || 0)) event.preventDefault(); });
            });
            tagFamilySections.querySelectorAll('[data-main-family-tag-id]').forEach((button) => {
                button.addEventListener('dragstart', (event) => {
                    const type = Number(button.closest('[data-relation-type]')?.dataset.relationType || 0);
                    if (state.reorderRelationType !== type) { event.preventDefault(); return; }
                    state.draggedSequenceTagId = Number(button.dataset.mainFamilyTagId) || 0;
                    button.classList.add('sequence-dragging');
                });
                button.addEventListener('dragend', () => { button.classList.remove('sequence-dragging'); state.draggedSequenceTagId = null; });
                button.addEventListener('dragover', (event) => {
                    const type = Number(button.closest('[data-relation-type]')?.dataset.relationType || 0);
                    if (state.reorderRelationType === type) event.preventDefault();
                });
                button.addEventListener('drop', async (event) => {
                    event.preventDefault();
                    const type = Number(button.closest('[data-relation-type]')?.dataset.relationType || 0);
                    if (state.reorderRelationType !== type) return;
                    const targetId = Number(button.dataset.mainFamilyTagId) || 0;
                    await reorderSequenceTag(type, Number(state.draggedSequenceTagId), targetId);
                });
                button.addEventListener('click', async () => {
                    const tagId = Number(button.dataset.mainFamilyTagId) || 0;
                    const type = Number(button.closest('[data-relation-type]')?.dataset.relationType || 0);
                    if (!tagId) return;
                    const tag = [...(state.tagFamily.children || []), ...(state.tagFamily.mothers || [])].find((item) => Number(item.id) === tagId && getTagRelationType(item) === type) || {};
                    if (state.reorderRelationType === type) return;
                    if (state.removalRelationType === type) { await removeFamilyTag(tag, button.dataset.relationRole || 'child'); return; }
                    state.selectedTagIds = [tagId];
                    state.selectedTagLabels = [getTagLabel(tag)];
                    await loadPage(1);
                    await loadSavedFilters();
                });
            });
        }

        async function removeFamilyTag(tag, relationRole) {
            if (!tag) return;
            const relationTypeId = getTagRelationType(tag);
            if (relationTypeUsesHierarchy(relationTypeId)) {
                await api('remove_tag_family_relation', { tag_id: state.selectedTagIds[0], other_tag_id: Number(tag.id), relation_type: relationRole, tipo_de_relacao: relationTypeId });
            } else {
                const payload = { tag_id: state.selectedTagIds[0], other_tag_id: Number(tag.id), tipo_de_relacao: relationTypeId };
                const results = await Promise.allSettled([api('remove_tag_family_relation', { ...payload, relation_type: 'child' }), api('remove_tag_family_relation', { ...payload, relation_type: 'mother' })]);
                if (results.every((result) => result.status === 'rejected')) throw results[0].reason || new Error('Não foi possível remover o vínculo.');
            }
            await loadPage(1);
        }

        async function reorderSequenceTag(relationType, draggedId, targetId) {
            if (!draggedId || !targetId || draggedId === targetId) return;
            const ordered = (state.tagFamily.children || []).filter((tag) => getTagRelationType(tag) === relationType).map((tag) => Number(tag.id));
            const from = ordered.indexOf(draggedId), to = ordered.indexOf(targetId);
            if (from < 0 || to < 0) return;
            ordered.splice(from, 1);
            ordered.splice(to, 0, draggedId);
            await api('reorder_tag_family_sequence', { tag_id: state.selectedTagIds[0], tipo_de_relacao: relationType, ordered_tag_ids: ordered });
            state.tagFamily.children.sort((a, b) => {
                const ia = ordered.indexOf(Number(a.id)), ib = ordered.indexOf(Number(b.id));
                if (getTagRelationType(a) !== relationType || getTagRelationType(b) !== relationType) return 0;
                return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib);
            });
            renderTagFamilySections();
        }

        function openRelationTypeActionsModal(type) {
            const relationType = getRelationTypeById(type);
            if (!canEditRelationType(relationType)) return;
            state.editingRelationTypeId = Number(relationType.id);
            document.getElementById('editRelationTypeNameInput').value = String(relationType.nome || relationType.name || '');
            showModal('editRelationTypeModal', 'editRelationTypeModalContent', 'editRelationTypeNameInput');
        }
        function closeRelationTypeActionsModal() { closeModal('editRelationTypeModal', 'editRelationTypeModalContent'); state.editingRelationTypeId = null; }
        async function submitEditRelationType(event) {
            event.preventDefault();
            const id = Number(state.editingRelationTypeId || 0);
            const relationType = getRelationTypeById(id);
            if (!canEditRelationType(relationType)) return;
            const name = document.getElementById('editRelationTypeNameInput').value.trim();
            if (!name) { alert('Preencha o nome da sessão.'); return; }
            await api('update_relation_type', { id, nome: name });
            closeRelationTypeActionsModal();
            await loadPage(1);
        }
        async function deleteEditingRelationType() {
            const id = Number(state.editingRelationTypeId || 0);
            const relationType = getRelationTypeById(id);
            if (!canEditRelationType(relationType)) return;
            if (!confirm('Excluir esta sessão também removerá os vínculos dela. Deseja continuar?')) return;
            await api('delete_relation_type', { id });
            if (state.removalRelationType === id) state.removalRelationType = null;
            if (state.reorderRelationType === id) state.reorderRelationType = null;
            closeRelationTypeActionsModal();
            await loadPage(1);
        }

        async function loadTagFamilyMode() {
            enforceSingleTagSelectionForTagMode();
            statusBox.classList.add('hidden');
            cardsGrid.classList.add('hidden');
            cardsGrid.classList.remove('grid');
            tagFamilySections.classList.remove('hidden');
            window.history.replaceState(null, '', buildCardsRoute(state.page));
            updateFooter();
            if (!state.selectedTagIds.length) { renderTagFamilySections(); return; }
            tagFamilySections.innerHTML = '<div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300"><i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando famílias da tag...</div>';
            try {
                const [familyResult, relationTypesResult, tagsResult] = await Promise.all([
                    api('get_tag_family', { tag_id: state.selectedTagIds[0] }),
                    api('list_relation_types'),
                    api('list_tags')
                ]);
                state.tags = tagsResult.data || [];
                state.tagFamily = familyResult.data || { mothers: [], children: [] };
                state.relationTypes = relationTypesResult.data || [];
                ensureSelectedRelationType();
                renderTagFamilySections();
                renderFooterTags();
            } catch (error) {
                tagFamilySections.innerHTML = `<div class="rounded-2xl border border-red-500/30 bg-red-950/20 p-6 text-center text-red-200">${escapeHtml(error.message || 'Erro ao carregar famílias da tag.')}</div>`;
            }
        }

        function updateFooter() {
            updateHeaderActions();
            const isTagMode = state.viewMode === 'tags';
            cardsPaginationFooter.classList.toggle('hidden', isTagMode);
            cardsPaginationFooter.classList.toggle('flex', !isTagMode);
            tagRelationFooter.classList.toggle('hidden', !isTagMode);
            paginationInfo.textContent = `Página ${state.page} de ${state.totalPages} • ${state.totalCards} card(s) • 20 por página`;
            prevPageBtn.disabled = state.page <= 1;
            nextPageBtn.disabled = state.page >= state.totalPages;
            clearTagFilterBtn.classList.toggle('hidden', state.selectedTagIds.length === 0 && !state.withoutTagsOnly);
            renderLeftOthersMenu();
            if (isTagMode) renderFooterTags();
        }

        function ensureSelectedRelationType() {
            const validTypes = new Set(state.relationTypes.map((item) => Number(item.id)).filter((id) => id > 0));
            if (!validTypes.size) { state.selectedRelationType = null; return; }
            if (!validTypes.has(Number(state.selectedRelationType))) state.selectedRelationType = [...validTypes][0];
        }

        function renderFooterTags() {
            if (!footerTagSelector || state.viewMode !== 'tags') return;
            ensureSelectedRelationType();
            const hideFooterTagSelector = () => {
                footerTagSelector.innerHTML = '';
                footerTagSelector.classList.add('hidden');
                footerTagSelector.classList.remove('flex');
            };
            const currentTagId = Number(state.selectedTagIds[0] || 0);
            if (!currentTagId || !state.selectedRelationType) { hideFooterTagSelector(); return; }
            const query = (footerTagSearch.value || '').toLowerCase().trim();
            if (query.length < 2) { hideFooterTagSelector(); return; }
            const matches = state.tags
                .filter((tag) => Number(tag.id) !== currentTagId)
                .filter((tag) => String(tag.name || '').toLowerCase().includes(query) || String(tag.name_pt_br || '').toLowerCase().includes(query) || String(tag.numero ?? '').toLowerCase().includes(query));
            if (!matches.length) { hideFooterTagSelector(); return; }
            const maxResults = 200;
            const filtered = matches.slice(0, maxResults);
            const numeroPtBrCounts = buildNumeroPtBrCounts(filtered);
            const summary = matches.length > maxResults ? `<div class="mb-2 w-full text-[11px] text-amber-300">Mostrando ${maxResults} de ${matches.length} tags. Refine a busca para ver menos resultados.</div>` : '';
            footerTagSelector.innerHTML = summary + filtered.map((tag) => `<button type="button" data-footer-add-tag-id="${Number(tag.id)}" class="rounded-full border px-2.5 py-1 text-xs transition-colors ${getTagOwnershipClass(tag)}">${renderTagButtonContent(tag, numeroPtBrCounts)}</button>`).join('');
            footerTagSelector.classList.remove('hidden');
            footerTagSelector.classList.add('flex');
            footerTagSelector.querySelectorAll('[data-footer-add-tag-id]').forEach((button) => button.addEventListener('click', () => addRelationToSelectedTag(Number(button.dataset.footerAddTagId || 0))));
        }

        async function addRelationToSelectedTag(otherTagId) {
            if (!otherTagId || !state.selectedTagIds[0] || !state.selectedRelationType) return;
            await api('add_tag_family_relation', { tag_id: state.selectedTagIds[0], other_tag_id: otherTagId, mode: 'child', tipo_de_relacao: state.selectedRelationType });
            footerTagSearch.value = '';
            await loadPage(1);
        }

        async function loadPage(page) {
            if (state.viewMode === 'tags') {
                state.page = 1;
                await loadTagFamilyMode();
                return;
            }
            tagFamilySections.classList.add('hidden');
            statusBox.classList.remove('hidden');
            cardsGrid.classList.add('hidden');
            statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando cards...';
            try {
                const params = new URLSearchParams({ action: 'list_graph_cards_for_user', page: String(page) });
                if (state.withoutTagsOnly) params.set('without_tags', '1');
                if (state.selectedTagIds.length) params.set('tag_ids', state.selectedTagIds.join(','));
                params.set('tag_link_types', state.selectedTagLinkTypes.join(','));
                const response = await fetch(`/api/flashcards?${params.toString()}`, { headers: { 'Accept': 'application/json' } });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível carregar os cards.');

                state.page = result.pagination.page;
                state.totalPages = result.pagination.total_pages;
                state.totalCards = result.pagination.total_cards;
                window.history.replaceState(null, '', buildCardsRoute(state.page));
                updateFooter();

                if (!result.data.length) {
                    statusBox.textContent = 'Nenhum card encontrado em decks do modo grafo.';
                    return;
                }
                renderCards(result.data);
                statusBox.classList.add('hidden');
                cardsGrid.classList.remove('hidden');
                cardsGrid.classList.add('grid');
            } catch (error) {
                statusBox.textContent = error.message || 'Erro ao carregar cards.';
            }
        }


        async function openFilteredCreateCard() {
            const originalContent = createFilteredCardBtn.innerHTML;
            createFilteredCardBtn.disabled = true;
            createFilteredCardBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Abrindo...';
            try {
                const response = await fetch('/api/flashcards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ action: 'get_user_system_deck' })
                });
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Deck de sistema não encontrado para criar o card.');
                const deckId = Number(result?.deck_id || result?.data?.deck_id || 0);
                if (!deckId) throw new Error('Deck de sistema não encontrado para criar o card.');

                const params = new URLSearchParams();
                params.set('id', String(deckId));
                if (state.selectedTagIds.length) {
                    params.set('tag_ids', state.selectedTagIds.join(','));
                    if (state.selectedTagLabels.length) params.set('tag_names', state.selectedTagLabels.join('|'));
                }
                params.set('from', window.location.pathname + window.location.search);
                window.location.href = `/ficha_do_card?${params.toString()}`;
            } catch (error) {
                statusBox.classList.remove('hidden');
                statusBox.textContent = error.message || 'Erro ao abrir a ficha do card.';
                createFilteredCardBtn.disabled = false;
                createFilteredCardBtn.innerHTML = originalContent;
            }
        }

        openLeftMenuBtn?.addEventListener('click', () => openMobileMenu('left'));
        openRightMenuBtn?.addEventListener('click', () => openMobileMenu('right'));
        openLeftMenuBtnTags?.addEventListener('click', () => openMobileMenu('left'));
        openRightMenuBtnTags?.addEventListener('click', () => openMobileMenu('right'));

        prevPageBtn.addEventListener('click', () => { if (state.page > 1) loadPage(state.page - 1); });
        nextPageBtn.addEventListener('click', () => { if (state.page < state.totalPages) loadPage(state.page + 1); });
        createFilteredCardBtn.addEventListener('click', openFilteredCreateCard);

        footerTagSearch?.addEventListener('input', renderFooterTags);
        document.getElementById('btnCancelCreateTag').addEventListener('click', () => closeModal('createTagModal', 'createTagModalContent'));
        document.getElementById('btnCloseCreateTagModal').addEventListener('click', () => closeModal('createTagModal', 'createTagModalContent'));
        document.getElementById('createTagForm').addEventListener('submit', submitCreateTag);
        document.getElementById('btnCancelEditTag').addEventListener('click', () => closeModal('editTagModal', 'editTagModalContent'));
        document.getElementById('btnCloseEditTagModal').addEventListener('click', () => closeModal('editTagModal', 'editTagModalContent'));
        document.getElementById('editTagForm').addEventListener('submit', submitEditCurrentTag);
        document.getElementById('btnCancelCreateRelationType').addEventListener('click', () => closeModal('createRelationTypeModal', 'createRelationTypeModalContent'));
        document.getElementById('btnCloseCreateRelationTypeModal').addEventListener('click', () => closeModal('createRelationTypeModal', 'createRelationTypeModalContent'));
        document.getElementById('createRelationTypeForm').addEventListener('submit', submitCreateRelationType);
        document.getElementById('btnCancelEditRelationType').addEventListener('click', closeRelationTypeActionsModal);
        document.getElementById('btnCloseEditRelationTypeModal').addEventListener('click', closeRelationTypeActionsModal);
        document.getElementById('btnDeleteRelationType').addEventListener('click', deleteEditingRelationType);
        document.getElementById('editRelationTypeForm').addEventListener('submit', submitEditRelationType);
        clearTagFilterBtn.addEventListener('click', () => {
            state.selectedTagIds = [];
            state.selectedTagLabels = [];
            state.withoutTagsOnly = false;
            loadPage(1);
            loadSavedFilters();
        });
        loadSessionUserId().then(() => updateHeaderActions());
        enforceSingleTagSelectionForTagMode();
        renderRightOptionsMenu();
        renderLeftOthersMenu();
        loadSavedFilters();
        loadPage(state.page);
    </script>
</body>
</html>
