<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Filtros - Gluon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gluon: {
                            dark: '#0f172a',
                            primary: '#3b82f6',
                            secondary: '#1e293b',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --card-filters-left-menu-width: 16rem;
            --card-filters-right-menu-width: 16rem;
            --card-filters-menu-min-width: 16rem;
            --card-filters-menu-max-width: min(32rem, 34vw);
        }
        .sequence-reorder-list { align-items: center; min-height: 2.25rem; }
        .sequence-reorder-list.sequence-drag-active { border-radius: 0.75rem; background: rgba(14, 165, 233, 0.08); box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.26); padding: 0.25rem; margin: -0.25rem; }
        .sequence-tag-chip.sequence-dragging { display: none; }
        .desktop-menu-resize-handle { display: none; }
        @media (min-width: 1024px) {
            #cardFiltersLayout {
                grid-template-columns: var(--card-filters-left-menu-width) minmax(0, 1fr) var(--card-filters-right-menu-width);
            }
            .desktop-resizable-menu {
                min-width: var(--card-filters-menu-min-width);
                max-width: var(--card-filters-menu-max-width);
            }
            .desktop-menu-resize-handle {
                display: flex;
                position: absolute;
                top: 0.75rem;
                bottom: 0.75rem;
                z-index: 10;
                width: 0.75rem;
                cursor: ew-resize;
                touch-action: none;
                align-items: center;
                justify-content: center;
                color: rgb(148 163 184 / 0.8);
            }
            .desktop-menu-resize-handle:hover,
            .desktop-menu-resize-handle:focus-visible,
            .desktop-menu-resize-handle.is-resizing {
                color: rgb(186 230 253);
            }
            .desktop-menu-resize-handle::before {
                content: '';
                width: 0.25rem;
                height: 3rem;
                border-radius: 9999px;
                background: currentColor;
                opacity: 0.55;
            }
            .desktop-menu-resize-handle[data-resize-menu="left"] { right: -0.375rem; }
            .desktop-menu-resize-handle[data-resize-menu="right"] { left: -0.375rem; }
            body.card-filters-resizing {
                cursor: ew-resize;
                user-select: none;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gluon-dark text-slate-100">
    <div class="flex min-h-screen flex-col">
        <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-950/95 px-4 py-4 backdrop-blur">
            <div class="flex w-full items-center justify-between gap-3">
                <a href="/dashboard" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-violet-400 hover:text-white">
                    <i class="fa-solid fa-arrow-left"></i>
                    Dashboard
                </a>
                <div class="flex items-center gap-2">
                    <button id="selectedTagsVisibilityIndicator" type="button" class="hidden inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-700 text-slate-400 transition hover:bg-slate-800/80 disabled:cursor-not-allowed disabled:opacity-60" title="Tags privadas" aria-label="Tags privadas">
                        <i class="fa-solid fa-lock"></i>
                    </button>
                    <button id="editCurrentTagBtn" type="button" class="hidden inline-flex h-10 w-10 items-center justify-center rounded-xl border border-amber-500/50 text-amber-300 transition hover:bg-amber-500/20 hover:text-amber-200" title="Editar tag selecionada" aria-label="Editar tag selecionada">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button id="createTagBtn" type="button" class="hidden inline-flex h-10 w-10 items-center justify-center rounded-xl border border-violet-500/50 text-violet-300 transition hover:bg-violet-500/20 hover:text-violet-200" title="Criar nova tag" aria-label="Criar nova tag">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <button id="createRelationTypeBtn" type="button" class="hidden inline-flex h-10 w-10 items-center justify-center rounded-xl border border-emerald-500/50 text-emerald-300 transition hover:bg-emerald-500/20 hover:text-emerald-200" title="Criar novo tipo de relação" aria-label="Criar novo tipo de relação">
                        <i class="fa-solid fa-folder-plus"></i>
                    </button>
                    <button id="createFilteredCardBtn" type="button" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-violet-400 hover:text-white">
                        <i class="fa-solid fa-plus"></i>
                        Novo card
                    </button>
                </div>
            </div>
        </header>

        <div id="mobileDrawerBackdrop" class="fixed inset-0 z-30 hidden bg-black/60 opacity-0 transition-opacity duration-200 lg:hidden"></div>

        <div id="cardFiltersLayout" class="grid w-full flex-1 grid-cols-1 gap-4 py-6">
            <aside id="leftFiltersMenu" aria-label="Menu lateral esquerdo" class="desktop-resizable-menu fixed inset-y-0 left-0 z-40 w-[85vw] max-w-xs -translate-x-full overflow-y-auto border-r border-slate-800 bg-slate-950 p-4 shadow-2xl shadow-black/50 transition-transform duration-200 lg:sticky lg:top-28 lg:z-auto lg:mx-0 lg:ml-0 lg:mr-4 lg:h-[calc(100vh-12rem)] lg:w-auto lg:max-w-none lg:translate-x-0 lg:overflow-y-auto lg:rounded-2xl lg:border lg:bg-slate-900/50 lg:shadow-none">
                <button type="button" class="desktop-menu-resize-handle" data-resize-menu="left" aria-label="Redimensionar menu de filtros" title="Arraste para aumentar o menu de filtros"></button>
                <div class="mb-4 flex items-center justify-between gap-2">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Filtros</p>
                        <h2 class="mt-1 text-base font-bold text-white">Tags fixadas</h2>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="savedFiltersCount" class="rounded-full border border-sky-500/40 bg-sky-500/20 px-2 py-0.5 text-xs font-semibold text-sky-100">0</span>
                        <button type="button" data-close-mobile-menu class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-700 text-slate-300 transition hover:border-sky-400 hover:text-white lg:hidden" title="Fechar filtros" aria-label="Fechar filtros">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
                <section class="mb-4 rounded-xl border border-sky-500/20 bg-sky-950/20 p-3" aria-labelledby="leftTagSearchLabel">
                    <label id="leftTagSearchLabel" for="leftTagSearchInput" class="text-xs font-semibold uppercase tracking-[0.2em] text-sky-300">Pesquisar tags</label>
                    <div class="mt-2 flex items-center gap-2 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 focus-within:border-sky-400 focus-within:ring-2 focus-within:ring-sky-500/20">
                        <i class="fa-solid fa-magnifying-glass text-slate-500" aria-hidden="true"></i>
                        <input id="leftTagSearchInput" type="search" autocomplete="off" placeholder="Digite para buscar qualquer tag..." class="w-full bg-transparent text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none">
                    </div>
                    <p class="mt-2 text-[11px] text-slate-500">Mostra tags além das fixadas conforme você digita.</p>
                    <div id="leftTagSearchResults" class="mt-3 hidden max-h-72 space-y-2 overflow-y-auto pr-1 text-sm text-slate-300"></div>
                </section>
                <div id="leftOthersMenu" class="mb-4 space-y-2 text-sm text-slate-300"></div>
                <div id="savedFiltersList" class="space-y-2 text-sm text-slate-300">
                    <p class="text-xs text-slate-500">Carregando tags fixadas...</p>
                </div>
                <button id="clearTagFilterBtn" type="button" class="mt-4 hidden w-full rounded-xl border border-slate-700 px-3 py-2 text-xs font-semibold text-slate-300 transition hover:border-violet-400 hover:text-white">
                    Limpar filtros de tags
                </button>
            </aside>

            <main class="min-w-0 px-4 lg:px-0">
                <div id="statusBox" class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 text-center text-slate-300">
                    <i class="fa-solid fa-spinner fa-spin mr-2 text-violet-300"></i>Carregando cards...
                </div>
                <section id="cardsGrid" class="hidden grid-cols-1 gap-4 md:grid-cols-2"></section>
                <section id="tagFamilySections" class="hidden space-y-4"></section>
                <section id="tagFormSection" class="hidden"></section>
            </main>

            <aside id="rightActionsMenu" aria-label="Menu lateral direito" class="desktop-resizable-menu fixed inset-y-0 right-0 z-40 w-[85vw] max-w-xs translate-x-full overflow-y-auto border-l border-slate-800 bg-slate-950 p-4 shadow-2xl shadow-black/50 transition-transform duration-200 lg:sticky lg:top-28 lg:z-auto lg:mx-0 lg:ml-4 lg:mr-0 lg:h-[calc(100vh-12rem)] lg:w-auto lg:max-w-none lg:translate-x-0 lg:rounded-2xl lg:border lg:bg-slate-900/50 lg:shadow-none">
                <button type="button" class="desktop-menu-resize-handle" data-resize-menu="right" aria-label="Redimensionar menu de ações" title="Arraste para aumentar o menu de ações"></button>
                <div class="mb-4 flex items-center justify-between gap-2">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-sky-300">Menu</p>
                        <h2 class="mt-1 text-base font-bold text-white">Ações rápidas</h2>
                    </div>
                    <button type="button" data-close-mobile-menu class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-700 text-slate-300 transition hover:border-sky-400 hover:text-white lg:hidden" title="Fechar ações" aria-label="Fechar ações">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="rightOptionsMenu" class="space-y-2 text-sm text-slate-300"></div>
            </aside>
        </div>

        <footer class="sticky bottom-0 border-t border-slate-800 bg-slate-950/95 px-4 py-4 backdrop-blur">
            <div id="cardsPaginationFooter" class="flex w-full flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div id="paginationInfo" class="text-sm text-slate-400">Página 1 de 1</div>
                <div class="grid grid-cols-2 gap-2 lg:hidden">
                    <button id="openLeftMenuBtn" type="button" class="rounded-xl border border-sky-500/50 bg-sky-500/10 px-4 py-2 text-sm font-semibold text-sky-100 transition hover:bg-sky-500/20">
                        <i class="fa-solid fa-filter mr-2"></i>Filtros
                    </button>
                    <button id="openRightMenuBtn" type="button" class="rounded-xl border border-violet-500/50 bg-violet-500/10 px-4 py-2 text-sm font-semibold text-violet-100 transition hover:bg-violet-500/20">
                        <i class="fa-solid fa-bars mr-2"></i>Menu
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button id="prevPageBtn" type="button" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 disabled:cursor-not-allowed disabled:opacity-40 hover:not-disabled:border-violet-400">
                        <i class="fa-solid fa-chevron-left mr-2"></i>Anterior

                    <button id="nextPageBtn" type="button" class="rounded-xl border border-slate-700 px-4 py-2 text-sm font-semibold text-slate-200 disabled:cursor-not-allowed disabled:opacity-40 hover:not-disabled:border-violet-400">
                        Próxima<i class="fa-solid fa-chevron-right ml-2"></i>

            <div id="tagRelationFooter" class="hidden w-full space-y-3">
                <div class="grid grid-cols-2 gap-2 lg:hidden">
                    <button id="openLeftMenuBtnTags" type="button" class="rounded-xl border border-sky-500/50 bg-sky-500/10 px-4 py-2 text-sm font-semibold text-sky-100 transition hover:bg-sky-500/20"><i class="fa-solid fa-filter mr-2"></i>Filtros</button>
                    <button id="openRightMenuBtnTags" type="button" class="rounded-xl border border-violet-500/50 bg-violet-500/10 px-4 py-2 text-sm font-semibold text-violet-100 transition hover:bg-violet-500/20"><i class="fa-solid fa-bars mr-2"></i>Menu</button>
                </div>
                <div id="footerTagSelector" class="hidden min-h-[48px] flex-wrap gap-2 rounded-lg border border-slate-700 bg-slate-900/70 p-3"></div>
                <input id="footerTagSearch" type="text" placeholder="Pesquisar tag por nome..." class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-base text-slate-100">
            </div>
        </footer>

    <div id="createRelationTypeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4">
        <div id="createRelationTypeModalContent" class="w-[92%] max-w-lg rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
            <form id="createRelationTypeForm" class="space-y-3">
                <div class="flex items-center justify-between"><h3 class="text-lg font-semibold">Criar tipo de relação</h3><button id="btnCloseCreateRelationTypeModal" type="button" class="text-slate-400 hover:text-white text-xl">&times;</button></div>
                <input id="createRelationTypeNameInput" type="text" required maxlength="120" placeholder="Nome do tipo de relação" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2">
                <select id="createRelationTypeHierarchyInput" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2"><option value="0">0 - Conjunto simples</option><option value="1">1 - Árvore parental</option><option value="2">2 - Sequência</option><option value="3">3 - Componente conexo</option><option value="4">4 - Replicação familiar</option></select>
                <div class="flex justify-end gap-2 pt-2"><button id="btnCancelCreateRelationType" type="button" class="rounded-lg border border-slate-600 px-4 py-2">Cancelar</button><button id="btnSubmitCreateRelationType" type="submit" class="rounded-lg bg-emerald-600 px-4 py-2 hover:bg-emerald-500">Criar relação</button></div>
            </form>
        </div>

    <div id="editRelationTypeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 opacity-0 transition-opacity duration-200 p-4" role="dialog" aria-modal="true">
        <div id="editRelationTypeModalContent" class="w-[92%] max-w-md rounded-xl border border-slate-700 bg-slate-900 p-4 scale-95 transition-transform duration-200">
            <form id="editRelationTypeForm" class="space-y-4">
                <div class="flex items-center justify-between gap-3"><h3 class="text-lg font-semibold">Editar sessão</h3><button id="btnCloseEditRelationTypeModal" type="button" class="text-slate-400 hover:text-white text-xl">&times;</button></div>
                <input id="editRelationTypeNameInput" type="text" maxlength="120" placeholder="Nome da sessão" class="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2">
                <div class="flex flex-col gap-2 pt-2 sm:flex-row sm:items-center sm:justify-between">
                    <button type="button" id="btnDeleteRelationType" class="rounded-lg border border-red-500/60 px-4 py-2 text-red-300 hover:bg-red-500/10">Excluir sessão</button>
                    <div class="flex justify-end gap-2"><button type="button" id="btnCancelEditRelationType" class="rounded-lg border border-slate-600 px-4 py-2">Cancelar</button><button type="submit" id="btnSubmitEditRelationType" class="rounded-lg bg-violet-600 px-4 py-2 hover:bg-violet-500">Salvar</button></div>
                </div>
            </form>
        </div>
    </div>



    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const state = {
            page: Number(urlParams.get('page')) || 1,
            totalPages: 1,
            totalCards: 0,
            selectedTagIds: parseSelectedTagIds(urlParams),
            selectedTagLabels: parseSelectedTagLabels(urlParams),
            selectedTagLinkTypes: parseSelectedTagLinkTypes(urlParams),
            selectedInfoTypes: parseSelectedInfoTypes(urlParams),
            viewMode: parseViewMode(urlParams),
            withoutTagsOnly: parseWithoutTagsOnly(urlParams),
            longTextOnly: parseLongTextOnly(urlParams),
            expandedTagIds: new Set(),
            leftOthersExpanded: false,
            rightModeExpanded: false,
            rightOptionsExpanded: false,
            rightIntentFiltersExpanded: false,
            tagFamily: { mothers: [], children: [] },
            relationTypes: [],
            tagFamilyLoading: false,
            tags: [],
            sessionUserId: null,
            removalRelationType: null,
            reorderRelationType: null,
            draggedSequenceTagId: null,
            editingRelationTypeId: null,
            selectedRelationType: null,
            leftTagSearchQuery: '',
            savedFilterTagIds: new Set(),
            pinningSelectedTags: false,
            updatingSelectedTagsVisibility: false,
            mainFormMode: null,
            tagSortDirection: ['asc', 'desc'].includes(urlParams.get('tag_sort')) ? urlParams.get('tag_sort') : 'asc'
        };
        
        state.selectedInfoTypes = normalizeSelectedInfoTypes(state.selectedInfoTypes);
        if (state.withoutTagsOnly && isCardListMode()) {
            state.selectedTagIds = [];
            state.selectedTagLabels = [];
        }

        const cardsGrid = document.getElementById('cardsGrid');
        const tagFamilySections = document.getElementById('tagFamilySections');
        const tagFormSection = document.getElementById('tagFormSection');
        const statusBox = document.getElementById('statusBox');
        const createFilteredCardBtn = document.getElementById('createFilteredCardBtn');
        const selectedTagsVisibilityIndicator = document.getElementById('selectedTagsVisibilityIndicator');
        const editCurrentTagBtn = document.getElementById('editCurrentTagBtn');
        const createTagBtn = document.getElementById('createTagBtn');
        const createRelationTypeBtn = document.getElementById('createRelationTypeBtn');
        const cardsPaginationFooter = document.getElementById('cardsPaginationFooter');
        const tagRelationFooter = document.getElementById('tagRelationFooter');
        const footerTagSelector = document.getElementById('footerTagSelector');
        const footerTagSearch = document.getElementById('footerTagSearch');
        const paginationInfo = document.getElementById('paginationInfo');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const clearTagFilterBtn = document.getElementById('clearTagFilterBtn');
        const leftOthersMenu = document.getElementById('leftOthersMenu');
        const leftTagSearchInput = document.getElementById('leftTagSearchInput');
        const leftTagSearchResults = document.getElementById('leftTagSearchResults');
        const rightOptionsMenu = document.getElementById('rightOptionsMenu');
        const leftFiltersMenu = document.getElementById('leftFiltersMenu');
        const rightActionsMenu = document.getElementById('rightActionsMenu');
        const mobileDrawerBackdrop = document.getElementById('mobileDrawerBackdrop');
        const openLeftMenuBtn = document.getElementById('openLeftMenuBtn');
        const openRightMenuBtn = document.getElementById('openRightMenuBtn');
        const openLeftMenuBtnTags = document.getElementById('openLeftMenuBtnTags');
        const openRightMenuBtnTags = document.getElementById('openRightMenuBtnTags');
        const cardFiltersLayout = document.getElementById('cardFiltersLayout');
        const desktopMenuMinWidthPx = 16 * 16;

        function clampDesktopMenuWidth(width) {
            const viewportLimit = Math.floor(window.innerWidth * 0.34);
            const maxWidth = Math.max(desktopMenuMinWidthPx, Math.min(32 * 16, viewportLimit));
            return Math.min(Math.max(width, desktopMenuMinWidthPx), maxWidth);
        }

        function setDesktopMenuWidth(side, width) {
            if (!cardFiltersLayout || !['left', 'right'].includes(side)) return;
            const clampedWidth = clampDesktopMenuWidth(width);
            cardFiltersLayout.style.setProperty(`--card-filters-${side}-menu-width`, `${clampedWidth}px`);
        }

        function setupDesktopMenuResizing() {
            if (!cardFiltersLayout) return;
            const desktopQuery = window.matchMedia('(min-width: 1024px)');
            document.querySelectorAll('[data-resize-menu]').forEach((handle) => {
                handle.addEventListener('pointerdown', (event) => {
                    if (!desktopQuery.matches || event.button !== 0) return;
                    const side = handle.dataset.resizeMenu;
                    const menu = side === 'left' ? leftFiltersMenu : rightActionsMenu;
                    if (!menu) return;
                    event.preventDefault();
                    handle.setPointerCapture?.(event.pointerId);
                    handle.classList.add('is-resizing');
                    document.body.classList.add('card-filters-resizing');
                    const startX = event.clientX;
                    const startWidth = menu.getBoundingClientRect().width;
                    const onPointerMove = (moveEvent) => {
                        const delta = moveEvent.clientX - startX;
                        const nextWidth = side === 'left' ? startWidth + delta : startWidth - delta;
                        setDesktopMenuWidth(side, nextWidth);
                    };
                    const stopResizing = () => {
                        handle.classList.remove('is-resizing');
                        document.body.classList.remove('card-filters-resizing');
                        window.removeEventListener('pointermove', onPointerMove);
                        window.removeEventListener('pointerup', stopResizing);
                        window.removeEventListener('pointercancel', stopResizing);
                    };
                    window.addEventListener('pointermove', onPointerMove);
                    window.addEventListener('pointerup', stopResizing);
                    window.addEventListener('pointercancel', stopResizing);
                });
            });
        }

        function setMobileDrawerBackdrop(open) {
            if (!mobileDrawerBackdrop) return;
            mobileDrawerBackdrop.classList.toggle('hidden', !open);
            requestAnimationFrame(() => {
                mobileDrawerBackdrop.classList.toggle('opacity-0', !open);
                mobileDrawerBackdrop.classList.toggle('opacity-100', open);
            });
        }

        function closeMobileMenus() {
            leftFiltersMenu?.classList.add('-translate-x-full');
            rightActionsMenu?.classList.add('translate-x-full');
            setMobileDrawerBackdrop(false);
            document.body.classList.remove('overflow-hidden');
        }

        function openMobileMenu(side) {
            const isLeft = side === 'left';
            setMobileDrawerBackdrop(true);
            document.body.classList.add('overflow-hidden');
            leftFiltersMenu?.classList.toggle('-translate-x-full', !isLeft);
            rightActionsMenu?.classList.toggle('translate-x-full', isLeft);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
        }

        function getTagLabel(tag = {}, numeroPtBrCounts = null) {
            const numero = tag?.numero;
            const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
            const name = String(tag?.name || '').trim();
            const namePtBr = String(tag?.name_pt_br || '').trim();
            if (hasNumero) {
                const numeroKey = String(numero).trim();
                const qtdTraducoes = numeroPtBrCounts?.get(numeroKey) || 0;
                if (qtdTraducoes > 1 && namePtBr) return `${numeroKey} (${namePtBr})`;
                return numeroKey;
            }
            if (name && namePtBr && name.toLowerCase() !== namePtBr.toLowerCase()) return `${name} (${namePtBr})`;
            return name || namePtBr || 'Tag sem nome';
        }

        function parseSelectedTagIds(params) {
            const rawTagIds = params.get('tag_ids') || params.get('tag_id') || '';
            return rawTagIds.split(',').map((id) => Number(id)).filter((id, index, ids) => id > 0 && ids.indexOf(id) === index);
        }

        function parseSelectedTagLabels(params) {
            const rawTagNames = params.get('tag_names') || params.get('tag_name') || '';
            return rawTagNames.split('|').map((label) => label.trim()).filter(Boolean);
        }

        function parseViewMode(params) {
            const mode = params.get('mode') || 'cards';
            if (['affirmations', 'translations', 'questions', 'tcoins', 'tag_expansion'].includes(mode)) return 'cards';
            if (mode === 'tag_sessions') return 'tag_sessions';
            return ['tags', 'cards', 'interactive_story'].includes(mode) ? mode : 'cards';
        }

        function isTagsGridMode() {
            return state.viewMode === 'tags';
        }

        function isTagSessionsMode() {
            return state.viewMode === 'tag_sessions';
        }

        function isInteractiveStoryMode() {
            return state.viewMode === 'interactive_story';
        }

        function isAnyTagMode() {
            return isTagsGridMode() || isTagSessionsMode() || isInteractiveStoryMode();
        }

        function isCardListMode() {
            return state.viewMode === 'cards';
        }

        function parseWithoutTagsOnly(params) {
            return params.get('without_tags') === '1';
        }

        function parseLongTextOnly(params) {
            return params.get('long_text') === '1';
        }

        function parseSelectedTagLinkTypes(params) {
            const allowedTypes = ['subject', 'object', 'lexical_chunk'];
            if (!params.has('tag_link_types')) return [...allowedTypes];
            const rawTypes = params.get('tag_link_types') || '';
            const parsedTypes = rawTypes.split(',').map((type) => type.trim()).filter((type, index, types) => allowedTypes.includes(type) && types.indexOf(type) === index);
            return parsedTypes;
        }

        function getAllowedIntentTypes() {
            return ['0', '5', '4', '1', '2'];
        }

        function normalizeSelectedInfoTypes(types = []) {
            const allowedTypes = getAllowedIntentTypes();
            const parsedTypes = types.filter((type, index) => allowedTypes.includes(type) && types.indexOf(type) === index);
            if (!parsedTypes.length || parsedTypes.length === allowedTypes.length) return [...allowedTypes];
            return [parsedTypes[0]];
        }

        function parseSelectedInfoTypes(params) {
            if (!params.has('info_types')) return getAllowedIntentTypes();
            const rawTypes = params.get('info_types') || '';
            return normalizeSelectedInfoTypes(rawTypes.split(',').map((type) => type.trim()));
        }

        async function api(action, payload = {}) {
            const response = await fetch('/api/flashcards', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ ...payload, action }) });
            const result = await response.json();
            if (!response.ok || result.status !== 'success') { const error = new Error(result.message || 'Erro na requisição.'); error.response = result; throw error; }
            return result;
        }

        async function loadSessionUserId() {
            try {
                const response = await fetch('/api/user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'get_session' }) });
                if (!response.ok) return;
                const result = await response.json();
                const parsed = Number(result?.id ?? result?.data?.id);
                if (Number.isInteger(parsed) && parsed > 0) state.sessionUserId = parsed;
            } catch (_) {}
        }

        function canEditTag(tag = {}) {
            const sessionId = Number(state.sessionUserId);
            return Number.isInteger(sessionId) && sessionId > 0 && [Number(tag.user_id), Number(tag.created_by_user_id)].includes(sessionId);
        }

        function isUserOwnedTag(tag = {}) {
            const tagUserId = Number(tag?.user_id);
            const sessionId = Number(state.sessionUserId);
            return Number.isInteger(tagUserId) && tagUserId > 0 && Number.isInteger(sessionId) && sessionId > 0 && tagUserId === sessionId;
        }

        function getTagOwnershipClass(tag = {}, { removalMode = false } = {}) {
            const base = isUserOwnedTag(tag) ? 'bg-emerald-500/15 text-emerald-200 border-emerald-400/80 hover:bg-emerald-500/25' : 'bg-slate-800 text-slate-300 border-slate-600 hover:bg-slate-700';
            return removalMode ? `${base} ring-1 ring-amber-300/70` : base;
        }

        function getSubjectsCount(tag = {}) {
            const value = Number(tag?.subjects_count ?? 0);
            return Number.isFinite(value) && value >= 0 ? value : 0;
        }

        function buildNumeroPtBrCounts(tags = []) {
            const counts = new Map();
            tags.forEach((tag) => {
                const numero = tag?.numero;
                const numeroKey = numero !== null && numero !== undefined ? String(numero).trim() : '';
                const namePtBr = String(tag?.name_pt_br || '').trim();
                if (numeroKey && namePtBr) counts.set(numeroKey, (counts.get(numeroKey) || 0) + 1);
            });
            return counts;
        }

        function renderTagButtonContent(tag = {}, numeroPtBrCounts = null) {
            return `${escapeHtml(getTagLabel(tag, numeroPtBrCounts))} <span class="text-[10px] text-slate-400">(${getSubjectsCount(tag)})</span>`;
        }

        function getCurrentTag() {
            const selectedId = Number(state.selectedTagIds[0] || 0);
            return state.tags.find((tag) => Number(tag.id) === selectedId) || { id: selectedId, name: state.selectedTagLabels[0] || '' };
        }

        function updateHeaderActions() {
            const isTagMode = isAnyTagMode();
            updateSelectedTagsVisibilityIndicator();
            createFilteredCardBtn.classList.toggle('hidden', isTagMode);
            createTagBtn.classList.toggle('hidden', !isTagMode);
            createRelationTypeBtn.classList.toggle('hidden', !isTagMode);
            editCurrentTagBtn.classList.toggle('hidden', !isTagMode || state.selectedTagIds.length !== 1 || !canEditTag(getCurrentTag()));
        }

        function normalizeSavedFilter(filter = {}) {
            return { ...filter, id: Number(filter.id_tag || filter.id || 0) };
        }

        function getSelectedTagSummary() {
            if (!state.selectedTagIds.length) return '';
            return state.selectedTagIds.map((id, index) => state.selectedTagLabels[index] || id).join(', ');
        }

        function buildTagRoute(path, tag = {}) {
            const params = new URLSearchParams();
            const tagId = Number(tag?.id || 0);
            if (tagId) params.set('tag_id', String(tagId));
            const tagName = getTagLabel(tag);
            if (tagName) params.set('tag_name', tagName);
            const query = params.toString();
            return `${path}${query ? `?${query}` : ''}`;
        }

        function buildCardsRoute(page = state.page) {
            const params = new URLSearchParams();
            params.set('page', String(page));
            if (state.viewMode !== 'cards') params.set('mode', state.viewMode);
            if (isTagsGridMode() && state.tagSortDirection !== 'asc') params.set('tag_sort', state.tagSortDirection);
            if (state.withoutTagsOnly && isCardListMode()) params.set('without_tags', '1');
            if (state.longTextOnly && isCardListMode()) params.set('long_text', '1');
            if (state.selectedTagIds.length) {
                params.set('tag_ids', state.selectedTagIds.join(','));
                if (state.selectedTagLabels.length) params.set('tag_names', state.selectedTagLabels.join('|'));
            }
            if (state.selectedTagLinkTypes.length !== 3) params.set('tag_link_types', state.selectedTagLinkTypes.join(','));
            if (state.selectedInfoTypes.length !== 5) params.set('info_types', state.selectedInfoTypes.join(','));
            return `/card_filters?${params.toString()}`;
        }

        function buildChildrenByMother(relations = []) {
            return relations.reduce((acc, relation) => {
                const motherId = Number(relation.id_tag_mother || 0);
                const childId = Number(relation.id_tag_child || 0);
                if (!motherId || !childId) return acc;
                if (!acc.has(motherId)) acc.set(motherId, []);
                if (!acc.get(motherId).includes(childId)) acc.get(motherId).push(childId);
                return acc;
            }, new Map());
        }

        function renderTagTreeItem(tag, tagById, childrenByMother, depth = 0, visited = new Set()) {
            const tagId = Number(tag.id) || 0;
            const label = getTagLabel(tag);
            const isActive = state.selectedTagIds.includes(tagId);
            const childIds = (childrenByMother.get(tagId) || []).filter((childId) => !visited.has(childId) && tagById.has(childId));
            const hasChildren = childIds.length > 0;
            const isExpanded = state.expandedTagIds.has(tagId);
            const childMarkup = hasChildren && isExpanded
                ? `<div class="mt-2 space-y-2 border-l border-sky-500/20 pl-3">${childIds.map((childId) => renderTagTreeItem(tagById.get(childId), tagById, childrenByMother, depth + 1, new Set([...visited, tagId]))).join('')}</div>`
                : '';

            return `
                <article class="rounded-xl border ${isActive ? 'border-violet-400/80 bg-violet-950/40' : 'border-sky-500/20 bg-sky-950/20'} p-3 transition hover:border-sky-400/60 hover:bg-sky-950/40" data-tag-tree-depth="${depth}">
                    <div class="flex items-center gap-2">
                        <button type="button" data-tag-accordion-id="${tagId}" aria-expanded="${isExpanded ? 'true' : 'false'}" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg border border-slate-700 text-xs ${hasChildren ? 'text-sky-200 hover:border-sky-400 hover:text-white' : 'cursor-default text-slate-600 opacity-50'}" ${hasChildren ? '' : 'disabled'} title="${hasChildren ? 'Mostrar tags filhas' : 'Sem tags filhas'}">
                            <i class="fa-solid ${hasChildren && isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
                        </button>
                        <button type="button" data-tag-filter-id="${tagId}" class="min-w-0 flex-1 text-left text-sm font-semibold ${isActive ? 'text-violet-100' : 'text-slate-100'} transition hover:text-sky-100">
                            <span class="break-words">${escapeHtml(label)}</span>
                        </button>
                    </div>
                    ${childMarkup}
                </article>
            `;
        }



        function tagMatchesLeftSearch(tag = {}, query = '') {
            const normalizedQuery = query.toLowerCase().trim();
            if (!normalizedQuery) return false;
            return [tag.name, tag.name_pt_br, tag.numero]
                .map((value) => String(value ?? '').toLowerCase())
                .some((value) => value.includes(normalizedQuery));
        }

        function renderLeftTagSearchResults() {
            if (!leftTagSearchResults) return;
            const query = state.leftTagSearchQuery.trim();
            const hideResults = () => {
                leftTagSearchResults.innerHTML = '';
                leftTagSearchResults.classList.add('hidden');
            };
            if (query.length < 2) { hideResults(); return; }
            const matches = state.tags.filter((tag) => tagMatchesLeftSearch(tag, query));
            if (!matches.length) {
                leftTagSearchResults.innerHTML = `<p class="rounded-lg border border-slate-700 bg-slate-950/60 p-3 text-xs text-slate-400">Nenhuma tag encontrada para "${escapeHtml(query)}".</p>`;
                leftTagSearchResults.classList.remove('hidden');
                return;
            }
            const maxResults = 80;
            const filtered = matches.slice(0, maxResults);
            const numeroPtBrCounts = buildNumeroPtBrCounts(filtered);
            const summary = matches.length > maxResults ? `<p class="text-[11px] text-amber-300">Mostrando ${maxResults} de ${matches.length} tags. Refine a busca.</p>` : '';
            leftTagSearchResults.innerHTML = summary + filtered.map((tag) => {
                const tagId = Number(tag.id) || 0;
                const isActive = state.selectedTagIds.includes(tagId);
                return `<button type="button" data-left-search-tag-id="${tagId}" aria-pressed="${isActive ? 'true' : 'false'}" class="w-full rounded-xl border p-3 text-left text-sm font-semibold transition ${isActive ? 'border-violet-400/80 bg-violet-950/40 text-violet-100' : 'border-sky-500/20 bg-sky-950/20 text-slate-100 hover:border-sky-400/60 hover:bg-sky-950/40 hover:text-sky-100'}">${renderTagButtonContent(tag, numeroPtBrCounts)}</button>`;
            }).join('');
            leftTagSearchResults.classList.remove('hidden');
            leftTagSearchResults.querySelectorAll('[data-left-search-tag-id]').forEach((button) => {
                button.addEventListener('click', () => {
                    const tagId = Number(button.dataset.leftSearchTagId) || 0;
                    const tag = state.tags.find((item) => Number(item.id) === tagId) || {};
                    if (!tagId) return;
                    toggleTagFilter(tagId, tag);
                    renderRightOptionsMenu();
                    loadPage(1);
                    loadSavedFilters();
                    renderLeftTagSearchResults();
                });
            });
        }

        function getSelectedPinnedTagIds() {
            return state.selectedTagIds.filter((tagId) => Number(tagId) > 0 && state.savedFilterTagIds.has(Number(tagId)));
        }

        function getSelectedUnpinnedTagIds() {
            return state.selectedTagIds.filter((tagId) => Number(tagId) > 0 && !state.savedFilterTagIds.has(Number(tagId)));
        }

        function getSelectedPinToggleConfig() {
            const selectedCount = state.selectedTagIds.length;
            const pinnedIds = getSelectedPinnedTagIds();
            const unpinnedIds = getSelectedUnpinnedTagIds();
            const hasPinned = pinnedIds.length > 0;
            const hasUnpinned = unpinnedIds.length > 0;
            let label = selectedCount === 1 ? 'Fixar tag' : 'Fixar tags';
            let description = selectedCount === 1 ? 'Cria o filtro desta tag.' : 'Cria filtros para estas tags.';
            let icon = 'fa-thumbtack';
            if (hasPinned && !hasUnpinned) {
                label = selectedCount === 1 ? 'Desfixar tag' : 'Desfixar tags';
                description = selectedCount === 1 ? 'Remove o filtro desta tag.' : 'Remove os filtros destas tags.';
                icon = 'fa-thumbtack';
            } else if (hasPinned && hasUnpinned) {
                label = selectedCount === 1 ? 'Inverter fixação da tag' : 'Inverter fixação das tags';
                description = 'Fixa as tags não fixadas e desfixa as já fixadas.';
                icon = 'fa-retweet';
            }
            return { selectedCount, pinnedIds, unpinnedIds, hasPinned, hasUnpinned, label, description, icon };
        }

        function getSelectedTags() {
            return state.selectedTagIds.map((tagId, index) => state.tags.find((tag) => Number(tag.id) === Number(tagId)) || { id: tagId, name: state.selectedTagLabels[index] || '' }).filter((tag) => Number(tag.id) > 0);
        }

        function getSelectedTagsVisibilityConfig() {
            const selectedTags = getSelectedTags();
            const ownedTags = selectedTags.filter((tag) => canEditTag(tag));
            const hasNonOwned = selectedTags.length > 0 && ownedTags.length !== selectedTags.length;
            const allOwnedPublic = ownedTags.length > 0 && ownedTags.every((tag) => Number(tag.user_id) === 5);
            const fixedSelectedTagIds = state.selectedTagIds.filter((tagId) => state.savedFilterTagIds.has(Number(tagId)));
            const fixedOwnedTags = ownedTags.filter((tag) => state.savedFilterTagIds.has(Number(tag.id)));
            return { selectedTags, ownedTags, hasNonOwned, nextPublic: !allOwnedPublic, fixedSelectedTagIds, fixedOwnedTags };
        }

        function getSelectedTagsVisibilityStatus() {
            const selectedTags = getSelectedTags();
            if (!selectedTags.length) return 'none';
            const publicCount = selectedTags.filter((tag) => Number(tag.user_id) === 5).length;
            if (publicCount === selectedTags.length) return 'public';
            if (publicCount > 0) return 'mixed';
            return 'private';
        }

        function updateSelectedTagsVisibilityIndicator() {
            if (!selectedTagsVisibilityIndicator) return;
            const status = getSelectedTagsVisibilityStatus();
            const unpinnedSelectedTagIds = getSelectedUnpinnedTagIds();
            const { ownedTags } = getSelectedTagsVisibilityConfig();
            const isBusy = state.pinningSelectedTags || state.updatingSelectedTagsVisibility;
            const canRunAction = state.selectedTagIds.length > 0 && (unpinnedSelectedTagIds.length > 0 || ownedTags.length > 0);
            const config = {
                none: {
                    hidden: true,
                    icon: 'fa-lock',
                    className: 'border-slate-700 text-slate-400',
                    label: 'Nenhuma tag selecionada'
                },
                public: {
                    hidden: false,
                    icon: 'fa-globe',
                    className: 'border-emerald-500/50 bg-emerald-500/10 text-emerald-300 hover:bg-emerald-500/20',
                    label: state.selectedTagIds.length > 1 ? 'Todas as tags selecionadas são públicas' : 'Tag pública'
                },
                mixed: {
                    hidden: false,
                    icon: 'fa-globe',
                    className: 'border-orange-500/50 bg-orange-500/10 text-orange-300 hover:bg-orange-500/20',
                    label: 'Algumas tags selecionadas são públicas'
                },
                private: {
                    hidden: false,
                    icon: 'fa-lock',
                    className: 'border-slate-700 bg-slate-800/60 text-slate-400 hover:bg-slate-700/70',
                    label: state.selectedTagIds.length > 1 ? 'Todas as tags selecionadas são privadas' : 'Tag privada'
                }
            }[status];
            const actionLabel = unpinnedSelectedTagIds.length > 0
                ? (unpinnedSelectedTagIds.length === 1 ? 'Fixar tag selecionada' : 'Fixar tags selecionadas')
                : (ownedTags.length > 0 ? (ownedTags.length === 1 ? 'Alterar visibilidade da tag selecionada' : 'Alterar visibilidade das tags selecionadas') : 'Apenas o dono da tag pode alterar a visibilidade');
            selectedTagsVisibilityIndicator.className = `inline-flex h-10 w-10 items-center justify-center rounded-xl border transition disabled:cursor-not-allowed disabled:opacity-60 ${config.className}`;
            selectedTagsVisibilityIndicator.classList.toggle('hidden', config.hidden);
            selectedTagsVisibilityIndicator.disabled = !canRunAction || isBusy;
            selectedTagsVisibilityIndicator.title = canRunAction ? actionLabel : config.label;
            selectedTagsVisibilityIndicator.setAttribute('aria-label', canRunAction ? actionLabel : config.label);
            selectedTagsVisibilityIndicator.innerHTML = `<i class="fa-solid ${isBusy ? 'fa-spinner fa-spin' : config.icon}"></i>`;
        }

        async function updateSelectedTagsVisibility() {
            const { ownedTags } = getSelectedTagsVisibilityConfig();
            if (!ownedTags.length || state.updatingSelectedTagsVisibility) return;
            state.updatingSelectedTagsVisibility = true;
            updateHeaderActions();
            renderRightOptionsMenu();
            try {
                const result = await api('toggle_selected_owned_tags_visibility', { ids: ownedTags.map((tag) => Number(tag.id)) });
                const updatedById = new Map((result.updated_tags || []).map((tag) => [Number(tag.id), tag]));
                state.tags = state.tags.map((tag) => {
                    const updated = updatedById.get(Number(tag.id));
                    return updated ? { ...tag, user_id: Number(updated.user_id), created_by_user_id: Number(updated.created_by_user_id || tag.created_by_user_id || state.sessionUserId) } : tag;
                });
                updateHeaderActions();
                await loadSavedFilters();
                if (isCardListMode()) await loadPage(1);
            } catch (error) {
                alert(error.message || 'Não foi possível alterar a visibilidade das tags selecionadas.');
            } finally {
                state.updatingSelectedTagsVisibility = false;
                updateHeaderActions();
                renderRightOptionsMenu();
            }
        }

        async function pinSelectedTags() {
            const { pinnedIds, unpinnedIds, selectedCount } = getSelectedPinToggleConfig();
            if (!selectedCount || state.pinningSelectedTags) return;
            state.pinningSelectedTags = true;
            updateHeaderActions();
            renderRightOptionsMenu();
            try {
                await Promise.all([
                    ...unpinnedIds.map((tagId) => api('toggle_saved_filter', { tag_id: tagId })),
                    ...pinnedIds.map((tagId) => api('remove_saved_filter', { tag_id: tagId }))
                ]);
                await loadSavedFilters();
            } catch (error) {
                alert(error.message || 'Não foi possível atualizar a fixação das tags selecionadas.');
            } finally {
                state.pinningSelectedTags = false;
                updateHeaderActions();
                renderRightOptionsMenu();
            }
        }

        function handleSelectedTagsHeaderAction() {
            if (getSelectedUnpinnedTagIds().length > 0) {
                pinSelectedTags();
                return;
            }
            updateSelectedTagsVisibility();
        }

        function renderRightOptionsMenu() {
            const modes = [
                { mode: 'cards', label: 'Cards' },
                { mode: 'tags', label: 'Tags Grid' },
                { mode: 'tag_sessions', label: 'Tags Sessões' },
                { mode: 'interactive_story', label: 'História Interativa' }
            ];
            const options = [
                { type: 'subject', label: 'Sujeito' },
                { type: 'object', label: 'Objeto' },
                { type: 'lexical_chunk', label: 'Lexical Chunk' }
            ];
            const cardOptions = [
                { flag: 'longTextOnly', label: '+80 ch', description: 'Cards com mais de 80 caracteres no front ou no back.' }
            ];
            const intentOptions = [
                { type: 'all', label: 'Todos os tipos' },
                { type: '0', label: 'Afirmations' },
                { type: '5', label: 'Tag Expansion' },
                { type: '4', label: 'Tcoins' },
                { type: '1', label: 'Tradução' },
                { type: '2', label: 'Pergunta' }
            ];
            const pinToggleConfig = getSelectedPinToggleConfig();
            const pinToggleButton = pinToggleConfig.selectedCount > 0 ? `
                <button type="button" id="toggleSelectedPinnedTagsBtn" class="w-full rounded-xl border border-amber-400/60 bg-amber-500/10 p-3 text-left text-sm font-semibold text-amber-100 transition hover:bg-amber-500/20 disabled:cursor-not-allowed disabled:opacity-60" ${state.pinningSelectedTags ? 'disabled' : ''}>
                    <span class="flex items-center gap-2"><i class="fa-solid ${state.pinningSelectedTags ? 'fa-spinner fa-spin' : pinToggleConfig.icon}"></i>${escapeHtml(pinToggleConfig.label)}</span>
                    <span class="mt-1 block text-xs font-normal text-amber-200/80">${escapeHtml(pinToggleConfig.description)}</span>
                </button>
            ` : '';
            rightOptionsMenu.innerHTML = `
                ${pinToggleButton}
                <article class="rounded-xl border border-violet-500/20 bg-violet-950/20 p-3 transition hover:border-violet-400/60 hover:bg-violet-950/40">
                    <div class="flex items-center gap-2">
                        <button type="button" id="rightModeAccordionBtn" aria-expanded="${state.rightModeExpanded ? 'true' : 'false'}" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg border border-slate-700 text-xs text-violet-200 hover:border-violet-400 hover:text-white" title="Mostrar modos">
                            <i class="fa-solid ${state.rightModeExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
                        </button>
                        <button type="button" id="rightModeTitleBtn" class="min-w-0 flex-1 text-left text-sm font-semibold text-slate-100 transition hover:text-violet-100">
                            <span class="break-words">Modo</span>
                        </button>
                    </div>
                    ${state.rightModeExpanded ? `<div class="mt-2 space-y-2 border-l border-violet-500/20 pl-3">${modes.map((option) => {
                        const isActive = state.viewMode === option.mode;
                        return `<button type="button" data-view-mode="${option.mode}" aria-pressed="${isActive ? 'true' : 'false'}" class="w-full rounded-xl border p-3 text-left text-sm font-semibold transition ${isActive ? 'border-violet-400/80 bg-violet-950/40 text-violet-100' : 'border-violet-500/20 bg-violet-950/20 text-slate-100 hover:border-violet-400/60 hover:bg-violet-950/40 hover:text-violet-100'}">${escapeHtml(option.label)}</button>`;
                    }).join('')}</div>` : ''}
                </article>
                <article class="rounded-xl border border-sky-500/20 bg-sky-950/20 p-3 transition hover:border-sky-400/60 hover:bg-sky-950/40">
                    <div class="flex items-center gap-2">
                        <button type="button" id="rightOptionsAccordionBtn" aria-expanded="${state.rightOptionsExpanded ? 'true' : 'false'}" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg border border-slate-700 text-xs text-sky-200 hover:border-sky-400 hover:text-white" title="Mostrar opções">
                            <i class="fa-solid ${state.rightOptionsExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
                        </button>
                        <button type="button" id="rightOptionsTitleBtn" class="min-w-0 flex-1 text-left text-sm font-semibold text-slate-100 transition hover:text-sky-100">
                            <span class="break-words">Filtros semânticos</span>
                        </button>
                    </div>
                    ${state.rightOptionsExpanded ? `<div class="mt-2 space-y-2 border-l border-sky-500/20 pl-3">${options.map((option) => {
                        const isActive = state.selectedTagLinkTypes.includes(option.type);
                        return `<button type="button" data-tag-link-type="${option.type}" aria-pressed="${isActive ? 'true' : 'false'}" class="w-full rounded-xl border p-3 text-left text-sm font-semibold transition ${isActive ? 'border-violet-400/80 bg-violet-950/40 text-violet-100' : 'border-sky-500/20 bg-sky-950/20 text-slate-100 hover:border-sky-400/60 hover:bg-sky-950/40 hover:text-sky-100'}">${escapeHtml(option.label)}</button>`;
                    }).join('')}</div>` : ''}
                </article>
                <article class="rounded-xl border border-emerald-500/20 bg-emerald-950/20 p-3 transition hover:border-emerald-400/60 hover:bg-emerald-950/40">
                    <div class="space-y-2">${cardOptions.map((option) => {
                        const isActive = !!state[option.flag];
                        return `<button type="button" data-card-option="${option.flag}" aria-pressed="${isActive ? 'true' : 'false'}" class="w-full rounded-xl border p-3 text-left text-sm font-semibold transition ${isActive ? 'border-emerald-300/80 bg-emerald-500/20 text-emerald-100' : 'border-emerald-500/20 bg-emerald-950/20 text-slate-100 hover:border-emerald-400/60 hover:bg-emerald-950/40 hover:text-emerald-100'}"><span class="block">${escapeHtml(option.label)}</span><span class="mt-1 block text-xs font-normal text-emerald-100/70">${escapeHtml(option.description)}</span></button>`;
                    }).join('')}</div>
                </article>
                <article class="rounded-xl border border-cyan-500/20 bg-cyan-950/20 p-3 transition hover:border-cyan-400/60 hover:bg-cyan-950/40">
                    <div class="flex items-center gap-2">

                button.addEventListener('click', () => { state.rightOptionsExpanded = !state.rightOptionsExpanded; renderRightOptionsMenu(); });

            rightOptionsMenu.querySelectorAll('#rightIntentFiltersAccordionBtn, #rightIntentFiltersTitleBtn').forEach((button) => {
                button.addEventListener('click', () => { state.rightIntentFiltersExpanded = !state.rightIntentFiltersExpanded; renderRightOptionsMenu(); });

        function enforceSingleTagSelectionForTagMode() {
            if (!(isTagSessionsMode() || isInteractiveStoryMode()) || state.selectedTagIds.length <= 1) return;
            state.selectedTagIds = [state.selectedTagIds[state.selectedTagIds.length - 1]];
            state.selectedTagLabels = [state.selectedTagLabels[state.selectedTagLabels.length - 1]].filter(Boolean);
        }

        function selectTagFilter(tagId, tag = {}) {
            if (!tagId || state.selectedTagIds.includes(tagId)) return false;
            state.withoutTagsOnly = false;
            if (isTagSessionsMode() || isInteractiveStoryMode()) {
                state.selectedTagIds = [tagId];
                state.selectedTagLabels = [getTagLabel(tag)];
                return true;
            }
            state.selectedTagIds.push(tagId);
            state.selectedTagLabels.push(getTagLabel(tag));
            return true;
        }

        function toggleTagFilter(tagId, tag = {}) {
            if (!tagId) return false;
            const existingIndex = state.selectedTagIds.indexOf(tagId);
            if (existingIndex >= 0) {
                state.selectedTagIds.splice(existingIndex, 1);
                state.selectedTagLabels.splice(existingIndex, 1);
                return true;
            }
            return selectTagFilter(tagId, tag);
        }

        function renderLeftOthersMenu() {
            if (!leftOthersMenu) return;
            if (!isCardListMode() && !isInteractiveStoryMode()) {
                leftOthersMenu.innerHTML = '';
                return;
            }
            leftOthersMenu.innerHTML = `
                <article class="rounded-xl border border-sky-500/20 bg-sky-950/20 p-3 transition hover:border-sky-400/60 hover:bg-sky-950/40">
                    <div class="flex items-center gap-2">
                        <button type="button" id="leftOthersAccordionBtn" aria-expanded="${state.leftOthersExpanded ? 'true' : 'false'}" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg border border-slate-700 text-xs text-sky-200 hover:border-sky-400 hover:text-white" title="Mostrar outros filtros">
                            <i class="fa-solid ${state.leftOthersExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
                        </button>
                        <button type="button" id="leftOthersTitleBtn" class="min-w-0 flex-1 text-left text-sm font-semibold text-slate-100 transition hover:text-sky-100">
                            <span class="break-words">${isInteractiveStoryMode() ? 'Modo' : 'Outros'}</span>
                        </button>
                    </div>
                    ${state.leftOthersExpanded ? `<div class="mt-2 space-y-2 border-l border-sky-500/20 pl-3">${isCardListMode() ? `<button type="button" id="withoutTagsOnlyBtn" aria-pressed="${state.withoutTagsOnly ? 'true' : 'false'}" class="w-full rounded-xl border p-3 text-left text-sm font-semibold transition ${state.withoutTagsOnly ? 'border-violet-400/80 bg-violet-950/40 text-violet-100' : 'border-sky-500/20 bg-sky-950/20 text-slate-100 hover:border-sky-400/60 hover:bg-sky-950/40 hover:text-sky-100'}">Sem tags</button>` : ''}${isInteractiveStoryMode() ? `<button type="button" id="mountInteractiveStoryBtn" aria-pressed="${state.selectedTagIds.length === 1 ? 'true' : 'false'}" class="w-full rounded-xl border p-3 text-left text-sm font-semibold transition ${state.selectedTagIds.length === 1 ? 'border-emerald-400/80 bg-emerald-950/40 text-emerald-100' : 'border-sky-500/20 bg-sky-950/20 text-slate-100 hover:border-sky-400/60 hover:bg-sky-950/40 hover:text-sky-100'}">Montar História</button>` : ''}</div>` : ''}
                </article>
            `;
            leftOthersMenu.querySelectorAll('#leftOthersAccordionBtn, #leftOthersTitleBtn').forEach((button) => {
                button.addEventListener('click', () => { state.leftOthersExpanded = !state.leftOthersExpanded; renderLeftOthersMenu(); });
            });

            leftOthersMenu.querySelector('#mountInteractiveStoryBtn')?.addEventListener('click', () => {
                if (!isInteractiveStoryMode()) return;
                if (state.selectedTagIds.length !== 1) {
                    alert('Selecione uma tag no menu lateral esquerdo para montar a História Colapsada dela.');
                    return;
                }
                tagFamilySections.querySelector('#interactiveStoryCollapseSection')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            leftOthersMenu.querySelector('#withoutTagsOnlyBtn')?.addEventListener('click', () => {
                state.withoutTagsOnly = !state.withoutTagsOnly;
                if (state.withoutTagsOnly) {
                    state.selectedTagIds = [];
                    state.selectedTagLabels = [];
                }
                renderRightOptionsMenu();
                renderLeftOthersMenu();
                loadPage(1);
                loadSavedFilters();
            });
        }

        function renderSavedFilters(filters, allTags = filters, familyRelations = []) {
            const savedFiltersList = document.getElementById('savedFiltersList');
            const savedFiltersCount = document.getElementById('savedFiltersCount');
            savedFiltersCount.textContent = String(filters.length);

            if (!filters.length) {
                savedFiltersList.innerHTML = '<p class="text-xs text-slate-500">Nenhuma tag fixada para o usuário atual.</p>';
                return;
            }

            const tagById = new Map(allTags.map((tag) => [Number(tag.id), normalizeSavedFilter(tag)]).filter(([id]) => id > 0));
            filters.forEach((tag) => tagById.set(Number(tag.id), tag));
            const childrenByMother = buildChildrenByMother(familyRelations);
            savedFiltersList.innerHTML = filters.map((tag) => renderTagTreeItem(tag, tagById, childrenByMother, 0, new Set())).join('');

            savedFiltersList.querySelectorAll('[data-tag-accordion-id]').forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    const tagId = Number(button.dataset.tagAccordionId) || 0;
                    if (!tagId) return;
                    const tag = tagById.get(tagId) || {};
                    selectTagFilter(tagId, tag);
                    renderRightOptionsMenu();
                    if (state.expandedTagIds.has(tagId)) state.expandedTagIds.delete(tagId);
                    else state.expandedTagIds.add(tagId);
                    loadPage(1);
                    renderSavedFilters(filters, allTags, familyRelations);
                });
            });

            savedFiltersList.querySelectorAll('[data-tag-filter-id]').forEach((button) => {
                button.addEventListener('click', () => {
                    const tagId = Number(button.dataset.tagFilterId) || 0;
                    const tag = tagById.get(tagId) || {};
                    if (!tagId) return;
                    toggleTagFilter(tagId, tag);
                    renderRightOptionsMenu();
                    loadPage(1);
                    renderSavedFilters(filters, allTags, familyRelations);
                });
            });
        }

        async function loadSavedFilters() {
            const savedFiltersList = document.getElementById('savedFiltersList');
            const savedFiltersCount = document.getElementById('savedFiltersCount');
            try {
                const [savedResponse, tagsResponse, familyResponse] = await Promise.all([
                    fetch('/api/flashcards', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ action: 'list_saved_filters' })
                    }),
                    fetch('/api/flashcards?action=list_tags', { headers: { 'Accept': 'application/json' } }),
                    fetch('/api/flashcards?action=list_tag_family_relations', { headers: { 'Accept': 'application/json' } })
                ]);
                const [savedResult, tagsResult, familyResult] = await Promise.all([savedResponse.json(), tagsResponse.json(), familyResponse.json()]);
                if (!savedResponse.ok || savedResult.status !== 'success') throw new Error(savedResult.message || 'Não foi possível carregar as tags fixadas.');
                if (!tagsResponse.ok || tagsResult.status !== 'success') throw new Error(tagsResult.message || 'Não foi possível carregar as tags.');
                if (!familyResponse.ok || familyResult.status !== 'success') throw new Error(familyResult.message || 'Não foi possível carregar as famílias de tags.');
                const allTags = (tagsResult.data || []).map(normalizeSavedFilter).filter((tag) => Number(tag.id) > 0);
                const savedFilters = (savedResult.data || []).map(normalizeSavedFilter).filter((tag) => Number(tag.id) > 0);
                state.savedFilterTagIds = new Set(savedFilters.map((tag) => Number(tag.id)));
                state.tags = allTags;
                updateHeaderActions();
                renderRightOptionsMenu();
                renderLeftTagSearchResults();
                renderSavedFilters(
                    savedFilters,
                    allTags,
                    familyResult.data || []
                );
            } catch (error) {
                state.savedFilterTagIds = new Set();
                renderRightOptionsMenu();
                savedFiltersCount.textContent = '0';
                savedFiltersList.innerHTML = `<p class="text-xs text-red-300">${escapeHtml(error.message || 'Erro ao carregar tags fixadas.')}</p>`;
            }
        }

        }

        function getCardEditUrl(card = {}) {
            const deckId = Number(card?.directory_id || 0);
            const cardId = Number(card?.id || 0);
            if (!deckId || !cardId) return '';

            const params = new URLSearchParams();
            params.set('id', String(deckId));
            params.set('edit_card_id', String(cardId));
            params.set('from', window.location.pathname + window.location.search);
            return `/ficha_do_card?${params.toString()}`;
        }

            const editUrl = getCardEditUrl(card);
            if (!editUrl) return '';

        function getRelationTypeLabel(typeId) {
            const relationType = state.relationTypes.find((item) => Number(item.id) === Number(typeId));
            return relationType?.name || relationType?.nome || relationType?.label || `Sessão ${typeId}`;
        }

        function getTagRelationType(tag = {}) {
            return Number(tag.tipo_de_relacao ?? tag.relation_type_id ?? tag.id_relation_type ?? tag.relationTypeId ?? 0) || 0;
        }

        function getRelationTypeById(type) { return state.relationTypes.find((item) => Number(item.id) === Number(type)) || null; }
        function canEditRelationType(relationType = {}) { const typeUserId = Number(relationType?.user_id); const sessionId = Number(state.sessionUserId); return Number.isInteger(typeUserId) && typeUserId > 0 && Number.isInteger(sessionId) && sessionId > 0 && typeUserId === sessionId; }
        function getRelationTypeHierarchy(type) { return Number(getRelationTypeById(type)?.hierarquia || 0); }
        function relationTypeUsesHierarchy(type) { return getRelationTypeHierarchy(type) === 1; }
        function relationTypeUsesSequence(type) { return getRelationTypeHierarchy(type) === 2; }
