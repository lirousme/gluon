<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cards da Tag</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    html,
    body {
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    input,
    textarea,
    select,
    button {
      font-size: 16px;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="min-h-screen flex flex-col">
    <header class="relative flex items-center justify-center border-b border-slate-700 px-4 py-3 bg-slate-950">
      <div class="absolute left-4 flex items-center gap-2">
        <button type="button" onclick="goBackToMarkedRoute()" class="h-9 rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800" title="Voltar" aria-label="Voltar"><i class="fa-solid fa-left-long" aria-hidden="true"></i></button>
        <button id="btnOpenOrphanTags" type="button" onclick="goToOrphanTags()" class="h-9 w-9 rounded-lg border border-purple-500/50 text-purple-300 hover:text-purple-200 hover:bg-purple-500/20 transition-colors text-sm font-medium" title="Tags sem vínculos" aria-label="Abrir tags sem vínculos"><i class="fa-solid fa-magnifying-glass-chart" aria-hidden="true"></i></button>
        <button id="btnOpenCustomRules" type="button" class="h-9 rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800" title="Regras customizadas" aria-label="Regras customizadas"><i class="fa-solid fa-bridge-circle-exclamation" aria-hidden="true"></i></button>
      </div>

      <span id="subjectCardsCount" class="rounded-full border border-emerald-500/40 bg-emerald-500/10 px-3 py-1 text-sm text-emerald-200">0 card(s)</span>

      <div class="absolute right-4 flex items-center gap-2">
        <button id="btnGenerateExampleCards" type="button" class="h-9 w-9 rounded-lg border border-cyan-300/50 text-cyan-200 hover:text-cyan-100 hover:bg-cyan-400/20 transition-colors text-sm font-medium" title="Gerar 10 frases de exemplo com lexical chunks" aria-label="Gerar 10 frases de exemplo com lexical chunks"><i class="fa-solid fa-tags"></i></button>
        <button id="btnOpenCreateCardModal" type="button" class="h-9 w-9 rounded-lg border border-violet-500/50 text-violet-300 hover:text-violet-200 hover:bg-violet-500/20 transition-colors text-lg font-semibold" title="Criar novo card"><i class="fa-solid fa-plus"></i></button>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 max-w-4xl mx-auto w-full">
      <section class="rounded-xl border border-slate-700 bg-slate-950/70 p-5">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <h2 id="selectedTagName" class="text-lg font-semibold text-slate-100">Tag</h2>
          </div>
        </div>

        <div id="subjectCardsStatus" class="mt-5 rounded-lg border border-slate-700 bg-slate-900/60 p-4 text-sm text-slate-300">
          <i class="fa-solid fa-spinner fa-spin mr-2 text-sky-300"></i>Carregando cards...
        </div>

        <div id="subjectCardsList" class="mt-5 space-y-3"></div>
      </section>
    </main>
  </div>

  <script>
(function lockMobileZoom(){
  const viewport = document.querySelector('meta[name="viewport"]');
  const lockedViewport = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
  if (viewport) viewport.setAttribute('content', lockedViewport);

  const preventZoom = (event) => event.preventDefault();
  document.addEventListener('gesturestart', preventZoom, { passive: false });
  document.addEventListener('gesturechange', preventZoom, { passive: false });
  document.addEventListener('gestureend', preventZoom, { passive: false });

  document.addEventListener('touchmove', (event) => {
    if (event.touches && event.touches.length > 1) event.preventDefault();
  }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  document.addEventListener('wheel', (event) => {
    if (event.ctrlKey) event.preventDefault();
  }, { passive: false });
})();
    const params = new URLSearchParams(window.location.search);
    const state = {
      tagId: Number(params.get('tag_id') || 0),
      tagName: (params.get('tag_name') || '').trim(),
      selectedTag: null,
      subjectCards: []
    };

    function esc(value){
      return String(value ?? '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }

    function getDecodedParam(name){
      const rawValue = params.get(name);
      if(!rawValue) return '';
      try {
        return decodeURIComponent(rawValue);
      } catch (error) {
        return rawValue;
      }
    }

    const CARD_DA_TAG_HISTORY_KEY = 'gluon.cardDaTagRouteHistory';
    const CARD_DA_TAG_HISTORY_LIMIT = 30;

    function normalizeRoute(rawRoute = ''){
      let route = String(rawRoute || '').trim();
      if(!route) return '';

      for(let i = 0; i < 2; i += 1){
        try {
          const decoded = decodeURIComponent(route);
          if(decoded === route) break;
          route = decoded;
        } catch (error) {
          break;
        }
      }

      try {
        const url = new URL(route, window.location.origin);
        if(url.origin !== window.location.origin) return '';
        return url.pathname + url.search + url.hash;
      } catch (error) {
        return '';
      }
    }

    function getCurrentRoute(){
      return window.location.pathname + window.location.search + window.location.hash;
    }

    function getRoutePath(route = ''){
      try {
        return new URL(route, window.location.origin).pathname;
      } catch (error) {
        return '';
      }
    }

    function isCardDaTagRoute(route = ''){
      return getRoutePath(route) === '/views/card_da_tag.html';
    }

    function isFichaDoCardRoute(route = ''){
      const path = getRoutePath(route);
      return path === '/ficha_do_card' || path === '/views/ficha_do_card.html';
    }

    function getStoredRouteHistory(){
      try {
        const parsed = JSON.parse(sessionStorage.getItem(CARD_DA_TAG_HISTORY_KEY) || '[]');
        return Array.isArray(parsed) ? parsed.map(normalizeRoute).filter(Boolean) : [];
      } catch (error) {
        return [];
      }
    }

    function setStoredRouteHistory(history = []){
      try {
        sessionStorage.setItem(CARD_DA_TAG_HISTORY_KEY, JSON.stringify(history.slice(-CARD_DA_TAG_HISTORY_LIMIT)));
      } catch (error) {
        // Se o armazenamento do navegador estiver indisponível, o botão ainda usa os fallbacks abaixo.
      }
    }

    function pushStoredRoute(history, route){
      if(!route || history[history.length - 1] === route) return history;
      history.push(route);
      return history.slice(-CARD_DA_TAG_HISTORY_LIMIT);
    }

    function trackCardDaTagRouteVisit(){
      const currentRoute = normalizeRoute(getCurrentRoute());
      let history = getStoredRouteHistory();
      const referrerRoute = normalizeRoute(document.referrer);

      if(referrerRoute && referrerRoute !== currentRoute) {
        history = pushStoredRoute(history, referrerRoute);
      }
      history = pushStoredRoute(history, currentRoute);
      setStoredRouteHistory(history);
    }

    function getTagFamilyRoute(){
      const markedFrom = normalizeRoute(getDecodedParam('from'));
      if(markedFrom && !isFichaDoCardRoute(markedFrom) && !isCardDaTagRoute(markedFrom)) {
        return markedFrom;
      }

      const tagFamilyParams = new URLSearchParams();
      if(state.tagId) tagFamilyParams.set('tag_id', String(state.tagId));
      if(state.tagName) tagFamilyParams.set('tag_name', state.tagName);
      const query = tagFamilyParams.toString();
      return `/views/tag_family.html${query ? `?${query}` : ''}`;
    }

    function getPreviousTrackedRoute(){
      const currentRoute = normalizeRoute(getCurrentRoute());
      const history = getStoredRouteHistory();
      const keptHistory = [];
      let target = '';

      for(let index = history.length - 1; index >= 0; index -= 1){
        const route = normalizeRoute(history[index]);
        if(!route || route === currentRoute || isFichaDoCardRoute(route) || isCardDaTagRoute(route)) continue;
        target = route;
        keptHistory.push(...history.slice(0, index + 1));
        break;
      }

      if(target) {
        setStoredRouteHistory(keptHistory);
      }
      return target;
    }

    function getDocumentReferrerRoute(){
      const referrerRoute = normalizeRoute(document.referrer);
      if(!referrerRoute || referrerRoute === normalizeRoute(getCurrentRoute()) || isFichaDoCardRoute(referrerRoute) || isCardDaTagRoute(referrerRoute)) return '';
      return referrerRoute;
    }

    function getCardDaTagBackRoute(){
      return getPreviousTrackedRoute() || getDocumentReferrerRoute() || getTagFamilyRoute();
    }

    function goBackToMarkedRoute(){
      window.location.href = getCardDaTagBackRoute();
    }

    function openCustomRulesPage(){
      const customRulesParams = new URLSearchParams();
      customRulesParams.set('from', window.location.pathname + window.location.search);
      if(state.tagId) customRulesParams.set('tag_id', String(state.tagId));
      if(state.tagName) customRulesParams.set('tag_name', state.tagName);
      window.location.href = `/views/regras_customizadas.html?${customRulesParams.toString()}`;
    }

    function goToOrphanTags(){
      window.location.href = '/views/tags_sem_vinculos.html';
    }

    async function api(action, payload = {}){
      payload.action = action;
      const response = await fetch('/api/flashcards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const text = await response.text();
      let json = null;
      try {
        json = text ? JSON.parse(text) : null;
      } catch (error) {
        throw new Error('A API retornou uma resposta inválida ao consultar os cards.');
      }
      if(!json) throw new Error('A API retornou uma resposta vazia ao consultar os cards.');
      if(!response.ok || json.status !== 'success') throw new Error(json.message || 'Erro ao consultar cards.');
      return json;
    }

    async function loadSelectedTag(){
      if(!state.tagId) return null;
      if(state.selectedTag) return state.selectedTag;
      const response = await api('list_tags');
      const tags = Array.isArray(response.data) ? response.data : [];
      state.selectedTag = tags.find(tag => Number(tag.id) === Number(state.tagId)) || null;
      return state.selectedTag;
    }

    async function generateExampleCards(){
      const button = document.getElementById('btnGenerateExampleCards');
      const originalContent = button?.innerHTML || '';
      if(button){
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      }

      try {
        const [deckResponse, tag] = await Promise.all([api('get_user_system_deck'), loadSelectedTag()]);
        const deckId = Number(deckResponse?.deck_id || deckResponse?.data?.deck_id || 0);
        if(!deckId) throw new Error('Deck de sistema não encontrado para criar os cards.');
        if(!tag) throw new Error('Tag não encontrada para gerar as frases de exemplo.');

        const tagTextEn = String(tag.name || '').trim();
        const tagTextPtBr = String(tag.name_pt_br || '').trim();
        if(!tagTextEn || !tagTextPtBr) throw new Error('A tag precisa ter texto em inglês e em pt-BR para gerar as frases de exemplo.');

        setStatus('Gerando 10 frases de exemplo e lexical chunks com Gemini...', 'info');
        const response = await api('generate_sentence_lexical_chunks_gemini', {
          tag_id: state.tagId,
          tag_text_en: tagTextEn,
          tag_text_pt_br: tagTextPtBr,
          count: 10,
          create_cards: true,
          deck_id: deckId,
          info_type: 2
        });
        const createdCards = Number(response.created_cards_count || 0);
        setStatus(`${createdCards || 0} card(s) de frases de exemplo criado(s) com lexical chunks.`, createdCards ? 'empty' : 'info');
        await loadSubjectCards();
      } catch (error) {
        setStatus(error.message || 'Erro ao gerar frases de exemplo.', 'error');
      } finally {
        if(button){
          button.disabled = false;
          button.innerHTML = originalContent;
        }
      }
    }

    async function openCreateCardModal(){
      const button = document.getElementById('btnOpenCreateCardModal');
      const originalContent = button?.innerHTML || '';
      if(button){
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      }

      try {
        const response = await api('get_user_system_deck');
        const deckId = Number(response?.deck_id || response?.data?.deck_id || 0);
        if(!deckId) throw new Error('Deck de sistema não encontrado para criar o card.');

        const createCardParams = new URLSearchParams();
        createCardParams.set('id', String(deckId));
        if(state.tagId) createCardParams.set('tag_id', String(state.tagId));
        if(state.tagName) createCardParams.set('tag_name', state.tagName);
        createCardParams.set('from', window.location.pathname + window.location.search);
        window.location.href = `/ficha_do_card?${createCardParams.toString()}`;
      } catch (error) {
        setStatus(error.message || 'Erro ao abrir a ficha do card.', 'error');
        if(button){
          button.disabled = false;
          button.innerHTML = originalContent;
        }
      }
    }

    function setStatus(message, type = 'info'){
      const status = document.getElementById('subjectCardsStatus');
      if(!status) return;
      const iconByType = {
        info: 'fa-spinner fa-spin text-sky-300',
        empty: 'fa-circle-info text-slate-400',
        error: 'fa-triangle-exclamation text-red-300'
      };
      const colorByType = {
        info: 'border-slate-700 bg-slate-900/60 text-slate-300',
        empty: 'border-slate-700 bg-slate-900/60 text-slate-400',
        error: 'border-red-500/40 bg-red-500/10 text-red-100'
      };
      status.className = `mt-5 rounded-lg border p-4 text-sm ${colorByType[type] || colorByType.info}`;
      status.innerHTML = `<i class="fa-solid ${iconByType[type] || iconByType.info} mr-2"></i>${esc(message)}`;
      status.classList.remove('hidden');
    }

    function getCardEditUrl(card = {}){
      const deckId = Number(card?.directory_id || 0);
      const cardId = Number(card?.id || 0);
      if(!deckId || !cardId) return '';
      const editParams = new URLSearchParams();
      editParams.set('id', String(deckId));
      editParams.set('edit_card_id', String(cardId));
      editParams.set('from', window.location.pathname + window.location.search);
      return `/ficha_do_card?${editParams.toString()}`;
    }

    function renderSubjectCards(){
      const list = document.getElementById('subjectCardsList');
      const count = document.getElementById('subjectCardsCount');
      const status = document.getElementById('subjectCardsStatus');
      const cards = Array.isArray(state.subjectCards) ? state.subjectCards : [];
      if(count) count.textContent = `${cards.length} card(s)`;
      if(!list) return;

      if(!cards.length){
        list.innerHTML = '';
        setStatus('Nenhum card encontrado para esta tag em subjects_links.', 'empty');
        return;
      }

      if(status) status.classList.add('hidden');
      list.innerHTML = cards.map((card) => {
        const front = String(card.front || '').trim() || '(sem frente)';
        const back = String(card.back || '').trim();
        const deckName = String(card.directory_name || '').trim();
        const editUrl = Number(card.can_edit || 0) === 1 ? getCardEditUrl(card) : '';
        const imageFront = card.image_front ? `<img src="${esc(card.image_front)}" alt="Imagem da frente" class="mt-2 max-h-40 rounded-lg border border-slate-700 object-contain">` : '';
        const backContent = back ? `<p class="mt-3 text-xs leading-relaxed text-slate-400 whitespace-pre-wrap break-words">${esc(back)}</p>` : '';
        const imageBack = card.image_back ? `<img src="${esc(card.image_back)}" alt="Imagem do verso" class="mt-2 max-h-40 rounded-lg border border-slate-700 object-contain">` : '';
        return `<article class="rounded-lg border border-slate-700 bg-slate-900/60 p-4 shadow-sm">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-slate-100 whitespace-pre-wrap break-words">${esc(front)}</p>
              ${imageFront}
              ${backContent}
              ${imageBack}
              ${deckName ? `<p class="mt-3 text-[11px] text-slate-500">Deck: ${esc(deckName)}</p>` : ''}
            </div>
            ${editUrl ? `<a href="${esc(editUrl)}" class="shrink-0 rounded-lg border border-violet-500/50 px-2.5 py-1 text-xs text-violet-200 hover:bg-violet-500/20">Editar</a>` : ''}
          </div>
        </article>`;
      }).join('');
    }

    async function loadSubjectCards(){
      if(!state.tagId){
        setStatus('ID da tag não informado na URL.', 'error');
        return;
      }

      setStatus('Carregando cards...', 'info');
      try{
        const response = await api('list_subject_cards_by_tag', { tag_id: state.tagId });
        state.subjectCards = response.data || [];
        renderSubjectCards();
      }catch(error){
        state.subjectCards = [];
        renderSubjectCards();
        setStatus(error.message || 'Erro ao carregar cards da tag.', 'error');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      trackCardDaTagRouteVisit();
      const label = state.tagName || 'Tag';
      document.getElementById('selectedTagName').textContent = label;
      document.getElementById('btnOpenCreateCardModal').onclick = openCreateCardModal;
      document.getElementById('btnGenerateExampleCards').onclick = generateExampleCards;
      document.getElementById('btnOpenCustomRules').onclick = openCustomRulesPage;
      loadSelectedTag().then((tag) => {
        if(tag){
          state.tagName = String(tag.name || state.tagName || '').trim();
          document.getElementById('selectedTagName').textContent = state.tagName || label;
        }
      }).catch(() => {});
      loadSubjectCards();
    });
  </script>
</body>
</html>
