<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gluon • Admin Trilha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-5xl mx-auto p-4 sm:p-6 space-y-4">
    <header class="flex flex-wrap items-center justify-between gap-2">
      <h1 id="title" class="text-xl font-bold">Trilha</h1>
      <div class="flex gap-2">
        <a id="playLink" class="px-3 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-sm" href="#">Abrir mapa</a>
        <button id="btnGenerate" class="px-3 py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-sm">Gerar +10 fases (GPT)</button>
        <button id="btnPublish" class="px-3 py-2 rounded bg-amber-600 hover:bg-amber-500 text-sm">Confirmar fases pendentes</button>
      </div>
    </header>

    <section class="bg-slate-900 border border-slate-700 rounded-xl p-4">
      <p class="text-sm text-slate-300">Geração e publicação foram separadas: você gera lotes de 10, revisa/edita e só depois publica para os jogadores. Conteúdo de cada fase (slides) é gerado separadamente na tela da fase.</p>
      <p id="pendingInfo" class="text-xs text-amber-300 mt-2"></p>
    </section>

    <section id="list" class="space-y-3"></section>
  </main>

<script>
const qs = new URLSearchParams(location.search);
const trackId = Number(qs.get('id') || 0);

async function api(action, payload={}) {
  const res = await fetch('/api/trilha', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action, ...payload}) });
  return res.json();
}

function esc(v){ return String(v || '').replace(/[&<>'"]/g, (m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[m])); }

function itemCard(node){
  const questions = (node.questions || []).map(q => `<li>${esc(q)}</li>`).join('');
  const badge = node.is_published
    ? '<span class="text-xs px-2 py-1 rounded bg-emerald-900 text-emerald-300">Publicado</span>'
    : '<span class="text-xs px-2 py-1 rounded bg-amber-900 text-amber-300">Pendente</span>';

  return `<article class="bg-slate-900 border border-slate-700 rounded-xl p-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h3 class="font-semibold">Mapa ${node.map_number} · Fase ${node.phase_number} · #${node.position_index}</h3>
      <div class="flex items-center gap-2">
        ${badge}
        <a href="/phase?id=${trackId}&node=${node.id}&admin=1" class="text-xs px-2 py-1 rounded bg-violet-700 hover:bg-violet-600">Slides</a>
        <button data-edit="${node.id}" class="text-xs px-2 py-1 rounded bg-blue-600 hover:bg-blue-500">Editar</button>
        <button data-del="${node.id}" class="text-xs px-2 py-1 rounded bg-rose-700 hover:bg-rose-600">Excluir</button>
      </div>
    </div>
    <p class="mt-1 text-sm text-emerald-300">${esc(node.title)}</p>
    <p class="mt-1 text-sm text-slate-300">${esc(node.objective || '')}</p>
    <ul class="mt-2 text-sm list-disc pl-5 text-slate-200">${questions}</ul>
  </article>`;
}

async function loadAdmin() {
  const data = await api('fetch_admin', { directory_id: trackId });
  if (data.status !== 'success') {
    document.getElementById('list').innerHTML = `<p class="text-rose-300">${esc(data.message || 'Erro')}</p>`;
    return;
  }

  document.getElementById('title').textContent = `Admin da trilha: ${data.track.name}`;
  document.getElementById('playLink').href = `/map?id=${trackId}`;
  document.getElementById('pendingInfo').textContent = `${data.pending_count || 0} fase(s) pendente(s) de confirmação para o mapa.`;
  document.getElementById('list').innerHTML = data.nodes.length ? data.nodes.map(itemCard).join('') : '<p class="text-slate-400">Sem fases ainda. Clique em "Gerar +10 fases (GPT)".</p>';

  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Excluir fase?')) return;
    await api('delete_node', { directory_id: trackId, node_id: Number(btn.dataset.del) });
    loadAdmin();
  });

  document.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = async () => {
    const node = data.nodes.find(n => n.id === Number(btn.dataset.edit));
    if (!node) return;
    const title = prompt('Título da fase', node.title); if (title === null) return;
    const objective = prompt('Objetivo curto', node.objective || '') ?? '';
    const questionsRaw = prompt('Perguntas (uma por linha)', (node.questions || []).join('\n'));
    if (questionsRaw === null) return;
    const questions = questionsRaw.split('\n').map(s => s.trim()).filter(Boolean);
    await api('upsert_node', { directory_id: trackId, node_id: node.id, title, objective, questions });
    alert('Edição salva. Esta fase voltou para status pendente e precisa ser confirmada novamente.');
    loadAdmin();
  });
}

document.getElementById('btnGenerate').onclick = async () => {
  const btn = document.getElementById('btnGenerate');
  btn.disabled = true; btn.textContent = 'Gerando...';
  const res = await api('generate_batch', { directory_id: trackId });
  btn.disabled = false; btn.textContent = 'Gerar +10 fases (GPT)';
  if (res.status !== 'success') alert(res.message || 'Falha ao gerar.');
  loadAdmin();
};

document.getElementById('btnPublish').onclick = async () => {
  const res = await api('publish_pending', { directory_id: trackId });
  if (res.status !== 'success') return alert(res.message || 'Falha ao publicar fases.');
  alert(`Fases confirmadas: ${res.published || 0}`);
  loadAdmin();
};

if (!trackId) alert('URL inválida. Use /map_admin?id=ID_DA_TRILHA');
else loadAdmin();
</script>
</body>
</html>
