<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Gluon - Quantificadores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
        scrollbar-width: thin;
        scrollbar-color: #7c3aed #0f172a;
    }
    *::-webkit-scrollbar {
        width: 12px;
        height: 12px;
    }
    *::-webkit-scrollbar-track {
        background: #0f172a;
        border-radius: 999px;
    }
    *::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        border: 3px solid #0f172a;
        border-radius: 999px;
    }
    *::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
    }
    .kanban-scroll {
        min-height: calc(100vh - 9rem);
        scrollbar-gutter: stable both-edges;
    }
    .dragging {
        opacity: .45;
        transform: rotate(1deg) scale(.98);
    }
    .drop-target {
        outline: 2px dashed #8b5cf6;
        outline-offset: 4px;
        background: rgba(124, 58, 237, .12);
    }
    .drop-target-children {
        border-color: rgba(139, 92, 246, .8);
        background: rgba(30, 41, 59, .95);
    }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<nav class="h-16 px-4 sm:px-6 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-3">
        <button onclick="history.back()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
            <p class="text-xs text-slate-400">Gluon</p>
            <h1 class="font-semibold">Quantificadores</h1>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <button id="visibilityButton" onclick="quantifiersApp.openVisibilityModal()" title="Opções de visualização" class="w-11 h-11 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200"><i id="visibilityIcon" class="fa-solid fa-eye"></i></button>
        <button onclick="quantifiersApp.openCreateModal()" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 font-medium"><i class="fa-solid fa-plus mr-2"></i>Novo</button>
    </div>
</nav>

<main class="p-4 sm:p-6 space-y-4 overflow-y-auto">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <div id="breadcrumb" class="flex flex-wrap items-center gap-2 text-sm text-slate-400"></div>
            <p id="levelHint" class="mt-1 text-xs text-slate-500">Clique em um filho para abrir o dashboard dele. O botão + Novo cria no nível aberto.</p>
        </div>
        <button id="rootButton" onclick="quantifiersApp.goTo(null)" class="hidden w-fit px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm text-slate-300 hover:bg-slate-800 hover:text-white">
            <i class="fa-solid fa-house mr-2"></i>Voltar para raiz
        </button>
    </div>
    <section id="kanban" class="kanban-scroll flex flex-nowrap items-start gap-4 overflow-x-auto overflow-y-auto pb-4 pr-4"></section>
    <div id="emptyState" class="hidden border border-dashed border-slate-700 rounded-2xl p-10 text-center text-slate-400">
        <i class="fa-solid fa-layer-group text-4xl mb-3 text-slate-600"></i>
        <p>Nenhum quantificador neste nível.</p>
    </div>
</main>

<div id="modal" class="hidden fixed inset-0 z-40 bg-black/70 p-4 items-center justify-center">
    <div class="w-full max-w-lg rounded-2xl bg-slate-900 border border-slate-700 shadow-xl">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <h2 id="modalTitle" class="font-semibold">Novo quantificador</h2>
            <button onclick="quantifiersApp.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form onsubmit="quantifiersApp.save(event)" class="p-4 space-y-4">
            <input type="hidden" id="quantifierId">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Nome</label>
                <input id="title" required class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-violet-500" placeholder="Ex.: Ler 10 artigos">
            </div>
            <label class="flex items-center justify-between gap-3 rounded-xl border border-slate-700 bg-slate-800/60 p-3 cursor-pointer">
                <span>
                    <span class="block text-sm font-medium">Quantidade derivada dos filhos</span>
                    <span class="block text-xs text-slate-400">Ativo = maximum_quantity recebe o número de filhos.</span>
                </span>
                <input id="derivative" type="checkbox" class="sr-only peer" onchange="quantifiersApp.toggleDerivativeField()">
                <span class="w-12 h-7 bg-slate-700 rounded-full relative after:content-[''] after:absolute after:w-5 after:h-5 after:bg-white after:rounded-full after:left-1 after:top-1 peer-checked:bg-violet-600 peer-checked:after:translate-x-5 after:transition"></span>
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Maximum quantity</label>
                    <input id="maximum" type="number" min="0" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-violet-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Current quantity</label>
                    <input id="current" type="number" min="0" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-violet-500">
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Período</label>
                    <select id="periodType" onchange="quantifiersApp.togglePeriodFields()" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-violet-500">
                        <option value="">Nenhum</option>
                        <option value="years">Anos</option>
                        <option value="months">Meses</option>
                        <option value="days">Dias</option>
                        <option value="custom">Personalizado</option>
                    </select>
                </div>
                <div id="startDatetimeWrap" class="hidden">
                    <label class="block text-sm text-slate-300 mb-1">Datetime inicial</label>
                    <input id="startDatetime" type="datetime-local" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-violet-500">
                </div>
            </div>
            <div id="customPeriodWrap" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Unidade personalizada</label>
                    <select id="customPeriodUnit" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-violet-500">
                        <option value="minutes">Minutos</option>
                        <option value="hours">Horas</option>
                        <option value="days">Dias</option>
                        <option value="months">Meses</option>
                        <option value="years">Anos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Quantidade da unidade</label>
                    <input id="customPeriodAmount" type="number" min="1" step="1" inputmode="numeric" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-violet-500" placeholder="Ex.: 15">
                </div>
            </div>
            <div id="repeatUntilWrap" class="hidden">
                <label class="block text-sm text-slate-300 mb-1">Repetir até (opcional)</label>
                <input id="repeatUntil" type="datetime-local" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-violet-500">
                <p class="mt-1 text-xs text-slate-500">Quando preenchido, ignora o Maximum quantity para criar os períodos até este datetime.</p>
            </div>
            <div id="editActions" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-2 border-t border-slate-800 pt-4">
                <button type="button" onclick="quantifiersApp.deleteCurrent()" class="px-3 py-2 rounded-lg bg-red-600/20 text-red-200 border border-red-500/40 hover:bg-red-600/30">Excluir quantificador</button>
                <button type="button" onclick="quantifiersApp.deleteDescendants()" class="px-3 py-2 rounded-lg bg-orange-600/20 text-orange-200 border border-orange-500/40 hover:bg-orange-600/30">Excluir descendência</button>
            </div>
            <div class="flex justify-end gap-2 border-t border-slate-800 pt-4">
                <button type="button" onclick="quantifiersApp.closeModal()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">Cancelar</button>
                <button class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 font-medium">Salvar</button>
            </div>
        </form>
    </div>
</div>

<div id="visibilityModal" class="hidden fixed inset-0 z-40 bg-black/70 p-4 items-center justify-center">
    <div class="w-full max-w-md rounded-2xl bg-slate-900 border border-slate-700 shadow-xl">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <h2 class="font-semibold">Visualização</h2>
            <button onclick="quantifiersApp.closeVisibilityModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-4 space-y-4">
            <label class="flex items-center justify-between gap-3 rounded-xl border border-slate-700 bg-slate-800/60 p-3 cursor-pointer">
                <span>
                    <span class="block text-sm font-medium">Ocultar concluídos</span>
                    <span class="block text-xs text-slate-400">Remove da tela os quantificadores marcados como concluídos.</span>
                </span>
                <input id="hideCompleted" type="checkbox" class="sr-only peer" onchange="quantifiersApp.setHideCompleted(this.checked)">
                <span class="w-12 h-7 bg-slate-700 rounded-full relative after:content-[''] after:absolute after:w-5 after:h-5 after:bg-white after:rounded-full after:left-1 after:top-1 peer-checked:bg-violet-600 peer-checked:after:translate-x-5 after:transition"></span>
            </label>
        </div>
    </div>
</div>

<script>
const quantifiersApp = {
    items: [],
    currentFather: null,
    modalFather: null,
    sortables: [],
    suppressClickUntil: 0,
    hideCompleted: localStorage.getItem('quantifiers_hide_completed') === '1',

    async api(action, payload = {}) {
        const res = await fetch('/api/quantifiers', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action, ...payload })
        });
        if (res.status === 401) window.location.href = '/login';
        const data = await res.json();
        if (data.status !== 'success') throw new Error(data.message || 'Erro inesperado.');
        return data;
    },

    toast(message, ok = true) {
        let toast = document.getElementById('toast');
        if (!toast) { toast = document.createElement('div'); toast.id = 'toast'; document.body.appendChild(toast); }
        toast.className = `fixed right-4 bottom-4 z-50 px-4 py-2 rounded-lg text-sm border ${ok ? 'bg-green-600 border-green-500' : 'bg-red-600 border-red-500'}`;
        toast.textContent = message;
        setTimeout(() => toast.remove(), 2500);
    },

    async load() {
        try {
            const data = await this.api('fetch');
            this.items = data.quantifiers || [];
            if (this.currentFather && !this.getItem(this.currentFather)) this.currentFather = null;
            this.render();
        } catch (error) { this.toast(error.message, false); }
    },

    childrenOf(id, includeCompleted = false) {
        return this.items
            .filter(item => String(item.id_quantifier_father || '') === String(id || ''))
            .filter(item => includeCompleted || !this.hideCompleted || Number(item.is_completed) !== 1)
            .sort((a, b) => Number(a.order_position || 0) - Number(b.order_position || 0) || Number(a.id) - Number(b.id));
    },

    getItem(id) { return this.items.find(item => Number(item.id) === Number(id)); },

    pathToCurrent() {
        const path = [];
        let cursor = this.currentFather ? this.getItem(this.currentFather) : null;
        while (cursor) {
            path.unshift(cursor);
            cursor = cursor.id_quantifier_father ? this.getItem(cursor.id_quantifier_father) : null;
        }
        return path;
    },

    renderBreadcrumb() {
        const el = document.getElementById('breadcrumb');
        const path = this.pathToCurrent();
        el.innerHTML = `<button onclick="quantifiersApp.goTo(null)" class="hover:text-white">Raiz</button>` + path.map(item => `
            <span>/</span><button onclick="quantifiersApp.goTo(${item.id})" class="hover:text-white">${this.escape(item.title)}</button>
        `).join('');
    },

    render() {
        this.destroySortables();
        this.renderBreadcrumb();
        document.getElementById('rootButton').classList.toggle('hidden', !this.currentFather);
        this.updateVisibilityButton();
        const visible = this.childrenOf(this.currentFather);
        document.getElementById('emptyState').classList.toggle('hidden', visible.length > 0);
        const kanban = document.getElementById('kanban');
        kanban.dataset.parentId = this.currentFather || '';
        kanban.innerHTML = visible.map(item => this.cardHtml(item)).join('') + this.pageDropZoneHtml();
        this.initSortables();
    },

    pageDropZoneHtml() {
        const label = this.currentFather ? 'Arraste e solte aqui para virar kanban desta página' : 'Arraste e solte aqui para virar kanban raiz';
        return `<div class="root-drop-hint min-w-[18rem] sm:min-w-[22rem] self-stretch rounded-2xl border border-dashed border-violet-500/40 bg-violet-950/20 p-4 text-sm text-violet-200 flex items-center justify-center text-center transition pointer-events-none"><span><i class="fa-solid fa-arrow-up-from-bracket mr-2"></i>${label}</span></div>`;
    },

    cardHtml(item) {
        const children = this.childrenOf(item.id);
        const max = Number(item.maximum_quantity || 0);
        const current = Number(item.current_quantity || 0);
        const pct = max > 0 ? Math.min(100, Math.round((current / max) * 100)) : 0;
        return `
            <article data-quantifier-id="${item.id}" class="quantifier-draggable w-[20rem] sm:w-[22rem] shrink-0 rounded-2xl border border-slate-800 bg-slate-900 p-4 shadow-lg shadow-black/20 space-y-3 transition">
                <div class="flex items-start justify-between gap-3 cursor-grab active:cursor-grabbing">
                    <button onclick="quantifiersApp.goTo(${item.id})" class="min-w-0 flex-1 text-left group">
                        <h3 class="font-semibold truncate group-hover:text-violet-300 ${Number(item.is_completed) === 1 ? 'line-through text-slate-500' : ''}">${this.escape(item.title)}</h3>
                        <p class="text-xs text-slate-500">ID #${item.id}${Number(item.derivative_quantities) === 1 ? ' · máximo derivado dos filhos' : ''}${this.periodLabel(item)}</p>
                    </button>
                    <button onclick="event.stopPropagation(); quantifiersApp.openEditModal(${item.id})" class="text-slate-400 hover:text-white"><i class="fa-solid fa-pen"></i></button>
                </div>
                <div><div class="flex justify-between text-xs text-slate-400 mb-1"><span>${current}/${max}</span><span>${pct}%</span></div><div class="h-2 rounded-full bg-slate-800 overflow-hidden"><div class="h-full bg-violet-500" style="width:${pct}%"></div></div></div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="quantifiersApp.complete(${item.id})" ${Number(item.is_completed) === 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-400">Concluir</button>
                    <button onclick="quantifiersApp.openCreateModal(${item.id})" class="px-3 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700">Adicionar filho</button>
                </div>
                <div class="border-t border-slate-800 pt-3"><div class="flex items-center justify-between text-xs text-slate-400 mb-2"><span>Filhos</span><span>${children.length}</span></div>
                    <div data-parent-id="${item.id}" class="quantifier-list min-h-16 space-y-2 max-h-72 overflow-y-auto pr-1 rounded-xl border border-transparent p-1 transition">
                        ${children.length ? children.map(child => this.childHtml(child)).join('') : '<p class="empty-child-message text-sm text-slate-500 p-2 pointer-events-none">Sem filhos. Arraste quantificadores para cá ou use “Adicionar filho”.</p>'}
                    </div>
                </div>
            </article>`;
    },

    childHtml(child) {
        return `<div data-quantifier-id="${child.id}" onclick="quantifiersApp.openChildPage(event, ${child.id})" class="quantifier-draggable w-full rounded-xl bg-slate-800/70 border border-slate-700 p-3 text-left hover:border-violet-500 hover:bg-slate-800 transition cursor-grab active:cursor-grabbing">
            <div class="flex items-center justify-between gap-2"><div class="min-w-0"><p class="text-sm font-medium truncate ${Number(child.is_completed) === 1 ? 'line-through text-slate-500' : ''}">${this.escape(child.title)}</p><p class="text-xs text-slate-500">${child.current_quantity}/${child.maximum_quantity} · ${this.childrenOf(child.id).length} filhos${this.periodLabel(child)}</p></div><i class="fa-solid fa-arrow-right text-slate-500"></i></div>
        </div>`;
    },

    initSortables() {
        if (typeof Sortable === 'undefined') { this.toast('Biblioteca de arrastar e soltar indisponível.', false); return; }
        const options = {
            group: 'quantifiers', animation: 180, draggable: '.quantifier-draggable', filter: 'button, input, textarea, .root-drop-hint, .empty-child-message', preventOnFilter: false,
            ghostClass: 'drop-target', dragClass: 'dragging', forceFallback: true, fallbackOnBody: true, scroll: true, scrollSensitivity: 90, scrollSpeed: 16,
            onStart: () => { this.suppressClickUntil = 0; },
            onEnd: (evt) => this.persistSortableMove(evt)
        };
        this.sortables.push(new Sortable(document.getElementById('kanban'), {...options, direction: 'horizontal'}));
        document.querySelectorAll('.quantifier-list').forEach(list => this.sortables.push(new Sortable(list, {...options, direction: 'vertical'})));
    },

    destroySortables() { this.sortables.forEach(s => s.destroy()); this.sortables = []; },

    async persistSortableMove(evt) {
        this.suppressClickUntil = Date.now() + 350;
        const id = Number(evt.item?.dataset?.quantifierId || 0);
        if (!id || !evt.to) return;
        const parentRaw = evt.to.dataset.parentId || '';
        const parentId = parentRaw === '' ? null : Number(parentRaw);
        const siblings = [...evt.to.children].filter(el => el.matches?.('.quantifier-draggable'));
        const position = Math.max(0, siblings.findIndex(el => Number(el.dataset.quantifierId) === id));
        try {
            await this.api('move', { id, id_quantifier_father: parentId, force_root: parentId === null ? 1 : 0, position });
            await this.load();
            const moved = this.getItem(id);
            const savedParentId = moved && moved.id_quantifier_father ? Number(moved.id_quantifier_father) : null;
            if (savedParentId !== parentId) throw new Error(parentId === null ? 'O servidor não transformou o quantificador em kanban raiz.' : 'O servidor não salvou a nova filiação.');
            this.toast('Ordem e filiação salvas.');
        } catch (error) { await this.load(); this.toast(error.message, false); }
    },

    openChildPage(event, id) {
        if (Date.now() < this.suppressClickUntil) { event.preventDefault(); event.stopPropagation(); return; }
        this.goTo(id);
    },

    goTo(id, push = true) {
        this.currentFather = id ? Number(id) : null;
        if (push) {
            const url = new URL(window.location.href);
            if (this.currentFather) url.searchParams.set('father', this.currentFather); else url.searchParams.delete('father');
            window.history.pushState({ father: this.currentFather }, '', url);
        }
        this.render();
    },

    openCreateModal(fatherId = this.currentFather) {
        document.getElementById('modalTitle').textContent = 'Novo quantificador';
        document.getElementById('quantifierId').value = '';
        document.getElementById('title').value = '';
        document.getElementById('maximum').value = 0;
        document.getElementById('current').value = 0;
        document.getElementById('derivative').checked = false;
        document.getElementById('periodType').value = '';
        document.getElementById('customPeriodUnit').value = 'minutes';
        document.getElementById('customPeriodAmount').value = '';
        document.getElementById('startDatetime').value = '';
        document.getElementById('repeatUntil').value = '';
        document.getElementById('editActions').classList.add('hidden');
        this.modalFather = fatherId ? Number(fatherId) : null;
        this.toggleDerivativeField();
        this.showModal();
    },

    openEditModal(id) {
        const item = this.getItem(id);
        if (!item) return;
        document.getElementById('modalTitle').textContent = 'Editar quantificador';
        document.getElementById('quantifierId').value = item.id;
        document.getElementById('title').value = item.title;
        document.getElementById('maximum').value = item.maximum_quantity;
        document.getElementById('current').value = item.current_quantity;
        document.getElementById('derivative').checked = Number(item.derivative_quantities) === 1;
        document.getElementById('periodType').value = item.period_type || '';
        document.getElementById('customPeriodUnit').value = item.custom_period_unit || 'minutes';
        document.getElementById('customPeriodAmount').value = item.custom_period_amount || '';
        document.getElementById('startDatetime').value = this.toDatetimeLocal(item.start_datetime);
        document.getElementById('repeatUntil').value = this.toDatetimeLocal(item.repeat_until);
        document.getElementById('editActions').classList.remove('hidden');
        this.modalFather = item.id_quantifier_father ? Number(item.id_quantifier_father) : null;
        this.toggleDerivativeField();
        this.showModal();
    },

    toggleDerivativeField() {
        const maximum = document.getElementById('maximum');
        const derivative = document.getElementById('derivative').checked;
        const hasPeriod = Boolean(document.getElementById('periodType').value);
        maximum.disabled = false;
        maximum.classList.remove('opacity-50');
        this.togglePeriodFields();
    },

    togglePeriodFields() {
        const periodType = document.getElementById('periodType').value;
        const hasPeriod = Boolean(periodType);
        const isCustom = periodType === 'custom';
        document.getElementById('startDatetimeWrap').classList.toggle('hidden', !hasPeriod);
        document.getElementById('repeatUntilWrap').classList.toggle('hidden', !hasPeriod);
        document.getElementById('customPeriodWrap').classList.toggle('hidden', !isCustom);
        document.getElementById('startDatetime').required = document.getElementById('derivative').checked && hasPeriod;
        document.getElementById('customPeriodUnit').required = isCustom;
        document.getElementById('customPeriodAmount').required = isCustom;
        const maximum = document.getElementById('maximum');
        maximum.disabled = false;
        maximum.classList.remove('opacity-50');
    },

    showModal() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); },
    closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); },
    openVisibilityModal() {
        document.getElementById('hideCompleted').checked = this.hideCompleted;
        document.getElementById('visibilityModal').classList.remove('hidden');
        document.getElementById('visibilityModal').classList.add('flex');
    },
    closeVisibilityModal() { document.getElementById('visibilityModal').classList.add('hidden'); document.getElementById('visibilityModal').classList.remove('flex'); },
    setHideCompleted(value) {
        this.hideCompleted = Boolean(value);
        localStorage.setItem('quantifiers_hide_completed', this.hideCompleted ? '1' : '0');
        this.updateVisibilityButton();
        this.render();
    },
    updateVisibilityButton() {
        const icon = document.getElementById('visibilityIcon');
        if (!icon) return;
        icon.className = `fa-solid ${this.hideCompleted ? 'fa-eye-slash' : 'fa-eye'}`;
        document.getElementById('visibilityButton')?.classList.toggle('text-violet-300', this.hideCompleted);
    },

    async save(event) {
        event.preventDefault();
        const id = document.getElementById('quantifierId').value;
        const payload = {
            id,
            title: document.getElementById('title').value,
            maximum_quantity: document.getElementById('maximum').value || 0,
            current_quantity: document.getElementById('current').value || 0,
            derivative_quantities: document.getElementById('derivative').checked ? 1 : 0,
            period_type: document.getElementById('periodType').value,
            custom_period_unit: document.getElementById('customPeriodUnit').value,
            custom_period_amount: document.getElementById('customPeriodAmount').value,
            start_datetime: this.localDatetimeToUtc(document.getElementById('startDatetime').value),
            repeat_until: this.localDatetimeToUtc(document.getElementById('repeatUntil').value)
        };
        if (!id) {
            payload.id_quantifier_father = this.modalFather;
        }
        try {
            await this.api(id ? 'update' : 'create', payload);
            this.closeModal();
            await this.load();
            this.toast('Quantificador salvo.');
        } catch (error) { this.toast(error.message, false); }
    },

    async complete(id) {
        try { await this.api('complete', {id}); await this.load(); this.toast('Quantificador concluído.'); }
        catch (error) { this.toast(error.message, false); }
    },

    async deleteCurrent() {
        const id = document.getElementById('quantifierId').value;
        if (!id || !confirm('Excluir este quantificador e todos os filhos dele?')) return;
        try { await this.api('delete', {id}); this.closeModal(); await this.load(); this.toast('Quantificador excluído.'); }
        catch (error) { this.toast(error.message, false); }
    },

    async deleteDescendants() {
        const id = document.getElementById('quantifierId').value;
        if (!id || !confirm('Excluir apenas filhos, netos, bisnetos e demais descendentes?')) return;
        try { await this.api('delete_descendants', {id}); this.closeModal(); await this.load(); this.toast('Descendência excluída.'); }
        catch (error) { this.toast(error.message, false); }
    },

    periodLabel(item) {
        const labels = {years: 'anos', months: 'meses', days: 'dias'};
        const customLabels = {minutes: 'minutos', hours: 'horas', days: 'dias', months: 'meses', years: 'anos'};
        if (!item.period_type && !item.start_datetime) return '';
        const period = item.period_type === 'custom'
            ? ` · a cada ${item.custom_period_amount || 1} ${customLabels[item.custom_period_unit] || 'unidades'}`
            : (labels[item.period_type] ? ` · ${labels[item.period_type]}` : '');
        const start = item.start_datetime ? ` · início ${this.formatDateTime(item.start_datetime)}` : '';
        const end = item.end_datetime ? ` · fim ${this.formatDateTime(item.end_datetime)}` : '';
        return `${period}${start}${end}`;
    },

    utcDate(value) {
        if (!value) return null;
        const normalized = String(value).trim().replace(' ', 'T');
        const date = new Date(/(Z|[+-]\d{2}:?\d{2})$/.test(normalized) ? normalized : `${normalized}Z`);
        return Number.isNaN(date.getTime()) ? null : date;
    },

    formatDateTime(value) {
        const date = this.utcDate(value);
        return date ? date.toLocaleString('pt-BR') : (value || '');
    },

    toDatetimeLocal(value) {
        const date = this.utcDate(value);
        if (!date) return '';
        const pad = number => String(number).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    },

    localDatetimeToUtc(value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '';
        const pad = number => String(number).padStart(2, '0');
        return `${date.getUTCFullYear()}-${pad(date.getUTCMonth() + 1)}-${pad(date.getUTCDate())} ${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}:${pad(date.getUTCSeconds())}`;
    },

    escape(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
};

const initialFather = new URLSearchParams(window.location.search).get('father');
quantifiersApp.currentFather = initialFather ? Number(initialFather) : null;
window.addEventListener('popstate', event => {
    quantifiersApp.goTo(event.state?.father || new URLSearchParams(window.location.search).get('father') || null, false);
});
quantifiersApp.load();
</script>
