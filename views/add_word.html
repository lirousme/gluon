function renderMenu(){const m=document.getElementById('menu');m.innerHTML='';tabs.forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t.label;b.className=`px-3 py-2 rounded-lg border text-sm ${active===t.key?'bg-indigo-600 border-indigo-400 text-white':'bg-slate-800 border-slate-600 text-slate-300'}`;b.onclick=()=>{active=t.key;renderMenu();renderForm();};m.appendChild(b);});}
function humanize(k){return k.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());}
function renderForm(){const tab=tabs.find(t=>t.key===active);const f=document.getElementById('wordForm');f.innerHTML='';tab.fields.forEach((name)=>{const w=document.createElement('div');const label=`<label class="block text-xs text-slate-400 mb-1">${humanize(name)}</label>`;if(name==='gender_id'){w.innerHTML=`${label}<select name="gender_id" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3 text-sm"><option value="0">Masculino (0)</option><option value="1">Feminino (1)</option></select><p class="text-xs text-slate-500 mt-1">Ex.: selecione o gênero do substantivo.</p>`;}else{w.innerHTML=`${label}<input name="${name}" placeholder="${fieldExamples[name]||''}" class="w-full bg-slate-950 border border-slate-600 rounded-lg py-2 px-3 text-sm"/>`;}f.appendChild(w);});const s=document.createElement('button');s.className='px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500';s.textContent='Salvar';f.appendChild(s);}
async function save(e){e.preventDefault();const fd=new FormData(e.target);const payload={action:'add_grammar_entry',table:active};fd.forEach((v,k)=>payload[k]=v);const r=await fetch('/api/flashcards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();const el=document.getElementById('status');el.textContent=j.message|| (j.status==='success'?'Registro salvo!':'Erro');el.className=`text-sm mb-3 ${j.status==='success'?'text-emerald-400':'text-rose-400'}`;}
document.getElementById('wordForm').addEventListener('submit',save);
renderMenu();renderForm();
