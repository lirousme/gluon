<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script src="/assets/zoom-lock.js" defer></script>
    <title>Branch Chats</title>
    <style>
        :root { color-scheme: dark; --green: #00a884; --panel: #202c33; --bg: #111b21; --line: #2a3942; --muted: #8696a0; }
        * { box-sizing: border-box; }
        body { margin: 0; height: 100dvh; overflow: hidden; background: #0c1317; color: #e9edef; font: 15px Arial, Helvetica, sans-serif; }
        button, textarea, input, select { font: inherit; }
        button { color: inherit; }
        .app { display: grid; grid-template-columns: minmax(290px, 31%) 1fr; height: 100%; min-height: 0; max-width: 1600px; margin: auto; overflow: hidden; background: var(--bg); box-shadow: 0 0 30px #0008; }
        .sidebar { min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
        .sidebar-header, .chat-header { height: 64px; flex: 0 0 64px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); }
        .chat-header { position: relative; z-index: 2; }
        .chat-header.selection-active > :not(.create-selected-chat) { display: none; }
        .create-selected-chat { width: 100%; height: 42px; border: 0; border-radius: 9px; background: var(--green); color: #fff; font-weight: 700; cursor: pointer; }
        .create-selected-chat:hover, .create-selected-chat:focus-visible { background: #06bd98; outline: none; }
        .create-selected-chat:disabled { background: #35444b; color: var(--muted); cursor: not-allowed; }
        .create-selected-chat[hidden] { display: none; }
        .brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
        .logo, .avatar { display: grid; place-items: center; flex: none; border-radius: 50%; background: linear-gradient(145deg, #00a884, #087d68); font-weight: 700; }
        .logo { width: 42px; height: 42px; font-size: 21px; }
        .avatar { width: 40px; height: 40px; }
        h1, h2, p { margin: 0; }
        h1 { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        h2 { font-size: 16px; font-weight: 500; }
        .subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
        .icon-button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer; }
        .icon-button:hover, .icon-button:focus-visible { background: #ffffff12; outline: none; }
        .read-cycle-count { min-width: 34px; height: 34px; padding: 0 10px; border: 1px solid #ffffff1f; border-radius: 17px; display: inline-flex; align-items: center; justify-content: center; background: #111b21; color: #d1d7db; font-size: 13px; font-weight: 700; }
        svg { width: 22px; height: 22px; fill: currentColor; }
        .search-wrap { padding: 8px 12px; border-bottom: 1px solid var(--line); }
        .search { width: 100%; height: 36px; border: 0; outline: 0; border-radius: 8px; background: var(--panel); color: #e9edef; padding: 0 14px; }
        .search::placeholder { color: var(--muted); }
        .chat-list { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; flex: 1 1 0; }
        .chat-item { width: 100%; min-height: 72px; display: flex; align-items: center; gap: 13px; padding: 10px 14px; border: 0; border-bottom: 1px solid #202c33; background: transparent; text-align: left; cursor: pointer; }
        .chat-item:hover, .chat-item.active { background: var(--panel); }
        .chat-copy { min-width: 0; flex: 1; }
        .chat-line { display: flex; justify-content: space-between; gap: 8px; }
        .chat-title { color: #e9edef; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { color: var(--muted); font-size: 11px; flex: none; }
        .preview { margin-top: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-list { color: var(--muted); text-align: center; padding: 45px 25px; line-height: 1.5; }
        .main { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; position: relative; background-color: #0b141a; background-image: radial-gradient(#ffffff09 1px, transparent 1px); background-size: 22px 22px; }
        .main.chat-type-1 { background-color: #24132f; }
        .main.chat-type-2, .main.chat-type-3 { background-color: #0b3d2e; }
        .back { display: none; }
        .chat-heading { min-width: 0; flex: 1; }
        .branch-count { width: auto; min-width: 40px; padding: 0 10px; border-radius: 20px; gap: 5px; }
        .branch-count svg { width: 19px; height: 19px; }
        .branch-count span { color: #d1d7db; font-size: 13px; font-weight: 700; }
        .read-button { width: auto; min-width: 62px; padding: 0 12px; border-radius: 20px; background: var(--green); font-size: 13px; font-weight: 700; }
        .read-button:hover, .read-button:focus-visible { background: #06bd98; }
        .read-button:disabled { background: #35444b; color: var(--muted); cursor: not-allowed; }
        .messages { min-height: 0; flex: 1 1 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: 26px clamp(18px, 7vw, 100px); scroll-behavior: smooth; }
        .message { max-width: min(68%, 650px); margin: 0 0 6px auto; padding: 7px 8px 5px; border-radius: 8px 0 8px 8px; background: #005c4b; box-shadow: 0 1px 1px #0004; overflow-wrap: anywhere; }
        .message.recipient { margin-right: auto; margin-left: 0; border-radius: 0 8px 8px 8px; background: #075eaa; }
        .message.orange { background: #d96f18; }
        .message.purple { background: #7c3cc8; }
        .audio-button { width: 23px; height: 23px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #a7c8c1; display: grid; place-items: center; cursor: pointer; }
        .audio-button:hover, .audio-button:focus-visible { background: #ffffff18; outline: none; }
        .audio-button svg { width: 15px; height: 15px; }
        .message.read-marker, .message.recipient.read-marker { background: #d94f8f; color: #fff; }
        .message-image { display: block; max-width: 100%; max-height: 420px; border-radius: 6px; object-fit: cover; margin-bottom: 5px; }
        .message-text { white-space: pre-wrap; line-height: 1.4; }
        .message-footer { float: right; display: inline-flex; align-items: center; gap: 3px; margin: 4px -3px 0 12px; color: #a7c8c1; }
        .message-time { font-size: 10px; }
        .message-actions { position: relative; display: inline-flex; }
        .message-more { width: 23px; height: 23px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #a7c8c1; display: grid; place-items: center; cursor: pointer; }
        .message-more:hover, .message-more:focus-visible { background: #ffffff18; outline: none; }
        .message-more svg { width: 16px; height: 16px; }
        .message-menu { position: absolute; z-index: 5; right: 0; bottom: calc(100% + 5px); width: 205px; padding: 7px; border-radius: 9px; background: #233138; box-shadow: 0 8px 28px #000a; }
        .message-menu.opens-downward { top: calc(100% + 5px); bottom: auto; }
        .message-menu[hidden] { display: none; }
        .message-menu button { width: 100%; padding: 10px 11px; border: 0; border-radius: 6px; background: transparent; color: #e9edef; text-align: left; cursor: pointer; }
        .message-menu button:hover, .message-menu button:focus-visible { background: #ffffff12; outline: none; }
        .message-row { display: flex; align-items: center; gap: 14px; }
        .message-row .message { flex: 0 1 auto; }
        .message-row.sent { justify-content: flex-end; }
        .message-row.received { justify-content: flex-start; }
        .message-selector { width: 22px; height: 22px; flex: 0 0 22px; margin: 0; accent-color: var(--green); cursor: pointer; }
        .message-row.selected .message { box-shadow: 0 0 0 2px #00a884, 0 1px 1px #0004; }
        .messages.selection-active .message-row { cursor: pointer; }
        .messages.selection-active .message-actions { display: none; }
        .response-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: #d1d7db; font-size: 12px; font-weight: 600; }
        .response-divider::before, .response-divider::after { content: ''; height: 1px; flex: 1; background: #ffffff24; }
        .response-divider span { padding: 6px 12px; border-radius: 7px; background: #182229; box-shadow: 0 1px 1px #0005; white-space: pre-wrap; }
        .welcome { margin: auto; max-width: 480px; padding: 30px; color: var(--muted); text-align: center; line-height: 1.6; }
        .welcome svg { width: 70px; height: 70px; color: #40525c; }
        .welcome h2 { color: #d1d7db; font-size: 26px; margin: 12px 0; }
        .composer { min-height: 66px; flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); position: relative; }
        .composer.hidden { display: none; }
        .message-box { min-height: 42px; max-height: 120px; flex: 1; resize: none; border: 0; outline: 0; border-radius: 9px; background: #2a3942; color: #e9edef; padding: 11px 13px; line-height: 20px; }
        .message-box::placeholder { color: #8696a0; }
        .send { background: var(--green); }
        .sender-toggle { background: var(--green); touch-action: none; user-select: none; -webkit-user-select: none; }
        .sender-toggle.recipient { background: #1476c9; }
        .sender-toggle.orange { background: #d96f18; }
        .sender-toggle.purple { background: #7c3cc8; }
        .sender-toggle:hover, .sender-toggle:focus-visible { background: #06bd98; }
        .sender-toggle.recipient:hover, .sender-toggle.recipient:focus-visible { background: #2587d7; }
        .sender-toggle.orange:hover, .sender-toggle.orange:focus-visible { background: #e7812f; }
        .sender-toggle.purple:hover, .sender-toggle.purple:focus-visible { background: #8d50d3; }
        .attachment-menu { position: absolute; left: 12px; bottom: calc(100% + 8px); width: 205px; padding: 8px; border-radius: 10px; background: #233138; box-shadow: 0 8px 28px #0009; transform-origin: bottom left; }
        .attachment-menu[hidden] { display: none; }
        .attachment-menu button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; }
        .attachment-menu button:hover { background: #ffffff12; }
        .attachment-menu svg { color: #bf59cf; }
        .image-chip { position: absolute; bottom: calc(100% + 8px); left: 64px; max-width: 280px; display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 8px; background: #2a3942; box-shadow: 0 5px 20px #0007; }
        .image-chip[hidden] { display: none; }
        .image-chip span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .image-chip button { border: 0; background: transparent; color: #ef6b73; cursor: pointer; }
        .toast { position: fixed; z-index: 20; left: 50%; bottom: 90px; transform: translateX(-50%); padding: 10px 16px; border-radius: 8px; background: #e9edef; color: #111b21; box-shadow: 0 4px 18px #0008; }
        .toast[hidden] { display: none; }
        dialog { width: min(92vw, 470px); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: #e9edef; box-shadow: 0 18px 60px #000b; }
        dialog::backdrop { background: #000a; }
        .modal-form { padding: 22px; display: grid; gap: 15px; }
        .modal-form h2 { font-size: 20px; font-weight: 600; }
        .modal-form input[type="text"], .modal-form input[type="number"], .modal-form textarea, .modal-form select { width: 100%; border: 1px solid #3b4a52; border-radius: 8px; outline: none; background: var(--bg); color: inherit; padding: 11px 12px; }
        .modal-form label { display: grid; gap: 7px; color: var(--muted); }
        .modal-form label[hidden] { display: none; }
        .modal-form textarea { min-height: 110px; resize: vertical; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 9px; }
        .modal-actions button { border: 0; border-radius: 8px; padding: 10px 14px; background: #35444b; cursor: pointer; }
        .modal-actions .primary { background: var(--green); font-weight: 700; }
        .modal-actions .danger { margin-right: auto; background: #9d2833; }
        .edit-image-row { display: flex; align-items: center; gap: 12px; color: var(--muted); }
        .edit-image-row img { width: 72px; height: 72px; border-radius: 7px; object-fit: cover; }
        @media (max-width: 720px) {
            .app { display: block; }
            .sidebar, .main { width: 100%; height: 100%; }
            .app.chat-open .sidebar { display: none; }
            .app:not(.chat-open) .main { display: none; }
            .back { display: grid; }
            .messages { padding: 18px 12px; }
            .message { max-width: 86%; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <aside class="sidebar">
        <header class="sidebar-header">
            <div class="brand"><div class="logo">B</div><div><h1>Branch Chats</h1><p class="subtitle">Suas conversas</p></div></div>
            <span class="read-cycle-count" id="readCycleCount" title="Leituras neste ciclo" aria-label="0 de 8 leituras neste ciclo">0/8</span>
            <button class="icon-button" id="newChat" title="Novo chat" aria-label="Criar novo chat">
                <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14l4-4h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2m-6 9h-2V9H8V7h3V4h2v3h3v2h-3z"/></svg>
            </button>
        </header>
        <div class="search-wrap"><input class="search" id="search" type="search" placeholder="Pesquisar ou iniciar nova conversa" aria-label="Pesquisar chats"></div>
        <div class="chat-list" id="chatList"></div>
    </aside>
    <main class="main">
        <header class="chat-header" id="chatHeader" hidden>
            <button class="icon-button back" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="m20 11-12.2.03 5.6-5.6L12 4l-8 8 8 8 1.4-1.43-5.6-5.6L20 13z"/></svg></button>
            <button class="icon-button avatar" id="editChat" type="button" title="Editar chat" aria-label="Editar nome ou excluir chat">B</button><div class="chat-heading"><h2 id="activeTitle"></h2><p class="subtitle" id="chatSubtitle">conversa privada</p></div>
            <button class="icon-button read-button" id="markViewed" type="button">Lido</button>
            <button class="icon-button branch-count" id="branchCount" type="button" title="Branches criados a partir deste chat" aria-label="Nenhum branch criado">
                <svg viewBox="0 0 24 24"><path d="M6 3a3 3 0 1 0 2 5.24v1.26A3.5 3.5 0 0 0 11.5 13H16v2.76A3 3 0 1 0 18 15V8.24a3 3 0 1 0-2 0V11h-4.5A1.5 1.5 0 0 1 10 9.5V8.24A3 3 0 0 0 6 3m0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2m12 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2m0 12a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/></svg><span id="branchCountValue">0</span>
            </button>
            <button class="create-selected-chat" id="createSelectedChat" type="button" hidden>Criar novo chat</button>
        </header>
        <section class="messages" id="messages"><div class="welcome"><svg viewBox="0 0 24 24"><path d="M16.75 13.96c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.16.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.24-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.13-.56-1.35-.77-1.84-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.87.85-.87 2.07s.89 2.4 1.01 2.57c.13.16 1.75 2.67 4.24 3.75.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.07-.11-.23-.17-.48-.29M12.04 21.5h-.01a9.45 9.45 0 0 1-4.82-1.32l-.35-.2-3.58.94.96-3.49-.23-.36A9.44 9.44 0 0 1 2.56 12c0-5.2 4.24-9.44 9.46-9.44 2.53 0 4.9.98 6.68 2.77A9.38 9.38 0 0 1 21.46 12c0 5.2-4.24 9.45-9.42 9.45"/></svg><h2>Branch Chats</h2><p>Selecione uma conversa ao lado ou crie um novo chat para começar.</p></div></section>
        <form class="composer hidden" id="composer">
            <button class="icon-button sender-toggle" id="more" type="button" aria-label="Remetente. Clique para alternar; segure por 1,5 segundo para adicionar imagem" aria-pressed="false" aria-expanded="false" title="Remetente · segure para adicionar imagem"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4m0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4m0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg></button>
            <div class="attachment-menu" id="attachmentMenu" hidden><button type="button" id="generateConversationAudio"><svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 0-4 4v4a4 4 0 1 0 8 0V7a4 4 0 0 0-4-4m-7 8h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.92V21h-2v-3.08A7 7 0 0 1 5 11"/></svg>Gerar áudio para toda conversa</button><button type="button" id="addImage"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2M8.5 13.5l2.5 3.01L14.5 12l4.5 6H5z"/></svg>Adicionar imagem</button></div>
            <div class="image-chip" id="imageChip" hidden><span id="imageName"></span><button type="button" id="removeImage" aria-label="Remover imagem">✕</button></div>
            <input id="imageInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
            <textarea class="message-box" id="messageBox" rows="1" maxlength="10000" placeholder="Mensagem" aria-label="Mensagem"></textarea>
            <button class="icon-button send" id="send" type="submit" aria-label="Enviar mensagem"><svg viewBox="0 0 24 24"><path d="m3.4 20.4 17.45-7.48c.81-.35.81-1.49 0-1.84L3.4 3.6c-.66-.29-1.39.2-1.39.91L2 9.12c0 .5.37.92.87.98L17 12 2.87 13.88c-.5.07-.87.49-.87.99l.01 4.61c0 .72.73 1.21 1.39.92"/></svg></button>
        </form>
    </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="chatDialog"><form class="modal-form" id="chatForm"><h2>Editar chat</h2><input id="chatTitleInput" type="text" maxlength="120" required aria-label="Nome do chat"><label>Máximo de leituras<input id="chatMaxInput" type="number" min="1" step="1" placeholder="Sem limite" aria-label="Máximo de leituras"></label><label id="chatTypeLabel">Tipo do chat<select id="chatTypeInput" aria-label="Tipo do chat"><option value="0">Chat normal</option><option value="1">Answer in a new chat</option><option value="2">Referência</option></select></label><label id="chatReferenceLabel" hidden>Texto da referência<textarea id="chatReferenceInput" maxlength="10000" placeholder="Digite a referência"></textarea></label><div class="modal-actions"><button class="danger" id="deleteChat" type="button">Excluir chat</button><button type="button" data-close="chatDialog">Cancelar</button><button class="primary" type="submit">Salvar</button></div></form></dialog>
<dialog id="messageDialog"><form class="modal-form" id="messageForm"><h2>Editar mensagem</h2><textarea id="editMessageText" maxlength="10000" placeholder="Mensagem" aria-label="Texto da mensagem"></textarea><div class="edit-image-row" id="currentImageRow" hidden><img id="currentImage" alt="Imagem atual"><label><input id="removeCurrentImage" type="checkbox"> Remover imagem atual</label></div><label>Trocar/adicionar imagem <input id="editMessageImage" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></label><div class="modal-actions"><button class="danger" id="deleteMessage" type="button">Excluir mensagem</button><button type="button" data-close="messageDialog">Cancelar</button><button class="primary" type="submit">Salvar</button></div></form></dialog>
<script>
    const state = { chats: [], activeId: null, activeChat: null, editingMessage: null, recipientMode: false, senderVariant: 'green', selectionMode: false, selectedMessages: new Set() };
    const $ = id => document.getElementById(id);
    const api = '/api/branch_chats';
    const readCycleLimit = 8;
    const readCycleStorageKey = 'branchChatsReadCycleCount';
    const timezoneOffset = () => -new Date().getTimezoneOffset();
    const utcDate = value => new Date(/[zZ]|[+-]\d\d:\d\d$/.test(value) ? value : value.replace(' ', 'T') + 'Z');
    const formatTime = value => value ? new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(utcDate(value)) : '';
    const formatDateTime = value => value ? new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(utcDate(value)) : '';
    function toast(message) { $('toast').textContent = message; $('toast').hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(() => $('toast').hidden = true, 3000); }
    function getReadCycleCount() { const count = Number(localStorage.getItem(readCycleStorageKey) || 0); return Number.isFinite(count) ? count % readCycleLimit : 0; }
    function updateReadCycleCount(count = getReadCycleCount()) { $('readCycleCount').textContent = `${count}/${readCycleLimit}`; $('readCycleCount').setAttribute('aria-label', `${count} de ${readCycleLimit} leituras neste ciclo`); }
    function incrementReadCycleCount() { const count = (getReadCycleCount() + 1) % readCycleLimit; localStorage.setItem(readCycleStorageKey, String(count)); updateReadCycleCount(count); return count; }
    async function request(url, options) { const response = await fetch(url, options); const result = await response.json(); if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Não foi possível concluir.'); return result.data; }
    function renderChats() {
        const query = $('search').value.trim().toLowerCase();
        const rows = state.chats.filter(chat => chat.titulo.toLowerCase().includes(query));
        $('chatList').replaceChildren();
        if (!rows.length) { const empty = document.createElement('div'); empty.className = 'empty-list'; empty.textContent = query ? 'Nenhuma conversa encontrada.' : 'Nenhum chat ainda. Crie sua primeira conversa.'; $('chatList').append(empty); return; }
        rows.forEach(chat => {
            const button = document.createElement('button'); button.className = 'chat-item' + (Number(chat.id) === state.activeId ? ' active' : ''); button.type = 'button';
            const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = chat.titulo.charAt(0).toUpperCase();
            const copy = document.createElement('div'); copy.className = 'chat-copy';
            const line = document.createElement('div'); line.className = 'chat-line';
            const title = document.createElement('span'); title.className = 'chat-title'; title.textContent = chat.titulo;
            const time = document.createElement('span'); time.className = 'chat-time'; time.textContent = formatTime(chat.updated_at);
            const preview = document.createElement('div'); preview.className = 'preview'; preview.textContent = chat.ultima_mensagem || (Number(chat.total_mensagens) ? '📷 Imagem' : 'Conversa vazia');
            line.append(title, time); copy.append(line, preview); button.append(avatar, copy); button.addEventListener('click', () => openChat(Number(chat.id))); $('chatList').append(button);
        });
    }
    async function loadChats() { try { state.chats = await request(api); renderChats(); } catch (error) { toast(error.message); } }
    function setMainChatType(chatType) {
        const main = document.querySelector('.main');
        ['chat-type-1', 'chat-type-2', 'chat-type-3'].forEach(className => main.classList.remove(className));
        if ([1, 2, 3].includes(Number(chatType))) main.classList.add(`chat-type-${Number(chatType)}`);
    }
    function renderMessages(messages) {
        $('messages').replaceChildren();
        if ([2, 3].includes(Number(state.activeChat?.chat_type)) && state.activeChat?.reference) { const divider = document.createElement('div'); divider.className = 'response-divider'; divider.setAttribute('role', 'separator'); const label = document.createElement('span'); label.textContent = state.activeChat.reference; divider.append(label); $('messages').append(divider); }
        if (!messages.length) { const empty = document.createElement('div'); empty.className = 'welcome'; empty.innerHTML = '<h2>Nenhuma mensagem</h2><p>Envie uma mensagem para começar esta conversa.</p>'; $('messages').append(empty); return; }
        messages.forEach(item => {
            if (Number(item.is_response)) { const divider = document.createElement('div'); divider.className = 'response-divider'; divider.setAttribute('role', 'separator'); const label = document.createElement('span'); label.textContent = 'Resposta'; divider.append(label); $('messages').append(divider); }
            const recipient = Boolean(Number(item.is_recipient));
            const variant = item.color_variant || (recipient ? 'blue' : 'green');
            const row = document.createElement('div'); row.className = 'message-row ' + (recipient ? 'received' : 'sent');
            const selector = document.createElement('input'); selector.type = 'checkbox'; selector.className = 'message-selector'; selector.hidden = !state.selectionMode; selector.checked = state.selectedMessages.has(Number(item.id)); selector.setAttribute('aria-label', 'Selecionar mensagem');
            const bubble = document.createElement('article'); bubble.className = 'message' + (recipient ? ' recipient' : '') + (['orange', 'purple'].includes(variant) ? ' ' + variant : '') + (Number(item.id) === Number(state.activeChat?.read_marker_message_id || 0) ? ' read-marker' : '');
            bubble.dataset.messageId = String(item.id);
            bubble.setAttribute('aria-label', recipient ? 'Mensagem do destinatário' : 'Mensagem do remetente');
            if (item.imagem_base64) { const image = document.createElement('img'); image.className = 'message-image'; image.src = item.imagem_base64; image.alt = 'Imagem enviada'; image.loading = 'lazy'; bubble.append(image); }
            if (item.texto) { const text = document.createElement('span'); text.className = 'message-text'; text.textContent = item.texto; bubble.append(text); }
            const footer = document.createElement('span'); footer.className = 'message-footer';
            const time = document.createElement('span'); time.className = 'message-time'; time.textContent = formatTime(item.created_at);
            const actions = document.createElement('span'); actions.className = 'message-actions';
            const audio = document.createElement('button'); audio.className = 'audio-button'; audio.type = 'button'; audio.title = item.audio_base64 ? 'Reproduzir áudio' : 'Gerar áudio'; audio.setAttribute('aria-label', audio.title); audio.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12"/></svg>';
            audio.addEventListener('click', event => { event.stopPropagation(); playOrGenerateMessageAudio(item.id, audio); });
            const more = document.createElement('button'); more.className = 'message-more'; more.type = 'button'; more.title = 'Opções da mensagem'; more.setAttribute('aria-label', 'Opções da mensagem'); more.setAttribute('aria-expanded', 'false'); more.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4m0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4m0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg>';
            const menu = document.createElement('span'); menu.className = 'message-menu'; menu.hidden = true;
            const single = document.createElement('button'); single.type = 'button'; single.textContent = 'Branchar mensagem';
            const through = document.createElement('button'); through.type = 'button'; through.textContent = 'Branchar a partir daqui';
            const select = document.createElement('button'); select.type = 'button'; select.textContent = 'Selecionar';
            const edit = document.createElement('button'); edit.type = 'button'; edit.textContent = 'Editar';
            const generateAudio = document.createElement('button'); generateAudio.type = 'button'; generateAudio.textContent = 'Gerar áudio';
            more.addEventListener('click', event => {
                event.stopPropagation();
                const opening = menu.hidden;
                closeMessageMenus(menu);
                menu.hidden = !opening;
                menu.classList.remove('opens-downward');
                if (opening && menu.getBoundingClientRect().top < $('messages').getBoundingClientRect().top) menu.classList.add('opens-downward');
                more.setAttribute('aria-expanded', String(opening));
            });
            menu.addEventListener('click', event => event.stopPropagation());
            single.addEventListener('click', () => branchFromMessage(item.id, 'single'));
            through.addEventListener('click', () => branchFromMessage(item.id, 'through'));
            select.addEventListener('click', () => enterSelectionMode(item.id));
            edit.addEventListener('click', () => openMessageEditor(item));
            generateAudio.addEventListener('click', () => playOrGenerateMessageAudio(item.id));
            selector.addEventListener('change', () => toggleMessageSelection(item.id, selector.checked));
            row.addEventListener('click', event => {
                if (event.target.closest('.message-actions') || event.target === selector) return;
                if (state.selectionMode) { selector.checked = !selector.checked; toggleMessageSelection(item.id, selector.checked); return; }
                setReadMarker(item.id);
            });
            menu.append(generateAudio, select, edit, single, through); actions.append(audio, more, menu); footer.append(time, actions); bubble.append(footer);
            row.classList.toggle('selected', selector.checked);
            if (recipient) row.append(selector, bubble); else row.append(bubble, selector);
            $('messages').append(row);
        });
        requestAnimationFrame(() => $('messages').scrollTop = $('messages').scrollHeight);
    }

    async function playOrGenerateMessageAudio(messageId, button = null) {
        const item = (state.currentMessages || []).find(message => Number(message.id) === Number(messageId));
        if (item?.audio_base64) { new Audio(item.audio_base64).play(); return; }
        if (button) button.disabled = true;
        try {
            const data = new FormData(); data.append('action', 'generate_message_audio'); data.append('chat_id', state.activeId); data.append('message_id', messageId);
            const result = await request(api, { method: 'POST', body: data });
            if (item) item.audio_base64 = result.audio_base64;
            new Audio(result.audio_base64).play();
            toast('Áudio gerado.');
        } catch (error) { toast(error.message); }
        finally { if (button) button.disabled = false; }
    }

    function updateSelectionHeader() {
        $('chatHeader').classList.toggle('selection-active', state.selectionMode);
        $('messages').classList.toggle('selection-active', state.selectionMode);
        $('createSelectedChat').hidden = !state.selectionMode;
        $('createSelectedChat').disabled = state.selectedMessages.size === 0;
        $('createSelectedChat').textContent = `Criar novo chat (${state.selectedMessages.size})`;
    }
    function enterSelectionMode(messageId) {
        closeMessageMenus(); state.selectionMode = true; state.selectedMessages = new Set([Number(messageId)]); renderMessages(state.currentMessages || []); updateSelectionHeader();
    }
    function toggleMessageSelection(messageId, selected) {
        const id = Number(messageId); selected ? state.selectedMessages.add(id) : state.selectedMessages.delete(id);
        document.querySelectorAll('.message-selector').forEach(input => input.closest('.message-row').classList.toggle('selected', input.checked)); updateSelectionHeader();
    }
    function leaveSelectionMode() { state.selectionMode = false; state.selectedMessages.clear(); updateSelectionHeader(); }
    function closeMessageMenus(except) {
        document.querySelectorAll('.message-menu').forEach(menu => { if (menu !== except) { menu.hidden = true; menu.previousElementSibling?.setAttribute('aria-expanded', 'false'); } });
    }
    async function branchFromMessage(messageId, branchMode) {
        try {
            const result = await request(api, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'branch_message', chat_id: state.activeId, message_id: messageId, branch_mode: branchMode, timezone_offset_minutes: timezoneOffset() }) });
            closeMessageMenus(); await loadChats(); await openChat(Number(result.chat_id));
            toast(branchMode === 'single' ? 'Branch criado somente com esta mensagem.' : 'Branch criado até esta mensagem.');
        } catch (error) { toast(error.message); }
    }
    async function openChat(id, preserveRecipientMode = false) {
        try {
            const data = await request(api + '?chat_id=' + id); state.activeId = id; state.activeChat = data.chat;
            setMainChatType(data.chat.chat_type);
            leaveSelectionMode(); state.currentMessages = data.mensagens;
            if (!preserveRecipientMode) setRecipientMode(false);
            $('activeTitle').textContent = data.chat.titulo;
            updateReadStatus(data.chat);
            $('branchCountValue').textContent = data.chat.total_branches;
            $('branchCount').setAttribute('aria-label', `${data.chat.total_branches} ${Number(data.chat.total_branches) === 1 ? 'branch criado' : 'branches criados'}`);
            $('chatHeader').hidden = false; $('composer').classList.remove('hidden'); $('app').classList.add('chat-open'); renderMessages(data.mensagens); renderChats(); $('messageBox').focus();
        } catch (error) { toast(error.message); }
    }
    function updateReadStatus(chat) {
        const available = Boolean(Number(chat.can_mark_viewed));
        $('markViewed').disabled = !available;
        $('markViewed').title = available ? 'Registrar esta leitura' : `Próxima leitura em ${formatDateTime(chat.next_view_at)}`;
        const kind = chat.parent_chat_id ? 'branch de outra conversa' : 'conversa privada';
        const reads = Number(chat.view_count || 0);
        const earlyReview = available && Boolean(Number(chat.early_review)) && chat.next_view_at;
        $('chatSubtitle').textContent = earlyReview
            ? `${kind} · ${reads} ${reads === 1 ? 'leitura' : 'leituras'} · disponível · próxima em ${formatDateTime(chat.next_view_at)}`
            : available
            ? `${kind} · ${reads} ${reads === 1 ? 'leitura' : 'leituras'} · disponível`
            : `${reads} ${reads === 1 ? 'leitura' : 'leituras'} · próxima em ${formatDateTime(chat.next_view_at)}`;
    }
    function updateMessageMarkerClasses() {
        document.querySelectorAll('.message[data-message-id]').forEach(bubble => {
            bubble.classList.toggle('read-marker', Number(bubble.dataset.messageId) === Number(state.activeChat?.read_marker_message_id || 0));
        });
    }
    async function setReadMarker(messageId) {
        const previousMarker = state.activeChat?.read_marker_message_id ?? null;
        state.activeChat.read_marker_message_id = Number(messageId);
        updateMessageMarkerClasses();
        try {
            const marker = await request(api, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'set_read_marker', chat_id: state.activeId, message_id: messageId }) });
            state.activeChat.read_marker_message_id = Number(marker.read_marker_message_id);
            updateMessageMarkerClasses();
        } catch (error) {
            state.activeChat.read_marker_message_id = previousMarker;
            updateMessageMarkerClasses();
            toast(error.message);
        }
    }
    function setRecipientMode(recipient, variant = null) {
        state.recipientMode = recipient;
        state.senderVariant = variant || (recipient ? 'blue' : 'green');
        $('attachmentMenu').hidden = true;
        $('more').classList.toggle('recipient', recipient);
        $('more').classList.toggle('orange', state.senderVariant === 'orange');
        $('more').classList.toggle('purple', state.senderVariant === 'purple');
        $('more').setAttribute('aria-expanded', 'false');
        $('more').setAttribute('aria-pressed', String(recipient));
        $('more').setAttribute('aria-label', `${state.senderVariant === 'purple' ? 'Destinatário roxo' : state.senderVariant === 'orange' ? 'Remetente laranja' : recipient ? 'Destinatário azul' : 'Remetente verde'}. Clique para alternar cor; segure por 1,5 segundo para opções`);
        $('more').title = `${state.senderVariant} · segure para opções`;
    }
    $('newChat').addEventListener('click', async () => { try { const chat = await request(api, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'create_chat', timezone_offset_minutes: timezoneOffset() }) }); await loadChats(); await openChat(chat.id); } catch (error) { toast(error.message); } });
    $('createSelectedChat').addEventListener('click', async () => {
        if (!state.selectedMessages.size) return;
        $('createSelectedChat').disabled = true;
        try {
            const result = await request(api, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'branch_selected_messages', chat_id: state.activeId, message_ids: [...state.selectedMessages], timezone_offset_minutes: timezoneOffset() }) });
            await loadChats(); await openChat(Number(result.chat_id)); toast('Novo chat criado com as mensagens selecionadas.');
        } catch (error) { $('createSelectedChat').disabled = false; toast(error.message); }
    });
    $('search').addEventListener('input', renderChats);
    $('back').addEventListener('click', () => $('app').classList.remove('chat-open'));
    $('branchCount').addEventListener('click', () => { const total = Number(state.activeChat?.total_branches || 0); toast(total ? `${total} ${total === 1 ? 'chat foi criado' : 'chats foram criados'} a partir desta conversa.` : 'Nenhum chat foi criado a partir desta conversa.'); });
    $('markViewed').addEventListener('click', async () => {
        $('markViewed').disabled = true;
        try {
            const view = await request(api, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'mark_viewed', chat_id: state.activeId }) });
            incrementReadCycleCount();
            if (view.deleted) { clearActiveChat(); await loadChats(); toast(`Leitura ${view.view_count} registrada. O chat atingiu o limite e foi excluído.`); return; }
            Object.assign(state.activeChat, view, { read_marker_message_id: null }); updateReadStatus(state.activeChat); updateMessageMarkerClasses(); await loadChats();
            toast(`Leitura ${view.view_count} registrada.`);
        } catch (error) { updateReadStatus(state.activeChat); toast(error.message); }
    });
    function updateReferenceField() { $('chatReferenceLabel').hidden = $('chatTypeInput').value !== '2'; }
    $('chatTypeInput').addEventListener('change', updateReferenceField);
    $('editChat').addEventListener('click', () => { const chatType = Number(state.activeChat?.chat_type || 0); $('chatTitleInput').value = state.activeChat?.titulo || ''; $('chatMaxInput').value = state.activeChat?.max ?? ''; $('chatTypeLabel').hidden = chatType === 3; $('chatTypeInput').value = chatType === 3 ? '0' : String(chatType); $('chatReferenceInput').value = state.activeChat?.reference || ''; updateReferenceField(); $('chatDialog').showModal(); $('chatTitleInput').select(); });
    document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => $(button.dataset.close).close()));
    $('chatForm').addEventListener('submit', async event => { event.preventDefault(); try { const result = await request(api, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'update_chat', chat_id: state.activeId, titulo: $('chatTitleInput').value, max: $('chatMaxInput').value, chat_type: Number($('chatTypeInput').value), reference: $('chatReferenceInput').value }) }); state.activeChat.titulo = result.titulo; state.activeChat.chat_type = result.chat_type; state.activeChat.max = result.max; state.activeChat.reference = result.reference; setMainChatType(result.chat_type); $('activeTitle').textContent = result.titulo; renderMessages(state.currentMessages || []); $('chatDialog').close(); await loadChats(); toast('Chat atualizado.'); } catch (error) { toast(error.message); } });
    function clearActiveChat() { state.activeId = null; state.activeChat = null; setMainChatType(null); $('chatHeader').hidden = true; $('composer').classList.add('hidden'); $('app').classList.remove('chat-open'); }
    $('deleteChat').addEventListener('click', async () => { if (!confirm('Excluir este chat e todos os branches dele permanentemente?')) return; try { await request(api, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'delete_chat', chat_id: state.activeId }) }); $('chatDialog').close(); clearActiveChat(); await loadChats(); toast('Chat e seus branches excluídos.'); } catch (error) { toast(error.message); } });
    function openMessageEditor(item) { closeMessageMenus(); state.editingMessage = item; $('editMessageText').value = item.texto || ''; $('currentImageRow').hidden = !item.imagem_base64; $('currentImage').src = item.imagem_base64 || ''; $('removeCurrentImage').checked = false; $('editMessageImage').value = ''; $('messageDialog').showModal(); }
    $('messageForm').addEventListener('submit', async event => { event.preventDefault(); const data = new FormData(); data.append('action', 'update_message'); data.append('chat_id', state.activeId); data.append('message_id', state.editingMessage.id); data.append('texto', $('editMessageText').value); data.append('remove_image', $('removeCurrentImage').checked ? '1' : '0'); const image = $('editMessageImage').files[0]; if (image) data.append('imagem', image); try { await request(api, { method: 'POST', body: data }); $('messageDialog').close(); await openChat(state.activeId); await loadChats(); toast('Mensagem atualizada.'); } catch (error) { toast(error.message); } });
    $('deleteMessage').addEventListener('click', async () => { if (!confirm('Excluir esta mensagem permanentemente?')) return; try { await request(api, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'delete_message', chat_id: state.activeId, message_id: state.editingMessage.id }) }); $('messageDialog').close(); await openChat(state.activeId); await loadChats(); toast('Mensagem excluída.'); } catch (error) { toast(error.message); } });
    let attachmentHoldTimer = null;
    let attachmentOpenedByHold = false;
    $('more').addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        attachmentOpenedByHold = false;
        clearTimeout(attachmentHoldTimer);
        attachmentHoldTimer = setTimeout(() => {
            attachmentOpenedByHold = true;
            $('attachmentMenu').hidden = false;
            $('more').setAttribute('aria-expanded', 'true');
        }, 1500);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => $('more').addEventListener(type, () => clearTimeout(attachmentHoldTimer)));
    $('more').addEventListener('contextmenu', event => event.preventDefault());
    $('more').addEventListener('click', event => {
        event.stopPropagation();
        if (attachmentOpenedByHold) { attachmentOpenedByHold = false; return; }
        const variants = ['green', 'blue', 'orange', 'purple'];
        const next = variants[(variants.indexOf(state.senderVariant) + 1) % variants.length];
        setRecipientMode(['blue', 'purple'].includes(next), next);
        $('attachmentMenu').hidden = true;
        $('more').setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('click', () => { $('attachmentMenu').hidden = true; $('more').setAttribute('aria-expanded', 'false'); closeMessageMenus(); });
    $('attachmentMenu').addEventListener('click', event => event.stopPropagation());
    $('generateConversationAudio').addEventListener('click', async () => { $('attachmentMenu').hidden = true; if (!state.activeId) return; try { const data = new FormData(); data.append('action', 'generate_chat_audio'); data.append('chat_id', state.activeId);
            const result = await request(api, { method: 'POST', body: data }); await openChat(state.activeId, true); toast(`Áudios gerados: ${result.generated_count}. Falhas: ${result.failed_count}.`); } catch (error) { toast(error.message); } });
    $('addImage').addEventListener('click', () => { $('imageInput').click(); $('attachmentMenu').hidden = true; $('more').setAttribute('aria-expanded', 'false'); });
    $('imageInput').addEventListener('change', () => { const file = $('imageInput').files[0]; $('imageChip').hidden = !file; $('imageName').textContent = file ? file.name : ''; });
    $('removeImage').addEventListener('click', () => { $('imageInput').value = ''; $('imageChip').hidden = true; });
    $('messageBox').addEventListener('input', event => { event.target.style.height = '42px'; event.target.style.height = Math.min(event.target.scrollHeight, 120) + 'px'; });
    $('messageBox').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('composer').requestSubmit(); } });
    $('composer').addEventListener('submit', async event => {
        event.preventDefault(); const text = $('messageBox').value.trim(); const image = $('imageInput').files[0]; if (!text && !image) return;
        const data = new FormData(); data.append('action', 'send_message'); data.append('chat_id', state.activeId); data.append('texto', text); data.append('is_recipient', state.recipientMode ? '1' : '0'); data.append('color_variant', state.senderVariant); data.append('create_branch', '0'); data.append('timezone_offset_minutes', timezoneOffset()); if (image) data.append('imagem', image);
        $('send').disabled = true;
        try {
            const result = await request(api, { method: 'POST', body: data });
            $('messageBox').value = ''; $('messageBox').style.height = '42px'; $('imageInput').value = ''; $('imageChip').hidden = true;
            await loadChats(); await openChat(Number(result.chat_id), true);
            if (result.answered_in_new_chat) toast('Resposta criada em um novo chat.');
            else if (result.branched) toast('Branch criado com a nova mensagem.');
        } catch (error) { toast(error.message); } finally { $('send').disabled = false; }
    });
    updateReadCycleCount();
    loadChats();
</script>
</body>
</html>
