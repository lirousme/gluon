<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags sem vínculos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between gap-3 mb-4">
      <button type="button" onclick="history.back()" class="rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">Voltar</button>
      <h1 class="text-lg md:text-xl font-semibold">Tags sem vínculos</h1>
      <span id="countBadge" class="rounded-lg border border-red-500 bg-red-600/80 px-3 py-2 text-sm">0</span>
    </div>
    <section class="bg-slate-800/60 border border-slate-700 rounded-xl p-4">
      <div id="tagsList" class="space-y-2"></div>
    </section>
  </div>
  <script>
    function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
    async function api(action, payload = {}) {
      payload.action = action;
      const r = await fetch('/api/flashcards', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const j = await r.json();
      if (!r.ok || j.status !== 'success') throw new Error(j.message || 'Erro');
      return j;
    }
    function getTagLabel(tag = {}) {
      const numero = tag?.numero;
      const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
      if (hasNumero) return String(numero).trim();
      const name = String(tag?.name || '').trim();
      const namePtBr = String(tag?.name_pt_br || '').trim();
      if (name && namePtBr && name.toLowerCase() !== namePtBr.toLowerCase()) return `${name} (${namePtBr})`;
      return name || namePtBr || 'Tag sem nome';
    }
    async function load(){
      const res = await api('list_orphan_user_tags');
      const tags = res.data || [];
      document.getElementById('countBadge').textContent = String(tags.length);
      const el = document.getElementById('tagsList');
      if (!tags.length) {
        el.innerHTML = '<p class="text-sm text-slate-400">Nenhuma tag sem vínculo encontrada.</p>';
        return;
      }
      el.innerHTML = tags.map((t) => `<article class="rounded-lg border border-slate-700 bg-slate-900/60 p-3"><p class="text-sm text-slate-100">${esc(getTagLabel(t))}</p></article>`).join('');
    }
    window.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
