<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tags por quantidade de cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,
    body {
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    input,
    textarea,
    select,
    button {
      font-size: 16px;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between gap-3 mb-4">
      <button type="button" onclick="history.back()" class="rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">Voltar</button>
      <div class="text-center">
        <h1 class="text-lg md:text-xl font-semibold">Tags por quantidade de cards</h1>
        <p id="pageInfo" class="text-xs text-slate-400 mt-1">Ordenadas por menos cards em Subjects, Objects e Lexical Chunks</p>
      </div>
      <span id="countBadge" class="rounded-lg border border-violet-500 bg-violet-600/80 px-3 py-2 text-sm">0</span>
    </div>
    <section class="mb-4 bg-slate-800/60 border border-sky-500/40 rounded-xl p-4 shadow-lg shadow-sky-950/20">
      <div class="mb-3 flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h2 class="text-base font-semibold text-sky-100">Tags fixadas</h2>
          <p id="pinnedInfo" class="text-xs text-slate-400">Tags fixadas pelo usuário atual</p>
        </div>
        <span id="pinnedCountBadge" class="self-start rounded-lg border border-sky-500 bg-sky-600/70 px-2.5 py-1 text-xs text-sky-50 sm:self-auto">0</span>
      </div>
      <div id="pinnedTagsList" class="space-y-2"></div>
    </section>

    <section id="allTagsSection" class="bg-slate-800/60 border border-slate-700 rounded-xl p-4">
      <div class="mb-3">
        <h2 class="text-base font-semibold text-slate-100">Todas as tags</h2>
        <p class="text-xs text-slate-400">Lista paginada das tags do usuário atual</p>
        <label for="tagSearchInput" class="sr-only">Pesquisar tags</label>
        <div class="mt-3">
          <input id="tagSearchInput" type="search" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500/30" placeholder="Pesquisar tags por nome, tradução ou número..." autocomplete="off">
          <p id="tagSearchHelp" class="mt-1 text-xs text-slate-500">Digite para ver sugestões de tags que começam com o texto informado.</p>
        </div>
      </div>
      <div id="tagsList" class="space-y-2"></div>
      <div id="pagination" class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-3 border-t border-slate-700 pt-4 hidden">
        <button id="prevPage" type="button" class="rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40">Anterior</button>
        <span id="paginationLabel" class="text-sm text-slate-300">Página 1 de 1</span>
        <button id="nextPage" type="button" class="rounded-lg border border-slate-600 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40">Próxima</button>
      </div>
    </section>
  </div>
  <script>
(function lockMobileZoom(){
  const viewport = document.querySelector('meta[name="viewport"]');
  const lockedViewport = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
  if (viewport) viewport.setAttribute('content', lockedViewport);

  const preventZoom = (event) => event.preventDefault();
  document.addEventListener('gesturestart', preventZoom, { passive: false });
  document.addEventListener('gesturechange', preventZoom, { passive: false });
  document.addEventListener('gestureend', preventZoom, { passive: false });

  document.addEventListener('touchmove', (event) => {
    if (event.touches && event.touches.length > 1) event.preventDefault();
  }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  document.addEventListener('wheel', (event) => {
    if (event.ctrlKey) event.preventDefault();
  }, { passive: false });
})();
    const state = { page: 1, perPage: 10, total: 0, totalPages: 1, search: '', allTags: null, searchRequestId: 0 };
    function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
    async function api(action, payload = {}) {
      payload.action = action;
      const r = await fetch('/api/flashcards', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const j = await r.json();
      if (!r.ok || j.status !== 'success') throw new Error(j.message || 'Erro');
      return j;
    }
    function getTagLabel(tag = {}) {
      const numero = tag?.numero;
      const hasNumero = numero !== null && numero !== undefined && String(numero).trim() !== '';
      if (hasNumero) return String(numero).trim();
      const name = String(tag?.name || '').trim();
      const namePtBr = String(tag?.name_pt_br || '').trim();
      if (name && namePtBr && name.toLowerCase() !== namePtBr.toLowerCase()) return `${name} (${namePtBr})`;
      return name || namePtBr || 'Tag sem nome';
    }
    function buildTagRoute(path, tag = {}) {
      const params = new URLSearchParams();
      const tagId = Number(tag?.id || 0);
      if (tagId) params.set('tag_id', String(tagId));
      const tagName = getTagLabel(tag);
      if (tagName) params.set('tag_name', tagName);
      const query = params.toString();
      return `${path}${query ? `?${query}` : ''}`;
    }
    function goToTagCards(tag = {}) {
      window.location.href = buildTagRoute('/views/card_da_tag.html', tag);
    }
    function goToTagFamily(tag = {}) {
      window.location.href = buildTagRoute('/views/tag_family.html', tag);
    }
    function normalizePinnedTag(filter = {}) {
      return { ...filter, id: Number(filter.id_tag || filter.id || 0) };
    }
    function normalizeSearchText(value = '') {
      return String(value)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toLowerCase();
    }
    function getTagSearchFields(tag = {}) {
      const fields = [getTagLabel(tag), tag?.name, tag?.name_pt_br, tag?.numero]
        .map((value) => normalizeSearchText(value))
        .filter(Boolean);
      return [...new Set(fields)];
    }
    function tagStartsWithSearch(tag = {}, search = '') {
      const normalizedSearch = normalizeSearchText(search);
      if (!normalizedSearch) return false;
      return getTagSearchFields(tag).some((field) => field.startsWith(normalizedSearch));
    }
    function sortTagsBySuggestionText(tags = []) {
      return [...tags].sort((a, b) => getTagLabel(a).localeCompare(getTagLabel(b), 'pt-BR', { numeric: true, sensitivity: 'base' }));
    }
    async function getAllTagsForSearch() {
      if (state.allTags) return state.allTags;
      const res = await api('list_tags');
      state.allTags = (res.data || []).filter((tag) => Number(tag.id) > 0);
      return state.allTags;
    }
    function renderSearchPagination() {
      const pagination = document.getElementById('pagination');
      const pageInfo = document.getElementById('pageInfo');
      pagination.classList.add('hidden');
      pageInfo.textContent = state.total
        ? `${state.total} sugestão${state.total === 1 ? '' : 'ões'} para "${state.search}" — tags que começam com o texto digitado`
        : `Nenhuma tag encontrada começando com "${state.search}"`;
    }
    function renderTagArticle(tag, index, options = {}) {
      const count = Number(tag.subjects_count || 0);
      const label = count === 1 ? '1 card' : `${count} cards`;
      const tagLabel = getTagLabel(tag);
      const tagIndexAttr = options.tagIndexAttr || 'data-tag-index';
      const cardIndexAttr = options.cardIndexAttr || 'data-card-index';
      const articleClass = options.articleClass || 'border-slate-700 bg-slate-900/60 hover:border-violet-500/60 hover:bg-slate-900 focus:ring-violet-500/70';
      const countClass = options.countClass || 'border-slate-600 bg-slate-800 text-slate-300 hover:border-sky-500/70 hover:bg-sky-500/20 hover:text-sky-100';
      const countMarkup = options.showCount === false
        ? ''
        : `<button type="button" ${cardIndexAttr}="${index}" class="shrink-0 rounded-full border px-2.5 py-1 text-xs transition ${countClass}" aria-label="Ver ${esc(label)} da tag ${esc(tagLabel)}">${esc(label)}</button>`;
      return `<article ${tagIndexAttr}="${index}" tabindex="0" role="link" class="flex cursor-pointer items-center justify-between gap-3 rounded-lg border p-3 transition focus:outline-none focus:ring-2 ${articleClass}"><p class="text-sm text-slate-100">${esc(tagLabel)}</p>${countMarkup}</article>`;
    }
    function bindTagNavigation(container, tags, options = {}) {
      const tagSelector = `[${options.tagIndexAttr || 'data-tag-index'}]`;
      const cardSelector = `[${options.cardIndexAttr || 'data-card-index'}]`;
      container.querySelectorAll(cardSelector).forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          goToTagCards(tags[Number(button.getAttribute(options.cardIndexAttr || 'data-card-index'))] || {});
        });
      });
      container.querySelectorAll(tagSelector).forEach((article) => {
        const openFamily = () => goToTagFamily(tags[Number(article.getAttribute(options.tagIndexAttr || 'data-tag-index'))] || {});
        article.addEventListener('click', openFamily);
        article.addEventListener('keydown', (event) => {
          if (event.target !== article) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openFamily();
          }
        });
      });
    }
    function renderPagination() {
      const pagination = document.getElementById('pagination');
      const prev = document.getElementById('prevPage');
      const next = document.getElementById('nextPage');
      const label = document.getElementById('paginationLabel');
      const pageInfo = document.getElementById('pageInfo');
      pagination.classList.toggle('hidden', state.totalPages <= 1 && state.total <= state.perPage);
      prev.disabled = state.page <= 1;
      next.disabled = state.page >= state.totalPages;
      label.textContent = `Página ${state.page} de ${state.totalPages}`;
      const searchSuffix = state.search ? ` filtrada${state.total === 1 ? '' : 's'} por \"${state.search}\"` : '';
      pageInfo.textContent = state.total
        ? `Mostrando ${Math.min(state.perPage, Math.max(0, state.total - ((state.page - 1) * state.perPage)))} de ${state.total} tag${state.total === 1 ? '' : 's'}${searchSuffix} — menos cards em Subjects, Objects e Lexical Chunks primeiro`
        : (state.search ? `Nenhuma tag encontrada para \"${state.search}\"` : 'Nenhuma tag encontrada para o usuário atual');
    }
    async function loadPinnedTags(){
      const el = document.getElementById('pinnedTagsList');
      const info = document.getElementById('pinnedInfo');
      const badge = document.getElementById('pinnedCountBadge');
      el.innerHTML = '<p class="text-sm text-slate-400">Carregando tags fixadas...</p>';
      try {
        const res = await api('list_saved_filters');
        const pinnedTags = (res.data || []).map(normalizePinnedTag).filter((tag) => Number(tag.id) > 0);
        badge.textContent = String(pinnedTags.length);
        info.textContent = pinnedTags.length
          ? `${pinnedTags.length} tag${pinnedTags.length === 1 ? '' : 's'} fixada${pinnedTags.length === 1 ? '' : 's'} para o usuário atual`
          : 'Nenhuma tag fixada para o usuário atual';
        if (!pinnedTags.length) {
          el.innerHTML = '<p class="text-sm text-slate-400">Nenhuma tag fixada para o usuário atual.</p>';
          return;
        }
        el.innerHTML = pinnedTags.map((tag, index) => renderTagArticle(tag, index, {
          tagIndexAttr: 'data-pinned-tag-index',
          cardIndexAttr: 'data-pinned-card-index',
          articleClass: 'border-sky-500/30 bg-sky-950/30 hover:border-sky-400/70 hover:bg-sky-950/50 focus:ring-sky-400/70',
          countClass: 'border-sky-500/40 bg-sky-900/60 text-sky-100 hover:border-sky-300 hover:bg-sky-500/30 hover:text-white'
        })).join('');
        bindTagNavigation(el, pinnedTags, { tagIndexAttr: 'data-pinned-tag-index', cardIndexAttr: 'data-pinned-card-index' });
      } catch (error) {
        badge.textContent = '0';
        info.textContent = 'Não foi possível carregar as tags fixadas';
        el.innerHTML = `<p class="text-sm text-red-300">${esc(error.message || 'Erro ao carregar tags fixadas.')}</p>`;
      }
    }
    async function load(page = state.page){
      const el = document.getElementById('tagsList');
      el.innerHTML = '<p class="text-sm text-slate-400">Carregando tags...</p>';
      try {
        const res = await api('list_user_tags_by_subject_card_count', { page, per_page: state.perPage });
        const tags = res.data || [];
        state.page = Number(res.page || page || 1);
        state.perPage = Number(res.per_page || state.perPage);
        state.total = Number(res.total || tags.length || 0);
        state.totalPages = Number(res.total_pages || 1);
        document.getElementById('countBadge').textContent = String(state.total);
        if (!tags.length) {
          el.innerHTML = '<p class="text-sm text-slate-400">Nenhuma tag encontrada para o usuário atual.</p>';
          renderPagination();
          return;
        }
        el.innerHTML = tags.map((tag, index) => renderTagArticle(tag, index)).join('');
        bindTagNavigation(el, tags);
        renderPagination();
      } catch (error) {
        el.innerHTML = `<p class="text-sm text-red-300">${esc(error.message || 'Erro ao carregar tags.')}</p>`;
      }
    }
    async function renderSearchSuggestions(){
      const el = document.getElementById('tagsList');
      const requestId = ++state.searchRequestId;
      const search = state.search;
      if (!search) {
        load(1);
        return;
      }
      el.innerHTML = '<p class="text-sm text-slate-400">Buscando sugestões...</p>';
      try {
        const allTags = await getAllTagsForSearch();
        if (requestId !== state.searchRequestId || search !== state.search) return;
        const tags = sortTagsBySuggestionText(allTags.filter((tag) => tagStartsWithSearch(tag, search)));
        state.page = 1;
        state.total = tags.length;
        state.totalPages = 1;
        document.getElementById('countBadge').textContent = String(tags.length);
        if (!tags.length) {
          el.innerHTML = `<p class="text-sm text-slate-400">Nenhuma tag começa com "${esc(search)}".</p>`;
          renderSearchPagination();
          return;
        }
        el.innerHTML = tags.map((tag, index) => renderTagArticle(tag, index, { showCount: false })).join('');
        bindTagNavigation(el, tags);
        renderSearchPagination();
      } catch (error) {
        if (requestId !== state.searchRequestId) return;
        el.innerHTML = `<p class="text-sm text-red-300">${esc(error.message || 'Erro ao buscar sugestões de tags.')}</p>`;
      }
    }
    document.getElementById('prevPage').addEventListener('click', () => { if (state.page > 1) load(state.page - 1); });
    document.getElementById('nextPage').addEventListener('click', () => { if (state.page < state.totalPages) load(state.page + 1); });
    document.getElementById('tagSearchInput').addEventListener('input', (event) => {
      state.search = event.target.value.trim();
      clearTimeout(window.tagSearchTimer);
      window.tagSearchTimer = setTimeout(renderSearchSuggestions, 80);
    });
    window.addEventListener('DOMContentLoaded', () => { loadPinnedTags(); load(1); });
  </script>
</body>
</html>
