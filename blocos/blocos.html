<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocos em Inglês</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
</head>
<body class="bg-black text-zinc-100 min-h-screen">
  <main class="max-w-2xl mx-auto px-4 py-6">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold">Blocos</h1>
      <button
        id="new-block-btn"
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-zinc-800 text-xl font-semibold transition hover:bg-zinc-700 focus:outline-none focus:ring-2 focus:ring-zinc-500"
        aria-label="Criar novo bloco"
        title="Criar novo bloco"
      >
        +
      </button>
    </header>

    <section id="blocks-list" class="flex flex-col gap-3"></section>
    <p id="empty-state" class="hidden text-zinc-400">Nenhum bloco cadastrado.</p>
  </main>

  <div id="block-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 px-4">
    <div class="w-full max-w-lg rounded-xl border border-zinc-800 bg-zinc-900 p-4">
      <h2 class="mb-4 text-lg font-semibold">Novo bloco</h2>

      <form id="block-form" class="space-y-4">
        <div>
          <label for="nome_pt_br" class="mb-1 block text-sm text-zinc-300">Nome</label>
          <input id="nome_pt_br" name="nome_pt_br" type="text" required class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100 outline-none focus:ring-2 focus:ring-zinc-600" placeholder="Digite o nome do bloco" />
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancel-modal" class="rounded-lg border border-zinc-700 px-4 py-2 text-sm hover:bg-zinc-800">Cancelar</button>
          <button type="submit" class="rounded-lg bg-zinc-100 px-4 py-2 text-sm font-medium text-zinc-900 hover:bg-zinc-200">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const listEl = document.getElementById('blocks-list');
    const emptyStateEl = document.getElementById('empty-state');
    const newBlockBtn = document.getElementById('new-block-btn');
    const blockModal = document.getElementById('block-modal');
    const blockForm = document.getElementById('block-form');
    const cancelModalBtn = document.getElementById('cancel-modal');

    function toggleModal(show) {
      if (show) {
        blockModal.classList.remove('hidden');
        blockModal.classList.add('flex');
      } else {
        blockModal.classList.add('hidden');
        blockModal.classList.remove('flex');
      }
    }

    function renderBlocks(blocks) {
      listEl.innerHTML = '';

      if (!Array.isArray(blocks) || blocks.length === 0) {
        emptyStateEl.classList.remove('hidden');
        return;
      }

      emptyStateEl.classList.add('hidden');

      blocks.forEach((block) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'w-full rounded-xl border border-zinc-800 bg-zinc-900 px-4 py-3 text-left transition hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-600';
        card.textContent = block.nome_pt_br;
        card.addEventListener('click', () => {
          window.location.href = `/blocos/cards.html?id_bloco=${encodeURIComponent(block.id)}`;
        });

        listEl.appendChild(card);
      });
    }

    async function loadBlocks() {
      try {
        const response = await fetch('/api/blocos');
        const payload = await response.json();

        if (!response.ok || payload.status !== 'success') {
          throw new Error(payload.message || 'Erro ao carregar blocos.');
        }

        renderBlocks(payload.data);
      } catch (error) {
        console.error(error);
        emptyStateEl.textContent = 'Erro ao carregar os blocos.';
        emptyStateEl.classList.remove('hidden');
      }
    }

    async function createBlock(event) {
      event.preventDefault();

      const formData = new FormData(blockForm);
      const nome = (formData.get('nome_pt_br') || '').toString().trim();

      if (!nome) return;

      try {
        const response = await fetch('/api/blocos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ nome_pt_br: nome })
        });

        const payload = await response.json();

        if (!response.ok || payload.status !== 'success') {
          throw new Error(payload.message || 'Erro ao criar bloco.');
        }

        blockForm.reset();
        toggleModal(false);
        await loadBlocks();
      } catch (error) {
        console.error(error);
        alert('Não foi possível criar o bloco.');
      }
    }

    newBlockBtn.addEventListener('click', () => toggleModal(true));
    cancelModalBtn.addEventListener('click', () => toggleModal(false));
    blockModal.addEventListener('click', (event) => {
      if (event.target === blockModal) {
        toggleModal(false);
      }
    });
    blockForm.addEventListener('submit', createBlock);
    loadBlocks();
  </script>
</body>
</html>
