<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Ações - Análise de Curto Prazo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 12px;
            width: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 6px;
            border-top: 1px solid #e2e8f0;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 6px;
            border: 2px solid #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
        }

        th,
        td {
            border-bottom: 1px solid #f3f4f6;
        }

        thead th {
            border-bottom: 2px solid #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800 font-sans pb-20">
    <div class="w-full mx-auto h-[calc(100vh-5rem)] flex flex-col">
        <div class="bg-white p-6 rounded-t-xl shadow-sm border border-gray-100 flex flex-col gap-5 shrink-0">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Meus Ativos - Gatilhos de Curto Prazo</h1>
                    <p class="text-sm text-gray-500 mt-1">Inclui score de curto prazo, filtros rápidos e barra horizontal fixa na largura total da tela.</p>
                </div>

                <div class="flex-shrink-0">
                    <label for="jsonFileInput" class="cursor-pointer inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Carregar arquivo JSON
                    </label>
                    <input type="file" id="jsonFileInput" accept=".json" class="hidden">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3 text-sm">
                <div>
                    <label for="filtroSetor" class="block text-gray-600 mb-1 font-medium">Setor</label>
                    <select id="filtroSetor" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white">
                        <option value="">Todos os setores</option>
                    </select>
                </div>
                <div>
                    <label for="filtroMdi" class="block text-gray-600 mb-1 font-medium">MDI (mês)</label>
                    <select id="filtroMdi" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white">
                        <option value="">Todos os meses</option>
                    </select>
                </div>
                <div>
                    <label for="filtroMargemMin" class="block text-gray-600 mb-1 font-medium">Margem mínima (%)</label>
                    <input id="filtroMargemMin" type="number" step="0.01" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Ex.: 15">
                </div>
                <div>
                    <label for="filtroDyMin" class="block text-gray-600 mb-1 font-medium">DY mínimo (%)</label>
                    <input id="filtroDyMin" type="number" step="0.01" class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Ex.: 6">
                </div>
            </div>

            <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-gray-700">
                <label class="inline-flex items-center gap-2"><input id="filtroCarteira" type="checkbox" class="rounded"> Somente em carteira</label>
                <label class="inline-flex items-center gap-2"><input id="filtroPrevidenciaria" type="checkbox" class="rounded"> Somente previdenciárias</label>
                <label class="inline-flex items-center gap-2"><input id="filtroGatilho" type="checkbox" class="rounded" checked> Somente gatilho (mês atual/próximo + margem positiva)</label>
                <button id="limparFiltros" type="button" class="ml-auto inline-flex items-center px-3 py-1.5 rounded-lg border border-gray-300 hover:bg-gray-100">Limpar filtros</button>
            </div>
        </div>

        <div class="bg-white rounded-b-xl shadow-sm border border-t-0 border-gray-100 flex-1 overflow-hidden flex flex-col">
            <div id="tableWrapper" class="custom-scrollbar overflow-auto flex-1 relative">
                <table id="acoesTable" class="min-w-full text-left whitespace-nowrap text-xs">
                    <thead>
                        <tr id="headerRow" class="text-gray-600 uppercase tracking-wider select-none"></tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm">
                        <tr id="loadingState">
                            <td colspan="100" class="py-8 px-6 text-center text-gray-500">
                                <div class="flex justify-center items-center gap-2">
                                    <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    Carregando dados padrão...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="fixedScrollbar" class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 border-t border-gray-200 shadow-[0_-4px_10px_rgba(0,0,0,0.04)] overflow-x-auto">
        <div id="fixedScrollbarContent" class="h-6"></div>
    </div>

    <script>
        let rawData = [];
        let filteredData = [];
        let currentSort = { column: null, direction: 'desc' };

        const nomesMeses = {
            '01': 'Jan', '02': 'Fev', '03': 'Mar', '04': 'Abr', '05': 'Mai', '06': 'Jun',
            '07': 'Jul', '08': 'Ago', '09': 'Set', '10': 'Out', '11': 'Nov', '12': 'Dez'
        };

        const hoje = new Date();
        const mesAtual = String(hoje.getMonth() + 1).padStart(2, '0');
        const mesQueVem = String((hoje.getMonth() + 1) % 12 + 1).padStart(2, '0');

        const columnConfig = [
            { key: 'nome', label: 'Empresa', type: 'string', sticky: true },
            { key: 'short_term_score', label: 'Score CP', type: 'number', helper: 'Indicador calculado para curto prazo' },
            { key: 'short_term_signal', label: 'Status Curto Prazo', type: 'string' },
            { key: 'id', label: 'ID', type: 'number' },
            { key: 'imagem', label: 'Imagem', type: 'image' },
            { key: 'sigla', label: 'Sigla', type: 'string' },
            { key: 'setor', label: 'Setor', type: 'string' },
            { key: 'is_previdenciaria', label: 'Previdenciária', type: 'boolean-number' },
            { key: 'mdi', label: 'Meses (MDI)', type: 'mdi' },
            { key: 'margem_seguranca', label: 'Margem Seg. (%)', type: 'percent' },
            { key: 'dy', label: 'DY (%)', type: 'percent' },
            { key: 'cotacao', label: 'Cotação', type: 'currency' },
            { key: 'cotacao_variation_percent', label: 'Variação (%)', type: 'percent' },
            { key: 'preco_teto', label: 'Preço Teto', type: 'currency' },
            { key: 'dpa', label: 'DPA', type: 'number' },
            { key: 'acao_id', label: 'Ação ID', type: 'number' },
            { key: 'resultado', label: 'Resultado', type: 'number' },
            { key: 'posicao', label: 'Posição', type: 'number' },
            { key: 'rentabilidade', label: 'Rentabilidade', type: 'percent' },
            { key: 'numero_atual', label: 'Número Atual', type: 'number' },
            { key: 'meta_total', label: 'Meta Total', type: 'number' },
            { key: 'percentual_atingido', label: '% Atingido', type: 'percent' },
            { key: 'preco_medio', label: 'Preço Médio', type: 'currency' },
            { key: 'preco_medio_ajustado', label: 'Preço Médio Ajust.', type: 'currency' },
            { key: 'yoc', label: 'YoC (%)', type: 'percent' },
            { key: 'is_active', label: 'Ativa', type: 'boolean-number' },
            { key: 'tem_carteira', label: 'Em Carteira', type: 'boolean' }
        ];

        const sortableColumns = columnConfig.map(col => col.key);

        document.addEventListener('DOMContentLoaded', () => {
            buildTableHeader();
            setupFilterEvents();
            setupFixedScrollbar();
            carregarJsonPadrao();
        });

        function carregarJsonPadrao() {
            fetch('acoes.json')
                .then(response => {
                    if (!response.ok) throw new Error('Arquivo padrão não encontrado.');
                    return response.json();
                })
                .then(json => {
                    rawData = (json.dados || json || []).map(enhanceRow);
                    popularFiltrosBase(rawData);
                    aplicarFiltros();
                    sortTable('short_term_score', true);
                })
                .catch(() => {
                    document.getElementById('tableBody').innerHTML = `
                        <tr>
                            <td colspan="100" class="py-8 px-6 text-center text-gray-400 italic">
                                Arquivo não encontrado. Utilize o botão acima para carregar o seu JSON.
                            </td>
                        </tr>`;
                });
        }

        function setupFilterEvents() {
            ['filtroSetor', 'filtroMdi', 'filtroMargemMin', 'filtroDyMin', 'filtroCarteira', 'filtroPrevidenciaria', 'filtroGatilho']
                .forEach(id => document.getElementById(id).addEventListener('input', aplicarFiltros));

            document.getElementById('limparFiltros').addEventListener('click', () => {
                document.getElementById('filtroSetor').value = '';
                document.getElementById('filtroMdi').value = '';
                document.getElementById('filtroMargemMin').value = '';
                document.getElementById('filtroDyMin').value = '';
                document.getElementById('filtroCarteira').checked = false;
                document.getElementById('filtroPrevidenciaria').checked = false;
                document.getElementById('filtroGatilho').checked = true;
                aplicarFiltros();
            });

            document.getElementById('jsonFileInput').addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const json = JSON.parse(e.target.result);
                        rawData = (json.dados || json || []).map(enhanceRow);
                        currentSort = { column: null, direction: 'desc' };
                        popularFiltrosBase(rawData);
                        aplicarFiltros();
                        sortTable('short_term_score', true);
                    } catch (error) {
                        alert('Erro ao processar o arquivo. Verifique o console.');
                        console.error('Erro de parsing:', error);
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            });
        }

        function enhanceRow(item) {
            const normalized = { ...item };
            normalized.short_term_signal = isGatilhoCurtoPrazo(normalized) ? 'Data com próxima' : 'Aguardar';
            normalized.short_term_score = calcularScoreCurtoPrazo(normalized);
            return normalized;
        }

        function calcularScoreCurtoPrazo(item) {
            const margem = Number(item.margem_seguranca) || 0;
            const dy = Number(item.dy) || 0;
            const variacao = Number(item.cotacao_variation_percent) || 0;
            const gatilhoBonus = isGatilhoCurtoPrazo(item) ? 15 : 0;
            const carteiraBonus = item.tem_carteira ? 5 : 0;
            return (margem * 0.45) + (dy * 0.30) + (variacao * 0.25) + gatilhoBonus + carteiraBonus;
        }

        function isGatilhoCurtoPrazo(item) {
            return Array.isArray(item.mdi)
                && (item.mdi.includes(mesAtual) || item.mdi.includes(mesQueVem))
                && (Number(item.margem_seguranca) > 0);
        }

        function popularFiltrosBase(dados) {
            const setores = [...new Set(dados.map(item => item.setor).filter(Boolean))].sort((a, b) => a.localeCompare(b));
            const mdiValores = [...new Set(dados.flatMap(item => Array.isArray(item.mdi) ? item.mdi : []))].sort();

            const setorSelect = document.getElementById('filtroSetor');
            const setorAtual = setorSelect.value;
            setorSelect.innerHTML = '<option value="">Todos os setores</option>';
            setores.forEach(setor => setorSelect.innerHTML += `<option value="${setor}">${setor}</option>`);
            setorSelect.value = setores.includes(setorAtual) ? setorAtual : '';

            const mdiSelect = document.getElementById('filtroMdi');
            const mdiAtual = mdiSelect.value;
            mdiSelect.innerHTML = '<option value="">Todos os meses</option>';
            mdiValores.forEach(mdi => mdiSelect.innerHTML += `<option value="${mdi}">${nomesMeses[mdi] || mdi}</option>`);
            mdiSelect.value = mdiValores.includes(mdiAtual) ? mdiAtual : '';
        }

        function aplicarFiltros() {
            const setor = document.getElementById('filtroSetor').value;
            const mdi = document.getElementById('filtroMdi').value;
            const margemMin = parseFloat(document.getElementById('filtroMargemMin').value);
            const dyMin = parseFloat(document.getElementById('filtroDyMin').value);
            const somenteCarteira = document.getElementById('filtroCarteira').checked;
            const somentePrevidenciaria = document.getElementById('filtroPrevidenciaria').checked;
            const somenteGatilho = document.getElementById('filtroGatilho').checked;

            filteredData = rawData.filter(item => {
                if (setor && item.setor !== setor) return false;
                if (mdi && (!Array.isArray(item.mdi) || !item.mdi.includes(mdi))) return false;
                if (!isNaN(margemMin) && Number(item.margem_seguranca) < margemMin) return false;
                if (!isNaN(dyMin) && Number(item.dy) < dyMin) return false;
                if (somenteCarteira && !item.tem_carteira) return false;
                if (somentePrevidenciaria && Number(item.is_previdenciaria) !== 1) return false;
                if (somenteGatilho && !isGatilhoCurtoPrazo(item)) return false;
                return true;
            });

            if (currentSort.column) {
                sortTable(currentSort.column, true);
            } else {
                renderTable(filteredData);
            }
        }

        function buildTableHeader() {
            const row = document.getElementById('headerRow');
            row.innerHTML = '';

            columnConfig.forEach((col, idx) => {
                const th = document.createElement('th');
                th.scope = 'col';
                th.className = `py-3 px-4 font-semibold cursor-pointer hover:bg-gray-200 transition-colors group sticky top-0 ${col.sticky ? 'left-0 z-30 bg-gray-100 shadow-[1px_0_0_0_#e5e7eb]' : 'z-20 bg-gray-50'} ${idx > 1 ? 'text-right' : ''}`;
                th.onclick = () => sortTable(col.key);
                th.innerHTML = `
                    <div class="flex items-center ${idx > 1 ? 'justify-end' : ''}">
                        ${col.label} <span id="icon-${col.key}" class="ml-1 text-gray-400 group-hover:text-gray-600 font-bold"></span>
                    </div>`;
                row.appendChild(th);
            });
        }

        function renderTable(dados) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (dados.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="100" class="py-8 px-6 text-center text-gray-500">Nenhum dado encontrado com os filtros aplicados.</td></tr>';
                updateFixedScrollbarWidth();
                return;
            }

            dados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50/50 transition-colors duration-150 group';

                tr.innerHTML = columnConfig.map((col, idx) => {
                    const rawValue = item[col.key];
                    const formatted = formatValue(rawValue, col.type, item);
                    const textAlign = idx > 1 ? 'text-right' : '';
                    const sticky = col.sticky ? 'sticky left-0 z-10 bg-white group-hover:bg-blue-50 shadow-[1px_0_0_0_#f3f4f6]' : '';
                    const emphasis = col.key === 'short_term_score' ? 'font-bold text-indigo-700' : '';
                    return `<td class="py-3 px-4 ${textAlign} ${sticky} ${emphasis}">${formatted}</td>`;
                }).join('');

                tableBody.appendChild(tr);
            });

            updateFixedScrollbarWidth();
        }

        function formatValue(value, type, item) {
            if (value === null || value === undefined || value === '') return '-';

            if (type === 'currency') {
                return formatarMoeda(value);
            }

            if (type === 'percent') {
                return `${Number(value).toFixed(2)}%`;
            }

            if (type === 'number') {
                return Number(value).toLocaleString('pt-BR', { maximumFractionDigits: 4 });
            }

            if (type === 'mdi') {
                return Array.isArray(value) ? value.map(m => nomesMeses[m] || m).join(', ') : '-';
            }

            if (type === 'boolean-number') {
                return Number(value) === 1
                    ? '<span class="text-green-700 font-semibold">Sim</span>'
                    : '<span class="text-gray-500">Não</span>';
            }

            if (type === 'boolean') {
                return value
                    ? '<span class="text-green-700 font-semibold">Sim</span>'
                    : '<span class="text-gray-500">Não</span>';
            }

            if (type === 'image') {
                return `<span class="text-blue-700 underline">${value}</span>`;
            }

            return String(value);
        }

        function formatarMoeda(valor) {
            if (valor === null || valor === undefined || isNaN(valor)) return '-';
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        }

        function sortTable(column, keepDirection = false) {
            if (!sortableColumns.includes(column)) return;

            if (!keepDirection) {
                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = 'desc';
                }
            } else {
                currentSort.column = column;
            }

            sortableColumns.forEach(col => {
                const el = document.getElementById(`icon-${col}`);
                if (el) el.innerHTML = '';
            });

            const currentIcon = document.getElementById(`icon-${column}`);
            if (currentIcon) currentIcon.innerHTML = currentSort.direction === 'asc' ? '↑' : '↓';

            filteredData.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];

                if (column === 'mdi') {
                    valA = Array.isArray(a.mdi) && a.mdi.length > 0 ? a.mdi[0] : '99';
                    valB = Array.isArray(b.mdi) && b.mdi.length > 0 ? b.mdi[0] : '99';
                }

                if (valA === null || valA === undefined) valA = currentSort.direction === 'asc' ? Infinity : -Infinity;
                if (valB === null || valB === undefined) valB = currentSort.direction === 'asc' ? Infinity : -Infinity;

                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            renderTable(filteredData);
        }

        function setupFixedScrollbar() {
            const fixed = document.getElementById('fixedScrollbar');
            const wrapper = document.getElementById('tableWrapper');

            fixed.addEventListener('scroll', () => {
                if (wrapper.scrollLeft !== fixed.scrollLeft) wrapper.scrollLeft = fixed.scrollLeft;
            });

            wrapper.addEventListener('scroll', () => {
                if (fixed.scrollLeft !== wrapper.scrollLeft) fixed.scrollLeft = wrapper.scrollLeft;
            });

            window.addEventListener('resize', updateFixedScrollbarWidth);
        }

        function updateFixedScrollbarWidth() {
            const table = document.getElementById('acoesTable');
            const fixedContent = document.getElementById('fixedScrollbarContent');
            fixedContent.style.width = `${table.scrollWidth}px`;
        }
    </script>
</body>
</html>
